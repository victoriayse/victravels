<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VicTravels</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f3;
    --bg-soft:#f1ede3;
    --card-bg:#ffffff;
    --text:#181c1a;
    --text-muted:#6d6a60;
    --border:#e7e2d4;
    --border-strong:#d9d2bd;
    --primary:#0f5257;
    --primary-dark:#0a3a3e;
    --primary-light:#e4f1f0;
    --accent:#b8874a;
    --accent-light:#f6ecdd;
    --danger:#b3261e;
    --danger-light:#fbe9e7;
    --success:#1f7a5c;
    --success-light:#e3f5ec;
    --warning:#b45309;
    --warning-light:#fdf1de;
    --radius:20px;
    --radius-sm:12px;
    --font-serif:'Fraunces',Georgia,serif;
    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 1px 2px rgba(15,20,18,0.04), 0 4px 14px rgba(15,20,18,0.05);
    --shadow-hover:0 14px 34px rgba(15,82,87,0.16), 0 3px 10px rgba(15,20,18,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-sans);
    background:
      radial-gradient(1100px 480px at 15% -8%, rgba(15,82,87,0.07), transparent 60%),
      radial-gradient(900px 420px at 100% 0%, rgba(184,135,74,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  #app{max-width:1000px;margin:0 auto;padding:0 20px 80px;}
  ::selection{background:var(--primary-light);color:var(--primary-dark);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px;border:2px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-muted);}

  /* NAV */
  header.topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(250,248,243,0.82);
    backdrop-filter:blur(10px) saturate(1.4);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:1000px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-serif);font-weight:600;font-size:20px;letter-spacing:-0.01em;color:var(--text);}
  .brand-mark{
    font-size:16px;display:inline-flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:10px;
    background:linear-gradient(150deg,var(--primary),var(--primary-dark));
    box-shadow:0 3px 8px rgba(15,82,87,0.35);
  }
  nav.tabs{display:flex;gap:2px;background:var(--card-bg);border:1px solid var(--border);border-radius:999px;padding:4px;box-shadow:var(--shadow);}
  nav.tabs button{
    border:none;background:transparent;padding:8px 18px;border-radius:999px;
    font-size:13.5px;font-weight:600;color:var(--text-muted);cursor:pointer;
    transition:all .18s ease;
  }
  nav.tabs button.active{background:linear-gradient(150deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 4px 10px rgba(15,82,87,0.3);}
  nav.tabs button:not(.active):hover{color:var(--text);background:var(--bg-soft);}

  h1,h2,h3{margin:0;letter-spacing:-0.01em;}
  .page-title{font-family:var(--font-serif);font-size:27px;font-weight:600;margin:30px 0 18px;letter-spacing:-0.01em;}
  .section-title{font-size:13px;font-weight:700;margin:0 0 14px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;}

  /* CARD */
  .card{
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    padding:20px;
    transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease;
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  @media (max-width:640px){ .grid-2{grid-template-columns:1fr;} }

  /* BUTTONS */
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    border-radius:999px;border:1px solid var(--border-strong);background:#fff;
    padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--text);
    transition:all .18s ease;
  }
  .btn:hover{border-color:var(--text-muted);box-shadow:0 4px 12px rgba(15,20,18,0.08);transform:translateY(-1px);}
  .btn-primary{background:linear-gradient(150deg,var(--primary),var(--primary-dark));border-color:var(--primary-dark);color:#fff;}
  .btn-primary:hover{box-shadow:0 8px 20px rgba(15,82,87,0.35);}
  .btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
  .btn-ghost{background:transparent;border-color:transparent;}
  .btn-ghost:hover{background:var(--bg-soft);box-shadow:none;border-color:transparent;transform:none;}
  .btn-sm{padding:6px 13px;font-size:12.5px;}
  .btn-block{width:100%;justify-content:center;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  /* EMPTY STATE */
  .empty-state{
    text-align:center;padding:64px 20px;color:var(--text-muted);
    border:1px dashed var(--border-strong);border-radius:var(--radius);background:rgba(255,255,255,0.5);
  }
  .empty-state .emoji{
    font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
    width:64px;height:64px;border-radius:50%;background:var(--primary-light);
  }
  .empty-state p{margin:0 0 18px;font-size:14.5px;}

  /* HOME */
  .home-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 18px;flex-wrap:wrap;}
  select.trip-select{
    border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 14px;
    font-size:14px;font-weight:600;background:#fff;color:var(--text);cursor:pointer;
  }
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media (max-width:720px){ .home-grid{grid-template-columns:1fr;} }
  .countdown-num{
    font-family:var(--font-serif);font-size:40px;font-weight:600;letter-spacing:-0.02em;
    background:linear-gradient(150deg,var(--primary),var(--primary-dark));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .countdown-sub{color:var(--text-muted);font-size:13.5px;margin-top:4px;}
  .overview-chip{
    display:inline-flex;align-items:center;gap:4px;background:var(--primary-light);color:var(--primary-dark);
    padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;margin:2px 4px 2px 0;
    border:1px solid rgba(15,82,87,0.12);
  }
  .overview-stats{display:flex;gap:26px;margin-top:14px;}
  .stat-num{font-family:var(--font-serif);font-size:24px;font-weight:600;}
  .stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
  .flight-row{
    display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);
  }
  .flight-row:last-child{border-bottom:none;}
  .flight-icon{
    font-size:14px;display:flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:50%;background:var(--primary-light);flex-shrink:0;
  }
  .flight-name{font-weight:600;font-size:13.5px;}
  .flight-meta{font-size:12px;color:var(--text-muted);margin-top:1px;}
  .expenses-total{font-family:var(--font-serif);font-size:28px;font-weight:600;margin-top:8px;}
  .task-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .task-row:last-of-type{border-bottom:none;}
  .task-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary);cursor:pointer;}
  .task-text{flex:1;font-size:13.5px;}
  .task-text.done{text-decoration:line-through;color:var(--text-muted);}
  .task-add-row{display:flex;gap:8px;margin-top:12px;}
  .task-add-row input{flex:1;}

  /* FORMS */
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{
    width:100%;padding:10px 13px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);
    font-size:14px;font-family:inherit;background:#fff;color:var(--text);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px var(--primary-light);border-color:var(--primary);}
  label.field-label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .field{margin-bottom:14px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}

  /* CHIPS INPUT (countries) */
  .chip-input-row{display:flex;gap:8px;}
  .chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--primary-light);color:var(--primary-dark);
    padding:5px 6px 5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;
  }
  .chip button{background:none;border:none;color:var(--primary-dark);cursor:pointer;font-size:14px;line-height:1;padding:2px 5px;border-radius:50%;}
  .chip button:hover{background:rgba(15,82,87,0.15);}

  /* TRIPS PAGE */
  .trip-card{cursor:pointer;position:relative;overflow:hidden;transition:box-shadow .2s ease, transform .2s ease;}
  .trip-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--primary),var(--accent));
  }
  .trip-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-3px);}
  .trip-card h3{font-family:var(--font-serif);font-size:18px;font-weight:600;margin-bottom:4px;margin-top:4px;}
  .trip-dates{font-size:12.5px;color:var(--text-muted);margin-bottom:8px;}
  .trip-card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted);}

  /* TRIP DETAIL */
  .trip-detail-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:26px 0 18px;flex-wrap:wrap;}
  .back-link{background:none;border:none;color:var(--text-muted);font-size:13px;cursor:pointer;padding:0;margin-bottom:8px;font-weight:600;}
  .back-link:hover{color:var(--primary-dark);}
  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .day-btn{
    border:1px solid var(--border-strong);background:#fff;border-radius:999px;padding:7px 15px;
    font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text-muted);white-space:nowrap;
    transition:all .15s ease;
  }
  .day-btn:hover{border-color:var(--primary);color:var(--primary-dark);}
  .day-btn.active{background:var(--text);border-color:var(--text);color:#fff;}
  .filter-select{width:auto;padding:7px 12px;font-size:12.5px;font-weight:600;border-radius:999px;}
  .toolbar-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}

  /* ITEM / ITINERARY CARD */
  .item-card{
    display:flex;align-items:center;gap:14px;padding:14px 16px;position:relative;margin-bottom:10px;
    transition:opacity .15s ease, box-shadow .2s ease, border-color .2s ease, transform .15s ease;
  }
  .item-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px);}
  .item-card.dragging{opacity:.4;}
  .item-card.drag-over{box-shadow:var(--shadow-hover);border-color:var(--primary);}
  .drag-handle{
    cursor:grab;color:var(--border-strong);font-size:15px;flex-shrink:0;letter-spacing:-1px;
    user-select:none;line-height:1;padding:4px 0;
  }
  .drag-handle:active{cursor:grabbing;}
  .item-type-badge{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:16px;background:var(--primary-light);flex-shrink:0;border:1px solid rgba(15,82,87,0.1);
  }
  .item-main{flex:1;min-width:0;}
  .item-name{font-weight:600;font-size:14.5px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item-meta{font-size:12px;color:var(--text-muted);display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  .status-badge{
    font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;
    text-transform:uppercase;letter-spacing:.03em;
  }
  .status-Booked{background:var(--success-light);color:var(--success);}
  .status-ToBook{background:var(--warning-light);color:var(--warning);}
  .item-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
  .item-cost{font-family:var(--font-serif);font-weight:600;font-size:14.5px;white-space:nowrap;}
  .item-bookedby{font-size:11.5px;color:var(--text-muted);white-space:nowrap;display:flex;align-items:center;gap:3px;}
  .item-edit-btn{
    background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:16px;
    padding:6px;border-radius:50%;flex-shrink:0;transition:all .15s ease;
  }
  .item-edit-btn:hover{background:var(--bg-soft);color:var(--text);}
  .day-group-label{font-size:12px;font-weight:700;color:var(--text-muted);margin:22px 0 10px;text-transform:uppercase;letter-spacing:.06em;}
  .day-group-label:first-child{margin-top:0;}

  /* POPOVER MENU */
  .popover{
    position:absolute;top:44px;right:8px;background:#fff;border:1px solid var(--border);
    border-radius:var(--radius-sm);box-shadow:var(--shadow-hover);z-index:30;min-width:150px;overflow:hidden;
  }
  .popover button{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;
    padding:11px 14px;font-size:13px;cursor:pointer;color:var(--text);
  }
  .popover button:hover{background:var(--bg-soft);}
  .popover button.danger{color:var(--danger);}
  .confirm-box{padding:12px 14px;width:220px;}
  .confirm-box p{font-size:12.5px;margin:0 0 10px;color:var(--text);}
  .confirm-actions{display:flex;gap:8px;}

  /* MODAL */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(12,16,15,0.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal-overlay.hidden{display:none;}
  .modal{
    background:#fff;border-radius:var(--radius);max-width:480px;width:100%;max-height:88vh;overflow-y:auto;
    box-shadow:0 24px 60px rgba(10,15,14,0.28);padding:24px;
  }
  .modal.modal-wide{max-width:640px;}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .modal-header h3{font-family:var(--font-serif);font-size:19px;font-weight:600;}
  .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);line-height:1;padding:2px 6px;border-radius:50%;}
  .modal-close:hover{background:var(--bg-soft);}
  .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

  /* RICH TEXT NOTES */
  .rt-toolbar{display:flex;gap:4px;margin-bottom:6px;}
  .rt-toolbar button{
    border:1px solid var(--border-strong);background:#fff;border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:13px;
  }
  .rt-toolbar button:hover{background:var(--bg-soft);}
  .rt-editor{
    min-height:80px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:10px 12px;font-size:13.5px;
  }
  .rt-editor:focus{outline:none;box-shadow:0 0 0 3px var(--primary-light);border-color:var(--primary);}

  /* FILE UPLOAD */
  .file-chip{display:flex;align-items:center;justify-content:space-between;background:var(--bg-soft);border-radius:9px;padding:7px 11px;font-size:12.5px;margin-top:6px;gap:8px;}
  .file-chip button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px;flex-shrink:0;font-weight:600;}
  .file-chip-name{cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .file-chip-name:hover{text-decoration:underline;}
  .file-pill{
    display:inline-flex;align-items:center;gap:4px;background:var(--bg-soft);border-radius:999px;padding:3px 10px 3px 8px;
    cursor:pointer;max-width:170px;border:1px solid var(--border);flex-shrink:0;
  }
  .file-pill:hover{background:var(--primary-light);color:var(--primary-dark);border-color:transparent;}
  .file-pill-icon{flex-shrink:0;font-size:11px;}
  .file-pill-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}

  /* TODAY PAGE */
  .today-scroll{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity;}
  .today-card{
    min-width:190px;max-width:190px;flex-shrink:0;padding:16px;scroll-snap-align:start;
  }
  .today-card .item-type-badge{margin-bottom:10px;}
  .today-card .item-name{white-space:normal;font-size:13.5px;}
  .today-time{font-family:var(--font-serif);font-size:21px;font-weight:600;margin:4px 0 3px;}

  .muted-note{color:var(--text-muted);font-size:13px;}
  .link-line{font-size:12.5px;margin-top:4px;}
  .link-line a{color:var(--primary);text-decoration:none;font-weight:600;}
  .link-line a:hover{text-decoration:underline;}
  .nav-btn{
    display:inline-flex;align-items:center;gap:4px;background:var(--primary-light);color:var(--primary-dark);
    padding:4px 12px;border-radius:999px;font-size:11.5px;font-weight:700;text-decoration:none;
    border:1px solid rgba(15,82,87,0.15);transition:all .15s ease;
  }
  .nav-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 3px 8px rgba(15,82,87,0.3);}
  .notes-preview{font-size:12.5px;color:var(--text-muted);margin-top:6px;line-height:1.5;}
  .notes-preview b,.notes-preview strong{font-weight:700;color:var(--text);}
  .notes-preview.collapsed .notes-preview-content{max-height:38px;overflow:hidden;position:relative;}
  .notes-preview.collapsed .notes-preview-content::after{content:'';position:absolute;bottom:0;left:0;right:0;height:18px;background:linear-gradient(transparent,var(--card-bg));}
  .notes-preview.expanded .notes-preview-content{max-height:none;}
  .notes-toggle{display:block;margin-top:4px;background:none;border:none;color:var(--primary);font-size:11.5px;font-weight:700;cursor:pointer;padding:0;}
  .notes-toggle:hover{text-decoration:underline;}
  .dup-badge{display:inline-block;background:var(--bg-soft);color:var(--text-muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:4px;}

  .hidden{display:none !important;}
  .loading-note{text-align:center;padding:80px 20px;color:var(--text-muted);font-size:14px;}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="setView('home')" style="cursor:pointer;"><span class="brand-mark">✈️</span> VicTravels</div>
    <nav class="tabs" id="main-nav">
      <button data-view="home">Home</button>
      <button data-view="trips">Trips</button>
      <button data-view="today">Today</button>
    </nav>
  </div>
</header>

<div id="app"><div class="loading-note">Loading your trips…</div></div>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<div class="modal-overlay hidden" id="preview-overlay" style="z-index:200;">
  <div class="modal modal-wide" id="preview-content"></div>
</div>

<script>
/* ============ UTILITIES ============ */
const TYPE_ICONS = {Flight:'✈️',Transport:'🚗',Food:'🍜',Activity:'🎟️',Stays:'🛏️',Misc:'📌'};
const TYPES = ['Flight','Transport','Food','Activity','Stays','Misc'];
const TYPE_COLORS = {Flight:'#0f5257',Transport:'#2f6690',Food:'#b8874a',Activity:'#3d8361',Stays:'#7a5195',Misc:'#948d7c'};
const STATUSES = ['Booked','To Book'];
const BOOKED_BY = ['Victoria','Weng Seng'];
const ICON_GROUPS = [
  { group:'Transport', icons:[['🚗','Car'],['🚆','Train'],['🚌','Bus'],['⛴️','Ferry'],['🚕','Taxi'],['🚲','Bike'],['🛵','Scooter'],['🚶','Walk'],['🚠','Cable Car']] },
  { group:'Flight', icons:[['✈️','Plane'],['🛫','Departure'],['🛬','Arrival']] },

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayStr(){
  const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowTime(){
  const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function parseDate(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function daysBetween(a,b){ return Math.round((parseDate(b)-parseDate(a))/86400000); }
function fmtDateShort(s){
  if(!s) return '';
  const d=parseDate(s);
  return d.toLocaleDateString('en-SG',{day:'numeric',month:'short'});
}
function fmtDateLong(s){
  if(!s) return '';
  const d=parseDate(s);
  return d.toLocaleDateString('en-SG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function fmtTime(t){
  if(!t) return '';
  const [h,m]=t.split(':').map(Number);
  const ampm = h>=12?'PM':'AM';
  const h12 = h%12===0?12:h%12;
  return h12+':'+String(m).padStart(2,'0')+' '+ampm;
}
function fmtCost(n){
  n = Number(n)||0;
  return 'S$'+n.toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function statusClass(s){ return 'status-'+s.replace(/\s+/g,''); }
function addDays(dateStr, n){
  const d = parseDate(dateStr);
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function itemSortKey(item){ return (item.dateStart||'9999-99-99')+' '+(item.timeStart||'00:00'); }
// Chronological by day first; items sharing the same day are ordered by their manual drag position.
function compareItems(a,b){
  const da = a.dateStart || '9999-99-99';
  const db = b.dateStart || '9999-99-99';
  if(da!==db) return da<db?-1:1;
  return (a.order||0)-(b.order||0);
}
function itemDateLabel(item){
  if(!item.dateStart) return '';
  if(item.dateEnd && item.dateEnd!==item.dateStart) return fmtDateShort(item.dateStart)+' – '+fmtDateShort(item.dateEnd);
  return fmtDateShort(item.dateStart);
}
function itemTimeLabel(item){
  if(!item.timeStart) return '';
  if(item.timeEnd && item.timeEnd!==item.timeStart) return fmtTime(item.timeStart)+' – '+fmtTime(item.timeEnd);
  return fmtTime(item.timeStart);
}
function itemMatchesDay(item, trip, dayNum){
  if(!item.dateStart || !trip.startDate) return false;
  const dayDate = addDays(trip.startDate, dayNum-1);
  const end = item.dateEnd || item.dateStart;
  return dayDate >= item.dateStart && dayDate <= end;
}

/* ---- Load everything from Supabase into the same in-memory shape the UI already expects ---- */
async function loadAllData(){
  const { data: tripRows, error: tripErr } = await sb.from('trips').select('*').order('start_date', { ascending: true });
  if(tripErr){ alert('Could not load your trips: '+tripErr.message); data.trips = []; return; }

  const tripIds = tripRows.map(t=>t.id);
  let activityRows = [], taskRows = [], fileRows = [];
  if(tripIds.length){
    const [actRes, taskRes] = await Promise.all([
      sb.from('activities').select('*').in('trip_id', tripIds).order('sort_order', { ascending: true }),
      sb.from('tasks').select('*').in('trip_id', tripIds).order('created_at', { ascending: true }),
    ]);
    if(actRes.error) alert('Could not load activities: '+actRes.error.message);
    if(taskRes.error) alert('Could not load tasks: '+taskRes.error.message);
    activityRows = actRes.data || [];
    taskRows = taskRes.data || [];
    const activityIds = activityRows.map(a=>a.id);
    if(activityIds.length){
      const filesRes = await sb.from('activity_files').select('*').in('activity_id', activityIds);
      if(filesRes.error) alert('Could not load attachments: '+filesRes.error.message);
      fileRows = filesRes.data || [];
    }
  }

  data.trips = tripRows.map(t=>({
    id: t.id,
    name: t.name,
    countries: t.countries || [],
    startDate: t.start_date || '',
    endDate: t.end_date || '',
    pax: t.pax || 1,
    items: activityRows.filter(a=>a.trip_id===t.id).map(a=>dbActivityToItem(a, fileRows)),
    tasks: taskRows.filter(tk=>tk.trip_id===t.id).map(tk=>({ id: tk.id, text: tk.text, done: tk.done })),
  }));
}
function dbActivityToItem(a, fileRows){
  return {
    id: a.id,
    type: a.type,
    icon: a.icon || '',
    status: a.status,
    bookedBy: a.booked_by || '',
    name: a.name,
    costTotal: Number(a.cost_total) || 0,
    costPerPax: Number(a.cost_per_pax) || 0,
    dateStart: a.date_start || '',
    dateEnd: a.date_end || '',
    timeStart: a.time_start ? a.time_start.slice(0,5) : '',
    timeEnd: a.time_end ? a.time_end.slice(0,5) : '',
    link: a.link || '',
    mapsLink: a.maps_link || '',
    cardColor: a.card_color || '',
    isDuplicate: !!a.is_duplicate,
    parentActivityId: a.parent_activity_id || null,
    notes: a.notes || '',
    order: a.sort_order || 0,
    files: fileRows.filter(f=>f.activity_id===a.id).map(f=>({ id: f.id, name: f.file_name, storagePath: f.storage_path })),
  };
}
function hexToRgba(hex, alpha){
  if(!hex) return null;
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g=parseInt(h.substring(2,4),16), b=parseInt(h.substring(4,6),16);
  if([r,g,b].some(isNaN)) return null;
  return `rgba(${r},${g},${b},${alpha})`;
}
function getTrip(id){ return data.trips.find(t=>t.id===id); }
function sortedTrips(){
  return [...data.trips].sort((a,b)=> (a.startDate||'').localeCompare(b.startDate||''));
}
function tripDays(trip){
  if(!trip.startDate || !trip.endDate) return 1;
  return Math.max(1, daysBetween(trip.startDate, trip.endDate)+1);
}
function defaultHomeTrip(){
  const trips = sortedTrips();
  if(trips.length===0) return null;
  const t = todayStr();
  const upcoming = trips.find(tr => tr.endDate >= t);
  return (upcoming || trips[trips.length-1]).id;
}

function renderCountdownCard(trip){
  const t = todayStr();
  let num='', sub='';
  if(!trip.startDate || !trip.endDate){
    num='—'; sub='No dates set for this trip yet';
  } else if(t < trip.startDate){
    const d = daysBetween(t, trip.startDate);
    num = d; sub = d===1 ? 'day to go' : 'days to go';
  } else if(t <= trip.endDate){
    const dayNum = daysBetween(trip.startDate, t)+1;
    num = 'Day '+dayNum; sub = 'of '+tripDays(trip)+' — trip in progress';
  } else {
    const d = daysBetween(trip.endDate, t);
    num = '✓'; sub = 'Trip ended '+d+' day'+(d===1?'':'s')+' ago';
  }
  return `
    <div class="card">
      <div class="section-title">Countdown</div>
      <div class="countdown-num">${num}</div>
      <div class="countdown-sub">${sub}</div>
    </div>`;
}

async function saveTrip(editId){
  const name = document.getElementById('trip-name-input').value.trim();
  const startDate = document.getElementById('trip-start-input').value;
  const endDate = document.getElementById('trip-end-input').value;
  const pax = Math.max(1, parseInt(document.getElementById('trip-pax-input').value) || 1);
  if(!name){ alert('Please enter a trip name.'); return; }
  if(startDate && endDate && endDate < startDate){ alert('End date must be after start date.'); return; }
  const payload = { name, countries: [...tempCountries], start_date: startDate || null, end_date: endDate || null, pax };
  if(editId){
    const { data: row, error } = await sb.from('trips').update(payload).eq('id', editId).select().single();
    if(error){ alert('Could not save trip: '+error.message); return; }
    const trip = getTrip(editId);
    Object.assign(trip, { name: row.name, countries: row.countries||[], startDate: row.start_date||'', endDate: row.end_date||'', pax: row.pax });
  } else {
    const { data: row, error } = await sb.from('trips').insert(payload).select().single();
    if(error){ alert('Could not create trip: '+error.message); return; }
    data.trips.push({ id: row.id, name: row.name, countries: row.countries||[], startDate: row.start_date||'', endDate: row.end_date||'', pax: row.pax, items:[], tasks:[] });

function renderItemList(items, trip){
  if(ui.dayFilter!=='all'){
    return `<div class="drag-group" data-group="single">${items.map(i=>renderItemCard(i, trip)).join('')}</div>`;
  }
  // group by day when showing all (items already sorted earliest-to-latest).
  // Multi-day continuation duplicates are real rows with their own single-day date, so
  // grouping purely by each item's own dateStart naturally places everything correctly.
  const groups = {};
  const noDate = [];
  items.forEach(i=>{
    if(!i.dateStart || !trip.startDate){ noDate.push(i); return; }
    const d = daysBetween(trip.startDate, i.dateStart)+1;
    groups[d] = groups[d]||[];
    groups[d].push(i);
  });
  let html = '';
  Object.keys(groups).sort((a,b)=>a-b).forEach(day=>{
    html += `<div class="day-group-label">Day ${day} · ${fmtDateShort(groups[day][0].dateStart)}</div>`;
    html += `<div class="drag-group" data-group="day-${day}">${groups[day].map(i=>renderItemCard(i, trip)).join('')}</div>`;
  });
  if(noDate.length){
    html += `<div class="day-group-label">No date set</div>`;
    html += `<div class="drag-group" data-group="nodate">${noDate.map(i=>renderItemCard(i, trip)).join('')}</div>`;
  }
  return html;
}

/* ---- Drag & drop reordering ---- */
let dragSrcId = null;
document.addEventListener('dragstart', e=>{
  const card = e.target.closest('.item-card');
  if(!card) return;
  dragSrcId = card.id.replace('item-','');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', dragSrcId); }catch(err){}
  card.classList.add('dragging');
});
document.addEventListener('dragend', e=>{
  const card = e.target.closest('.item-card');
  if(card) card.classList.remove('dragging');
  document.querySelectorAll('.item-card.drag-over').forEach(c=>c.classList.remove('drag-over'));
  dragSrcId = null;
});
document.addEventListener('dragover', e=>{
  const card = e.target.closest('.item-card');
  if(!card || !dragSrcId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.item-card.drag-over').forEach(c=>{ if(c!==card) c.classList.remove('drag-over'); });
  card.classList.add('drag-over');
});
document.addEventListener('drop', async e=>{
  const targetCard = e.target.closest('.item-card');
  if(!targetCard || !dragSrcId) return;
  e.preventDefault();
  const targetId = targetCard.id.replace('item-','');
  targetCard.classList.remove('drag-over');
  if(targetId===dragSrcId) return;
  const group = targetCard.closest('.drag-group');
  const srcCard = document.getElementById('item-'+dragSrcId);
  if(!group || !srcCard || !group.contains(srcCard)) return;
  const ids = [...group.querySelectorAll('.item-card')].map(c=>c.id.replace('item-',''));
  const fromIdx = ids.indexOf(dragSrcId);
  const toIdx = ids.indexOf(targetId);
  if(fromIdx===-1 || toIdx===-1) return;
  ids.splice(fromIdx,1);
  ids.splice(toIdx,0,dragSrcId);
  const trip = getTrip(ui.detailTripId);
  const updates = [];
  ids.forEach((id, idx)=>{
    const it = trip.items.find(i=>i.id===id);
    if(it && it.order!==idx){
      it.order = idx;
      updates.push(sb.from('activities').update({ sort_order: idx }).eq('id', id));
    }
  });
  render(); // optimistic — reflect the new order immediately
  if(updates.length) await Promise.all(updates);
});

async function deleteItem(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip.items.find(i=>i.id===itemId);
  const children = trip.items.filter(i=>i.parentActivityId===itemId);
  const storagePaths = [item, ...children].flatMap(it=>(it && it.files || []).map(f=>f.storagePath));
  // Explicitly remove continuation duplicates too (belt-and-braces alongside the DB's own cascade).
  if(children.length){
    await sb.from('activities').delete().in('id', children.map(c=>c.id));
  }
  const { error } = await sb.from('activities').delete().eq('id', itemId);
  if(error){ alert('Could not delete activity: '+error.message); return; }
  if(storagePaths.length) await sb.storage.from('attachments').remove(storagePaths).catch(()=>{});
  trip.items = trip.items.filter(i=>i.id!==itemId && i.parentActivityId!==itemId);
  render();
}
async function duplicateItem(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip.items.find(i=>i.id===itemId);
  if(!item) return;
  const newOrder = trip.items.reduce((m,i)=>Math.max(m,i.order||0),-1)+1;
  const payload = {
    trip_id: tripId, type: item.type, icon: item.icon || null, status: item.status,
    booked_by: item.bookedBy || null, name: item.name,
    cost_total: item.costTotal || 0, cost_per_pax: item.costPerPax || 0,
    date_start: item.dateStart || null, date_end: item.dateEnd || null,
    time_start: item.timeStart || null, time_end: item.timeEnd || null,
    link: item.link || null, maps_link: item.mapsLink || null,
    card_color: item.cardColor || null, notes: item.notes || '', sort_order: newOrder,
    is_duplicate: false, parent_activity_id: null,
  };
  const { data: row, error } = await sb.from('activities').insert(payload).select().single();
  if(error){ alert('Could not duplicate activity: '+error.message); return; }
  trip.items.push(dbActivityToItem(row, []));
  await reconcileDuplicates(tripId, row.id, payload, newOrder);
  render();
}
/* Keeps auto-generated multi-day "continuation" rows in sync with a parent activity's
   date range, without touching any continuation rows the user has independently edited. */
async function reconcileDuplicates(tripId, parentId, basePayload, order){
  const trip = getTrip(tripId);
  if(!trip) return;
  const dateStart = basePayload.date_start, dateEnd = basePayload.date_end;
  const desiredDates = [];
  if(dateStart && dateEnd && dateEnd > dateStart){
    let d = addDays(dateStart, 1);
    while(d <= dateEnd){ desiredDates.push(d); d = addDays(d, 1); }
  }
  const existingDups = trip.items.filter(i=>i.parentActivityId===parentId);
  for(const dup of existingDups){
    if(!desiredDates.includes(dup.dateStart)){
      const storagePaths = (dup.files||[]).map(f=>f.storagePath);
      await sb.from('activities').delete().eq('id', dup.id);
      if(storagePaths.length) await sb.storage.from('attachments').remove(storagePaths).catch(()=>{});
      trip.items = trip.items.filter(i=>i.id!==dup.id);
    }
  }
  const stillExistingDates = trip.items.filter(i=>i.parentActivityId===parentId).map(i=>i.dateStart);
  for(const d of desiredDates){
    if(stillExistingDates.includes(d)) continue;
    const { data: row, error } = await sb.from('activities').insert({
      trip_id: tripId, type: basePayload.type, icon: basePayload.icon, status: basePayload.status,
      booked_by: basePayload.booked_by, name: basePayload.name,
      cost_total: basePayload.cost_total, cost_per_pax: basePayload.cost_per_pax,
      date_start: d, date_end: d, time_start: null, time_end: null,
      link: basePayload.link, maps_link: basePayload.maps_link, card_color: basePayload.card_color,
      notes: basePayload.notes, sort_order: order, is_duplicate: true, parent_activity_id: parentId,
    }).select().single();
    if(!error) trip.items.push(dbActivityToItem(row, []));
  }
}

        <button type="button" onmousedown="event.preventDefault()" onclick="document.execCommand('italic')"><i>I</i></button>
        <button type="button" onmousedown="event.preventDefault()" onclick="document.execCommand('underline')"><u>U</u></button>
      </div>
      <div class="rt-editor" id="item-notes-input" contenteditable="true">${item&&item.notes?item.notes:''}</div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveItem('${tripId}','${item?item.id:''}')">Save Activity</button>
    </div>
  `;
  openModal(html);
  renderFileChips();
}
async function handleFileSelect(e){
  const files = Array.from(e.target.files);
  e.target.value = '';
  if(!files.length) return;
  for(const f of files){
    const uploadingEntry = { name: f.name, storagePath: null, uploading: true };
    tempFiles.push(uploadingEntry);
    renderFileChips();
    const path = `shared/${currentDraftId}/${Date.now()}_${f.name}`;
    const { error } = await sb.storage.from('attachments').upload(path, f);
    if(error){
      alert('Upload failed for '+f.name+': '+error.message);
      tempFiles.splice(tempFiles.indexOf(uploadingEntry), 1);
      renderFileChips();
      continue;
    }
    uploadingEntry.storagePath = path;
    uploadingEntry.uploading = false;
    uploadingEntry.pending = true; // not yet linked to an activity row
    if(currentEditingItemId){
      // parent activity already exists in the DB — link the file right away
      const { data: row, error: linkErr } = await sb.from('activity_files')
        .insert({ activity_id: currentEditingItemId, file_name: f.name, storage_path: path }).select().single();
      if(!linkErr){ uploadingEntry.id = row.id; uploadingEntry.pending = false; }
    }
    renderFileChips();
  }
}
function renderFileChips(){
  const el = document.getElementById('file-chip-list');
  if(!el) return;
  el.innerHTML = tempFiles.map((f,idx)=>`
    <div class="file-chip">
      ${f.uploading ? `<span class="file-chip-name">📎 ${escapeHtml(f.name)} (uploading…)</span>` :
        `<span class="file-chip-name" onclick="openFilePreviewByTemp(${idx})">📎 ${escapeHtml(f.name)}</span>`}
      <button onclick="removeTempFile(${idx})" ${f.uploading?'disabled':''}>Remove</button>
    </div>`).join('');
}
async function removeTempFile(idx){
  const f = tempFiles[idx];
  if(f && f.storagePath){
    await sb.storage.from('attachments').remove([f.storagePath]).catch(()=>{});
    if(f.id) await sb.from('activity_files').delete().eq('id', f.id).catch(()=>{});
  }
  tempFiles.splice(idx,1);
  renderFileChips();
}
function recalcPerPax(pax){
  const totalEl = document.getElementById('item-cost-total-input');
  const perPaxEl = document.getElementById('item-cost-perpax-input');
  if(!totalEl || !perPaxEl) return;
  const total = parseFloat(totalEl.value) || 0;
  const p = Number(pax) || 1;
  perPaxEl.value = total ? (total/p).toFixed(2) : '';
}

async function saveItem(tripId, itemId){
  const trip = getTrip(tripId);
  const existingItem = itemId ? trip.items.find(i=>i.id===itemId) : null;
  const isEditingDuplicate = !!(existingItem && existingItem.isDuplicate);
  const name = document.getElementById('item-name-input').value.trim();
  if(!name){ alert('Please enter a name.'); return; }
  const dateStart = document.getElementById('item-date-start-input').value;
  const dateEnd = document.getElementById('item-date-end-input').value;
  const timeStart = document.getElementById('item-time-start-input').value;
  const timeEnd = document.getElementById('item-time-end-input').value;
  if(dateEnd && dateStart && dateEnd < dateStart){ alert('End date must be on or after the start date.'); return; }
  if(timeEnd && timeStart && (!dateEnd || dateEnd===dateStart) && timeEnd < timeStart){ alert('End time must be after the start time.'); return; }
  if(tempFiles.some(f=>f.uploading)){ alert('Please wait for the attachment upload to finish.'); return; }

  const colorEnabled = document.getElementById('item-color-enable').checked;
  const payload = {
    type: document.getElementById('item-type-input').value,
    icon: document.getElementById('item-icon-input').value || null,
    status: document.getElementById('item-status-input').value,
    booked_by: document.getElementById('item-bookedby-input').value || null,
    name,
    cost_total: parseFloat(document.getElementById('item-cost-total-input').value) || 0,
    cost_per_pax: parseFloat(document.getElementById('item-cost-perpax-input').value) || 0,
    date_start: dateStart || null,
    date_end: dateEnd || null,
    time_start: timeStart || null,
    time_end: timeEnd || null,
    link: document.getElementById('item-link-input').value.trim() || null,
    maps_link: document.getElementById('item-maps-input').value.trim() || null,
    card_color: colorEnabled ? document.getElementById('item-color-input').value : null,
    notes: document.getElementById('item-notes-input').innerHTML,
  };

  let savedId = itemId;
  let savedOrder;
  if(itemId){
    const { error } = await sb.from('activities').update(payload).eq('id', itemId);
    if(error){ alert('Could not save activity: '+error.message); return; }
    savedOrder = trip.items.find(i=>i.id===itemId).order;
  } else {
    savedOrder = trip.items.reduce((m,i)=>Math.max(m,i.order||0),-1)+1;
    const { data: row, error } = await sb.from('activities').insert({ ...payload, trip_id: tripId, sort_order: savedOrder }).select().single();
    if(error){ alert('Could not create activity: '+error.message); return; }
    savedId = row.id;
    // link any files that were uploaded before this activity row existed
    for(const f of tempFiles.filter(f=>f.pending)){
      const { data: fr, error: fe } = await sb.from('activity_files')
        .insert({ activity_id: savedId, file_name: f.name, storage_path: f.storagePath }).select().single();
      if(!fe){ f.id = fr.id; f.pending = false; }
    }
  }

  const localItem = {
    id: savedId,
    type: payload.type, icon: payload.icon || '', status: payload.status, bookedBy: payload.booked_by || '',
    name: payload.name, costTotal: payload.cost_total, costPerPax: payload.cost_per_pax,
    dateStart: payload.date_start || '', dateEnd: payload.date_end || '',
    timeStart: payload.time_start || '', timeEnd: payload.time_end || '',
    link: payload.link || '', mapsLink: payload.maps_link || '', cardColor: payload.card_color || '',
    isDuplicate: existingItem ? existingItem.isDuplicate : false,
    parentActivityId: existingItem ? existingItem.parentActivityId : null,
    notes: payload.notes, order: savedOrder,
    files: tempFiles.map(f=>({ id: f.id, name: f.name, storagePath: f.storagePath })),
  };
  if(itemId){
    Object.assign(trip.items.find(i=>i.id===itemId), localItem);
  } else {
    trip.items = trip.items||[];
    trip.items.push(localItem);
  }
  if(!isEditingDuplicate){
    await reconcileDuplicates(tripId, savedId, payload, savedOrder);
  }
  closeModal(); render();
}

/* ---- Trip Expenses Modal ---- */
let tripExpensesChart = null;
function openExpensesModal(tripId){
  renderExpensesModal(tripId);
}
function renderExpensesModal(tripId){
  const trip = getTrip(tripId);
  if(!trip) return;
  const filterType = ui.expensesModalType;
  const filterBookedBy = ui.expensesModalBookedBy;
  const items = (trip.items||[]).filter(i=> !i.isDuplicate && Number(i.costTotal)>0
    && (filterType==='all' || i.type===filterType)
    && (filterBookedBy==='all' || i.bookedBy===filterBookedBy));
  const total = items.reduce((s,i)=>s+Number(i.costTotal),0);
  const html = `
    <div class="modal-header">
      <h3>Expenses — ${escapeHtml(trip.name)}</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="filter-bar">
      <select class="filter-select" onchange="ui.expensesModalType=this.value;renderExpensesModal('${tripId}');">
        <option value="all" ${filterType==='all'?'selected':''}>All Types</option>
        ${TYPES.map(t=>`<option value="${t}" ${filterType===t?'selected':''}>${t}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="ui.expensesModalBookedBy=this.value;renderExpensesModal('${tripId}');">
        <option value="all" ${filterBookedBy==='all'?'selected':''}>Booked by: All</option>
        ${BOOKED_BY.map(b=>`<option value="${b}" ${filterBookedBy===b?'selected':''}>Booked by: ${b}</option>`).join('')}
      </select>
    </div>
    ${items.length===0 ? '<p class="muted-note">No matching expenses.</p>' : `
      <div style="height:220px;position:relative;"><canvas id="trip-expenses-chart"></canvas></div>
      <div class="expenses-total">${fmtCost(total)}</div>
      <div class="countdown-sub">total across ${items.length} item${items.length===1?'':'s'} · shown as total cost (not per pax)</div>
    `}
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="closeModal()">Close</button>
    </div>
  `;
  openModal(html, true);
  renderTripExpensesChart(tripId);
}
function renderTripExpensesChart(tripId){
  const canvas = document.getElementById('trip-expenses-chart');
  if(!canvas || typeof Chart==='undefined') return;
  const trip = getTrip(tripId);
  if(!trip) return;
  const filterType = ui.expensesModalType;
  const filterBookedBy = ui.expensesModalBookedBy;
  const byType = {};
  (trip.items||[]).forEach(i=>{
    if(!i.isDuplicate && Number(i.costTotal)>0 && (filterType==='all' || i.type===filterType) && (filterBookedBy==='all' || i.bookedBy===filterBookedBy)){
      byType[i.type] = (byType[i.type]||0) + Number(i.costTotal);
    }
  });
  const labels = Object.keys(byType);
  if(tripExpensesChart) tripExpensesChart.destroy();
  tripExpensesChart = new Chart(canvas, {
    type:'doughnut',
    data:{ labels, datasets:[{ data: labels.map(l=>byType[l]), backgroundColor: labels.map(l=>TYPE_COLORS[l]||'#999'), borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:11} } } }, cutout:'65%' }
  });
}

/* ============ TODAY ============ */
function renderToday(){
  const t = todayStr();
  const n = nowTime();
  let allToday = [];
  data.trips.forEach(trip=>{
    (trip.items||[]).forEach(item=>{
      if(item.isDuplicate) return;
      const start = item.dateStart, end = item.dateEnd || item.dateStart;
      if(start && start<=t && t<=end) allToday.push({...item, tripName: trip.name, tripId: trip.id});
    });
  });
  allToday.sort((a,b)=> (a.timeStart||'99:99').localeCompare(b.timeStart||'99:99'));
  // "upcoming" = ongoing multi-day items already in progress, or items starting today that haven't started yet
  const upcoming = allToday.filter(i => i.dateStart < t || !i.timeStart || i.timeStart >= n);

  const list = ui.todayShowAll ? allToday : upcoming;

  return `
    <div class="toolbar-row" style="margin-top:28px;">
      <div>
        <h1 class="page-title" style="margin:0;">Today</h1>
        <div class="countdown-sub">${fmtDateLong(t)}</div>
      </div>
      <button class="btn" onclick="ui.todayShowAll=!ui.todayShowAll;render();">${ui.todayShowAll? 'Show upcoming only':'View all of today'}</button>
    </div>
    ${allToday.length===0 ? `
      <div class="empty-state"><span class="emoji">☀️</span><p>Nothing on the itinerary for today.</p></div>
    ` : list.length===0 ? `
      <div class="empty-state"><span class="emoji">✅</span><p>You're all caught up for today.</p></div>
    ` : `
      <div class="section-title">${ui.todayShowAll? "Today's full itinerary" : "Coming up"}</div>
      <div class="today-scroll">
        ${list.map(i=>renderTodayCard(i)).join('')}
      </div>
    `}
  `;
}

function renderTodayCard(item){
  const t = todayStr();
  const ongoing = item.dateStart < t; // started on an earlier day, still spanning today
  const past = !ongoing && item.timeStart && item.timeStart < nowTime();
  return `
    <div class="card today-card" style="${past?'opacity:.55;':''}" onclick="openTripDetail('${item.tripId}')">
      <div class="item-type-badge">${item.icon || TYPE_ICONS[item.type] || '📌'}</div>
      ${ongoing? '<div class="today-time" style="font-size:13px;color:var(--text-muted);">In progress</div>' :
        item.timeStart? `<div class="today-time">${itemTimeLabel(item)}</div>` : '<div class="today-time" style="font-size:13px;color:var(--text-muted);">All day</div>'}
      <div class="item-name">${escapeHtml(item.name||'Untitled')}</div>
      <div class="item-meta"><span class="status-badge ${statusClass(item.status)}">${item.status}</span></div>
      <div class="countdown-sub" style="margin-top:6px;">${escapeHtml(item.tripName)}</div>
    </div>`;
}

/* ============ MODAL HELPERS ============ */
function openModal(html, wide){
  const modal = document.getElementById('modal-content');
  modal.className = 'modal' + (wide ? ' modal-wide' : '');
  modal.innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.add('hidden');
  document.getElementById('modal-content').innerHTML = '';
  document.getElementById('modal-content').className = 'modal';
}
document.getElementById('modal-overlay').addEventListener('click', e=>{
  if(e.target.id==='modal-overlay') closeModal();
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if(!document.getElementById('preview-overlay').classList.contains('hidden')) closeFilePreview();
  else closeModal();
});

/* ---- File attachment preview (opens as an in-app pop-out instead of a new browser tab) ---- */
function openFilePreview(url, name){
  const ext = (name.split('.').pop()||'').toLowerCase();
  const isImage = ['png','jpg','jpeg','gif','webp','svg'].includes(ext);
  const isPdf = ext==='pdf';
  let body;
  if(isImage) body = `<img src="${url}" style="max-width:100%;border-radius:10px;display:block;margin:0 auto;">`;
  else if(isPdf) body = `<iframe src="${url}#toolbar=0&navpanes=0&pagemode=none" style="width:100%;height:70vh;border:1px solid var(--border);border-radius:10px;"></iframe>`;
  else body = `<p class="muted-note">Preview isn't available for this file type, but you can open it below.</p>`;
  document.getElementById('preview-content').innerHTML = `
    <div class="modal-header"><h3 style="font-size:14px;word-break:break-all;padding-right:10px;">${escapeHtml(name)}</h3><button class="modal-close" onclick="closeFilePreview()">&times;</button></div>
    ${body}
    <div class="modal-footer">
      <a class="btn" href="${url}" target="_blank" rel="noopener">Open / Download</a>
      <button class="btn btn-primary" onclick="closeFilePreview()">Close</button>
    </div>`;
  document.getElementById('preview-overlay').classList.remove('hidden');
}
function closeFilePreview(){
  document.getElementById('preview-overlay').classList.add('hidden');
  document.getElementById('preview-content').innerHTML = '';
}
document.getElementById('preview-overlay').addEventListener('click', e=>{
  if(e.target.id==='preview-overlay') closeFilePreview();
});
async function openFilePreviewFor(tripId, itemId, idx){
  const trip = getTrip(tripId);
  const item = trip && trip.items.find(i=>i.id===itemId);
  const f = item && item.files && item.files[idx];
  if(!f) return;
  const { data, error } = await sb.storage.from('attachments').createSignedUrl(f.storagePath, 3600);
  if(error){ alert('Could not open file: '+error.message); return; }
  openFilePreview(data.signedUrl, f.name);
}
async function openFilePreviewByTemp(idx){
  const f = tempFiles[idx];
  if(!f || !f.storagePath) return;
  const { data, error } = await sb.storage.from('attachments').createSignedUrl(f.storagePath, 3600);
  if(error){ alert('Could not open file: '+error.message); return; }
  openFilePreview(data.signedUrl, f.name);
}

loadAllData().then(render);
