function addCountryChip(){
  const input = document.getElementById('country-input');
  const val = input.value.trim();
  if(!val) return;
  tempCountries.push(val);
  input.value='';
  renderCountryChips();
}
function removeCountryChip(idx){
  tempCountries.splice(idx,1);
  renderCountryChips();
}
function renderCountryChips(){
  const el = document.getElementById('country-chip-list');
  if(!el) return;
  el.innerHTML = tempCountries.map((c,idx)=>`<span class="chip">${escapeHtml(c)}<button onclick="removeCountryChip(${idx})">&times;</button></span>`).join('');
}
async function saveTrip(editId){
  const name = document.getElementById('trip-name-input').value.trim();
  const startDate = document.getElementById('trip-start-input').value;
  const endDate = document.getElementById('trip-end-input').value;
  const pax = Math.max(1, parseInt(document.getElementById('trip-pax-input').value) || 1);
  const budgetRaw = document.getElementById('trip-budget-input').value;
  const budget = budgetRaw!=='' ? Math.max(0, parseFloat(budgetRaw)||0) : null;
  if(!name){ alert('Please enter a trip name.'); return; }
  if(startDate && endDate && endDate < startDate){ alert('End date must be after start date.'); return; }
  const payload = { name, countries: [...tempCountries], start_date: startDate || null, end_date: endDate || null, pax, budget };
  beginLoading();
  try{
    if(editId){
      const { data: row, error } = await sb.from('trips').update(payload).eq('id', editId).select().single();
      if(error){ alert('Could not save trip: '+error.message); return; }
      const trip = getTrip(editId);
      Object.assign(trip, { name: row.name, countries: row.countries||[], startDate: row.start_date||'', endDate: row.end_date||'', pax: row.pax, budget: row.budget });
    } else {
      const { data: row, error } = await sb.from('trips').insert(payload).select().single();
      if(error){ alert('Could not create trip: '+error.message); return; }
      data.trips.push({ id: row.id, name: row.name, countries: row.countries||[], startDate: row.start_date||'', endDate: row.end_date||'', pax: row.pax, budget: row.budget, items:[], tasks:[], expenses:[] });
    }
    closeModal(); render();
    showToast('Trip saved');
  } finally {
    endLoading();
  }
}
function deleteTripConfirm(tripId){
  const trip = getTrip(tripId);
  const modal = document.getElementById('modal-content');
  modal.innerHTML = `
    <div class="modal-header"><h3>Delete Trip</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <p>Are you sure you want to delete <strong>${escapeHtml(trip.name)}</strong>? This will remove all its itinerary items and tasks. This can't be undone.</p>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="deleteTrip('${tripId}')">Yes, delete trip</button>
    </div>`;
}
async function deleteTrip(tripId){
  const trip = getTrip(tripId);
  const storagePaths = (trip.items||[]).flatMap(i=>(i.files||[]).map(f=>f.storagePath));
  beginLoading();
  try{
    const { error } = await sb.from('trips').delete().eq('id', tripId);
    if(error){ alert('Could not delete trip: '+error.message); return; }
    if(storagePaths.length) await sb.storage.from('attachments').remove(storagePaths).catch(()=>{});
    data.trips = data.trips.filter(t=>t.id!==tripId);
    closeModal();
    ui.view='trips';
    render();
    showToast('Trip deleted');
  } finally {
    endLoading();
  }
}

function itemSearchText(item){
  return [item.name, extractPlaceNameFromMapsLink(item.mapsLink), item.mapsLink].filter(Boolean).join(' ').toLowerCase();
}
function getFilteredTripItems(trip){
  let items = (trip.items||[]).filter(i=>!i.isPoi);
  if(ui.typeFilter!=='all') items = items.filter(i=>i.type===ui.typeFilter);
  if(ui.statusFilter!=='all') items = items.filter(i=>i.status===ui.statusFilter);
  if(ui.bookedByFilter && ui.bookedByFilter!=='all') items = items.filter(i=>i.bookedBy===ui.bookedByFilter);
  if(ui.dayFilter!=='all'){
    items = items.filter(i=> itemMatchesDay(i, trip, Number(ui.dayFilter)));
  }
  const q = (ui.searchQuery||'').trim().toLowerCase();
  if(q) items = items.filter(i=> itemSearchText(i).includes(q));
  items.sort(compareItems);
  return items;
}
// Live-filters the item list as the user types in the search box, touching only
// #item-list — a full render() would replace the search <input> itself and drop focus
// mid-keystroke, since it's rebuilt fresh from the ui state on every render.
function updateItemSearch(tripId, value){
  ui.searchQuery = value;
  saveUiState();
  const trip = getTrip(tripId);
  if(!trip) return;
  const items = getFilteredTripItems(trip);
  lastTripDetailItems = items;
  const listEl = document.getElementById('item-list');
  if(listEl) listEl.innerHTML = items.length===0? '<div class="empty-state"><span class="emoji">📋</span><p>No activities match this view.</p></div>' : renderItemList(items, trip);
  loadDistanceBadges(trip, items);
  loadCardOpenBadges(trip, items);
}

// Interleaves a distance-badge placeholder between each pair of consecutive cards (skipped
// across a Place of Interest, which isn't part of the day's walking sequence). The badges
// start empty and are filled in afterwards by loadDistanceBadges() once coordinates for
// both ends are known — keeps the initial render instant, no request-per-render-call.
function renderItemsWithDistanceBadges(items, trip){
  let html = '';
  items.forEach((item, idx)=>{
    html += renderItemCard(item, trip);
    if(idx < items.length-1){
      const next = items[idx+1];
      if(!item.isPoi && !next.isPoi){
        html += `<div class="card-distance-badge" id="distbadge-${item.id}-${next.id}" data-from="${item.id}" data-to="${next.id}"></div>`;
      }
    }
  });
  return html;
}
function renderItemList(items, trip){
  if(ui.dayFilter!=='all'){
    return `<div class="drag-group" data-group="single">${renderItemsWithDistanceBadges(items, trip)}</div>`;
  }
  // group by day when showing all (items already sorted earliest-to-latest).
  // Multi-day continuation duplicates are real rows with their own single-day date, so
  // grouping purely by each item's own dateStart naturally places everything correctly.
  const groups = {};
  const noDate = [];
  items.forEach(i=>{
    if(!i.dateStart || !trip.startDate){ noDate.push(i); return; }
    const d = daysBetween(trip.startDate, i.dateStart);
    groups[d] = groups[d]||[];
    groups[d].push(i);
  });
  let html = '';
  Object.keys(groups).sort((a,b)=>a-b).forEach(day=>{
    const title = trip.dayTitles && trip.dayTitles[day] ? ` · ${escapeHtml(trip.dayTitles[day])}` : '';
    html += `<div class="day-group-label">Day ${day} · ${fmtDateShort(groups[day][0].dateStart)}${title}</div>`;
    html += `<div class="drag-group" data-group="day-${day}">${renderItemsWithDistanceBadges(groups[day], trip)}</div>`;
  });
  if(noDate.length){
    html += `<div class="day-group-label">No date set</div>`;
    html += `<div class="drag-group" data-group="nodate">${noDate.map(i=>renderItemCard(i, trip)).join('')}</div>`;

// Fills in each distance-badge placeholder left by renderItemsWithDistanceBadges(), one
// consecutive pair at a time. Walking is tried first; if it's a long-looking hop (>20 min
// on foot) transit is tried too and shown instead when it's actually available for that
// leg. A pair with no coordinates yet (still geocoding) or a failed lookup is left blank —
// the placeholder's CSS collapses to nothing rather than showing a wrong or stuck number.
let distanceBadgeRenderToken = 0;
async function loadDistanceBadges(trip, items){
  if(!trip || !items || !items.length) return;
  const myToken = ++distanceBadgeRenderToken;
  const dayGroups = {};
  items.forEach(i=>{
    if(i.isPoi || !i.dateStart || !trip.startDate) return;
    const d = daysBetween(trip.startDate, i.dateStart);
    dayGroups[d] = dayGroups[d]||[];
    dayGroups[d].push(i);
  });
  for(const day of Object.keys(dayGroups)){
    const dayItems = dayGroups[day];
    for(let idx=0; idx<dayItems.length-1; idx++){
      const a = dayItems[idx], b = dayItems[idx+1];
      const el = document.getElementById(`distbadge-${a.id}-${b.id}`);
      if(!el || a.lat==null || a.lng==null || b.lat==null || b.lng==null) continue;
      let leg = await computeRouteLeg(a.lat, a.lng, b.lat, b.lng, 'WALK');
      let mode = 'walk';
      if(leg && leg.seconds > 20*60){
        const transitLeg = await computeRouteLeg(a.lat, a.lng, b.lat, b.lng, 'TRANSIT');
        if(transitLeg){ leg = transitLeg; mode = 'transit'; }
      }
      if(distanceBadgeRenderToken !== myToken) return; // a newer render superseded this one
      if(!leg) continue;
      const icon = mode==='transit' ? '🚆' : '🚶';
      el.innerHTML = `${icon} ${formatRouteDuration(leg.seconds)} · ${formatDistance(leg.meters)}`;
      el.classList.add('ready');
      el.onclick = (ev)=> showNavMethodsPopover(ev, a.lat, a.lng, b.lat, b.lng);
    }
  }
}

let dragSrcId = null;
document.addEventListener('dragstart', e=>{
  const card = e.target.closest('.item-card');
  if(!card) return;
  dragSrcId = card.id.replace('item-','');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', dragSrcId); }catch(err){}
  card.classList.add('dragging');
});
document.addEventListener('dragend', e=>{
  const card = e.target.closest('.item-card');
  if(card) card.classList.remove('dragging');
  document.querySelectorAll('.item-card.drag-over').forEach(c=>c.classList.remove('drag-over'));
  dragSrcId = null;
});
document.addEventListener('dragover', e=>{
  const card = e.target.closest('.item-card');
  if(!card || !dragSrcId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.item-card.drag-over').forEach(c=>{ if(c!==card) c.classList.remove('drag-over'); });
  card.classList.add('drag-over');
});
document.addEventListener('drop', async e=>{
  const targetCard = e.target.closest('.item-card');
  if(!targetCard || !dragSrcId) return;
  e.preventDefault();
  const targetId = targetCard.id.replace('item-','');
  targetCard.classList.remove('drag-over');
  if(targetId===dragSrcId) return;
  const group = targetCard.closest('.drag-group');
  const srcCard = document.getElementById('item-'+dragSrcId);
  if(!group || !srcCard || !group.contains(srcCard)) return;
  const ids = [...group.querySelectorAll('.item-card')].map(c=>c.id.replace('item-',''));
  const fromIdx = ids.indexOf(dragSrcId);
  const toIdx = ids.indexOf(targetId);
  if(fromIdx===-1 || toIdx===-1) return;
  ids.splice(fromIdx,1);
  ids.splice(toIdx,0,dragSrcId);
  const trip = getTrip(ui.detailTripId);
  const updates = [];
  ids.forEach((id, idx)=>{
    const it = trip.items.find(i=>i.id===id);
    if(it && it.order!==idx){
      it.order = idx;
      updates.push(sb.from('activities').update({ sort_order: idx }).eq('id', id));
    }
  });
  render(); // optimistic — reflect the new order immediately
  if(updates.length) await Promise.all(updates);
});

function closePopovers(){

}
function toggleItemPopover(e, itemId, tripId){
  e.stopPropagation();
  const card = e.target.closest('.item-card');
  const existing = card.querySelector('.popover');
  closePopovers();
  if(existing) return;
  // The drag-handle (⠿) only reorders via HTML5 drag-and-drop, which mouse-only — there's
  // no touch equivalent, so it silently doesn't work on a phone. These "Reorder" buttons
  // give touch users the same reordering ability via a tap instead of a drag gesture.
  const group = card.closest('.drag-group');
  const siblingIds = group ? [...group.querySelectorAll('.item-card')].map(c=>c.id.replace('item-','')) : [];
  const idx = siblingIds.indexOf(itemId);
  const canUp = idx > 0;
  const canDown = idx !== -1 && idx < siblingIds.length-1;
  const pop = document.createElement('div');
  pop.className='popover';
  pop.innerHTML = `
    ${canUp? `<button onclick="closePopovers();moveItemPosition('${tripId}','${itemId}',-1)">⬆️ Reorder Up</button>` : ''}
    ${canDown? `<button onclick="closePopovers();moveItemPosition('${tripId}','${itemId}',1)">⬇️ Reorder Down</button>` : ''}
    <button onclick="closePopovers();openAddItemModal('${tripId}','${itemId}')">✏️ Edit</button>

async function deleteItem(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip.items.find(i=>i.id===itemId);
  const children = trip.items.filter(i=>i.parentActivityId===itemId);
  const storagePaths = [item, ...children].flatMap(it=>{
    if(!it) return [];
    const paths = (it.files||[]).map(f=>f.storagePath);
    if(it.imagePaths && it.imagePaths.length) paths.push(...it.imagePaths);
    if(it.iconImagePath) paths.push(it.iconImagePath);
    return paths;
  });
  beginLoading();
  try{
  // Explicitly remove continuation duplicates too (belt-and-braces alongside the DB's own cascade).
  if(children.length){
    await sb.from('activities').delete().in('id', children.map(c=>c.id));
  }
  const { error } = await sb.from('activities').delete().eq('id', itemId);
  if(error){ alert('Could not delete activity: '+error.message); return; }
  if(storagePaths.length) await sb.storage.from('attachments').remove(storagePaths).catch(()=>{});
  trip.items = trip.items.filter(i=>i.id!==itemId && i.parentActivityId!==itemId);
  render();
  showToast('Activity deleted');
  } finally {
    endLoading();
  }
}
async function duplicateItem(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip.items.find(i=>i.id===itemId);
  if(!item) return;
  const newOrder = trip.items.reduce((m,i)=>Math.max(m,i.order||0),-1)+1;
  const payload = {
    trip_id: tripId, type: item.type, icon: item.icon || null, icon_image_path: item.iconImagePath || null, status: item.status,
    booked_by: item.bookedBy || null, name: item.name,
    cost_total: item.costTotal || 0, cost_per_pax: item.costPerPax || 0, currency: item.currency || 'SGD',
    date_start: item.dateStart || null, date_end: item.dateEnd || null,
    time_start: item.timeStart || null, time_end: item.timeEnd || null,
    link: item.link || null, maps_link: item.mapsLink || null,
    card_color: item.cardColor || null, notes: item.notes || '', sort_order: newOrder,
    is_duplicate: false, parent_activity_id: null, is_poi: item.isPoi || false,
  };
  beginLoading();
  try{
    const { data: row, error } = await sb.from('activities').insert(payload).select().single();
    if(error){ alert('Could not duplicate activity: '+error.message); return; }
    trip.items.push(dbActivityToItem(row, []));
    await reconcileDuplicates(tripId, row.id, payload, newOrder);
    render();
    showToast('Activity duplicated');
  } finally {
    endLoading();
  }
}
/* Keeps auto-generated multi-day "continuation" rows in sync with a parent activity's
   date range, without touching any continuation rows the user has independently edited. */
async function reconcileDuplicates(tripId, parentId, basePayload, order){
  const trip = getTrip(tripId);
  if(!trip) return;
  const dateStart = basePayload.date_start, dateEnd = basePayload.date_end;
  const desiredDates = [];
  if(dateStart && dateEnd && dateEnd > dateStart){
    let d = addDays(dateStart, 1);
    while(d <= dateEnd){ desiredDates.push(d); d = addDays(d, 1); }
  }
  const existingDups = trip.items.filter(i=>i.parentActivityId===parentId);
  for(const dup of existingDups){
    if(!desiredDates.includes(dup.dateStart)){
      const storagePaths = (dup.files||[]).map(f=>f.storagePath);
      if(dup.imagePaths && dup.imagePaths.length) storagePaths.push(...dup.imagePaths);
      await sb.from('activities').delete().eq('id', dup.id);
      if(storagePaths.length) await sb.storage.from('attachments').remove(storagePaths).catch(()=>{});
      trip.items = trip.items.filter(i=>i.id!==dup.id);
    }
  }
  const stillExistingDates = trip.items.filter(i=>i.parentActivityId===parentId).map(i=>i.dateStart);
  for(const d of desiredDates){
    if(stillExistingDates.includes(d)) continue;
    const { data: row, error } = await sb.from('activities').insert({
      trip_id: tripId, type: basePayload.type, icon: basePayload.icon, icon_image_path: basePayload.icon_image_path || null, status: basePayload.status,
      booked_by: basePayload.booked_by, name: basePayload.name,
      cost_total: basePayload.cost_total, cost_per_pax: basePayload.cost_per_pax, currency: basePayload.currency || 'SGD',
      date_start: d, date_end: d, time_start: null, time_end: null,
      link: basePayload.link, maps_link: basePayload.maps_link, card_color: basePayload.card_color,
      notes: basePayload.notes, sort_order: order, is_duplicate: true, parent_activity_id: parentId,
      is_poi: basePayload.is_poi || false, place_id: basePayload.place_id || null,
    }).select().single();
    if(!error) trip.items.push(dbActivityToItem(row, []));
  }
}

async function moveItemToDate(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip && trip.items.find(i=>i.id===itemId);
  const newStart = document.getElementById('move-item-date-input').value;
  if(!trip || !item || !newStart) return;
  // Preserve the activity's span (e.g. a 2-night stay stays a 2-night stay) by shifting
  // date_end by the same number of days the start moved.
  let newEnd = newStart;
  if(item.dateStart && item.dateEnd && item.dateEnd > item.dateStart){
    const span = daysBetween(item.dateStart, item.dateEnd);
    newEnd = addDays(newStart, span);
  }
  beginLoading();
  try{
    const { error } = await sb.from('activities').update({ date_start: newStart, date_end: newEnd }).eq('id', itemId);
    if(error){ alert('Could not move activity: '+error.message); return; }
    item.dateStart = newStart;
    item.dateEnd = newEnd;
    await reconcileDuplicates(tripId, itemId, {
      type: item.type, icon: item.icon||null, icon_image_path: item.iconImagePath||null, status: item.status, booked_by: item.bookedBy||null,
      name: item.name, cost_total: item.costTotal||0, cost_per_pax: item.costPerPax||0, currency: item.currency||'SGD',
      date_start: newStart, date_end: newEnd, link: item.link||null, maps_link: item.mapsLink||null,
      card_color: item.cardColor||null, notes: item.notes||'', is_poi: item.isPoi||false,
    }, item.order||0);
    closeModal();
    render();
    showToast('Activity moved');
  } finally {
    endLoading();
  }
}

function coverPublicUrl(path){
  if(!path) return '';
  return sb.storage.from('attachments').getPublicUrl(path).data.publicUrl;
}
function renderCoverPreview(){
  const el = document.getElementById('cover-preview');
  if(!el) return;
  el.innerHTML = tempCoverPaths.map((path, idx)=>`
    <div style="position:relative;display:inline-block;">
      <img src="${coverPublicUrl(path)}" style="width:120px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--border);display:block;">
      <button type="button" onclick="removeCoverImage(${idx})" style="position:absolute;top:-8px;right:-8px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:13px;line-height:1;">&times;</button>
    </div>`).join('');
}
// Supabase Storage rejects object keys with spaces or other non-URL-safe characters
// (common in default screenshot/download filenames like "Screenshot 2026-09-01 at
// 5.06.33 PM.png") with an "Invalid key" error — sanitize before using in a path.
// The original, human-readable name is kept separately wherever it's displayed.
function sanitizeFileName(name){
  const lastDot = name.lastIndexOf('.');
  const base = lastDot > 0 ? name.slice(0, lastDot) : name;
  const ext = lastDot > 0 ? name.slice(lastDot) : '';
  const safeBase = base.replace(/[^a-zA-Z0-9_-]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '') || 'file';
  const safeExt = ext.replace(/[^a-zA-Z0-9.]+/g, '');
  return safeBase + safeExt;
}
async function handleCoverSelect(e){
  const files = Array.from(e.target.files);
  e.target.value = '';
  if(!files.length) return;
  beginLoading();
  try{
    for(const file of files){
      const path = `shared/${currentDraftId}/cover_${Date.now()}_${sanitizeFileName(file.name)}`;
      const { error } = await sb.storage.from('attachments').upload(path, file);
      if(error){ alert('Image upload failed for '+file.name+': '+error.message); continue; }
      tempCoverPaths.push(path);
      renderCoverPreview();
    }
  } finally {
    endLoading();
  }
}
function removeCoverImage(idx){
  tempCoverPaths.splice(idx, 1);
  renderCoverPreview();
}
/* ---- Custom uploaded icon (replaces the emoji picker for this activity when set) ---- */
function renderIconUploadHtml(){

}
async function handleIconUpload(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  beginLoading();
  try{
    const path = `shared/${currentDraftId}/icon_${Date.now()}_${sanitizeFileName(file.name)}`;
    const { error } = await sb.storage.from('attachments').upload(path, file);
    if(error){ alert('Icon upload failed: '+error.message); return; }
    tempIconImagePath = path;
    refreshIconField();
  } finally {
    endLoading();
  }
}
function removeCustomIcon(){
  tempIconImagePath = null;
  refreshIconField();
}
function refreshIconField(){
  const select = document.getElementById('item-icon-input');
  if(select) select.disabled = !!tempIconImagePath;
  const row = document.getElementById('icon-upload-row');
  if(row) row.innerHTML = renderIconUploadHtml();
}
async function handleFileSelect(e){
  const files = Array.from(e.target.files);
  e.target.value = '';
  if(!files.length) return;
  for(const f of files){
    const uploadingEntry = { name: f.name, storagePath: null, uploading: true };
    tempFiles.push(uploadingEntry);
    renderFileChips();
    const path = `shared/${currentDraftId}/${Date.now()}_${sanitizeFileName(f.name)}`;
    const { error } = await sb.storage.from('attachments').upload(path, f);
    if(error){
      alert('Upload failed for '+f.name+': '+error.message);
      tempFiles.splice(tempFiles.indexOf(uploadingEntry), 1);
      renderFileChips();
      continue;
    }
    uploadingEntry.storagePath = path;
    uploadingEntry.uploading = false;
    uploadingEntry.pending = true; // not yet linked to an activity row
    if(currentEditingItemId){
      // parent activity already exists in the DB — link the file right away
      const { data: row, error: linkErr } = await sb.from('activity_files')
        .insert({ activity_id: currentEditingItemId, file_name: f.name, storage_path: path }).select().single();
      if(!linkErr){ uploadingEntry.id = row.id; uploadingEntry.pending = false; }
    }
    renderFileChips();
  }
}
function renderFileChips(){
  const el = document.getElementById('file-chip-list');
  if(!el) return;
  el.innerHTML = tempFiles.map((f,idx)=>`
    <div class="file-chip">
      ${f.uploading ? `<span class="file-chip-name">📎 ${escapeHtml(f.name)} (uploading…)</span>` :
        `<span class="file-chip-name" onclick="openFilePreviewByTemp(${idx})">📎 ${escapeHtml(f.name)}</span>`}
      <button onclick="removeTempFile(${idx})" ${f.uploading?'disabled':''}>Remove</button>
    </div>`).join('');
}
async function removeTempFile(idx){
  const f = tempFiles[idx];
  if(f && f.storagePath){
    try{ await sb.storage.from('attachments').remove([f.storagePath]); }catch(e){}
    // Note: Supabase's Postgrest query builder only implements .then(), not .catch(),
    // so chaining .catch() directly on it throws a TypeError — must use try/catch instead.
    // Prefer deleting by id, but fall back to matching on storage_path when it's missing —
    // without this fallback, a file removed here would delete the storage object but leave
    // its activity_files row behind, orphaned and permanently un-openable from then on
    // (this is how a past bug left a few "Could not open file" attachments on some cards).
    try{
      if(f.id) await sb.from('activity_files').delete().eq('id', f.id);
      else if(currentEditingItemId) await sb.from('activity_files').delete().eq('activity_id', currentEditingItemId).eq('storage_path', f.storagePath);
    }catch(e){ console.error('Could not remove file record for', f.storagePath, e); }
  }
  tempFiles.splice(idx,1);
  renderFileChips();
}
function recalcPerPax(pax){
  const totalEl = document.getElementById('item-cost-total-input');
  const perPaxEl = document.getElementById('item-cost-perpax-input');
  if(!totalEl || !perPaxEl) return;
  const total = parseFloat(totalEl.value) || 0;
  const p = Number(pax) || 1;
  perPaxEl.value = total ? (total/p).toFixed(2) : '';
}

async function saveItem(tripId, itemId){
  const trip = getTrip(tripId);
  const existingItem = itemId ? trip.items.find(i=>i.id===itemId) : null;
  const isEditingDuplicate = !!(existingItem && existingItem.isDuplicate);
  const name = document.getElementById('item-name-input').value.trim();
  if(!name){ alert('Please enter a name.'); return; }
  const dateStart = document.getElementById('item-date-start-input').value;
  const dateEnd = document.getElementById('item-date-end-input').value;
  const timeStart = document.getElementById('item-time-start-input').value;
  const timeEnd = document.getElementById('item-time-end-input').value;
  if(dateEnd && dateStart && dateEnd < dateStart){ alert('End date must be on or after the start date.'); return; }
  if(timeEnd && timeStart && (!dateEnd || dateEnd===dateStart) && timeEnd < timeStart){ alert('End time must be after the start time.'); return; }
  if(tempFiles.some(f=>f.uploading)){ alert('Please wait for the attachment upload to finish.'); return; }

  const colorEnabled = document.getElementById('item-color-input').dataset.enabled==='1';
  const payload = {
    type: document.getElementById('item-type-input').value,
    icon: document.getElementById('item-icon-input').value || null,
    status: document.getElementById('item-status-input').value,
    booking_opens_date: document.getElementById('item-bookingopens-input').value || null,
    booked_by: document.getElementById('item-bookedby-input').value || null,
    name,
    cost_total: parseFloat(document.getElementById('item-cost-total-input').value) || 0,
    cost_per_pax: parseFloat(document.getElementById('item-cost-perpax-input').value) || 0,
    currency: document.getElementById('item-currency-input').value === 'EUR' ? 'EUR' : 'SGD',
    date_start: dateStart || null,
    date_end: dateEnd || null,
    time_start: timeStart || null,
    time_end: timeEnd || null,
    link: document.getElementById('item-link-input').value.trim() || null,
    maps_link: document.getElementById('item-maps-input').value.trim() || null,
    card_color: colorEnabled ? document.getElementById('item-color-input').value : null,
    image_paths: tempCoverPaths,
    icon_image_path: tempIconImagePath,
    notes: document.getElementById('item-notes-input').innerHTML,
    is_poi: document.getElementById('item-poi-input').checked,
    place_id: tempPlaceId,
  };
  // Re-geocode if the location-relevant fields changed, so stale coordinates don't stick around.
  // A fresh Places Autocomplete selection already carries exact coordinates, so it skips the
  // geocoding pass entirely rather than clearing lat/lng and waiting for the map to fill them in.
  let coordsCleared = false;
  if(tempPlaceLatLng){
    payload.lat = tempPlaceLatLng.lat; payload.lng = tempPlaceLatLng.lng;
  } else if(existingItem && (existingItem.mapsLink !== (payload.maps_link||'') || existingItem.name !== payload.name)){
    payload.lat = null; payload.lng = null; coordsCleared = true;
  }
  // Images removed during this edit (still present in the original set, no longer in the
  // current one) need their storage objects cleaned up; newly-added ones are already
  // uploaded and just need linking, which the image_paths column update below handles.
  const removedCoverPaths = originalCoverPaths.filter(p=>!tempCoverPaths.includes(p));
  // Note: unlike gallery images, a custom icon's storage path can be shared by multi-day
  // continuation duplicates (copied at creation time, not a live reference), so an old icon
  // is deliberately NOT deleted from storage here when replaced/removed — doing so could
  // break a sibling duplicate that still points at the same file. It's only cleaned up when
  // the whole activity (and all its duplicates) is deleted, in deleteItem.

  let savedId = itemId;
  let savedOrder;
  beginLoading();
  try{
    if(itemId){
      const { error } = await sb.from('activities').update(payload).eq('id', itemId);
      if(error){ alert('Could not save activity: '+error.message); return; }
      savedOrder = trip.items.find(i=>i.id===itemId).order;
    } else {
      savedOrder = trip.items.reduce((m,i)=>Math.max(m,i.order||0),-1)+1;
      const { data: row, error } = await sb.from('activities').insert({ ...payload, trip_id: tripId, sort_order: savedOrder }).select().single();
      if(error){ alert('Could not create activity: '+error.message); return; }
      savedId = row.id;
      // link any files that were uploaded before this activity row existed
      for(const f of tempFiles.filter(f=>f.pending)){
        const { data: fr, error: fe } = await sb.from('activity_files')
          .insert({ activity_id: savedId, file_name: f.name, storage_path: f.storagePath }).select().single();
        if(!fe){ f.id = fr.id; f.pending = false; }
      }
    }

    const localItem = {
      id: savedId,
      type: payload.type, icon: payload.icon || '', status: payload.status, bookingOpensDate: payload.booking_opens_date || '', bookedBy: payload.booked_by || '',
      name: payload.name, costTotal: payload.cost_total, costPerPax: payload.cost_per_pax, currency: payload.currency,
      dateStart: payload.date_start || '', dateEnd: payload.date_end || '',
      timeStart: payload.time_start || '', timeEnd: payload.time_end || '',
      link: payload.link || '', mapsLink: payload.maps_link || '', cardColor: payload.card_color || '',
      imagePaths: payload.image_paths || [],
      iconImagePath: payload.icon_image_path || null,
      lat: tempPlaceLatLng ? tempPlaceLatLng.lat : (coordsCleared ? null : (existingItem ? existingItem.lat : null)),
      lng: tempPlaceLatLng ? tempPlaceLatLng.lng : (coordsCleared ? null : (existingItem ? existingItem.lng : null)),
      placeId: payload.place_id || null,
      isDuplicate: existingItem ? existingItem.isDuplicate : false,
      isPoi: payload.is_poi,
      parentActivityId: existingItem ? existingItem.parentActivityId : null,
      notes: payload.notes, order: savedOrder,
      files: tempFiles.map(f=>({ id: f.id, name: f.name, storagePath: f.storagePath })),
    };
    if(removedCoverPaths.length){
      sb.storage.from('attachments').remove(removedCoverPaths).catch(()=>{});
    }
    if(itemId){
      Object.assign(trip.items.find(i=>i.id===itemId), localItem);
    } else {
      trip.items = trip.items||[];
      trip.items.push(localItem);
    }
    if(!isEditingDuplicate){
      await reconcileDuplicates(tripId, savedId, payload, savedOrder);
    }
    closeModal(); render();
    showToast('Activity saved');
  } finally {
    endLoading();
  }
}

/* ============ TRIP EXPENSES (quick daily spending log) ============
   Separate from the booked-activity cost breakdown below (Expenses modal) — this is for
   ad-hoc cash spending as you go (food, shopping, etc.), logged in a few taps and not
   folded into the itinerary's own cost totals. Opens as a modal over whatever page you're
   already on (trip detail), rather than navigating away to its own page. */
let editingExpenseId = null;
let tempReceiptPath = null;
// Entry point for both "💰 Trip Expenses" buttons — resets any in-progress edit so
// re-opening the modal never carries over stale form state from a previous visit.
function openTripExpenses(tripId){
  ui.detailTripId = tripId;
  editingExpenseId = null;
  tempReceiptPath = null;
  modalPreventOutsideClose = true;
  renderTripExpensesModal(tripId);
}
function renderTripExpensesModal(tripId){
  const trip = getTrip(tripId);

  const numDays = tripDays(trip);
  const filterCat = ui.expenseCategoryFilter || 'all';
  const filterDay = ui.expenseDayFilter || 'all';

  const filtered = all
    .filter(e=> filterCat==='all' || e.category===filterCat)
    .filter(e=> filterDay==='all' || e.date===filterDay);
  const total = filtered.reduce((s,e)=>s+Number(e.amount||0),0);
  const byCategory = {};
  filtered.forEach(e=>{ byCategory[e.category] = (byCategory[e.category]||0) + Number(e.amount||0); });
  const groups = groupExpensesByDate(filtered);

  const editing = editingExpenseId ? (trip.expenses||[]).find(e=>e.id===editingExpenseId) : null;

  const html = `
    <div class="modal-header">

    </div>

    <div class="card" id="expense-form-card" style="margin-bottom:22px;padding:18px;">

      <div class="field-row">
        <div class="field">
          <label class="field-label">Amount</label>
          <input type="number" min="0" step="0.01" id="expense-amount-input" placeholder="0.00" value="${editing?editing.amount:''}">
        </div>
        <div class="field">
          <label class="field-label">Category</label>
          <select id="expense-category-input">${EXPENSE_CATEGORIES.map(c=>`<option value="${c}" ${editing&&editing.category===c?'selected':''}>${EXPENSE_CATEGORY_ICONS[c]||''} ${c}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">Day <span style="font-weight:400;">(optional)</span></label>
          ${trip.startDate
            ? `<select id="expense-date-input">${dayOptionsHtml(trip, editing?editing.date:todayWithinTrip(trip), true)}</select>`
            : `<input type="date" id="expense-date-input" value="${editing?editing.date:todayStr()}">`}
        </div>
        <div class="field">
          <label class="field-label">Paid by <span style="font-weight:400;">(optional)</span></label>
          <select id="expense-paidby-input">
            <option value="" ${editing&&!editing.paidBy?'selected':''}>—</option>
            ${BOOKED_BY.map(b=>`<option value="${b}" ${editing&&editing.paidBy===b?'selected':''}>${b}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Note <span style="font-weight:400;">(optional)</span></label>
        <input type="text" id="expense-note-input" placeholder="e.g. Lunch at the night market" value="${editing?escapeHtml(editing.note):''}">

        <div id="expense-receipt-row">${renderExpenseReceiptUploadHtml()}</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" onclick="saveExpense('${trip.id}')">${editing? 'Save Changes' : '+ Log Expense'}</button>
        ${editing? `<button class="btn" onclick="cancelEditExpense()">Cancel</button>` : ''}
      </div>
    </div>

    <div class="filter-bar">
      <select class="filter-select" onchange="ui.expenseCategoryFilter=this.value;renderTripExpensesModal('${trip.id}');">
        <option value="all" ${filterCat==='all'?'selected':''}>All Categories</option>
        ${EXPENSE_CATEGORIES.map(c=>`<option value="${c}" ${filterCat===c?'selected':''}>${c}</option>`).join('')}
      </select>
      ${trip.startDate? `<select class="filter-select" onchange="ui.expenseDayFilter=this.value;renderTripExpensesModal('${trip.id}');">
        <option value="all" ${filterDay==='all'?'selected':''}>All Days</option>
        ${Array.from({length:numDays}).map((_,i)=>{ const d=addDays(trip.startDate,i); return `<option value="${d}" ${filterDay===d?'selected':''}>Day ${i} · ${fmtDateShort(d)}</option>`; }).join('')}

      ${trip.pax>1 && total>0? `<div class="countdown-sub">≈ ${fmtCost(total/trip.pax)}/pax</div>`:''}
      ${Object.keys(byCategory).length? `<div class="countdown-sub" style="margin-top:6px;">${Object.keys(byCategory).map(c=>`${EXPENSE_CATEGORY_ICONS[c]||''} ${c}: ${fmtCost(byCategory[c])}`).join(' · ')}</div>` : ''}
    </div>

    <div id="expense-list">

function groupExpensesByDate(list){
  const byDate = {};
  const order = [];
  list.forEach(e=>{
    const key = e.date || 'No date';
    if(!byDate[key]){ byDate[key]=[]; order.push(key); }
    byDate[key].push(e);
  });
  return order.map(key=>({ date:key, items:byDate[key], total: byDate[key].reduce((s,e)=>s+Number(e.amount||0),0) }));
}
function renderExpenseGroupHtml(group, trip){
  const hasDate = group.date!=='No date';
  const dayLabel = (hasDate && trip.startDate) ? `Day ${daysBetween(trip.startDate, group.date)} · ${fmtDateShort(group.date)}` : (hasDate ? fmtDateShort(group.date) : 'No date');
  return `
    <div style="margin-bottom:18px;">
      <div class="expense-day-header">
        <span>${dayLabel}</span>
        <span>${fmtCost(group.total)}</span>
      </div>
      ${group.items.map(e=>renderExpenseRow(e, trip)).join('')}
    </div>`;
}
// Each row doubles as an edit trigger (tap anywhere on it) — the receipt thumbnail and
// delete button stop propagation so they act independently of that. position:relative here
// anchors the delete-confirmation popover (see showDeleteExpenseConfirm) to this specific row.
function renderExpenseRow(e, trip){
  const perPax = (trip && trip.pax>1 && Number(e.amount)>0) ? ` · ${fmtCost(Number(e.amount)/trip.pax)}/pax` : '';
  const metaBits = [e.paidBy? escapeHtml(e.paidBy):'', e.note? escapeHtml(e.note):''].filter(Boolean).join(' · ');
  return `<div class="card expense-row" id="expense-row-${e.id}" style="position:relative;margin-bottom:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;" onclick="startEditExpense('${e.tripId}','${e.id}')">
    ${e.receiptPath
      ? `<a href="${coverPublicUrl(e.receiptPath)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><img src="${coverPublicUrl(e.receiptPath)}" alt="Receipt" style="width:40px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--border-strong);flex-shrink:0;"></a>`
      : `<div style="font-size:20px;flex-shrink:0;">${EXPENSE_CATEGORY_ICONS[e.category]||'💸'}</div>`}
    <div style="flex:1;min-width:0;">
      <div style="font-weight:600;">${fmtCost(e.amount)} <span style="font-weight:400;color:var(--text-muted);">· ${escapeHtml(e.category)}${perPax}</span></div>
      ${metaBits? `<div class="countdown-sub">${metaBits}</div>`:''}
    </div>
    <button class="btn btn-sm" onclick="event.stopPropagation();startEditExpense('${e.tripId}','${e.id}')" title="Edit">✏️</button>
    <button class="btn btn-sm" onclick="showDeleteExpenseConfirm(event,'${e.tripId}','${e.id}')" title="Delete">✕</button>
  </div>`;
}
// A tap on "✕" used to delete the expense immediately — one careless tap on a phone and a
// logged expense was gone with no way back. This shows the same inline confirm-box pattern
// already used for deleting an activity, instead of deleting straight away.
function showDeleteExpenseConfirm(e, tripId, expenseId){
  e.stopPropagation();
  const row = document.getElementById('expense-row-'+expenseId);
  if(!row) return;
  const existing = row.querySelector('.confirm-box');
  if(existing){ existing.remove(); return; }
  const box = document.createElement('div');
  box.className = 'popover confirm-box';
  box.innerHTML = `
    <p>Delete this expense? This can't be undone.</p>
    <div class="confirm-actions">
      <button class="btn btn-sm" style="flex:1;" onclick="event.stopPropagation();this.closest('.confirm-box').remove()">Cancel</button>
      <button class="btn btn-danger btn-sm" style="flex:1;" onclick="event.stopPropagation();deleteExpense('${tripId}','${expenseId}')">Delete</button>
    </div>`;
  box.addEventListener('click', e2=>e2.stopPropagation());
  row.appendChild(box);
}
function renderExpenseReceiptUploadHtml(){
  if(tempReceiptPath){
    return `<div style="display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap;">
      <img src="${coverPublicUrl(tempReceiptPath)}" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--border-strong);">
      <span class="muted-note" style="flex:1;min-width:120px;">Receipt attached.</span>
      <button type="button" class="btn btn-sm" onclick="scanReceiptWithAI()">🔍 Scan with AI</button>
      <button type="button" class="btn btn-sm" onclick="removeExpenseReceipt()">Remove</button>
    </div>`;
  }
  // No "capture" attribute here on purpose — it forces mobile browsers straight into the
  // camera app, skipping the normal picker that also offers the photo gallery/files. Leaving
  // it off lets the OS show its usual chooser (camera, gallery, or files) instead.
  return `<input type="file" accept="image/*" id="expense-receipt-input" onchange="handleReceiptUpload(event)">
    <span class="muted-note">Snap a photo of the receipt, or pick one from your gallery.</span>`;
}
// Sends the just-uploaded receipt photo to the scan-receipt Edge Function, which calls
// Claude's vision model server-side (so the Anthropic API key never touches the browser) to
// read the line items and translate them to English. Pre-fills the form for review rather
// than saving straight to the database, since OCR/AI reads can occasionally mis-read a
// number — a human glance before hitting Save is cheap insurance on a financial record.
async function scanReceiptWithAI(){
  if(!tempReceiptPath){ alert('Attach a receipt photo first.'); return; }
  const imageUrl = coverPublicUrl(tempReceiptPath);
  beginLoading();
  try{
    const { data, error } = await sb.functions.invoke('scan-receipt', { body: { imageUrl } });
    if(error || (data && data.error)){
      const msg = (data && data.message) || (error && error.message) || 'Unknown error';
      alert('Could not scan the receipt: '+msg);
      return;
    }
    const amountEl = document.getElementById('expense-amount-input');
    const categoryEl = document.getElementById('expense-category-input');
    const noteEl = document.getElementById('expense-note-input');
    if(data.total!=null && amountEl) amountEl.value = Number(data.total).toFixed(2);
    if(data.category_guess && EXPENSE_CATEGORIES.includes(data.category_guess) && categoryEl) categoryEl.value = data.category_guess;
    if(noteEl){
      const parts = [];
      if(data.merchant) parts.push(data.merchant);
      if(data.items && data.items.length) parts.push(data.items.map(i=>`${i.name} (${i.price!=null?i.price:'?'})`).join(', '));
      if(data.currency) parts.push(`[${data.currency} on receipt — amount above may need converting]`);
      if(parts.length) noteEl.value = parts.join(' — ');
    }
    showToast((data.items&&data.items.length) ? 'Receipt scanned — review and save' : 'Scanned, but could not read line items — please check');
  }catch(e){
    alert('Could not scan the receipt: '+(e.message||e));
  } finally {
    endLoading();
  }
}
function refreshExpenseReceiptField(){
  const row = document.getElementById('expense-receipt-row');
  if(row) row.innerHTML = renderExpenseReceiptUploadHtml();
}
async function handleReceiptUpload(e){
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  beginLoading();
  try{
  const path = `shared/expenses/receipt_${Date.now()}_${sanitizeFileName(file.name)}`;
  const { error } = await sb.storage.from('attachments').upload(path, file);
  if(error){ alert('Receipt upload failed: '+error.message); return; }
  tempReceiptPath = path;
  refreshExpenseReceiptField();
  } finally {
    endLoading();
  }
}
function removeExpenseReceipt(){
  tempReceiptPath = null;
  refreshExpenseReceiptField();
}
function startEditExpense(tripId, expenseId){
  const trip = getTrip(tripId);
  const exp = trip && (trip.expenses||[]).find(e=>e.id===expenseId);
  if(!exp) return;
  editingExpenseId = expenseId;
  tempReceiptPath = exp.receiptPath || null;
  renderTripExpensesModal(tripId);
  const formEl = document.getElementById('expense-form-card');
  if(formEl && formEl.scrollIntoView) formEl.scrollIntoView({ behavior:'smooth', block:'start' });
}
function cancelEditExpense(){
  editingExpenseId = null;
  tempReceiptPath = null;
  renderTripExpensesModal(ui.detailTripId);
}
async function saveExpense(tripId){
  const trip = getTrip(tripId);
  if(!trip) return;
  const amount = Number(document.getElementById('expense-amount-input').value);
  if(!amount || amount<=0){ alert('Enter an amount greater than 0.'); return; }
  const category = document.getElementById('expense-category-input').value;
  const dateInput = document.getElementById('expense-date-input');
  const date = (dateInput && dateInput.value) ? dateInput.value : (todayWithinTrip(trip) || null);
  const paidBy = document.getElementById('expense-paidby-input').value || null;
  const note = document.getElementById('expense-note-input').value.trim() || null;
  const payload = { trip_id: tripId, amount, category, date, paid_by: paidBy, note, receipt_path: tempReceiptPath || null };
  beginLoading();
  try{
    if(editingExpenseId){
      const { data: row, error } = await sb.from('expenses').update(payload).eq('id', editingExpenseId).select().single();
      if(error){ alert('Could not update expense: '+error.message); return; }
      const idx = (trip.expenses||[]).findIndex(e=>e.id===editingExpenseId);
      if(idx>-1) trip.expenses[idx] = dbExpenseToItem(row);
      editingExpenseId = null;
      tempReceiptPath = null;
      renderTripExpensesModal(tripId);
      showToast('Expense updated');
    } else {
      const { data: row, error } = await sb.from('expenses').insert(payload).select().single();
      if(error){ alert('Could not log expense: '+error.message); return; }
      trip.expenses = trip.expenses || [];
      trip.expenses.push(dbExpenseToItem(row));
      tempReceiptPath = null;
      renderTripExpensesModal(tripId);
      showToast('Expense logged');
    }
  } finally {
    endLoading();
  }
}
async function deleteExpense(tripId, expenseId){
  const trip = getTrip(tripId);
  if(!trip) return;
  const exp = (trip.expenses||[]).find(e=>e.id===expenseId);
  beginLoading();
  try{
    try{ await sb.from('expenses').delete().eq('id', expenseId); }catch(e){}
    if(exp && exp.receiptPath){ try{ await sb.storage.from('attachments').remove([exp.receiptPath]); }catch(e){} }
    trip.expenses = (trip.expenses||[]).filter(e=>e.id!==expenseId);
    if(editingExpenseId===expenseId){ editingExpenseId=null; tempReceiptPath=null; }
    showToast('Expense deleted');
  } finally {
    endLoading();
  }
  renderTripExpensesModal(tripId);
}

/* ---- Trip Expenses Modal ---- */
let tripExpensesChart = null;
function openExpensesModal(tripId){
  renderExpensesModal(tripId);
}
function renderExpensesModal(tripId){
  const trip = getTrip(tripId);
  if(!trip) return;
  const filterType = ui.expensesModalType;
  const filterBookedBy = ui.expensesModalBookedBy;
  const items = (trip.items||[]).filter(i=> !i.isDuplicate && !i.isPoi && Number(i.costTotal)>0
    && (filterType==='all' || i.type===filterType)
    && (filterBookedBy==='all' || i.bookedBy===filterBookedBy));
  const total = items.reduce((s,i)=>s+toSgd(i.costTotal,i.currency),0);
  const html = `
    <div class="modal-header">
      <h3>Expenses — ${escapeHtml(trip.name)}</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="filter-bar">
      <select class="filter-select" onchange="ui.expensesModalType=this.value;renderExpensesModal('${tripId}');">
        <option value="all" ${filterType==='all'?'selected':''}>All Types</option>
        ${TYPES.map(t=>`<option value="${t}" ${filterType===t?'selected':''}>${t}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="ui.expensesModalBookedBy=this.value;renderExpensesModal('${tripId}');">
        <option value="all" ${filterBookedBy==='all'?'selected':''}>Booked by: All</option>
        ${BOOKED_BY.map(b=>`<option value="${b}" ${filterBookedBy===b?'selected':''}>Booked by: ${b}</option>`).join('')}
      </select>
    </div>
    ${items.length===0 ? '<p class="muted-note">No matching expenses.</p>' : `
      <div style="height:220px;position:relative;"><canvas id="trip-expenses-chart"></canvas></div>
      <div class="expenses-total">${fmtCost(total)}</div>
      <div class="countdown-sub">total across ${items.length} item${items.length===1?'':'s'} · shown as total cost (not per pax)</div>
    `}
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="closeModal()">Close</button>
    </div>
  `;
  openModal(html, true);
  renderTripExpensesChart(tripId);
}
function renderTripExpensesChart(tripId){
  const canvas = document.getElementById('trip-expenses-chart');
  if(!canvas || typeof Chart==='undefined') return;
  const trip = getTrip(tripId);
  if(!trip) return;
  const filterType = ui.expensesModalType;
  const filterBookedBy = ui.expensesModalBookedBy;
  const byType = {};
  (trip.items||[]).forEach(i=>{
    if(!i.isDuplicate && !i.isPoi && Number(i.costTotal)>0 && (filterType==='all' || i.type===filterType) && (filterBookedBy==='all' || i.bookedBy===filterBookedBy)){
      byType[i.type] = (byType[i.type]||0) + toSgd(i.costTotal,i.currency);
    }
  });
  const labels = Object.keys(byType);
  if(tripExpensesChart) tripExpensesChart.destroy();
  tripExpensesChart = new Chart(canvas, {
    type:'doughnut',
    data:{ labels, datasets:[{ data: labels.map(l=>byType[l]), backgroundColor: labels.map(l=>TYPE_COLORS[l]||'#999'), borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:11} } } }, cutout:'65%' }
  });
}

/* ============ SHOPPING LIST (per country, per trip) ============
   For things worth buying in a specific place — "get this in Venice", "look out for that in
   Paris" — tracked separately from booked-activity costs and the ad-hoc Trip Expenses log.
   Prices follow the same EUR/SGD pattern as activity costs (see toSgd/costHtml). */
let editingShoppingItemId = null;
let tempShoppingImagePath = null;
function openShoppingList(tripId){
  ui.detailTripId = tripId;
  editingShoppingItemId = null;
  tempShoppingImagePath = null;
  modalPreventOutsideClose = true;
  renderShoppingListModal(tripId);
}
function renderShoppingListModal(tripId){
  const trip = getTrip(tripId);
  if(!trip) return;
  const countries = trip.countries || [];
  const filterCountry = ui.shoppingCountryFilter || 'all';
  const all = (trip.shoppingItems||[]).slice().sort((a,b)=>
    (a.isBought===b.isBought ? 0 : (a.isBought ? 1 : -1)) || (b.createdAt||'').localeCompare(a.createdAt||''));
  const filtered = filterCountry==='all' ? all : all.filter(i=>i.country===filterCountry);
  const editing = editingShoppingItemId ? (trip.shoppingItems||[]).find(i=>i.id===editingShoppingItemId) : null;
  const groups = groupShoppingByCountry(filtered);

  const html = `
    <div class="modal-header">
      <h3>Shopping List — ${escapeHtml(trip.name)}</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>

    <div class="card" id="shopping-form-card" style="margin-bottom:22px;padding:18px;">
      <div class="section-title">${editing? 'Edit Item' : 'Add Item'}</div>
      <div class="field">
        <label class="field-label">Item</label>
        <input type="text" id="shopping-name-input" placeholder="e.g. Murano glass necklace" value="${editing?escapeHtml(editing.itemName):''}">
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">Country</label>
          <select id="shopping-country-input">
            ${countries.length
              ? countries.map(c=>`<option value="${escapeHtml(c)}" ${(editing? editing.country===c : (filterCountry!=='all' && filterCountry===c))?'selected':''}>${escapeHtml(c)}</option>`).join('')
              : `<option value="">—</option>`}
          </select>
        </div>
        <div class="field">
          <label class="field-label">Price</label>
          <input type="number" min="0" step="0.01" id="shopping-price-input" placeholder="0.00" value="${editing&&editing.price?editing.price:''}">
        </div>
        <div class="field" style="flex:0.6;">
          <label class="field-label">Currency</label>
          <select id="shopping-currency-input">
            <option value="SGD" ${(!editing||editing.currency!=='EUR')?'selected':''}>SGD</option>
            <option value="EUR" ${editing&&editing.currency==='EUR'?'selected':''}>EUR</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Where to find it <span style="font-weight:400;">(optional)</span></label>
        <input type="text" id="shopping-foundat-input" placeholder="e.g. Rialto Market, Murano island" value="${editing&&editing.foundAt?escapeHtml(editing.foundAt):''}">
      </div>
      <div class="field">
        <label class="field-label">Notes <span style="font-weight:400;">(optional)</span></label>
        <input type="text" id="shopping-notes-input" placeholder="e.g. Get the blue one, compare prices first" value="${editing&&editing.notes?escapeHtml(editing.notes):''}">
      </div>
      <div class="field">
        <label class="field-label">Photo <span style="font-weight:400;">(optional)</span></label>
        <div id="shopping-image-row">${renderShoppingImageUploadHtml()}</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" onclick="saveShoppingItem('${trip.id}')">${editing? 'Save Changes' : '+ Add Item'}</button>
        ${editing? `<button class="btn" onclick="cancelEditShoppingItem('${trip.id}')">Cancel</button>` : ''}
      </div>
    </div>

    ${countries.length>1 ? `
    <div class="filter-bar">
      <select class="filter-select" onchange="ui.shoppingCountryFilter=this.value;renderShoppingListModal('${trip.id}');">
        <option value="all" ${filterCountry==='all'?'selected':''}>All Countries</option>
        ${countries.map(c=>`<option value="${escapeHtml(c)}" ${filterCountry===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
      </select>
    </div>` : ''}

    <div id="shopping-list">
      ${groups.length===0 ? '<div class="empty-state"><span class="emoji">🛍️</span><p>No shopping list items yet.</p></div>' : groups.map(g=>renderShoppingGroupHtml(g, trip)).join('')}
    </div>

    <div class="modal-footer">
      <button class="btn btn-primary" onclick="closeModal()">Close</button>
    </div>
  `;
  openModal(html, true);
}
function groupShoppingByCountry(list){
  const byCountry = {};
  const order = [];
  list.forEach(i=>{
    const key = i.country || 'No country set';
    if(!byCountry[key]){ byCountry[key]=[]; order.push(key); }
    byCountry[key].push(i);
  });
  return order.map(key=>({ country:key, items:byCountry[key], total: byCountry[key].reduce((s,i)=>s+toSgd(i.price,i.currency),0) }));
}
function renderShoppingGroupHtml(group, trip){
  return `
    <div style="margin-bottom:18px;">
      <div class="expense-day-header">
        <span>${escapeHtml(group.country)}</span>
        <span>${fmtCost(group.total)}</span>
      </div>
      ${group.items.map(i=>renderShoppingRow(i, trip)).join('')}
    </div>`;
}
// Tapping anywhere on the row (including its thumbnail) opens the read-only detail popup —

// Mirrors the Trip Expenses receipt-photo upload pattern (see renderExpenseReceiptUploadHtml/
// handleReceiptUpload) — same "attachments" bucket, same no-capture-attribute choice so mobile
// browsers show their normal camera-or-gallery picker instead of forcing the camera straight open.
function renderShoppingImageUploadHtml(){
  if(tempShoppingImagePath){
    return `<div style="display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap;">
      <img src="${coverPublicUrl(tempShoppingImagePath)}" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--border-strong);">
      <span class="muted-note" style="flex:1;min-width:120px;">Photo attached.</span>

    </div>`;
  }
  return `<input type="file" accept="image/*" id="shopping-image-input" onchange="handleShoppingImageUpload(event)">
    <span class="muted-note">Snap a photo of the item, or pick one from your gallery.</span>`;
}
function refreshShoppingImageField(){
  const row = document.getElementById('shopping-image-row');
  if(row) row.innerHTML = renderShoppingImageUploadHtml();
}
async function handleShoppingImageUpload(e){
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  beginLoading();
  try{
    const path = `shared/shopping/item_${Date.now()}_${sanitizeFileName(file.name)}`;
    const { error } = await sb.storage.from('attachments').upload(path, file);
    if(error){ alert('Photo upload failed: '+error.message); return; }
    tempShoppingImagePath = path;
    refreshShoppingImageField();
  } finally {
    endLoading();
  }
}
function removeShoppingImage(){
  tempShoppingImagePath = null;
  refreshShoppingImageField();
}
async function saveShoppingItem(tripId){
  const trip = getTrip(tripId);
  if(!trip) return;
  const itemName = document.getElementById('shopping-name-input').value.trim();
  if(!itemName){ alert('Please enter an item name.'); return; }
  const country = document.getElementById('shopping-country-input').value || null;
  const price = parseFloat(document.getElementById('shopping-price-input').value) || 0;
  const currency = document.getElementById('shopping-currency-input').value === 'EUR' ? 'EUR' : 'SGD';
  const foundAt = document.getElementById('shopping-foundat-input').value.trim() || null;
  const notes = document.getElementById('shopping-notes-input').value.trim() || null;
  const payload = { trip_id: tripId, country, item_name: itemName, price, currency, found_at: foundAt, notes, image_path: tempShoppingImagePath || null };
  beginLoading();
  try{
    if(editingShoppingItemId){
      const { data: row, error } = await sb.from('shopping_items').update(payload).eq('id', editingShoppingItemId).select().single();
      if(error){ alert('Could not update item: '+error.message); return; }
      const idx = (trip.shoppingItems||[]).findIndex(i=>i.id===editingShoppingItemId);
      if(idx>-1) trip.shoppingItems[idx] = dbShoppingItemToItem(row);
      editingShoppingItemId = null;
      tempShoppingImagePath = null;
      renderShoppingListModal(tripId);
      showToast('Item updated');
    } else {
      const { data: row, error } = await sb.from('shopping_items').insert(payload).select().single();
      if(error){ alert('Could not add item: '+error.message); return; }
      trip.shoppingItems = trip.shoppingItems || [];
      trip.shoppingItems.push(dbShoppingItemToItem(row));
      tempShoppingImagePath = null;
      renderShoppingListModal(tripId);
      showToast('Item added');
    }
  } finally {
    endLoading();
  }
}
async function toggleShoppingBought(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip && (trip.shoppingItems||[]).find(i=>i.id===itemId);
  if(!item) return;
  const newBought = !item.isBought;
  const { error } = await sb.from('shopping_items').update({ is_bought: newBought }).eq('id', itemId);
  if(error){ alert('Could not update item: '+error.message); return; }
  item.isBought = newBought;
  renderShoppingListModal(tripId);
}
function showDeleteShoppingConfirm(e, tripId, itemId){
  e.stopPropagation();
  const row = document.getElementById('shopping-row-'+itemId);
  if(!row) return;
  const existing = row.querySelector('.confirm-box');
  if(existing){ existing.remove(); return; }
  const box = document.createElement('div');
  box.className = 'popover confirm-box';
  box.innerHTML = `
    <p>Delete this item? This can't be undone.</p>
    <div class="confirm-actions">
      <button class="btn btn-sm" style="flex:1;" onclick="event.stopPropagation();this.closest('.confirm-box').remove()">Cancel</button>
      <button class="btn btn-danger btn-sm" style="flex:1;" onclick="event.stopPropagation();deleteShoppingItem('${tripId}','${itemId}')">Delete</button>
    </div>`;
  box.addEventListener('click', e2=>e2.stopPropagation());
  row.appendChild(box);
}
async function deleteShoppingItem(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip && (trip.shoppingItems||[]).find(i=>i.id===itemId);
  beginLoading();
  try{
    try{ await sb.from('shopping_items').delete().eq('id', itemId); }catch(e){}
    if(item && item.imagePath){ try{ await sb.storage.from('attachments').remove([item.imagePath]); }catch(e){} }
    if(trip) trip.shoppingItems = (trip.shoppingItems||[]).filter(i=>i.id!==itemId);
    if(editingShoppingItemId===itemId){ editingShoppingItemId=null; tempShoppingImagePath=null; }
    showToast('Item deleted');
  } finally {
    endLoading();
  }
  renderShoppingListModal(tripId);
}

/* ============ TODAY ============ */
function renderToday(){
  const t = todayStr();
  const n = nowTime();
  let allToday = [];
  data.trips.forEach(trip=>{
    (trip.items||[]).forEach(item=>{
      if(item.isDuplicate || item.isPoi) return;
      const start = item.dateStart, end = item.dateEnd || item.dateStart;
      if(start && start<=t && t<=end) allToday.push({...item, tripName: trip.name, tripId: trip.id});
    });
  });
  allToday.sort((a,b)=> (a.timeStart||'99:99').localeCompare(b.timeStart||'99:99'));
  // "upcoming" = ongoing multi-day items already in progress, or items starting today that haven't started yet
  const upcoming = allToday.filter(i => i.dateStart < t || !i.timeStart || i.timeStart >= n);

  const list = ui.todayShowAll ? allToday : upcoming;

  return `
    <div class="toolbar-row" style="margin-top:28px;">
      <div>
        <h1 class="page-title" style="margin:0;">Today</h1>
        <div class="countdown-sub">${fmtDateLong(t)}</div>
      </div>
      <button class="btn" onclick="ui.todayShowAll=!ui.todayShowAll;render();">${ui.todayShowAll? 'Show upcoming only':'View all of today'}</button>
    </div>
    ${allToday.length===0 ? `
      <div class="empty-state"><span class="emoji">☀️</span><p>Nothing on the itinerary for today.</p></div>
    ` : list.length===0 ? `
      <div class="empty-state"><span class="emoji">✅</span><p>You're all caught up for today.</p></div>
    ` : `
      <div class="section-title">${ui.todayShowAll? "Today's full itinerary" : "Coming up"}</div>
      <div class="today-scroll">
        ${list.map(i=>renderTodayCard(i)).join('')}
      </div>
    `}
  `;
}

function renderTodayCard(item){
  const t = todayStr();
  const ongoing = item.dateStart < t; // started on an earlier day, still spanning today
  const past = !ongoing && item.timeStart && item.timeStart < nowTime();
  return `
    <div class="card today-card" style="${past?'opacity:.55;':''}" onclick="openTripDetail('${item.tripId}')">
      <div class="item-type-badge">${iconGlyphHtml(item, 22)}</div>
      ${ongoing? '<div class="today-time" style="font-size:13px;color:var(--text-muted);">In progress</div>' :
        item.timeStart? `<div class="today-time">${itemTimeLabel(item)}</div>` : '<div class="today-time" style="font-size:13px;color:var(--text-muted);">All day</div>'}
      <div class="item-name">${escapeHtml(item.name||'Untitled')}</div>
      <div class="item-meta"><span class="status-badge ${statusClass(item.status)}">${item.status}</span></div>
      <div class="countdown-sub" style="margin-top:6px;">${escapeHtml(item.tripName)}</div>
    </div>`;
}

/* ============ MODAL HELPERS ============ */
let modalPreventOutsideClose = false;
function openModal(html, wide){
  const modal = document.getElementById('modal-content');
  modal.className = 'modal' + (wide ? ' modal-wide' : '');
  modal.innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.add('hidden');
  document.getElementById('modal-content').innerHTML = '';
  document.getElementById('modal-content').className = 'modal';
  modalPreventOutsideClose = false;
  // The Places Autocomplete widget appends its suggestion dropdown to <body>, outside the
  // modal — it isn't cleaned up automatically when the input it's bound to gets wiped above.
  document.querySelectorAll('.pac-container').forEach(el=>el.remove());
}
document.getElementById('modal-overlay').addEventListener('click', e=>{
  if(e.target.id==='modal-overlay' && !modalPreventOutsideClose) closeModal();
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if(!document.getElementById('preview-overlay').classList.contains('hidden')) closeFilePreview();
  else closeModal();
});

/* ---- File attachment preview (opens as an in-app pop-out instead of a new browser tab) ---- */
function openFilePreview(url, name){
  const ext = (name.split('.').pop()||'').toLowerCase();
  const isImage = ['png','jpg','jpeg','gif','webp','svg'].includes(ext);
  const isPdf = ext==='pdf';
  let body;
  if(isImage) body = `<img src="${url}" style="max-width:100%;border-radius:10px;display:block;margin:0 auto;">`;
  // A raw <iframe src="pdf-url"> hands off to the browser's own native PDF plugin, which on
  // mobile Safari/Chrome often locks to page 1 with no way to scroll further inside a modal
  // (the touch-scroll gesture gets captured by the page behind it instead). Routing through
  // Mozilla's PDF.js web viewer instead renders the PDF as a normal scrollable web page, so
  // swiping down moves through every page reliably on both mobile and desktop.
  else if(isPdf) body = `<iframe src="https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(url)}" style="width:100%;height:75vh;border:1px solid var(--border);border-radius:10px;" allowfullscreen></iframe>`;
  else body = `<p class="muted-note">Preview isn't available for this file type, but you can open it below.</p>`;
  document.getElementById('preview-content').innerHTML = `
    <div class="modal-header"><h3 style="font-size:14px;word-break:break-all;padding-right:10px;">${escapeHtml(name)}</h3><button class="modal-close" onclick="closeFilePreview()">&times;</button></div>
    ${body}
    <div class="modal-footer">
      <a class="btn" href="${url}" target="_blank" rel="noopener">Open / Download</a>
      <button class="btn btn-primary" onclick="closeFilePreview()">Close</button>
    </div>`;
  document.getElementById('preview-overlay').classList.remove('hidden');
}
function closeFilePreview(){
  document.getElementById('preview-overlay').classList.add('hidden');
  document.getElementById('preview-content').innerHTML = '';
}
document.getElementById('preview-overlay').addEventListener('click', e=>{
  if(e.target.id==='preview-overlay') closeFilePreview();
});
async function openFilePreviewFor(tripId, itemId, idx){
  const trip = getTrip(tripId);
  const item = trip && trip.items.find(i=>i.id===itemId);
  const f = item && item.files && item.files[idx];
  if(!f) return;
  const { data, error } = await sb.storage.from('attachments').createSignedUrl(f.storagePath, 3600);
  if(error){
    // The DB still has this attachment linked, but the underlying file is gone from
    // storage (e.g. left behind by a past removal that deleted the object but not this
    // reference). Rather than a dead-end error every time, offer to clear the broken link.
    const shouldRemove = confirm(`Could not open "${f.name}" — the file seems to be missing.\n\nRemove this broken attachment from the activity?`);
    if(shouldRemove){
      beginLoading();
      try{
        await sb.from('activity_files').delete().eq('id', f.id);
        item.files = item.files.filter(x=>x.id!==f.id);
        render();
        showToast('Removed broken attachment');
      }catch(e){
        alert('Could not remove the broken attachment: '+(e.message||e));
      } finally {
        endLoading();
      }
    }
    return;
  }
  openFilePreview(data.signedUrl, f.name);
}
async function openFilePreviewByTemp(idx){
  const f = tempFiles[idx];
  if(!f || !f.storagePath) return;
  const { data, error } = await sb.storage.from('attachments').createSignedUrl(f.storagePath, 3600);
  if(error){ alert('Could not open file: '+error.message); return; }
  openFilePreview(data.signedUrl, f.name);
}

/* ---- Activity image gallery (pop-out with left/right nav for multiple images) ---- */
let galleryImages = [];
let galleryIndex = 0;
function openItemImages(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip && trip.items.find(i=>i.id===itemId);
  if(!item || !item.imagePaths || !item.imagePaths.length) return;
  galleryImages = item.imagePaths;
  galleryIndex = 0;
  renderGallery();
}
function renderGallery(){
  const multi = galleryImages.length > 1;
  const url = coverPublicUrl(galleryImages[galleryIndex]);
  document.getElementById('preview-content').innerHTML = `
    <div class="modal-header">
      <h3 style="font-size:14px;">${multi? (galleryIndex+1)+' / '+galleryImages.length : 'Image'}</h3>
      <button class="modal-close" onclick="closeFilePreview()">&times;</button>
    </div>
    <div style="position:relative;display:flex;align-items:center;justify-content:center;min-height:200px;">
      <img src="${url}" style="max-width:100%;max-height:65vh;border-radius:10px;display:block;">
      ${multi? `<button class="lightbox-nav" onclick="galleryNav(-1)" style="position:absolute;top:50%;left:8px;transform:translateY(-50%);">&#8249;</button>` : ''}
      ${multi? `<button class="lightbox-nav" onclick="galleryNav(1)" style="position:absolute;top:50%;right:8px;transform:translateY(-50%);">&#8250;</button>` : ''}
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" onclick="closeFilePreview()">Close</button>
    </div>`;
  document.getElementById('preview-overlay').classList.remove('hidden');
}
function galleryNav(delta){
  galleryIndex = (galleryIndex + delta + galleryImages.length) % galleryImages.length;
  renderGallery();
}

// One-tap way to hand a location to a taxi driver or send it to a travel companion —
// uses the native share sheet on mobile (where it's most useful), falling back to a
// clipboard copy (with a plain "copy the link" nudge if even that fails, e.g. no
// clipboard permission).
async function shareLocation(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip && trip.items.find(i=>i.id===itemId);
  if(!item || !item.mapsLink) return;
  const title = item.name || 'Location';
  if(navigator.share){
    try{ await navigator.share({ title, text: title, url: item.mapsLink }); return; }
    catch(e){ if(e && e.name==='AbortError') return; /* user cancelled the share sheet */ }
  }
  try{
    await navigator.clipboard.writeText(`${title}\n${item.mapsLink}`);
    alert('Location copied — paste it into Maps, a message, or share with your companion.');
  }catch(e){
    alert('Could not copy automatically — long-press the Navigation link above to copy it.');
  }
}

/* ---- Activity detail popup: tapping a card (or its map pin) opens everything about
   it in one place — images, meta, notes, and attachments — instead of only the edit form. */
let detailGalleryImages = [];
let detailGalleryIndex = 0;
let detailModalRenderToken = 0;
function openItemDetailModal(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip && trip.items.find(i=>i.id===itemId);
  if(!trip || !item) return;
  closePopovers();
  detailGalleryImages = item.imagePaths || [];
  detailGalleryIndex = 0;
  const myToken = ++detailModalRenderToken;
  // Street View acts as an instant placeholder hero image (no fetch needed — just lat/lng)
  // for activities with no photo of their own yet. If the async Places lookup below finds a
  // real photo of the place, it replaces this placeholder rather than stacking a second image
  // underneath it.
  const hasStreetViewFallback = !detailGalleryImages.length && item.lat!=null && item.lng!=null;
  const linkedNotes = linkifyNotes(item.notes);
  const html = `
    <div class="modal-header">
      <h3>${escapeHtml(item.name||'Untitled')}</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="detail-gallery">${detailGalleryImages.length ? renderDetailGalleryHtml()
      : hasStreetViewFallback ? `<div class="detail-gallery-frame"><img src="${streetViewUrl(item.lat,item.lng,640,320)}" class="detail-gallery-img" alt="Street View"></div>`
      : ''}</div>
    <div class="detail-meta-row">
      <span class="status-badge ${statusClass(item.status)}">${item.status}</span>
      <span class="detail-type-pill">${iconGlyphHtml(item, 16)} ${item.type}${item.isPoi?' · Place of Interest':''}</span>
      ${item.dateStart? `<span>📅 ${itemDateLabel(item)}</span>`:''}
      ${item.timeStart? `<span>⏰ ${itemTimeLabel(item)}</span>`:''}
      ${item.bookedBy? `<span>👤 ${escapeHtml(item.bookedBy)}</span>`:''}
      ${Number(item.costTotal)>0? `<span style="display:inline-block;">💰 ${costHtml(item.costTotal, item.currency)}${item.costPerPax?` (${fmtCost(toSgd(item.costPerPax,item.currency))}/pax)`:''}</span>`:''}
      <span id="detail-openbadge"></span>
    </div>
    ${(item.link||item.mapsLink)? `<div class="detail-links-row">
      ${item.link? `<a class="nav-btn" href="${escapeHtml(item.link)}" target="_blank" rel="noopener">🔗 Link</a>`:''}
      ${item.mapsLink? `<a class="nav-btn" href="${escapeHtml(item.mapsLink)}" target="_blank" rel="noopener">🧭 Navigation</a>`:''}
      ${item.mapsLink? `<button type="button" class="nav-btn" onclick="shareLocation('${trip.id}','${item.id}')">📤 Share Location</button>`:''}
    </div>` : ''}
    ${item.notes? `<div class="detail-notes">${linkedNotes}</div>` : ''}
    ${(item.files&&item.files.length)? `<div class="detail-files">
      ${item.files.map((f,idx)=>`<span class="file-pill" onclick="openFilePreviewFor('${trip.id}','${item.id}',${idx})" title="${escapeHtml(f.name)}"><span class="file-pill-icon">📎</span><span class="file-pill-name">${escapeHtml(f.name)}</span></span>`).join('')}
    </div>` : ''}
    <div class="modal-footer">
      <button class="btn" onclick="closeModal();openAddItemModal('${trip.id}','${item.id}')">✏️ Edit</button>
      <button class="btn btn-primary" onclick="closeModal()">Close</button>
    </div>`;
  openModal(html, true);
  loadDetailPlaceExtras(trip.id, item, myToken);
}
function renderDetailGalleryHtml(){
  const multi = detailGalleryImages.length > 1;
  const url = coverPublicUrl(detailGalleryImages[detailGalleryIndex]);
  return `
    <div class="detail-gallery-frame">
      <img src="${url}" class="detail-gallery-img" alt="">
      ${multi? `<button type="button" class="lightbox-nav" style="position:absolute;top:50%;left:8px;transform:translateY(-50%);" onclick="detailGalleryNav(-1)">&#8249;</button>` : ''}
      ${multi? `<button type="button" class="lightbox-nav" style="position:absolute;top:50%;right:8px;transform:translateY(-50%);" onclick="detailGalleryNav(1)">&#8250;</button>` : ''}
      ${multi? `<span class="detail-gallery-count">${detailGalleryIndex+1} / ${detailGalleryImages.length}</span>` : ''}
    </div>`;
}
function detailGalleryNav(delta){
  detailGalleryIndex = (detailGalleryIndex + delta + detailGalleryImages.length) % detailGalleryImages.length;
  const el = document.getElementById('detail-gallery');
  if(el) el.innerHTML = renderDetailGalleryHtml();
}
