<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VicTravels</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VicTravels">
<meta name="theme-color" content="#4f5bd5">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* ===== VicTravels 2.0 palette — indigo/teal/pink gradient accents on a light,
       airy background, replacing the previous teal/brass travel-journal theme.
       Every component below reads its colors from these tokens, so this block is
       the single place the whole app's look is controlled from. ===== */
    --bg:#f5f3ed;
    --bg-soft:#eeeae0;
    --card-bg:#ffffff;
    --text:#14171f;
    --text-muted:#6b7181;
    --border:#e9e5d8;
    --border-strong:#dcd6c5;
    --primary:#4f5bd5;
    --primary-dark:#3944b0;
    --primary-light:#ecebfb;
    --primary-accent:#8b5cf6;
    --accent:#00b3a4;
    --accent-light:#e0f7f4;
    --accent2:#e8407e;
    --accent2-light:#fbe3ee;
    --danger:#b3261e;
    --danger-light:#fbe9e7;
    --success:#00967f;
    --success-light:#e3f7f2;
    --warning:#b45309;
    --warning-light:#fdf1de;
    --radius:22px;
    --radius-sm:14px;
    --font-serif:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 1px 2px rgba(20,23,31,0.04), 0 10px 26px -14px rgba(20,23,31,0.12);
    --shadow-hover:0 16px 36px -10px rgba(79,91,213,0.28), 0 4px 12px rgba(20,23,31,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-sans);
    background:
      radial-gradient(1000px 480px at 10% -10%, rgba(79,91,213,0.10), transparent 60%),
      radial-gradient(900px 460px at 100% 0%, rgba(0,179,164,0.08), transparent 58%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  #app{max-width:1000px;margin:0 auto;padding:0 20px 80px;}
  ::selection{background:var(--primary-light);color:var(--primary-dark);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px;border:2px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-muted);}

  /* NAV */
  header.topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(250,248,243,0.82);
    backdrop-filter:blur(10px) saturate(1.4);
    border-bottom:1px solid var(--border);
  }
  /* Slim progress bar shown at the very top of the page during a save/delete/upload so a
     tap on a slow connection doesn't feel like it didn't register. */
  #loading-bar{
    position:fixed;top:0;left:0;height:3px;width:0;z-index:300;
    background:linear-gradient(90deg,var(--primary),var(--primary-dark));
    transition:width .3s ease, opacity .3s ease;opacity:0;pointer-events:none;
  }
  #loading-bar.active{width:70%;opacity:1;transition:width 2.2s cubic-bezier(.1,.6,.2,1), opacity .2s ease;}

  /* Toast notifications — quick "Saved"/"Deleted" confirmation after an async action,
     since most save/delete flows just silently re-render otherwise. */
  #toast-container{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:310;
    display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
  }
  .toast{
    background:var(--text);color:#fff;font-size:13px;font-weight:600;
    padding:10px 18px;border-radius:999px;box-shadow:0 8px 22px rgba(10,15,14,0.28);
    opacity:0;transform:translateY(8px);transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.toast-error{background:var(--danger);}
  .topbar-inner{
    max-width:1000px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-serif);font-weight:600;font-size:20px;letter-spacing:-0.01em;color:var(--text);}
  .brand-mark{
    font-size:16px;display:inline-flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:11px;
    background:linear-gradient(180deg,var(--primary),var(--primary-dark));
    box-shadow:0 3px 8px rgba(79,91,213,0.35);
  }
  /* NAV — a fixed bottom tab bar on phone/tablet (thumb-reachable), a collapsible left
     sidebar on desktop (≥860px). Same #main-nav element and click handler/setView logic
     either way — only the layout changes per breakpoint. */
  nav.tabs{
    position:fixed;left:14px;right:14px;bottom:14px;z-index:40;
    display:flex;align-items:stretch;gap:0;
    background:rgba(255,255,255,0.78);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid rgba(20,23,31,0.06);border-radius:30px;
    box-shadow:0 14px 30px -10px rgba(20,23,31,0.25);
    padding:6px 8px;
  }
  nav.tabs .sidebar-brand,nav.tabs .sidebar-toggle{display:none;}
  nav.tabs button[data-view]{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    border:none;background:transparent;padding:6px 4px;border-radius:18px;
    font-size:10px;font-weight:700;color:var(--text-muted);cursor:pointer;
    transition:all .18s ease;
  }
  nav.tabs .nav-icon{
    font-size:16px;line-height:1;width:34px;height:34px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    transition:all .18s ease;
  }
  nav.tabs button[data-view].active{color:var(--primary-dark);}
  nav.tabs button[data-view].active .nav-icon{
    background:linear-gradient(180deg,var(--primary),var(--primary-dark));color:#fff;
    box-shadow:0 6px 14px -4px rgba(79,91,213,0.55);
  }
  nav.tabs button[data-view]:not(.active):hover{color:var(--text);}
  body{padding-bottom:88px;} /* clears the floating bottom nav */
  @media (max-width:859px){ #toast-container{bottom:98px;} }

  @media (min-width:860px){
    body{padding-bottom:0;}
    header.topbar .brand{display:none;} /* shown inside the sidebar instead, below */
    nav.tabs{
      left:0;top:0;bottom:0;right:auto;width:220px;flex-direction:column;align-items:stretch;
      padding:18px 12px;gap:3px;border-top:none;border-right:1px solid var(--border);
      box-shadow:none;background:var(--card-bg);transition:width .2s ease;
    }
    nav.tabs .sidebar-brand{
      display:flex;align-items:center;gap:10px;font-family:var(--font-serif);font-weight:600;font-size:17px;
      color:var(--text);margin-bottom:14px;padding:0 6px;cursor:pointer;white-space:nowrap;overflow:hidden;
    }
    nav.tabs button[data-view]{
      flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:12px;
      font-size:13.5px;white-space:nowrap;overflow:hidden;
    }
    nav.tabs button[data-view] .nav-icon{width:auto;height:auto;border-radius:0;background:none;box-shadow:none;font-size:17px;}
    /* Soft flat tint instead of a solid fill — reads as "selected" without the heavier
       pill-button treatment used for actual buttons elsewhere. */
    nav.tabs button[data-view].active{
      background:rgba(79,91,213,0.1);
      color:var(--primary);box-shadow:none;
    }
    nav.tabs .sidebar-toggle{
      display:flex;align-items:center;justify-content:center;margin-top:auto;padding:11px 14px;border-radius:12px;
      border:none;background:transparent;color:var(--text-muted);cursor:pointer;font-size:13px;font-weight:600;
      white-space:nowrap;overflow:hidden;
    }
    nav.tabs .sidebar-toggle:hover{background:var(--bg-soft);color:var(--text);}
    nav.tabs .sidebar-toggle .nav-icon{transition:transform .2s ease;}
    body header.topbar .topbar-inner,body header.topbar .countdown-strip,body #app{margin-left:220px;transition:margin-left .2s ease;}

    /* Collapsed is the resting state: a narrow icon rail that's pinned open only if the
       person clicks the toggle (title: "Pin sidebar open/closed"). Otherwise, hovering it
       auto-expands it as a floating flyout (it's position:fixed, so this doesn't reflow or
       resize the page content behind it) and it auto-collapses the moment the mouse leaves —
       no click needed for the normal case. */
    body.sidebar-collapsed nav.tabs{width:68px;padding-left:10px;padding-right:10px;transition:width .15s ease;}
    body.sidebar-collapsed nav.tabs .sidebar-brand .brand-text,
    body.sidebar-collapsed nav.tabs .nav-label{display:none;}
    body.sidebar-collapsed nav.tabs button[data-view]{justify-content:center;}
    body.sidebar-collapsed nav.tabs .sidebar-toggle .nav-icon{transform:rotate(180deg);}
    body.sidebar-collapsed header.topbar .topbar-inner,
    body.sidebar-collapsed header.topbar .countdown-strip,
    body.sidebar-collapsed #app{margin-left:68px;}

    body.sidebar-collapsed nav.tabs:hover{
      width:220px;padding-left:12px;padding-right:12px;
      box-shadow:6px 0 28px -10px rgba(20,23,31,0.3);
    }
    body.sidebar-collapsed nav.tabs:hover .sidebar-brand .brand-text,
    body.sidebar-collapsed nav.tabs:hover .nav-label{display:inline;}
    body.sidebar-collapsed nav.tabs:hover button[data-view]{justify-content:flex-start;}
  }

  /* Always-visible "what's next" banner, part of the sticky header so it's on screen
     from any page without needing to open anything. A bright, high-contrast pill on
     purpose — this is meant to catch your eye at a glance, not blend into the header. */
  .countdown-strip{
    max-width:1000px;margin:0 auto;padding:0 20px 12px;
    display:flex;cursor:pointer;
  }
  .countdown-strip-pill{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--primary);
    color:#fff;font-size:13px;font-weight:600;
    padding:8px 16px;border-radius:999px;
    box-shadow:0 4px 14px rgba(79,91,213,0.3);
    transition:box-shadow .18s ease, transform .18s ease;
  }
  .countdown-strip:hover .countdown-strip-pill{box-shadow:0 6px 18px rgba(79,91,213,0.4);transform:translateY(-1px);}
  .countdown-strip-icon{font-size:14px;line-height:1;display:inline-flex;}
  .countdown-strip-when{font-weight:800;background:rgba(255,255,255,0.28);padding:2px 9px;border-radius:999px;}

  h1,h2,h3{margin:0;letter-spacing:-0.01em;}
  .page-title{font-family:var(--font-serif);font-size:27px;font-weight:600;margin:30px 0 18px;letter-spacing:-0.01em;}
  .section-title{font-size:13px;font-weight:700;margin:0 0 14px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;}

  /* CARD — a clean, mostly-opaque white surface with just enough blur to pick up a hint of
     the page's very subtle background tint, rather than a flat solid panel. Kept quiet on
     purpose: color comes from a handful of accent spots, not from every surface. */
  .card{
    background:rgba(255,255,255,0.86);
    backdrop-filter:blur(14px) saturate(1.2);
    -webkit-backdrop-filter:blur(14px) saturate(1.2);
    border-radius:var(--radius);
    box-shadow:0 6px 20px -14px rgba(20,23,31,0.18);
    border:1px solid #ececef;
    padding:20px;
    transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease;
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  @media (max-width:640px){ .grid-2{grid-template-columns:1fr;} }

  /* BUTTONS — kept deliberately quiet: a plain white pill with a hairline border for
     anything secondary, so the one filled (.btn-primary) button in a row is the only thing
     that actually draws the eye, instead of every button competing at the same volume. */
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    border-radius:980px;border:1px solid #d9d9de;background:#fff;
    padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;color:#1d1d1f;
    transition:all .15s ease;
  }
  .btn:hover{border-color:#b8b8bf;background:#f5f5f7;box-shadow:none;transform:none;}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
  .btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);}
  .btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
  /* Deliberately a different color family from primary/danger — meant to stand out at a
     glance as "the one you tap to hand the day's plan to someone else", the way a share
     icon usually reads as its own distinct action rather than a normal form button. */
  .btn-share{background:#1a7a42;border-color:#1a7a42;color:#fff;font-weight:600;}
  .btn-share:hover{background:#156334;border-color:#156334;}
  .btn-ghost{background:transparent;border-color:transparent;}
  .btn-ghost:hover{background:#f5f5f7;box-shadow:none;border-color:transparent;transform:none;}
  .btn-sm{padding:6px 13px;font-size:12.5px;}
  .btn-block{width:100%;justify-content:center;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  /* EMPTY STATE */
  .empty-state{
    text-align:center;padding:64px 20px;color:var(--text-muted);
    border:1px dashed var(--border-strong);border-radius:var(--radius);background:rgba(255,255,255,0.5);
  }
  .empty-state .emoji{
    font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
    width:64px;height:64px;border-radius:50%;background:var(--primary-light);
  }
  .empty-state p{margin:0 0 18px;font-size:14.5px;}

  /* HOME */
  .home-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 18px;flex-wrap:wrap;}
  select.trip-select{
    border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 14px;
    font-size:14px;font-weight:600;background:#fff;color:var(--text);cursor:pointer;
  }
  .search-bar{margin-bottom:14px;}
  .search-input{width:100%;}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media (max-width:720px){ .home-grid{grid-template-columns:1fr;} }
  .currency-row{display:flex;align-items:flex-end;gap:12px;}
  .currency-field{flex:1;min-width:0;}
  .currency-field input{width:100%;border-radius:999px;font-weight:700;}
  .currency-swap{
    margin-bottom:9px;width:30px;height:30px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;
    background:linear-gradient(180deg,var(--primary),var(--primary-dark));
  }
  @media (max-width:480px){ .currency-row{flex-wrap:wrap;} .currency-swap{display:none;} }
  .countdown-num{
    font-family:var(--font-serif);font-size:40px;font-weight:700;letter-spacing:-0.02em;
    color:var(--text);
  }
  .countdown-sub{color:var(--text-muted);font-size:13.5px;margin-top:4px;}
  .overview-chip{
    display:inline-flex;align-items:center;gap:4px;background:var(--primary-light);color:var(--primary-dark);
    padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;margin:2px 4px 2px 0;
    border:1px solid rgba(79,91,213,0.12);
  }
  .overview-stats{display:flex;gap:26px;margin-top:14px;}
  .stat-num{font-family:var(--font-serif);font-size:24px;font-weight:600;}
  .stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
  /* Budget card — at-a-glance spend vs. an optional target, combining booked activity
     costs and the separate ad-hoc Trip Expenses log into one "spent so far" figure. */
  .budget-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;}
  .budget-spent{font-family:var(--font-serif);font-size:24px;font-weight:600;}
  .budget-target{font-size:12.5px;color:var(--text-muted);}
  .budget-track{background:var(--bg-soft);border-radius:999px;height:8px;margin-top:10px;overflow:hidden;}
  .budget-fill{height:100%;border-radius:999px;background:var(--primary);transition:width .3s ease;}
  .budget-fill.over{background:linear-gradient(90deg,var(--warning),var(--danger));}
  .flight-row{
    display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .flight-row:last-child{border-bottom:none;}
  .flight-row:hover .flight-name{text-decoration:underline;}
  .flight-icon{
    font-size:14px;display:flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:50%;flex-shrink:0;color:#fff;
    background:linear-gradient(180deg,var(--primary),var(--primary-dark));
  }
  .flight-name{font-weight:600;font-size:13.5px;}
  .flight-meta{font-size:12px;color:var(--text-muted);margin-top:1px;}
  .flight-icon.icon-alert{background:var(--warning-light);color:var(--warning);}
  .booking-windows-card{border-left:4px solid var(--warning);margin-bottom:16px;}
  .expenses-total{font-family:var(--font-serif);font-size:28px;font-weight:600;margin-top:8px;}
  /* FINANCE DASHBOARD */
  /* Hero-style gradient treatment — same visual weight as the redesign concept's
     balance-hero card, color cycling by what the number actually means (green-leaning for
     "owed to you", warm for "you owe", neutral dark for settled). */
  .balance-banner{
    font-size:17px;font-weight:800;padding:22px 18px;border-radius:var(--radius);text-align:center;
    color:#fff;box-shadow:0 14px 30px -14px rgba(20,23,31,0.35);
  }
  .balance-banner.owed{background:linear-gradient(135deg,var(--success),var(--accent) 140%);}
  .balance-banner.owes{background:linear-gradient(135deg,var(--warning),var(--danger) 140%);}
  .balance-banner.settled{background:linear-gradient(135deg,#6b7181,#3a3f4d 140%);}
  .fin-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .fin-table th{
    text-align:left;padding:10px 14px;background:var(--bg-soft);color:var(--text-muted);
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    cursor:pointer;white-space:nowrap;user-select:none;
  }
  .fin-table th:hover{color:var(--text);}
  .fin-table td{padding:10px 14px;border-top:1px solid var(--border);}
  .fin-table tbody tr:hover{background:var(--bg-soft);}
  .fin-table tfoot td{padding:12px 14px;border-top:2px solid var(--border-strong);}
  /* "Nearby" / "Nearest Toilets" modal lists */
  .nearby-list{max-height:60vh;overflow-y:auto;}
  .nearby-row{
    display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .nearby-row:last-child{border-bottom:none;}
  .expense-day-header{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin:0 2px 8px;}
  .expense-row:hover{box-shadow:var(--shadow-hover);}
  .task-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .task-row:last-of-type{border-bottom:none;}
  .task-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary);cursor:pointer;}
  .task-text{flex:1;font-size:13.5px;}
  .task-text.done{text-decoration:line-through;color:var(--text-muted);}
  .task-add-row{display:flex;gap:8px;margin-top:12px;}
  .task-add-row input{flex:1;}

  /* FORMS */
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{
    width:100%;padding:10px 13px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);
    font-size:14px;font-family:inherit;background:#fff;color:var(--text);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px var(--primary-light);border-color:var(--primary);}
  label.field-label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .field{margin-bottom:14px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}

  /* CHIP SELECTOR — a row of pill buttons standing in for a <select>, backed by a hidden
     input holding the actual value (see selectChip() / syncChipActive()). Used for Type,
     Status and Booked By on the Add/Edit Activity form. */
  .chip-select{display:flex;flex-wrap:wrap;gap:8px;}
  .chip-opt{
    padding:9px 16px;border-radius:999px;font-size:12.5px;font-weight:500;
    background:#fff;border:1px solid #d9d9de;color:var(--text-muted);cursor:pointer;
    transition:all .15s ease;
  }
  .chip-opt:hover{border-color:var(--primary);color:var(--primary-dark);}
  .chip-opt.on{
    background:var(--primary);color:#fff;font-weight:600;
    border-color:var(--primary);box-shadow:none;
  }

  /* CHIPS INPUT (countries) */
  .chip-input-row{display:flex;gap:8px;}
  .chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--primary-light);color:var(--primary-dark);
    padding:5px 6px 5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;
  }
  .chip button{background:none;border:none;color:var(--primary-dark);cursor:pointer;font-size:14px;line-height:1;padding:2px 5px;border-radius:50%;}
  .chip button:hover{background:rgba(79,91,213,0.15);}

  /* TRIPS PAGE — a photo-less "cover" card: a gradient band standing in for a hero photo,
     cycling through a few preset combinations so a multi-trip grid doesn't look monotone.
     Text sits on a dark scrim (::after) over the gradient for contrast, same trick the
     redesign concept uses for its trip cover cards. */
  .trip-card{
    cursor:pointer;position:relative;overflow:hidden;isolation:isolate;
    min-height:176px;display:flex;flex-direction:column;justify-content:flex-end;
    color:#fff;transition:box-shadow .2s ease, transform .2s ease;
    background:linear-gradient(180deg,var(--primary),var(--primary-dark));
  }
  .trip-card::after{
    content:'';position:absolute;inset:0;z-index:-1;
    background:linear-gradient(0deg,rgba(14,17,25,0.65),rgba(14,17,25,0) 65%);
  }
  .trip-card:nth-child(4n+2){background:linear-gradient(180deg,#2f3542,#1d212b);}
  .trip-card:nth-child(4n+3){background:linear-gradient(180deg,var(--accent),#00806f);}
  .trip-card:nth-child(4n+4){background:linear-gradient(180deg,var(--text-muted),#3a3f4d);}
  .trip-card:hover{box-shadow:0 20px 40px -14px rgba(20,23,31,0.45);transform:translateY(-3px);}
  .trip-card h3{font-family:var(--font-serif);font-size:18px;font-weight:700;margin-bottom:4px;margin-top:4px;color:#fff;}
  .trip-dates{font-size:12.5px;color:rgba(255,255,255,0.85);margin-bottom:8px;}
  .trip-card .overview-chip{background:rgba(255,255,255,0.22);color:#fff;border-color:rgba(255,255,255,0.3);}
  .trip-card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.25);font-size:12px;color:rgba(255,255,255,0.85);}

  /* TRIP DETAIL */
  .trip-detail-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:26px 0 18px;flex-wrap:wrap;}
  .back-link{background:none;border:none;color:var(--text-muted);font-size:13px;cursor:pointer;padding:0;margin-bottom:8px;font-weight:600;}
  .back-link:hover{color:var(--primary-dark);}
  /* A single grouped toolbar strip rather than loose pills scattered on the page background —
     everything inside reads as one control bar instead of competing separately for attention. */
  .filter-bar{
    display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center;
    background:#fff;border:1px solid #ececef;border-radius:16px;padding:8px;
  }
  .day-btn{
    border:1px solid #d9d9de;background:#fff;border-radius:999px;padding:7px 15px;
    font-size:12.5px;font-weight:500;cursor:pointer;color:var(--text-muted);white-space:nowrap;
    transition:all .15s ease;
  }
  .day-btn:hover{border-color:var(--primary);color:var(--primary-dark);}
  .day-btn.active{background:var(--text);border-color:var(--text);color:#fff;}
  .filter-select{
    width:auto;padding:7px 12px;font-size:12.5px;font-weight:500;border-radius:999px;
    border:1px solid transparent;background:#f5f5f7;color:#1d1d1f;
  }
  .filter-select:focus{box-shadow:none;border-color:var(--primary);}
  /* Sticky day selector — stays put while scrolling a long day's itinerary, with prev/next
     buttons so switching days is a tap instead of reopening the dropdown each time. The
     "top" offset is set from JS (syncDayNavSticky) since the header's height changes
     depending on whether the countdown strip is currently showing. Kept as a plain full-width
     sticky strip (not the grouped toolbar-card look above) since it needs to span edge-to-edge
     under the header. */
  .day-nav-bar{
    position:sticky;z-index:15;background:var(--bg);border:none;border-radius:0;
    padding:10px 0;margin:0 0 4px;
  }
  .day-nav-btn{
    border:1px solid var(--border-strong);background:#fff;border-radius:999px;
    width:36px;height:36px;flex-shrink:0;font-size:16px;font-weight:700;cursor:pointer;
    color:var(--text);display:flex;align-items:center;justify-content:center;
    transition:all .15s ease;
  }
  .day-nav-bar .filter-select{background-color:#fff;border:1px solid var(--border-strong);height:36px;padding:0 14px;font-weight:600;}
  .day-nav-bar .filter-select:focus{border-color:var(--primary);}
  .day-nav-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary-dark);}
  .day-nav-btn:disabled{opacity:.35;cursor:default;}
  .toolbar-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .day-title-input{
    font-family:var(--font-serif);font-size:18px;font-weight:600;color:var(--text);
    border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;
    margin-bottom:14px;background:#fff;
  }
  .day-title-input::placeholder{color:var(--text-muted);font-weight:500;font-family:var(--font-sans);font-size:13.5px;}

  /* ITEM / ITINERARY CARD */
  .item-card{
    display:flex;align-items:center;gap:14px;padding:14px 16px;position:relative;margin-bottom:10px;
    transition:opacity .15s ease, box-shadow .2s ease, border-color .2s ease, transform .15s ease;
    z-index:0;cursor:pointer;
  }
  .item-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px);}
  .item-card:has(.popover){z-index:5;}
  .item-card.dragging{opacity:.4;}
  .item-card.drag-over{box-shadow:var(--shadow-hover);border-color:var(--primary);}
  .drag-handle{
    cursor:grab;color:var(--border-strong);font-size:15px;flex-shrink:0;letter-spacing:-1px;
    user-select:none;line-height:1;padding:4px 0;
  }
  .drag-handle:active{cursor:grabbing;}
  .item-type-badge{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:16px;flex-shrink:0;position:relative;z-index:1;
    background:linear-gradient(180deg,var(--primary),var(--primary-dark));
    box-shadow:0 6px 14px -4px rgba(79,91,213,0.45);
    /* Emoji glyphs render in their own color regardless of CSS color, so the gradient node
       only shows through for the few icons that are plain text (rare — TYPE_ICONS are all
       emoji) — filter:brightness/contrast isn't needed here, this is just the node's frame. */
  }
  /* TIMELINE — a connecting rail runs down through each day's stack of activity "nodes"
     (the round type-badge icons), with the distance/walking-time chip hanging on it between
     consecutive location cards. Purely decorative (positioned behind the cards via z-index),
     so it never affects drag-and-drop, click targets, or any of the data rendered inside. */
  .drag-group{position:relative;}
  .drag-group::before{
    content:'';position:absolute;top:19px;bottom:19px;left:63px;width:3px;border-radius:3px;
    background:linear-gradient(var(--primary),var(--accent));opacity:0.35;z-index:0;
  }
  .item-main{flex:1;min-width:0;}
  .item-name{font-weight:600;font-size:14.5px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item-meta{font-size:12px;color:var(--text-muted);display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  .status-badge{
    font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;
    text-transform:uppercase;letter-spacing:.03em;
  }
  .status-Booked{background:var(--success-light);color:var(--success);}
  .status-ToBook{background:var(--warning-light);color:var(--warning);}
  .status-Nil{background:var(--bg-soft);color:var(--text-muted);}
  .item-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
  .item-cover-img{width:88px;height:88px;object-fit:cover;border-radius:12px;flex-shrink:0;border:1px solid var(--border);display:block;}
  .item-cover-wrap{position:relative;flex-shrink:0;cursor:pointer;}
  .item-cover-fallback{
    width:88px;height:88px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:28px;color:#fff;box-shadow:0 8px 18px -8px rgba(20,23,31,0.4);cursor:default;
  }
  .item-cover-count{
    position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,0.65);color:#fff;
    font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:999px;line-height:1.3;
  }
  .lightbox-nav{
    background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:50%;
    width:38px;height:38px;font-size:22px;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .lightbox-nav:hover{background:rgba(0,0,0,0.8);}

  /* ACTIVITY DETAIL POPUP
     The frame no longer forces a fixed height + object-fit:cover — that cropped anything
     that wasn't already the frame's own aspect ratio (a square photo lost its top/bottom).
     max-height + object-fit:contain instead: the image keeps its real proportions and just
     gets capped (and centered, with letterboxing if needed) so a very tall/wide photo can't
     blow out the modal. */
  .detail-gallery-frame{position:relative;width:100%;border-radius:var(--radius-sm);overflow:hidden;background:var(--bg-soft);margin:-24px -24px 18px;width:calc(100% + 48px);display:flex;align-items:center;justify-content:center;}
  .detail-gallery-frame .detail-gallery-img{border-radius:0;}
  #detail-gallery .detail-gallery-frame{margin:0 0 18px;width:100%;border-radius:var(--radius-sm);}
  #detail-gallery .detail-gallery-frame .detail-gallery-img{border-radius:var(--radius-sm);}
  .detail-gallery-img{width:100%;max-height:420px;object-fit:contain;display:block;}
  .detail-gallery-count{position:absolute;bottom:8px;right:10px;background:rgba(0,0,0,0.55);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}
  .detail-meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-muted);}
  .detail-meta-row>span{display:inline-flex;align-items:center;gap:4px;}
  .detail-type-pill{background:var(--bg-soft);padding:3px 11px;border-radius:999px;font-weight:600;}
  .detail-links-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .detail-notes{font-size:13.5px;line-height:1.65;color:var(--text);margin-bottom:16px;overflow-wrap:anywhere;background:var(--bg-soft);border-radius:var(--radius-sm);padding:12px 14px;}
  .detail-files{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
  .open-now-badge{padding:2px 10px;border-radius:999px;font-weight:600;}
  .open-now-badge.open{background:rgba(52,199,89,0.15);color:#1f8b3d;}
  .open-now-badge.closed{background:rgba(255,59,48,0.15);color:#c0392b;}
  @media (max-width:480px){
    .detail-gallery-img{max-height:280px;}
    .lightbox-nav{width:32px;height:32px;font-size:18px;}
    /* On a narrow phone screen there's rarely room for a long activity name alongside its
       cost/booked-by column and still fit on one line — wrap to a second line instead of
       silently cutting the title off with "…". */
    .item-name{white-space:normal;overflow:visible;text-overflow:clip;}
  }
  .item-cost{font-family:var(--font-serif);font-weight:600;font-size:14.5px;white-space:nowrap;}
  .cost-eur-sub{font-size:11px;font-style:italic;color:var(--text-muted);margin-top:1px;white-space:nowrap;}
  .item-bookedby{font-size:11.5px;color:var(--text-muted);white-space:nowrap;display:flex;align-items:center;gap:3px;}
  .item-edit-btn{
    background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:16px;
    padding:6px;border-radius:50%;flex-shrink:0;transition:all .15s ease;
    min-width:28px;min-height:28px;display:flex;align-items:center;justify-content:center;
  }
  .item-edit-btn:hover{background:var(--bg-soft);color:var(--text);}
  @media (max-width:480px){
    /* A 28px tap target is tight for a thumb — widen it to the ~44px minimum recommended
       for touch, using negative margin so the card's layout doesn't shift to make room. */
    .item-edit-btn{min-width:44px;min-height:44px;margin:-8px -4px -8px 0;}
  }
  .day-group-label{font-size:12px;font-weight:700;color:var(--text-muted);margin:22px 0 10px;text-transform:uppercase;letter-spacing:.06em;}
  .day-group-label:first-child{margin-top:0;}

  /* POPOVER MENU */
  .popover{
    position:absolute;top:44px;right:8px;background:#fff;border:1px solid var(--border);
    border-radius:var(--radius-sm);box-shadow:var(--shadow-hover);z-index:30;min-width:150px;overflow:hidden;
  }
  .popover button{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;
    padding:11px 14px;font-size:13px;cursor:pointer;color:var(--text);
  }
  .popover button:hover{background:var(--bg-soft);}
  .popover button.danger{color:var(--danger);}
  .confirm-box{padding:12px 14px;width:220px;}
  .confirm-box p{font-size:12.5px;margin:0 0 10px;color:var(--text);}
  .confirm-actions{display:flex;gap:8px;}

  /* MODAL */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(12,16,15,0.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal-overlay.hidden{display:none;}
  .modal{
    background:#fff;border-radius:var(--radius);max-width:480px;width:100%;max-height:88vh;overflow-y:auto;
    box-shadow:0 24px 60px rgba(10,15,14,0.28);padding:24px;
    /* Reserves equal space on both edges for the scrollbar up front, so a tall form's content
       doesn't sit closer to the right edge than the left the moment it needs to scroll —
       without this, the right padding visually shrinks by the scrollbar's own width. */
    scrollbar-gutter:stable both-edges;
  }
  .modal.modal-wide{max-width:640px;}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .modal-header h3{font-family:var(--font-serif);font-size:19px;font-weight:600;}
  .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);line-height:1;padding:2px 6px;border-radius:50%;}
  .modal-close:hover{background:var(--bg-soft);}
  .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  /* BOTTOM SHEET — used only for the Add/Edit Activity form (the one the redesign concept
     mocks up as a sheet), via openModal(html, wide, true). Other modals (Add Trip, Finance
     adjustments, etc.) are untouched and keep the centered-dialog look. */
  #modal-overlay:has(.modal-sheet){align-items:flex-end;padding:20px 20px 0;}
  .modal-sheet{
    max-width:560px;width:100%;max-height:90vh;border-radius:28px 28px 0 0;
    margin:0 auto;padding-top:14px;
  }
  .modal-sheet::before{
    content:'';display:block;width:36px;height:4px;background:var(--border-strong);
    border-radius:99px;margin:0 auto 18px;
  }
  @media (max-width:640px){
    #modal-overlay:has(.modal-sheet){padding:0;}
    .modal-sheet{border-radius:24px 24px 0 0;max-width:none;}
  }

  /* RICH TEXT NOTES */
  .rt-toolbar{display:flex;gap:4px;margin-bottom:6px;}
  .rt-toolbar button{
    border:1px solid var(--border-strong);background:#fff;border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:13px;
  }
  .rt-toolbar button:hover{background:var(--bg-soft);}
  .rt-editor{
    min-height:80px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:10px 12px;font-size:13.5px;
  }
  .rt-editor:focus{outline:none;box-shadow:0 0 0 3px var(--primary-light);border-color:var(--primary);}

  /* FILE UPLOAD */
  .file-chip{display:flex;align-items:center;justify-content:space-between;background:var(--bg-soft);border-radius:9px;padding:7px 11px;font-size:12.5px;margin-top:6px;gap:8px;}
  .file-chip button{background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px;flex-shrink:0;font-weight:600;}
  .file-chip-name{cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .file-chip-name:hover{text-decoration:underline;}
  .file-pill{
    display:inline-flex;align-items:center;gap:4px;background:var(--bg-soft);border-radius:999px;padding:3px 10px 3px 8px;
    cursor:pointer;max-width:170px;border:1px solid var(--border);
    /* flex-shrink:0 here (as it used to be) refuses to let the pill shrink even when its
       row is narrower than 170px — e.g. on a mobile card squeezed by the fixed-width cover
       image next to it — so the pill overflows its own column and ends up visually hidden
       behind that image (which paints later in the DOM). min-width:0 + the default
       flex-shrink:1 let it shrink and ellipsis-truncate instead of overflowing. */
    flex-shrink:1;min-width:0;
  }
  .file-pill:hover{background:var(--primary-light);color:var(--primary-dark);border-color:transparent;}
  .file-pill-icon{flex-shrink:0;font-size:11px;}
  .file-pill-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}

  /* TODAY PAGE */
  .today-scroll{display:flex;flex-direction:column;gap:16px;padding:4px 2px 14px;}
  .today-item .item-card{
    margin:0 0 14px;
    background:linear-gradient(135deg,#ffffff 0%,#f3f1ff 100%);
    border:1px solid rgba(99,102,241,.20);
    border-left:5px solid #6366f1;
    box-shadow:0 14px 30px -14px rgba(79,91,213,.40), 0 3px 8px rgba(79,91,213,.10);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .today-item .item-card:hover{transform:translateY(-2px);box-shadow:0 18px 36px -14px rgba(79,91,213,.50), 0 4px 10px rgba(79,91,213,.14);}
  .today-item .item-card.item-current{
    background:linear-gradient(135deg,#e4deff 0%,#c9c0ff 100%);
    border:2px solid #5b5bd6;
    border-left:7px solid #4338ca;
    box-shadow:0 20px 40px -14px rgba(67,56,202,.60), 0 4px 12px rgba(67,56,202,.22);
  }
  .now-pill{display:inline-block;background:#4338ca;color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:999px;vertical-align:middle;margin-left:6px;}
  .today-item .drag-handle,.today-item .view-map-btn,.today-item .item-edit-btn{display:none;}
  .today-card{
    display:flex;align-items:center;gap:16px;width:100%;padding:16px 18px;cursor:pointer;
  }
  .today-card .item-type-badge{margin-bottom:0;flex-shrink:0;}
  .today-card-body{min-width:0;flex:1;}
  .today-card .item-name{white-space:normal;font-size:13.5px;}
  .today-time{font-family:var(--font-serif);font-size:21px;font-weight:600;margin:4px 0 3px;}

  .muted-note{color:var(--text-muted);font-size:13px;}
  .link-line{font-size:12.5px;margin-top:4px;}
  .link-line a{color:var(--primary);text-decoration:none;font-weight:600;}
  .link-line a:hover{text-decoration:underline;}
  .nav-btn{
    display:inline-flex;align-items:center;gap:4px;background:var(--primary-light);color:var(--primary-dark);
    padding:4px 12px;border-radius:999px;font-size:11.5px;font-weight:700;text-decoration:none;
    border:1px solid rgba(79,91,213,0.15);transition:all .15s ease;
  }
  .nav-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 3px 8px rgba(79,91,213,0.3);}
  /* A long unbroken URL in notes has no whitespace to wrap at, so without this it overflows
     its own box and visually bleeds over the card's cover image sitting next to it (worst on
     narrow/mobile widths where there's little room to begin with). */
  .notes-preview{font-size:12.5px;color:var(--text-muted);margin-top:6px;line-height:1.5;overflow-wrap:anywhere;}
  .notes-preview b,.notes-preview strong{font-weight:700;color:var(--text);}
  .notes-preview.collapsed .notes-preview-content{max-height:38px;overflow:hidden;position:relative;}
  .notes-preview.collapsed .notes-preview-content::after{content:'';position:absolute;bottom:0;left:0;right:0;height:18px;background:linear-gradient(transparent,var(--card-bg));}
  .notes-preview.expanded .notes-preview-content{max-height:none;}
  .notes-toggle{display:block;margin-top:4px;background:none;border:none;color:var(--primary);font-size:11.5px;font-weight:700;cursor:pointer;padding:0;}
  .link-btn{background:none;border:none;color:var(--primary);font-size:inherit;font-weight:700;cursor:pointer;padding:0;text-decoration:underline;}
  .notes-toggle:hover{text-decoration:underline;}
  .dup-badge{display:inline-block;background:var(--bg-soft);color:var(--text-muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:4px;}

  /* MAP */
  #trip-map{font-family:var(--font-sans);position:relative;isolation:isolate;z-index:0;}
  .map-pin{
    width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;
    box-shadow:0 2px 6px rgba(0,0,0,0.35);border:2px solid #fff;
  }
  .map-pin span{transform:rotate(45deg);display:block;font-size:14px;line-height:1;}
  .map-star{
    width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #c9971f;
    color:#c9971f;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;
    box-shadow:0 2px 6px rgba(0,0,0,0.3);
  }
  /* "My location" dot — same visual language as Google Maps' own blue-dot marker, so it
     reads instantly as "you are here" rather than another activity pin. */
  .map-mydot{
    width:16px;height:16px;border-radius:50%;background:#4285F4;border:3px solid #fff;
    box-shadow:0 0 0 4px rgba(66,133,244,0.35), 0 2px 6px rgba(0,0,0,0.3);
  }
  /* Custom Google Maps control button — added via map.controls[...] so Maps positions and
     manages it itself, rather than an absolutely-positioned element fighting the map's own
     internal DOM. */
  .map-locate-btn{
    width:40px;height:40px;margin:10px;border-radius:50%;background:#fff;border:1px solid var(--border-strong);
    box-shadow:0 2px 6px rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;
    font-size:18px;line-height:1;cursor:pointer;padding:0;
  }
  .map-locate-btn:hover{background:var(--bg-soft);}
  .map-locate-btn:disabled{opacity:0.6;cursor:default;}
  /* "Maximize" expands the map card to fill the viewport (handy for checking a day's route
     in detail on a small phone screen) — pure CSS positioning, the underlying map instance
     is the same one, just resized via toggleMapMaximize()'s resize nudge. */
  .map-maximize-btn{flex-shrink:0;}
  .map-card.map-maximized{
    position:fixed;inset:16px;z-index:150;margin:0 !important;
    display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(10,15,14,0.35);
  }
  .map-card.map-maximized #trip-map{flex:1;height:auto !important;}
  body.map-maximized-open{overflow:hidden;}
  .card-distance-badge{
    position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;
    margin:0 0 10px 41px;padding:5px 12px 5px 10px;min-height:1px;
    background:var(--card-bg);border:1px solid var(--border);border-radius:999px;
    font-size:11.5px;font-weight:600;color:var(--text-muted);box-shadow:var(--shadow);
  }
  .card-distance-badge:empty{display:none;margin:0;padding:0;border:none;box-shadow:none;}
  .card-distance-badge.ready{cursor:pointer;}
  .card-distance-badge.ready:hover{color:var(--primary-dark);border-color:var(--primary);}
  .card-distance-badge .popover{top:28px;left:0;right:auto;min-width:180px;}
  .card-openbadge:empty{display:none;}
  #test-banner{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9999;background:#1f2937;color:#fff;font-size:12.5px;font-weight:600;padding:8px 8px 8px 16px;border-radius:999px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:92vw;}
  #test-banner{white-space:nowrap;font-size:12px;padding:6px 6px 6px 14px;gap:8px;max-width:calc(100vw - 24px);}
  #test-banner > span{overflow:hidden;text-overflow:ellipsis;}
  @media (max-width:768px){ #test-banner{bottom:calc(112px + env(safe-area-inset-bottom));} }
  #test-banner button{background:#fff;color:#1f2937;border:none;border-radius:999px;padding:4px 12px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;}
  .item-type-badge{background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);}
  .pin-tools{margin-top:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;}
  .pin-color-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pin-color-label{font-size:13px;font-weight:600;color:var(--text-muted);margin-right:4px;}
  .pin-swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.18);}
  .pin-swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--card-bg),0 0 0 3px var(--text);}
  .done-pill{background:#e1f3ea;color:#2f7d56;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;}
  .item-card.item-done .item-name{text-decoration:line-through;text-decoration-color:rgba(0,0,0,.35);}
  .item-card.item-done{opacity:.78;}
  .item-files-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .item-files-row .file-pill{max-width:100%;}
  .view-map-btn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:var(--bg-soft);color:var(--text);border:none;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .view-map-btn:hover{filter:brightness(.95);}
  .type-pill{background:var(--bg-soft);color:var(--text);font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;letter-spacing:.02em;}
  .drag-group::before{display:none;}
  .card-distance-badge{margin-left:8px;}
  .leg-row{display:flex;align-items:flex-start;flex-wrap:wrap;gap:8px;margin:0 0 10px 41px;}
  .leg-row .card-distance-badge{margin:0;}
  .leg-notes-btn{display:inline-flex;align-items:center;gap:5px;background:var(--card-bg);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:600;color:var(--text-muted);box-shadow:var(--shadow);cursor:pointer;font-family:inherit;min-height:26px;}
  .leg-notes-btn:hover,.leg-notes-btn.has-note{color:var(--primary-dark);border-color:var(--primary);}
  .leg-note-body{font-size:14px;line-height:1.6;color:var(--text);word-break:break-word;}
  .leg-note-body img,.rt-editor img{max-width:100%;border-radius:10px;margin:6px 0;display:block;}
  .leg-note-body a,.rt-editor a{color:var(--primary-dark);text-decoration:underline;}
  .leg-note-body ul,.leg-note-body ol,#leg-note-editor ul,#leg-note-editor ol{margin:6px 0;padding-left:22px;}
  .leg-note-body ul,#leg-note-editor ul{list-style:disc;}
  .leg-note-empty{color:var(--text-muted);font-size:14px;}
  .map-pin{transition:transform .18s ease, box-shadow .18s ease;}
  .map-pin.pin-active{transform:rotate(-45deg) scale(1.7);box-shadow:0 4px 14px rgba(0,0,0,0.5);}
  .map-star{transition:transform .18s ease;}
  .map-star.pin-active{transform:scale(1.6);}
  .item-card.item-selected{border-color:var(--primary);box-shadow:0 0 0 2px rgba(79,91,213,0.25);}
  .trip-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .trip-actions .btn{white-space:nowrap;}
  .item-meta>span,.item-meta .nav-btn,.item-meta .status-badge{white-space:nowrap;}
  .notes-preview{overflow-wrap:break-word;word-break:normal;}
  @media (max-width:480px){
    .trip-actions{gap:6px;}
    .trip-actions .btn{font-size:11.5px;padding:7px 11px;}
    /* Itinerary card as a grid so the text gets the full middle column: cost/booked-by drop
       under the text instead of taking their own column, and the photo + ⋮ sit at the far right. */
    .item-card{display:grid;grid-template-columns:minmax(0,1fr) 84px 30px;grid-template-areas:"main cover edit" "side side side";align-items:start;column-gap:10px;row-gap:8px;}
    .item-card .item-type-badge{grid-area:badge;}
    .item-card .item-main{grid-area:main;min-width:0;}
    .item-card .item-cover-wrap{grid-area:cover;}
    .item-card .item-edit-btn{grid-area:edit;}
    .item-card .item-side{grid-area:side;flex-direction:row;align-items:baseline;justify-content:flex-start;gap:12px;flex-wrap:wrap;}
    .item-name{overflow-wrap:break-word;word-break:normal;}
  }
  .open-now-badge[data-place]{cursor:pointer;}
  .popover.hours-pop{position:fixed;right:auto;padding:8px 0;min-width:230px;max-width:calc(100vw - 16px);z-index:200;}
  .hours-row{padding:5px 14px;font-size:12.5px;color:var(--text-muted);white-space:nowrap;}
  .hours-row.today{color:var(--text);font-weight:700;background:var(--bg-soft);}
  .item-side:not(:has(.item-bookedby, .item-cost:not(:empty))){display:none;}
  .overview-stats{flex-wrap:wrap;}
  @media (max-width:480px){
    .overview-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
    .overview-stats .stat-num{font-size:20px;overflow-wrap:anywhere;}
    .field-row{flex-wrap:wrap;}
    .field-row .field{min-width:110px;}
    .field input[type=date]{min-width:0;max-width:100%;width:100%;box-sizing:border-box;}
    /* Itinerary card: drop the drag handle (no touch drag), tighten gaps, give the text the
       room, and push the photo to the far right with just enough space for the ⋮ button. */
    .item-card{gap:10px;padding:12px 8px 12px 12px;}
    .item-card .drag-handle{display:none;}
    .item-type-badge{width:32px;height:32px;}
    .item-cover-img,.item-cover-fallback{width:84px;height:84px;}
    .item-edit-btn{min-width:30px;margin:-8px -2px -8px -4px;}
    .drag-group::before{left:28px;}
    .card-distance-badge{margin-left:12px;flex-wrap:wrap;}

  /* PRESET COLOR PICKER (Card Color field) — a trigger swatch that opens a panel of
     fixed, precomputed swatches (quick colors + a hue/lightness grid), never an open
     arbitrary color input. */
  .color-picker{position:relative;display:inline-block;}
  .color-trigger{width:36px;height:36px;border-radius:50%;border:2px solid var(--border-strong);cursor:pointer;font-size:14px;color:var(--text-muted);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08);padding:0;}
  .color-trigger:hover{border-color:var(--text);}
  .color-picker-panel{position:absolute;top:44px;left:0;z-index:50;background:var(--card-bg);border:1px solid var(--border-strong);border-radius:12px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,0.2);width:296px;}
  .color-picker-panel.hidden{display:none !important;}
  .color-quick-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);}
  .color-swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12);flex-shrink:0;}
  .color-swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--card-bg),0 0 0 3px var(--text);}
  .color-swatch-default{background:var(--bg-soft);color:var(--text-muted);font-size:12px;display:flex;align-items:center;justify-content:center;border:2px dashed var(--border-strong);box-shadow:none;}
  .color-swatch-default.active{border-style:solid;border-color:var(--text);color:var(--text);}
  .color-grid{display:flex;flex-direction:column;gap:0;}
  .color-grid-row{display:flex;}
  .color-cell{width:20px;height:16px;border:none;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08);flex:1;}
  .color-cell.active{box-shadow:inset 0 0 0 2px var(--text);position:relative;z-index:1;}

  /* ===== HOME TOOLS ===== */
  .tools-heading{font-size:13px;font-weight:700;margin:22px 0 12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;}
  .tool-card{display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0;transition:border-color .15s ease, box-shadow .15s ease;}
  .tool-card:hover{border-color:var(--primary);}
  .tool-card .flight-name{overflow-wrap:anywhere;}
  .tool-chev{color:var(--text-muted);font-size:20px;flex-shrink:0;}
  .tool-card:hover .flight-name{text-decoration:none;}
  .tool-card:hover .tool-chev{color:var(--primary);}

  /* ===== FLIGHT TRACKING (fl-) ===== */
  .fl-wrap{border-bottom:1px solid var(--border);min-width:0;}
  .fl-wrap:last-child{border-bottom:none;}
  .fl-wrap .flight-row{border-bottom:none;padding-bottom:6px;}
  .fl-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 0 10px 40px;min-width:0;}
  .fl-chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg-soft);color:var(--text-muted);padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;max-width:100%;overflow-wrap:anywhere;}
  .fl-chip.fl-on{background:var(--success-light);color:var(--success);}
  .fl-panel{margin:0 0 12px 40px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;min-width:0;overflow-wrap:anywhere;}
  .fl-panel .fl-line{margin:0 0 8px;}
  .fl-inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0;}
  .fl-inline input{flex:1 1 90px;min-width:0;width:auto;padding:7px 12px;font-size:13px;border-radius:999px;}
  .fl-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:8px 0;}
  .fl-stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 10px;min-width:0;}
  .fl-stat b{display:block;font-size:14px;overflow-wrap:anywhere;}
  .fl-stat span{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;}
  .fl-badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;}
  .fl-badge.air{background:var(--success-light);color:var(--success);}
  .fl-badge.gnd{background:var(--warning-light);color:var(--warning);}
  .fl-links{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .fl-toggle{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0;cursor:pointer;}
  .fl-toggle input{width:auto;flex-shrink:0;}
  @media (max-width:480px){ .fl-actions{padding-left:0;} .fl-panel{margin-left:0;} }

  /* ===== BEST TIME (bt-) ===== */
  .bt-section{margin-top:16px;padding:14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);min-width:0;overflow-wrap:anywhere;}
  .bt-title{font-size:13px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
  .bt-days{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .bt-days .chip-opt{padding:6px 12px;font-size:12px;}
  .bt-chart{display:flex;align-items:flex-end;gap:2px;height:92px;margin:10px 0 2px;}
  .bt-bar{flex:1 1 0;min-width:0;border-radius:4px 4px 0 0;background:var(--primary-light);border:1px solid rgba(79,91,213,.25);border-bottom:none;}
  .bt-bar.quiet{background:var(--success-light);border-color:rgba(0,150,127,.45);}
  .bt-bar.peak{background:var(--accent2-light);border-color:rgba(232,64,126,.45);}
  .bt-bar.now{outline:2px solid var(--primary);outline-offset:1px;}
  .bt-axis{display:flex;gap:2px;font-size:9.5px;color:var(--text-muted);}
  .bt-axis span{flex:1 1 0;min-width:0;text-align:center;overflow:hidden;}
  .bt-sum{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
  .bt-pill{padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;}
  .bt-pill.q{background:var(--success-light);color:var(--success);}
  .bt-pill.p{background:var(--accent2-light);color:var(--accent2);}
  .bt-pill.n{background:var(--primary-light);color:var(--primary-dark);}
  .bt-key{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;}
  .bt-key input{flex:1 1 160px;min-width:0;width:auto;padding:7px 12px;font-size:13px;border-radius:999px;}

  /* ===== TAX REFUND (tx-) ===== */
  .tx-wrap{min-width:0;overflow-wrap:anywhere;}
  .tx-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .tx-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto auto;gap:8px;align-items:center;margin-bottom:8px;}
  .tx-row select,.tx-row input[type=number]{min-width:0;width:100%;}
  .tx-check{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-muted);white-space:nowrap;}
  .tx-check input{width:auto;}
  .tx-x{background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:2px 6px;border-radius:50%;}
  .tx-x:hover{background:var(--bg-soft);}
  .tx-res{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin:10px 0;background:var(--bg);min-width:0;}
  .tx-res.bad{background:var(--danger-light);border-color:rgba(179,38,30,.25);}
  .tx-kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:2px 0;}
  .tx-kv span:first-child{color:var(--text-muted);}
  .tx-kv b{text-align:right;overflow-wrap:anywhere;}
  .tx-big{font-size:22px;font-weight:700;letter-spacing:-0.01em;}
  .tx-guide{border-top:1px solid var(--border);margin-top:12px;padding-top:12px;font-size:13px;}
  .tx-guide ul{margin:6px 0 6px 18px;padding:0;}
  .tx-guide li{margin:2px 0;}
  .tx-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warning-light);color:var(--warning);margin-left:6px;vertical-align:middle;}
  @media (max-width:480px){
    .tx-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
    .tx-row select{grid-column:1 / -1;}
  }

  /* ===== JET LAG (jl-) ===== */
  .jl-wrap{min-width:0;overflow-wrap:anywhere;}
  .jl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:6px;}
  .jl-grid .field{margin-bottom:6px;min-width:0;}
  .jl-grid input,.jl-grid select{min-width:0;width:100%;box-sizing:border-box;}
  .jl-sum{background:var(--primary-light);color:var(--primary-dark);border-radius:var(--radius-sm);padding:10px 14px;font-size:13.5px;margin:10px 0;}
  .jl-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--text-muted);margin:8px 0;}
  .jl-legend i{display:inline-block;width:12px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle;}
  .jl-day{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;background:#fff;min-width:0;}
  .jl-day-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;font-size:13px;font-weight:600;}
  .jl-times{display:flex;gap:12px;margin:10px 0 6px;}
  .jl-times>div{flex:1;background:var(--bg-soft);border-radius:var(--radius-sm);padding:10px 12px;text-align:center;}
  .jl-times small{display:block;font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;}
  .jl-times b{font-size:22px;font-weight:700;}
  .jl-day-head small{font-weight:500;color:var(--text-muted);font-size:11.5px;}
  .jl-strip{position:relative;height:50px;margin:8px 0 2px;background:var(--bg);border-radius:8px;overflow:hidden;}
  .jl-lane{position:absolute;left:0;right:0;height:14px;}
  .jl-lane.l1{top:3px;}.jl-lane.l2{top:19px;}.jl-lane.l3{top:35px;}
  .jl-seg{position:absolute;top:0;bottom:0;border-radius:4px;}
  .jl-sleep{background:#4f5bd5;}
  .jl-nap{background:#00b3a4;}
  .jl-seek{background:#f5b301;}
  .jl-dark{background:#8b8fa3;}
  .jl-caf{background:#e8407e;opacity:.8;}
  .jl-mel{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;border-radius:3px;background:#8b5cf6;}
  .jl-axis{display:flex;justify-content:space-between;font-size:9.5px;color:var(--text-muted);}
  .jl-tips{font-size:12px;color:var(--text-muted);margin-top:6px;}
  .jl-tips div{margin:2px 0;}
  @media (max-width:480px){ .jl-grid{grid-template-columns:1fr 1fr;} }

  .hidden{display:none !important;}
  .loading-note{text-align:center;padding:80px 20px;color:var(--text-muted);font-size:14px;}
</style>
</head>

<div id="loading-bar"></div>
<div id="toast-container"></div>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="setView('home')" style="cursor:pointer;"><span class="brand-mark">✈️</span> <span class="brand-text">VicTravels</span></div>
  </div>
  <div id="countdown-strip" class="countdown-strip hidden"></div>
</header>

<nav class="tabs" id="main-nav">
  <div class="sidebar-brand" onclick="setView('home')" style="cursor:pointer;"><span class="brand-mark">✈️</span><span class="brand-text">VicTravels</span></div>
  <button data-view="home"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></button>

</nav>

<div id="app"><div class="loading-note">Loading your trips…</div></div>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<div class="modal-overlay hidden" id="preview-overlay" style="z-index:200;">
  <div class="modal modal-wide" id="preview-content"></div>
</div>

<script>
/* ============ UTILITIES ============ */
const TYPE_ICONS = {Flight:'✈️',Transport:'🚗',Food:'🍜',Activity:'🎟️',Stays:'🛏️',Shopping:'🛍️',Supermarket:'🛒','Photo Spot':'📸',Misc:'📌'};
const TYPES = ['Flight','Transport','Food','Activity','Stays','Shopping','Supermarket','Photo Spot','Misc'];
const TYPE_COLORS = {Flight:'#0f5257',Transport:'#2f6690',Food:'#b8874a',Activity:'#3d8361',Stays:'#7a5195',Shopping:'#c9577a',Supermarket:'#5c8a3a','Photo Spot':'#b5533c',Misc:'#948d7c'};
const STATUSES = ['Booked','To Book','Nil'];
// Ad-hoc daily spending (Trip Expenses page) is a separate concept from booked activity
// costs — its own small category set, kept distinct from TYPES so "Activities" here can't

const QUICK_COLORS = ['#000000','#ffffff','#ff0000','#00ff00','#0000ff','#ffff00','#00ffff','#ff00ff','#c0c0c0','#808080','#800000','#808000','#008000','#800080','#008080','#000080'];
function hslToHex(h, s, l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return '#'+toHex(f(0))+toHex(f(8))+toHex(f(4));
}
// A larger hue x lightness shade grid (12 hues + a grayscale column, 8 lightness rows),
// like the "more colors" grid under a classic paint-program color picker — still a fixed,
// precomputed set of swatches to click, not an open/arbitrary color input.
const COLOR_GRID = (function(){
  const hues = [0,25,45,65,90,140,170,190,210,240,270,300,330];
  const lightness = [90,80,68,56,44,32,20,10];
  return lightness.map(l => {
    const row = hues.map(h => hslToHex(h, 85, l));
    row.push(hslToHex(0,0,l));
    return row;
  });
})();
function renderColorSwatches(selected){
  const isDefault = !selected;
  const triggerStyle = `background:${selected || '#ffffff'};`;
  const quickRow = `<button type="button" class="color-swatch color-swatch-default ${isDefault?'active':''}" data-hex="" title="White (default)" style="background:#fff;" onclick="selectCardColor('')">&#10005;</button>` +

    `<button type="button" class="color-cell ${selected===hex?'active':''}" data-hex="${hex}" style="background:${hex};" title="${hex}" onclick="selectCardColor('${hex}')"></button>`).join('')}</div>`).join('');
  return `
    <div class="color-picker" id="color-picker-wrap">
      <button type="button" class="color-trigger" id="color-trigger" style="${triggerStyle}" onclick="toggleColorPicker()"></button>
      <div class="color-picker-panel hidden" id="color-picker-panel">

}

function selectCardColor(hex){

/* ============ UI FEEDBACK: loading bar + toasts ============
   Most save/delete/upload flows below just silently re-render on success, which on a slow
   mobile connection can feel like the tap didn't register. beginLoading/endLoading toggle a
   slim top progress bar (counter-based, so overlapping calls don't hide it too early) and
   showToast gives a quick confirmation after the fact. */
let __loadingCount = 0;
function beginLoading(){
  __loadingCount++;
  const bar = document.getElementById('loading-bar');
  if(bar) bar.classList.add('active');
}
function endLoading(){
  __loadingCount = Math.max(0, __loadingCount-1);
  if(__loadingCount===0){
    const bar = document.getElementById('loading-bar');
    if(bar) bar.classList.remove('active');
  }
}
function showToast(message, isError){
  const container = document.getElementById('toast-container');
  if(!container) return;
  const el = document.createElement('div');
  el.className = 'toast'+(isError?' toast-error':'');
  el.textContent = message;
  container.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=>el.remove(), 250);
  }, 2400);
}

}

function parseDate(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }

function fmtDateLong(s){

function fmtTime(t){

function fmtCost(n){

}
// Converts a cost that may have been entered in EUR to its SGD equivalent, using the live
// EUR/SGD rate from the currency converter (see ensureCurrencyRate). Falls back to the raw
// amount, unconverted, for the brief window before the rate has first loaded — corrected
// automatically once it arrives, since every page that shows costs re-renders often.
function toSgd(amount, currency){
  amount = Number(amount) || 0;
  if(currency !== 'EUR') return amount;
  return currencyRate!=null ? amount * currencyRate : amount;
}
// Renders a single listing's own cost: always shown converted to SGD (the app's one
// consistent currency), with a small grey-italic line underneath showing the original €
// amount for anything actually entered in EUR — so what was really paid isn't lost.
// Aggregated totals (Overview, Expenses/budget) use toSgd() directly instead, since summing
// several listings' original currencies into one italic sub-figure wouldn't mean anything.
function costHtml(amount, currency, suffix){
  amount = Number(amount) || 0;
  if(amount<=0) return '';
  suffix = suffix || '';
  if(currency !== 'EUR') return fmtCost(amount)+suffix;
  const sgd = toSgd(amount, currency);
  const eurFmt = '€'+amount.toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2});
  return `${fmtCost(sgd)}${suffix}<div class="cost-eur-sub">${eurFmt}${suffix}</div>`;
}

function addDays(dateStr, n){

}

function compareItems(a,b){
  const da = a.dateStart || '9999-99-99';
  const db = b.dateStart || '9999-99-99';
  if(da!==db) return da<db?-1:1;

function itemDateLabel(item){
  if(!item.dateStart) return '';
  if(item.dateEnd && item.dateEnd!==item.dateStart) return fmtDateShort(item.dateStart)+' – '+fmtDateShort(item.dateEnd);

}
function itemTimeLabel(item){

// Day numbering is 0-indexed throughout the app (the first day of a trip is "Day 0"),
// so a dayNum here is always a plain zero-based offset from trip.startDate.
function itemMatchesDay(item, trip, dayNum){
  if(!item.dateStart || !trip.startDate) return false;
  // Multi-day items (dateEnd > dateStart) get a real continuation row per extra day
  // (see reconcileDuplicates), each with its own single-day dateStart. So matching a
  // day tab is a straight equality check — a range check here would make the original
  // multi-day parent row bleed into every day it spans, double-showing it alongside
  // its own continuation card (visible as a stray extra pin on the map, for instance).
  const dayDate = addDays(trip.startDate, dayNum);
  return item.dateStart === dayDate;

  const numDays = tripDays(trip);

function dayOptionLabel(trip, d, dayNum){

  return `${fmtDateShort(d)} - Day ${dayNum}${title}`;

function dayOptionsHtml(trip, selectedDate, includeBlank){
  const numDays = tripDays(trip);
  let html = includeBlank ? `<option value="" ${!selectedDate?'selected':''}>—</option>` : '';
  let matched = !selectedDate;
  for(let i=0;i<numDays;i++){
    const d = addDays(trip.startDate, i);
    const dayNum = i;
    if(d===selectedDate) matched = true;
    html += `<option value="${d}" ${selectedDate===d?'selected':''}>${escapeHtml(dayOptionLabel(trip, d, dayNum))}</option>`;
  }
  if(!matched){
    // Keep it instead of silently dropping it — e.g. the trip dates changed after this
    // activity's date was set, so it no longer falls inside the (now different) range.
    html += `<option value="${selectedDate}" selected>${escapeHtml(fmtDateShort(selectedDate))} (outside trip dates)</option>`;
  }
  return html;
}
async function saveDayTitle(tripId, dayNum, value){
  const trip = getTrip(tripId);
  if(!trip) return;
  const titles = { ...(trip.dayTitles||{}) };
  const trimmed = (value||'').trim();
  if(trimmed) titles[dayNum] = trimmed; else delete titles[dayNum];
  const { error } = await sb.from('trips').update({ day_titles: titles }).eq('id', tripId);
  if(error){ alert('Could not save day title: '+error.message); return; }
  trip.dayTitles = titles;
  render();
}
