<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VicTravels</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f3;
    --bg-soft:#f1ede3;
    --card-bg:#ffffff;
    --text:#181c1a;
    --text-muted:#6d6a60;
    --border:#e7e2d4;
    --border-strong:#d9d2bd;
    --primary:#0f5257;
    --primary-dark:#0a3a3e;
    --primary-light:#e4f1f0;
    --accent:#b8874a;
    --accent-light:#f6ecdd;
    --danger:#b3261e;
    --danger-light:#fbe9e7;
    --success:#1f7a5c;
    --success-light:#e3f5ec;
    --warning:#b45309;
    --warning-light:#fdf1de;
    --radius:20px;
    --radius-sm:12px;
    --font-serif:'Fraunces',Georgia,serif;
    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 1px 2px rgba(15,20,18,0.04), 0 4px 14px rgba(15,20,18,0.05);
    --shadow-hover:0 14px 34px rgba(15,82,87,0.16), 0 3px 10px rgba(15,20,18,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-sans);
    background:
      radial-gradient(1100px 480px at 15% -8%, rgba(15,82,87,0.07), transparent 60%),
      radial-gradient(900px 420px at 100% 0%, rgba(184,135,74,0.06), transparent 55%),
      var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  #app{max-width:1000px;margin:0 auto;padding:0 20px 80px;}
  ::selection{background:var(--primary-light);color:var(--primary-dark);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px;border:2px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-muted);}

  /* NAV */
  header.topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(250,248,243,0.82);
    backdrop-filter:blur(10px) saturate(1.4);
    border-bottom:1px solid var(--border);
  }
  /* Slim progress bar shown at the very top of the page during a save/delete/upload so a
     tap on a slow connection doesn't feel like it didn't register. */
  #loading-bar{
    position:fixed;top:0;left:0;height:3px;width:0;z-index:300;
    background:linear-gradient(90deg,var(--primary),var(--primary-dark));
    transition:width .3s ease, opacity .3s ease;opacity:0;pointer-events:none;
  }
  #loading-bar.active{width:70%;opacity:1;transition:width 2.2s cubic-bezier(.1,.6,.2,1), opacity .2s ease;}

  /* Toast notifications — quick "Saved"/"Deleted" confirmation after an async action,
     since most save/delete flows just silently re-render otherwise. */
  #toast-container{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:310;
    display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
  }
  .toast{
    background:var(--text);color:#fff;font-size:13px;font-weight:600;
    padding:10px 18px;border-radius:999px;box-shadow:0 8px 22px rgba(10,15,14,0.28);
    opacity:0;transform:translateY(8px);transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.toast-error{background:var(--danger);}
  .topbar-inner{
    max-width:1000px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-serif);font-weight:600;font-size:20px;letter-spacing:-0.01em;color:var(--text);}
  .brand-mark{
    font-size:16px;display:inline-flex;align-items:center;justify-content:center;
    width:32px;height:32px;border-radius:10px;
    background:linear-gradient(150deg,var(--primary),var(--primary-dark));
    box-shadow:0 3px 8px rgba(15,82,87,0.35);
  }
  nav.tabs{display:flex;gap:2px;background:var(--card-bg);border:1px solid var(--border);border-radius:999px;padding:4px;box-shadow:var(--shadow);}
  nav.tabs button{
    border:none;background:transparent;padding:8px 18px;border-radius:999px;
    font-size:13.5px;font-weight:600;color:var(--text-muted);cursor:pointer;
    transition:all .18s ease;
  }
  nav.tabs button.active{background:linear-gradient(150deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 4px 10px rgba(15,82,87,0.3);}
  nav.tabs button:not(.active):hover{color:var(--text);background:var(--bg-soft);}

  /* Always-visible "what's next" banner, part of the sticky header so it's on screen
     from any page without needing to open anything. A bright, high-contrast pill on
     purpose — this is meant to catch your eye at a glance, not blend into the header. */
  .countdown-strip{
    max-width:1000px;margin:0 auto;padding:0 20px 12px;
    display:flex;cursor:pointer;
  }
  .countdown-strip-pill{
    display:inline-flex;align-items:center;gap:8px;
    background:linear-gradient(120deg,#ff8a3d,#ff4d6d);
    color:#fff;font-size:13px;font-weight:700;
    padding:8px 16px;border-radius:999px;
    box-shadow:0 4px 14px rgba(255,77,109,0.4);
    transition:box-shadow .18s ease, transform .18s ease;
  }
  .countdown-strip:hover .countdown-strip-pill{box-shadow:0 6px 18px rgba(255,77,109,0.5);transform:translateY(-1px);}
  .countdown-strip-icon{font-size:14px;line-height:1;display:inline-flex;}
  .countdown-strip-when{font-weight:800;background:rgba(255,255,255,0.28);padding:2px 9px;border-radius:999px;}

  h1,h2,h3{margin:0;letter-spacing:-0.01em;}
  .page-title{font-family:var(--font-serif);font-size:27px;font-weight:600;margin:30px 0 18px;letter-spacing:-0.01em;}
  .section-title{font-size:13px;font-weight:700;margin:0 0 14px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;}

  /* CARD */
  .card{
    background:var(--card-bg);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    padding:20px;
    transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease;
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  @media (max-width:640px){ .grid-2{grid-template-columns:1fr;} }

  /* BUTTONS */
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    border-radius:999px;border:1px solid var(--border-strong);background:#fff;
    padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--text);
    transition:all .18s ease;
  }
  .btn:hover{border-color:var(--text-muted);box-shadow:0 4px 12px rgba(15,20,18,0.08);transform:translateY(-1px);}
  .btn-primary{background:linear-gradient(150deg,var(--primary),var(--primary-dark));border-color:var(--primary-dark);color:#fff;}
  .btn-primary:hover{box-shadow:0 8px 20px rgba(15,82,87,0.35);}
  .btn-danger{background:var(--danger);border-color:var(--danger);color:#fff;}
  .btn-ghost{background:transparent;border-color:transparent;}
  .btn-ghost:hover{background:var(--bg-soft);box-shadow:none;border-color:transparent;transform:none;}
  .btn-sm{padding:6px 13px;font-size:12.5px;}
  .btn-block{width:100%;justify-content:center;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  /* EMPTY STATE */
  .empty-state{
    text-align:center;padding:64px 20px;color:var(--text-muted);
    border:1px dashed var(--border-strong);border-radius:var(--radius);background:rgba(255,255,255,0.5);
  }
  .empty-state .emoji{
    font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
    width:64px;height:64px;border-radius:50%;background:var(--primary-light);
  }
  .empty-state p{margin:0 0 18px;font-size:14.5px;}

  /* HOME */
  .home-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 18px;flex-wrap:wrap;}
  select.trip-select{
    border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 14px;
    font-size:14px;font-weight:600;background:#fff;color:var(--text);cursor:pointer;
  }
  .search-bar{margin-bottom:14px;}
  .search-input{width:100%;}
  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media (max-width:720px){ .home-grid{grid-template-columns:1fr;} }
  .currency-row{display:flex;align-items:flex-end;gap:12px;}
  .currency-field{flex:1;min-width:0;}
  .currency-field input{width:100%;}
  .currency-swap{padding-bottom:11px;font-size:16px;color:var(--text-muted);flex-shrink:0;}
  @media (max-width:480px){ .currency-row{flex-wrap:wrap;} .currency-swap{display:none;} }
  .countdown-num{
    font-family:var(--font-serif);font-size:40px;font-weight:600;letter-spacing:-0.02em;
    background:linear-gradient(150deg,var(--primary),var(--primary-dark));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .countdown-sub{color:var(--text-muted);font-size:13.5px;margin-top:4px;}
  .overview-chip{
    display:inline-flex;align-items:center;gap:4px;background:var(--primary-light);color:var(--primary-dark);
    padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;margin:2px 4px 2px 0;
    border:1px solid rgba(15,82,87,0.12);
  }
  .overview-stats{display:flex;gap:26px;margin-top:14px;}
  .stat-num{font-family:var(--font-serif);font-size:24px;font-weight:600;}
  .stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
  /* Budget card — at-a-glance spend vs. an optional target, combining booked activity
     costs and the separate ad-hoc Trip Expenses log into one "spent so far" figure. */
  .budget-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;}
  .budget-spent{font-family:var(--font-serif);font-size:24px;font-weight:600;}
  .budget-target{font-size:12.5px;color:var(--text-muted);}
  .budget-track{background:var(--bg-soft);border-radius:999px;height:8px;margin-top:10px;overflow:hidden;}
  .budget-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--primary-dark));transition:width .3s ease;}
  .budget-fill.over{background:linear-gradient(90deg,var(--warning),var(--danger));}
  .flight-row{
    display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .flight-row:last-child{border-bottom:none;}
  .flight-row:hover .flight-name{text-decoration:underline;}
  .flight-icon{
    font-size:14px;display:flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:50%;background:var(--primary-light);flex-shrink:0;
  }
  .flight-name{font-weight:600;font-size:13.5px;}
  .flight-meta{font-size:12px;color:var(--text-muted);margin-top:1px;}
  .flight-icon.icon-alert{background:var(--warning-light);color:var(--warning);}
  .booking-windows-card{border-left:4px solid var(--warning);margin-bottom:16px;}
  .expenses-total{font-family:var(--font-serif);font-size:28px;font-weight:600;margin-top:8px;}
  /* "Nearby" / "Nearest Toilets" modal lists */
  .nearby-list{max-height:60vh;overflow-y:auto;}
  .nearby-row{
    display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .nearby-row:last-child{border-bottom:none;}
  .expense-day-header{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin:0 2px 8px;}
  .expense-row:hover{box-shadow:var(--shadow-hover);}
  .task-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .task-row:last-of-type{border-bottom:none;}
  .task-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary);cursor:pointer;}
  .task-text{flex:1;font-size:13.5px;}
  .task-text.done{text-decoration:line-through;color:var(--text-muted);}
  .task-add-row{display:flex;gap:8px;margin-top:12px;}
  .task-add-row input{flex:1;}

  /* FORMS */
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{
    width:100%;padding:10px 13px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);
    font-size:14px;font-family:inherit;background:#fff;color:var(--text);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px var(--primary-light);border-color:var(--primary);}
  label.field-label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .field{margin-bottom:14px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}

  /* CHIPS INPUT (countries) */
  .chip-input-row{display:flex;gap:8px;}
  .chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--primary-light);color:var(--primary-dark);
    padding:5px 6px 5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;
  }
  .chip button{background:none;border:none;color:var(--primary-dark);cursor:pointer;font-size:14px;line-height:1;padding:2px 5px;border-radius:50%;}
  .chip button:hover{background:rgba(15,82,87,0.15);}

  /* TRIPS PAGE */
  .trip-card{cursor:pointer;position:relative;overflow:hidden;transition:box-shadow .2s ease, transform .2s ease;}
  .trip-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--primary),var(--accent));
  }
  .trip-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-3px);}
  .trip-card h3{font-family:var(--font-serif);font-size:18px;font-weight:600;margin-bottom:4px;margin-top:4px;}
  .trip-dates{font-size:12.5px;color:var(--text-muted);margin-bottom:8px;}
  .trip-card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted);}

  /* TRIP DETAIL */
  .trip-detail-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:26px 0 18px;flex-wrap:wrap;}
  .back-link{background:none;border:none;color:var(--text-muted);font-size:13px;cursor:pointer;padding:0;margin-bottom:8px;font-weight:600;}
  .back-link:hover{color:var(--primary-dark);}
  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .day-btn{
    border:1px solid var(--border-strong);background:#fff;border-radius:999px;padding:7px 15px;
    font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text-muted);white-space:nowrap;
    transition:all .15s ease;
  }
  .day-btn:hover{border-color:var(--primary);color:var(--primary-dark);}
  .day-btn.active{background:var(--text);border-color:var(--text);color:#fff;}
  .filter-select{width:auto;padding:7px 12px;font-size:12.5px;font-weight:600;border-radius:999px;}
  /* Sticky day selector — stays put while scrolling a long day's itinerary, with prev/next
     buttons so switching days is a tap instead of reopening the dropdown each time. The
     "top" offset is set from JS (syncDayNavSticky) since the header's height changes
     depending on whether the countdown strip is currently showing. */
  .day-nav-bar{
    position:sticky;z-index:15;background:var(--bg);
    padding:10px 0;margin:0 0 4px;
  }
  .day-nav-btn{
    border:1px solid var(--border-strong);background:#fff;border-radius:999px;
    width:36px;height:36px;flex-shrink:0;font-size:16px;font-weight:700;cursor:pointer;
    color:var(--text);display:flex;align-items:center;justify-content:center;
    transition:all .15s ease;
  }
  .day-nav-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary-dark);}
  .day-nav-btn:disabled{opacity:.35;cursor:default;}
  .toolbar-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .day-title-input{
    font-family:var(--font-serif);font-size:18px;font-weight:600;color:var(--text);
    border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;
    margin-bottom:14px;background:#fff;
  }
  .day-title-input::placeholder{color:var(--text-muted);font-weight:500;font-family:var(--font-sans);font-size:13.5px;}

  /* ITEM / ITINERARY CARD */
  .item-card{
    display:flex;align-items:center;gap:14px;padding:14px 16px;position:relative;margin-bottom:10px;
    transition:opacity .15s ease, box-shadow .2s ease, border-color .2s ease, transform .15s ease;
    z-index:0;cursor:pointer;
  }
  .item-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px);}
  .item-card:has(.popover){z-index:5;}
  .item-card.dragging{opacity:.4;}
  .item-card.drag-over{box-shadow:var(--shadow-hover);border-color:var(--primary);}
  .drag-handle{
    cursor:grab;color:var(--border-strong);font-size:15px;flex-shrink:0;letter-spacing:-1px;
    user-select:none;line-height:1;padding:4px 0;
  }
  .drag-handle:active{cursor:grabbing;}
  .item-type-badge{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:16px;background:var(--primary-light);flex-shrink:0;border:1px solid rgba(15,82,87,0.1);
  }
  .item-main{flex:1;min-width:0;}
  .item-name{font-weight:600;font-size:14.5px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item-meta{font-size:12px;color:var(--text-muted);display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  .status-badge{
    font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;
    text-transform:uppercase;letter-spacing:.03em;
  }
  .status-Booked{background:var(--success-light);color:var(--success);}
  .status-ToBook{background:var(--warning-light);color:var(--warning);}
  .status-Nil{background:var(--bg-soft);color:var(--text-muted);}
  .item-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
  .item-cover-img{width:88px;height:88px;object-fit:cover;border-radius:12px;flex-shrink:0;border:1px solid var(--border);display:block;}
  .item-cover-wrap{position:relative;flex-shrink:0;cursor:pointer;}
  .item-cover-count{
    position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,0.65);color:#fff;
    font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:999px;line-height:1.3;
  }
  .lightbox-nav{
    background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:50%;
    width:38px;height:38px;font-size:22px;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .lightbox-nav:hover{background:rgba(0,0,0,0.8);}

  /* ACTIVITY DETAIL POPUP
     The frame no longer forces a fixed height + object-fit:cover — that cropped anything
     that wasn't already the frame's own aspect ratio (a square photo lost its top/bottom).
     max-height + object-fit:contain instead: the image keeps its real proportions and just
     gets capped (and centered, with letterboxing if needed) so a very tall/wide photo can't
     blow out the modal. */
  .detail-gallery-frame{position:relative;width:100%;border-radius:12px;overflow:hidden;background:var(--bg-soft);margin-bottom:16px;display:flex;align-items:center;justify-content:center;}
  .detail-gallery-img{width:100%;max-height:420px;object-fit:contain;display:block;}
  .detail-gallery-count{position:absolute;bottom:8px;right:10px;background:rgba(0,0,0,0.55);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}
  .detail-meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;font-size:13px;color:var(--text-muted);}
  .detail-type-pill{background:var(--bg-soft);padding:2px 10px;border-radius:999px;}
  .detail-links-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .detail-notes{font-size:13.5px;line-height:1.65;color:var(--text);margin-bottom:16px;overflow-wrap:anywhere;}
  .detail-files{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
  .open-now-badge{padding:2px 10px;border-radius:999px;font-weight:600;}
  .open-now-badge.open{background:rgba(52,199,89,0.15);color:#1f8b3d;}
  .open-now-badge.closed{background:rgba(255,59,48,0.15);color:#c0392b;}
  @media (max-width:480px){
    .detail-gallery-img{max-height:280px;}

  .nav-btn{

  /* A long unbroken URL in notes has no whitespace to wrap at, so without this it overflows

     reads instantly as "you are here" rather than another activity pin. */
  .map-mydot{
    width:16px;height:16px;border-radius:50%;background:#4285F4;border:3px solid #fff;
    box-shadow:0 0 0 4px rgba(66,133,244,0.35), 0 2px 6px rgba(0,0,0,0.3);

  .card-distance-badge{

  .color-picker{position:relative;display:inline-block;}
  .color-trigger{width:36px;height:36px;border-radius:50%;border:2px solid var(--border-strong);cursor:pointer;font-size:14px;color:var(--text-muted);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08);padding:0;}

  .color-picker-panel.hidden{display:none !important;}

  .color-swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12);flex-shrink:0;}
  .color-swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--card-bg),0 0 0 3px var(--text);}
  .color-swatch-default{background:var(--bg-soft);color:var(--text-muted);font-size:12px;display:flex;align-items:center;justify-content:center;border:2px dashed var(--border-strong);box-shadow:none;}
  .color-swatch-default.active{border-style:solid;border-color:var(--text);color:var(--text);}
  .color-grid{display:flex;flex-direction:column;gap:0;}
  .color-grid-row{display:flex;}
  .color-cell{width:20px;height:16px;border:none;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08);flex:1;}
  .color-cell.active{box-shadow:inset 0 0 0 2px var(--text);position:relative;z-index:1;}

  .hidden{display:none !important;}
  .loading-note{text-align:center;padding:80px 20px;color:var(--text-muted);font-size:14px;}
</style>

<script>
/* ============ UTILITIES ============ */
const TYPE_ICONS = {Flight:'✈️',Transport:'🚗',Food:'🍜',Activity:'🎟️',Stays:'🛏️',Shopping:'🛍️',Supermarket:'🛒',Misc:'📌'};
const TYPES = ['Flight','Transport','Food','Activity','Stays','Shopping','Supermarket','Misc'];
const TYPE_COLORS = {Flight:'#0f5257',Transport:'#2f6690',Food:'#b8874a',Activity:'#3d8361',Stays:'#7a5195',Shopping:'#c9577a',Supermarket:'#5c8a3a',Misc:'#948d7c'};
const STATUSES = ['Booked','To Book','Nil'];
// Ad-hoc daily spending (Trip Expenses page) is a separate concept from booked activity
// costs — its own small category set, kept distinct from TYPES so "Activities" here can't
// be confused with the itinerary's "Activity" item type.
const EXPENSE_CATEGORIES = ['Food','Shopping','Transport','Activities','Supermarket','Other'];
const EXPENSE_CATEGORY_ICONS = {Food:'🍜',Shopping:'🛍️',Transport:'🚗',Activities:'🎟️',Supermarket:'🛒',Other:'💸'};
const BOOKED_BY = ['Victoria','Weng Seng'];
const ICON_GROUPS = [
  { group:'Transport', icons:[['🚗','Car'],['🚆','Train'],['🚌','Bus'],['⛴️','Ferry'],['🚕','Taxi'],['🚲','Bike'],['🛵','Scooter'],['🚶','Walk'],['🚠','Cable Car']] },
  { group:'Flight', icons:[['✈️','Plane'],['🛫','Departure'],['🛬','Arrival']] },
  { group:'Stay', icons:[['🛏️','Hotel'],['🏨','Hotel Building'],['🏠','Apartment'],['⛺','Camping']] },
  { group:'Food', icons:[['🍜','Noodles'],['🍽️','Restaurant'],['☕','Cafe'],['🍷','Bar'],['🍰','Dessert']] },
  { group:'Activity', icons:[['🎟️','Ticket'],['🏛️','Museum'],['📸','Photo Spot'],['🥾','Hiking'],['🏖️','Beach'],['🎢','Theme Park'],['⛷️','Skiing'],['🛍️','Shopping'],['🎭','Show']] },
  { group:'Other', icons:[['📌','Pin'],['📄','Document']] },
];
function iconOptionsHtml(selected){
  return ICON_GROUPS.map(g=>`<optgroup label="${g.group}">${g.icons.map(([emoji,label])=>
    `<option value="${emoji}" ${selected===emoji?'selected':''}>${emoji} ${label}</option>`).join('')}</optgroup>`).join('');
}
// A custom-uploaded icon image (set via the Icon field's upload option) always takes
// precedence over the emoji picker and the type default, wherever an icon is shown.
function iconGlyphHtml(item, size){
  size = size || 20;
  if(item && item.iconImagePath){
    return `<img src="${coverPublicUrl(item.iconImagePath)}" alt="" style="width:${size}px;height:${size}px;object-fit:contain;display:inline-block;vertical-align:middle;">`;
  }
  return escapeHtml((item && item.icon) || (item && TYPE_ICONS[item.type]) || '📌');
}
// Like iconGlyphHtml, but returns null instead of falling back to the type default —
// used for the Places of Interest map pin, which should keep its plain gold star unless
// the user has actually chosen an icon (explicit emoji or uploaded image) for that place.
function explicitIconGlyphHtml(item, size){
  size = size || 20;
  if(item && item.iconImagePath){
    return `<img src="${coverPublicUrl(item.iconImagePath)}" alt="" style="width:${size}px;height:${size}px;object-fit:contain;display:inline-block;vertical-align:middle;">`;
  }
  if(item && item.icon) return escapeHtml(item.icon);
  return null;
}
// Muted palette used when a card/pin has no custom color set — the map cycles through
// these automatically so consecutive days stay visually distinct without any input.
const COLOR_PALETTE = ['#0f5257','#b8874a','#7a5195','#2f6690','#3d8361','#b3454a','#948d7c','#c9a227','#5c6bc0','#8d6e63'];

// Classic 16-color "basic colors" row, same set used by MS Paint / Windows color pickers.
const QUICK_COLORS = ['#000000','#ffffff','#ff0000','#00ff00','#0000ff','#ffff00','#00ffff','#ff00ff','#c0c0c0','#808080','#800000','#808000','#008000','#800080','#008080','#000080'];
function hslToHex(h, s, l){
  s/=100; l/=100;
  const k = n => (n + h/30) % 12;
  const a = s * Math.min(l, 1-l);
  const f = n => l - a*Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
  const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
  return '#'+toHex(f(0))+toHex(f(8))+toHex(f(4));
}
// A larger hue x lightness shade grid (12 hues + a grayscale column, 8 lightness rows),
// like the "more colors" grid under a classic paint-program color picker — still a fixed,
// precomputed set of swatches to click, not an open/arbitrary color input.
const COLOR_GRID = (function(){
  const hues = [0,25,45,65,90,140,170,190,210,240,270,300,330];
  const lightness = [90,80,68,56,44,32,20,10];
  return lightness.map(l => {
    const row = hues.map(h => hslToHex(h, 85, l));
    row.push(hslToHex(0,0,l));
    return row;
  });
})();
function renderColorSwatches(selected){
  const isDefault = !selected;
  const triggerStyle = selected ? `background:${selected};` : '';
  const quickRow = `<button type="button" class="color-swatch color-swatch-default ${isDefault?'active':''}" data-hex="" title="Automatic" onclick="selectCardColor('')">&#10005;</button>` +
    QUICK_COLORS.map(hex=>`<button type="button" class="color-swatch ${selected===hex?'active':''}" data-hex="${hex}" style="background:${hex};" title="${hex}" onclick="selectCardColor('${hex}')"></button>`).join('');
  const grid = COLOR_GRID.map(row=>`<div class="color-grid-row">${row.map(hex=>
    `<button type="button" class="color-cell ${selected===hex?'active':''}" data-hex="${hex}" style="background:${hex};" title="${hex}" onclick="selectCardColor('${hex}')"></button>`).join('')}</div>`).join('');
  return `
    <div class="color-picker" id="color-picker-wrap">
      <button type="button" class="color-trigger" id="color-trigger" style="${triggerStyle}" onclick="toggleColorPicker()">${selected?'':'&#10005;'}</button>
      <div class="color-picker-panel hidden" id="color-picker-panel">
        <div class="color-quick-row">${quickRow}</div>
        <div class="color-grid">${grid}</div>
      </div>
    </div>`;
}
function toggleColorPicker(force){
  const panel = document.getElementById('color-picker-panel');
  if(!panel) return;
  const show = typeof force === 'boolean' ? force : panel.classList.contains('hidden');
  panel.classList.toggle('hidden', !show);
}
document.addEventListener('click', e=>{
  const wrap = document.getElementById('color-picker-wrap');
  const panel = document.getElementById('color-picker-panel');
  if(!wrap || !panel || panel.classList.contains('hidden')) return;
  if(!wrap.contains(e.target)) panel.classList.add('hidden');
});
function selectCardColor(hex){
  const input = document.getElementById('item-color-input');
  if(!input) return;
  input.value = hex;
  input.dataset.enabled = hex ? '1' : '0';
  document.querySelectorAll('.color-swatch,.color-cell').forEach(el=>{
    el.classList.toggle('active', (el.dataset.hex||'') === hex);
  });
  const trigger = document.getElementById('color-trigger');
  if(trigger){
    trigger.style.background = hex || '';
    trigger.innerHTML = hex ? '' : '&#10005;';
  }
  toggleColorPicker(false);
}

/* ============ SUPABASE ============ */
const SUPABASE_URL = 'https://xndkjgtdbxpabajqbjmv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_T3LclvJsqEnvqBdKMH-hgQ_LBiDrI9F';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ============ UI FEEDBACK: loading bar + toasts ============
   Most save/delete/upload flows below just silently re-render on success, which on a slow
   mobile connection can feel like the tap didn't register. beginLoading/endLoading toggle a
   slim top progress bar (counter-based, so overlapping calls don't hide it too early) and
   showToast gives a quick confirmation after the fact. */
let __loadingCount = 0;
function beginLoading(){
  __loadingCount++;
  const bar = document.getElementById('loading-bar');
  if(bar) bar.classList.add('active');
}
function endLoading(){
  __loadingCount = Math.max(0, __loadingCount-1);
  if(__loadingCount===0){
    const bar = document.getElementById('loading-bar');
    if(bar) bar.classList.remove('active');
  }
}
function showToast(message, isError){
  const container = document.getElementById('toast-container');
  if(!container) return;
  const el = document.createElement('div');
  el.className = 'toast'+(isError?' toast-error':'');
  el.textContent = message;
  container.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=>el.remove(), 250);
  }, 2400);
}

function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayStr(){
  const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowTime(){
  const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
// Defaults the Trip Expenses "Day" field to today if today falls inside the trip, otherwise
// the trip's start date — so logging a coffee mid-trip doesn't need any date fiddling.
function todayWithinTrip(trip){
  const t = todayStr();
  if(trip.startDate && trip.endDate && t>=trip.startDate && t<=trip.endDate) return t;
  return trip.startDate || '';
}

function toSgd(amount, currency){

/* ---- Map pin geocoding ---- */
function extractLatLngFromMapsLink(url){
  if(!url) return null;
  let m = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  m = url.match(/[?&](?:q|query)=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  return null;
}
function extractPlaceNameFromMapsLink(url){
  if(!url) return null;
  let m = url.match(/\/maps\/place\/([^\/@]+)/);
  if(m) return decodeURIComponent(m[1].replace(/\+/g,' '));
  m = url.match(/[?&](?:q|query)=([^&]+)/);
  if(m && !/^-?\d+\.\d+,-?\d+\.\d+$/.test(m[1])) return decodeURIComponent(m[1].replace(/\+/g,' '));
  return null;
}
// Google Maps "share" links (from the Share button on the app) come back shortened,
// e.g. https://maps.app.goo.gl/xxxx — these carry no lat/lng or place name in the URL
// itself, so extractLatLngFromMapsLink/extractPlaceNameFromMapsLink can't read anything
// from them until they're followed to their real, expanded maps.google.com URL.
function isShortMapsLink(url){
  if(!url) return false;
  return /^https?:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps)\//i.test(url.trim());
}
// A browser can't follow this redirect itself — a cross-origin fetch() to goo.gl is
// blocked by CORS (Google doesn't send Access-Control-Allow-Origin on the redirect
// chain) — so this asks a small Supabase Edge Function to follow it server-side instead.
async function resolveMapsShortLink(url){
  try{
    const { data, error } = await sb.functions.invoke('resolve-maps-link', { body: { url } });
    if(error || !data || !data.finalUrl) return null;
    return data.finalUrl;
  }catch(e){ return null; }
}
// Convenience for the Add/Edit Activity form: pasting a Maps link fills in the Name (and a
// best-guess Type) so a place doesn't need to be typed out by hand while standing in front
// of it. Only ever fills fields the user hasn't already touched — never overwrites.
async function autofillFromMapsLink(url){
  url = (url||'').trim();
  if(!url) return;
  const nameInput = document.getElementById('item-name-input');
  if(!nameInput || nameInput.value.trim()) return;
  let placeName = extractPlaceNameFromMapsLink(url);
  if(!placeName && isShortMapsLink(url)){
    const resolved = await resolveMapsShortLink(url);
    if(resolved) placeName = extractPlaceNameFromMapsLink(resolved);
  }
  if(!placeName) return;
  // The maps link field may have changed (or the modal closed) while the short-link
  // resolve above was in flight — re-check right before writing.
  const nameInputNow = document.getElementById('item-name-input');
  if(!nameInputNow || nameInputNow.value.trim()) return;
  nameInputNow.value = placeName;
  const typeInput = document.getElementById('item-type-input');
  if(typeInput && !typeInput.dataset.userChanged){
    const guessed = guessTypeFromPlaceName(placeName);
    if(guessed) typeInput.value = guessed;
  }

/* ============ LOCATION: "Nearby" + "Nearest Toilet" ============
   Both features are free — no API key, no billing. "Nearby" reuses lat/lng the app has
   already geocoded for each activity; "Nearest Toilet" queries OpenStreetMap's free,
   crowdsourced amenity=toilets tag via the public Overpass API. Both use the browser's
   built-in Geolocation API for "where am I", which also costs nothing and needs no key —
   just a one-time permission prompt (requires HTTPS, which GitHub Pages already is). */
function getCurrentPosition(){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation){ reject(new Error('Geolocation is not supported on this device/browser.')); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      err => {
        let msg = 'Could not get your location.';
        if(err.code===1) msg = 'Location permission was denied. Allow location access in your browser settings to use this.';
        else if(err.code===2) msg = 'Your location is currently unavailable.';
        else if(err.code===3) msg = 'Getting your location took too long. Please try again.';
        reject(new Error(msg));
      },
      { enableHighAccuracy:true, timeout:12000, maximumAge:60000 }
    );
  });
}
// Great-circle distance between two lat/lng points, in meters (haversine formula).
function haversineMeters(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const toRad = d => d * Math.PI/180;
  const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function formatDistance(meters){
  if(meters < 1000) return Math.round(meters) + ' m';
  return (meters/1000).toFixed(1) + ' km';
}
function formatRouteDuration(seconds){
  const mins = Math.round(seconds/60);
  if(mins < 1) return '<1 min';
  if(mins < 60) return mins + ' min';
  const h = Math.floor(mins/60), m = mins % 60;
  return h + 'h' + (m ? ' '+m+'m' : '');
}
// Google's Routes API — used only for the two allowed modes (walking, public transit; no
// driving). Costs nothing at this app's scale: Routes: Compute Routes Essentials gives
// 10,000 free calls/month, and a couple of people's daily itinerary has nowhere near that.
async function computeRouteLeg(originLat, originLng, destLat, destLng, mode){
  try {
    const res = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
        'X-Goog-FieldMask': 'routes.duration,routes.distanceMeters',
      },
      body: JSON.stringify({
        origin: { location: { latLng: { latitude: originLat, longitude: originLng } } },
        destination: { location: { latLng: { latitude: destLat, longitude: destLng } } },
        travelMode: mode, // 'WALK' or 'TRANSIT'
      }),
    });
    if(!res.ok) return null;
    const data = await res.json();
    const route = data.routes && data.routes[0];
    if(!route) return null;
    return { seconds: parseInt(route.duration, 10) || 0, meters: route.distanceMeters || 0 };
  } catch(e){
    return null;
  }
}

        'Content-Type': 'application/json',
        'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
        'X-Goog-FieldMask': 'routes.duration,routes.distanceMeters,routes.polyline.encodedPolyline',
      },
      body: JSON.stringify({
        origin: { location: { latLng: { latitude: originLat, longitude: originLng } } },
        destination: { location: { latLng: { latitude: destLat, longitude: destLng } } },
        travelMode: mode,
      }),
    });
    if(!res.ok) return null;
    const data = await res.json();
    const route = data.routes && data.routes[0];
    if(!route) return null;
    return {
      seconds: parseInt(route.duration, 10) || 0,
      meters: route.distanceMeters || 0,
      encodedPolyline: route.polyline && route.polyline.encodedPolyline,
    };
  } catch(e){
    return null;
  }
}
// On a phone/tablet, jump straight into the native Google Maps app (location.href on the
// same universal link Google Maps already understands is what reliably triggers the app,
// where window.open tends to just open a browser tab instead). On desktop, where there's
// no Maps app to hand off to, show the route as an on-screen overlay instead of leaving
// the page.
async function showNavRoute(fromLat, fromLng, toLat, toLng, mode){
  closePopovers();
  const gmapsUrl = googleMapsDirectionsUrlBetween(fromLat, fromLng, toLat, toLng, mode);
  if(isMobileDevice()){
    window.location.href = gmapsUrl;
    return;
  }
  const modeLabel = mode==='transit' ? '🚆 Transit' : '🚶 Walking';
  openModal(`
    <div class="modal-header"><h3>${modeLabel} directions</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div id="route-overlay-map" style="height:340px;border-radius:12px;overflow:hidden;background:var(--bg-soft);"></div>
    <div class="muted-note" id="route-overlay-status" style="margin-top:10px;">Loading route…</div>
    <div class="modal-footer">
      <a class="btn" href="${gmapsUrl}" target="_blank" rel="noopener">Open in Google Maps ↗</a>
      <button class="btn btn-primary" onclick="closeModal()">Close</button>
    </div>
  `, true);

  const leg = await computeRouteWithPolyline(fromLat, fromLng, toLat, toLng, mode==='transit' ? 'TRANSIT' : 'WALK');
  const mapEl = document.getElementById('route-overlay-map');
  if(!mapEl) return; // modal was closed before this resolved
  const statusEl = document.getElementById('route-overlay-status');
  if(!leg){
    if(statusEl) statusEl.textContent = 'Could not load this route — try "Open in Google Maps" instead.';
    return;
  }
  if(statusEl) statusEl.textContent = `${formatRouteDuration(leg.seconds)} · ${formatDistance(leg.meters)}`;

  let googleMaps;
  try { googleMaps = await loadGoogleMaps(); } catch(e){ return; }
  if(document.getElementById('route-overlay-map') !== mapEl) return; // modal changed underneath us

  const map = new googleMaps.Map(mapEl, {
    gestureHandling:'greedy', zoomControl:true, streetViewControl:false,
    mapTypeControl:false, fullscreenControl:false, mapId:'DEMO_MAP_ID',
  });
  const bounds = new googleMaps.LatLngBounds();
  new googleMaps.marker.AdvancedMarkerElement({ map, position:{ lat:fromLat, lng:fromLng } });
  new googleMaps.marker.AdvancedMarkerElement({ map, position:{ lat:toLat, lng:toLng } });
  bounds.extend({ lat:fromLat, lng:fromLng });
  bounds.extend({ lat:toLat, lng:toLng });
  if(leg.encodedPolyline && googleMaps.geometry){
    const path = googleMaps.geometry.encoding.decodePath(leg.encodedPolyline);
    new googleMaps.Polyline({ path, map, strokeColor:'#2f6f5e', strokeWeight:4, strokeOpacity:0.9 });
    path.forEach(p=>bounds.extend(p));
  }
  map.fitBounds(bounds, 40);
}

/* ---- Places API (New): autocomplete, "open now" badge, auto-pulled photo ----
   Text Search "IDs only" (field mask: places.id) is unlimited/free, so it's safe to call
   speculatively for any legacy activity missing a cached place_id. Place Details is on the
   Enterprise tier (1,000 free calls/month) — kept to the item detail modal only (not every
   compact list card) to stay comfortably within that smaller cap, and combined into one call
   covering both the open-now badge and the photo to minimize usage further. */
function streetViewUrl(lat, lng, w, h){
  return `https://maps.googleapis.com/maps/api/streetview?size=${w||640}x${h||300}&location=${lat},${lng}&key=${GOOGLE_MAPS_API_KEY}`;
}
function placesPhotoUrl(photoName, maxWidthPx){
  return `https://places.googleapis.com/v1/${photoName}/media?maxWidthPx=${maxWidthPx||480}&key=${GOOGLE_MAPS_API_KEY}`;
}
async function resolvePlaceId(item){
  if(item.placeId) return item.placeId;
  if(item.lat==null || item.lng==null || !item.name) return null;
  try{
    const res = await fetch('https://places.googleapis.com/v1/places:searchText', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
        'X-Goog-FieldMask': 'places.id',
      },
      body: JSON.stringify({
        textQuery: item.name,
        locationBias: { circle: { center: { latitude: item.lat, longitude: item.lng }, radius: 200 } },
      }),
    });
    if(!res.ok) return null;
    const data = await res.json();
    return (data.places && data.places[0] && data.places[0].id) || null;
  } catch(e){ return null; }
}
const placeDetailsCache = {}; // placeId -> {openNow, businessStatus, photoName} | null, per page session
async function fetchPlaceDetails(placeId){
  if(Object.prototype.hasOwnProperty.call(placeDetailsCache, placeId)) return placeDetailsCache[placeId];
  try{
    const res = await fetch(`https://places.googleapis.com/v1/places/${placeId}`, {
      headers: {
        'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
        'X-Goog-FieldMask': 'currentOpeningHours.openNow,businessStatus,photos',
      },
    });
    if(!res.ok){ placeDetailsCache[placeId] = null; return null; }
    const data = await res.json();
    const result = {
      openNow: data.currentOpeningHours && typeof data.currentOpeningHours.openNow === 'boolean' ? data.currentOpeningHours.openNow : null,
      businessStatus: data.businessStatus || null,
      photoName: (data.photos && data.photos[0] && data.photos[0].name) || null,
    };
    placeDetailsCache[placeId] = result;
    return result;
  } catch(e){ placeDetailsCache[placeId] = null; return null; }
}
// Fills in the "open now" badge and, if the activity has no manually-uploaded photo of its
// own, an auto-pulled Places photo as a fallback gallery image — both async, after the detail
// modal is already open. myToken guards against a stale fetch landing after the modal moved on.
async function loadDetailPlaceExtras(tripId, item, myToken){
  let placeId = item.placeId;
  if(!placeId){
    placeId = await resolvePlaceId(item);
    if(detailModalRenderToken !== myToken) return;
    if(placeId){
      item.placeId = placeId;
      sb.from('activities').update({ place_id: placeId }).eq('id', item.id).then(()=>{});
    }
  }
  if(!placeId) return;
  const details = await fetchPlaceDetails(placeId);
  if(detailModalRenderToken !== myToken || !details) return;
  const badgeEl = document.getElementById('detail-openbadge');
  if(badgeEl){
    if(details.businessStatus === 'CLOSED_PERMANENTLY'){
      badgeEl.innerHTML = `<span class="open-now-badge closed">Permanently closed</span>`;
    } else if(details.businessStatus === 'CLOSED_TEMPORARILY'){
      badgeEl.innerHTML = `<span class="open-now-badge closed">Temporarily closed</span>`;
    } else if(details.openNow === true){
      badgeEl.innerHTML = `<span class="open-now-badge open">🟢 Open now</span>`;
    } else if(details.openNow === false){
      badgeEl.innerHTML = `<span class="open-now-badge closed">🔴 Closed now</span>`;
    }
  }
  // Overwrites whatever's currently in the gallery slot — including a Street View placeholder
  // shown while this was loading — with the real place photo, as long as there's no manually
  // uploaded photo of the user's own to protect.
  if(details.photoName && !(item.imagePaths && item.imagePaths.length)){
    const galleryEl = document.getElementById('detail-gallery');
    if(galleryEl){
      galleryEl.innerHTML = `<div class="detail-gallery-frame"><img src="${placesPhotoUrl(details.photoName, 640)}" class="detail-gallery-img" alt=""></div>`;
    }
  }
}
// Builds the small "open now"/"closed" markup shared by the item detail modal, the compact
// card badge, and the map pin hover tooltip, so all three stay visually and logically in sync.
function openBadgeHtml(details){
  if(!details) return '';
  if(details.businessStatus === 'CLOSED_PERMANENTLY') return `<span class="open-now-badge closed">Permanently closed</span>`;
  if(details.businessStatus === 'CLOSED_TEMPORARILY') return `<span class="open-now-badge closed">Temporarily closed</span>`;
  if(details.openNow === true) return `<span class="open-now-badge open">🟢 Open</span>`;
  if(details.openNow === false) return `<span class="open-now-badge closed">🔴 Closed</span>`;
  return '';
}
// Fills in each card's small open-now badge (day view, POI view) — same lazy resolve+cache
// path as the detail modal, so repeat visits/hovers of an already-resolved place cost nothing
// extra. Runs after the card list is in the DOM, one item at a time, same pattern as
// loadDistanceBadges.
let cardOpenBadgeRenderToken = 0;
async function loadCardOpenBadges(trip, items){
  if(!trip || !items || !items.length) return;
  const myToken = ++cardOpenBadgeRenderToken;
  for(const item of items){
    if(item.lat==null || item.lng==null) continue;
    if(!document.getElementById(`cardopenbadge-${item.id}`)) continue;
    let placeId = item.placeId;
    if(!placeId){
      placeId = await resolvePlaceId(item);
      if(cardOpenBadgeRenderToken !== myToken) return;
      if(placeId){
        item.placeId = placeId;
        sb.from('activities').update({ place_id: placeId }).eq('id', item.id).then(()=>{});
      }
    }
    if(!placeId) continue;
    const details = await fetchPlaceDetails(placeId);
    if(cardOpenBadgeRenderToken !== myToken) return;
    const el = document.getElementById(`cardopenbadge-${item.id}`);
    if(el) el.innerHTML = openBadgeHtml(details);
  }
}

async function queryNearbyToilets(pos, radiusMeters){
  const query = `[out:json][timeout:15];node["amenity"="toilets"](around:${radiusMeters},${pos.lat},${pos.lng});out body;`;
  const res = await fetch('https://overpass-api.de/api/interpreter', {
    method: 'POST',
    body: 'data=' + encodeURIComponent(query),
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
  });
  if(!res.ok) throw new Error('Overpass API returned an error');
  const json = await res.json();
  return (json.elements||[]).map(el=>({
    lat: el.lat, lng: el.lon,
    name: (el.tags && el.tags.name) || 'Public Toilet',
    fee: el.tags && el.tags.fee==='yes',
    wheelchair: el.tags && el.tags.wheelchair==='yes',
    dist: haversineMeters(pos.lat, pos.lng, el.lat, el.lon),
  })).sort((a,b)=>a.dist-b.dist).slice(0,20);
}

function getTrip(id){ return data.trips.find(t=>t.id===id); }
function sortedTrips(){
  return [...data.trips].sort((a,b)=> (a.startDate||'').localeCompare(b.startDate||''));
}
function tripDays(trip){
  if(!trip.startDate || !trip.endDate) return 1;
  return Math.max(1, daysBetween(trip.startDate, trip.endDate)+1);
}
function defaultHomeTrip(){
  const trips = sortedTrips();
  if(trips.length===0) return null;
  const t = todayStr();
  const upcoming = trips.find(tr => tr.endDate >= t);
  return (upcoming || trips[trips.length-1]).id;
}

// dropdown. Disabled (see renderTripDetail) at either end of the trip or while "All Days"

function shiftDay(delta){
  if(ui.dayFilter==='all') return;
  const trip = getTrip(ui.detailTripId);
  if(!trip) return;
  const numDays = tripDays(trip);

/* ---- "What's next" countdown strip (lives in the header, outside #app, so it's visible
   on every page without needing to open anything) ---- */
function computeCountdownInfo(){
  const now = new Date();
  const t = todayStr();
  const n = nowTime();
  let candidates = [];
  data.trips.forEach(trip=>{
    (trip.items||[]).forEach(item=>{
      // Only confirmed plans are worth an "at a glance" countdown — a "To Book" or "Nil"
      // item isn't a real commitment yet, so surfacing it here would be misleading.
      if(item.isPoi || !item.dateStart || item.status!=='Booked') return;
      candidates.push({ item, trip });
    });
  });
  // Prefer the soonest thing that hasn't started yet, within the next 3 days — far-future
  // items would just be noise in an "at a glance" strip.
  let upcoming = null;
  candidates.forEach(c=>{
    const dt = new Date(c.item.dateStart+'T'+(c.item.timeStart||'00:00')+':00');
    if(isNaN(dt.getTime())) return;
    const diffMs = dt.getTime() - now.getTime();
    if(diffMs > 0 && diffMs <= 1000*60*60*72 && (!upcoming || diffMs < upcoming.diffMs)){
      upcoming = { ...c, diffMs, mode:'upcoming' };
    }
  });
  if(upcoming) return upcoming;
  // Otherwise, surface whatever's currently in progress (e.g. a multi-night hotel stay) so
  // there's still a useful "where am I supposed to be" answer even with nothing imminent.
  let ongoing = null;
  candidates.forEach(c=>{
    const { item } = c;
    const end = item.dateEnd || item.dateStart;
    if(item.dateStart<=t && t<=end && !ongoing) ongoing = { ...c, mode:'ongoing' };
  });
  return ongoing;
}
function countdownWhenLabel(diffMs){
  const mins = Math.max(1, Math.round(diffMs/60000));
  if(mins < 60) return `in ${mins}m`;
  if(mins < 60*24) return `in ${Math.floor(mins/60)}h ${mins%60}m`;
  return `in ${Math.floor(mins/(60*24))}d`;
}
function renderCountdownStrip(){
  const el = document.getElementById('countdown-strip');
  if(!el) return;
  const info = computeCountdownInfo();
  if(!info){ el.classList.add('hidden'); el.innerHTML=''; el.onclick=null; return; }
  const { item, trip, mode, diffMs } = info;
  const whenHtml = mode==='ongoing'
    ? `<span class="countdown-strip-when">Now</span>`
    : `<span class="countdown-strip-when">${countdownWhenLabel(diffMs)}</span>`;
  el.classList.remove('hidden');
  el.innerHTML = `<span class="countdown-strip-pill"><span class="countdown-strip-icon">${iconGlyphHtml(item,14)}</span><span class="countdown-strip-text">${escapeHtml(item.name||'Untitled')}</span> ${whenHtml}</span>`;
  el.onclick = ()=> openItemDetailModal(trip.id, item.id);
}
let countdownStripTimer = setInterval(renderCountdownStrip, 60000);

let googleMapsLoadPromise = null;
// Loaded on first use rather than on every page load, since most page views (home,

function loadGoogleMaps(){
  if(googleMapsLoadPromise) return googleMapsLoadPromise;
  googleMapsLoadPromise = new Promise((resolve, reject)=>{
    if(window.google && window.google.maps){ resolve(window.google.maps); return; }
    window.__onGoogleMapsLoaded = ()=> resolve(window.google.maps);
    const script = document.createElement('script');
    script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=marker,geometry,places&loading=async&callback=__onGoogleMapsLoaded`;
    script.async = true;
    script.onerror = ()=> reject(new Error('Failed to load Google Maps'));
    document.head.appendChild(script);
  });
  return googleMapsLoadPromise;
}
// Places Autocomplete on the Add/Edit Activity form's Name field: picking a real suggestion
// captures its place_id and exact lat/lng directly (no geocoding round trip needed), and fills
// in a Google Maps link if the field is still blank. Attached fresh each time the modal opens
// since it's a real DOM element the widget binds to, not a persistent one.
let placeAutocompleteInstance = null;
async function initPlacesAutocomplete(){
  let googleMaps;
  try { googleMaps = await loadGoogleMaps(); } catch(e){ return; }
  const input = document.getElementById('item-name-input');
  if(!input || !googleMaps.places) return; // modal may have closed while Maps was loading
  placeAutocompleteInstance = new googleMaps.places.Autocomplete(input, { fields: ['place_id','name','geometry','url'] });
  placeAutocompleteInstance.addListener('place_changed', ()=>{
    const place = placeAutocompleteInstance.getPlace();
    if(!place || !place.geometry || !place.geometry.location) return;
    tempPlaceId = place.place_id || null;
    tempPlaceLatLng = { lat: place.geometry.location.lat(), lng: place.geometry.location.lng() };
    const nameInput = document.getElementById('item-name-input');
    if(nameInput && place.name) nameInput.value = place.name;
    const mapsInput = document.getElementById('item-maps-input');
    if(mapsInput && !mapsInput.value.trim() && place.url) mapsInput.value = place.url;
  });
}
function dayNumberFor(trip, item){
  if(!item.dateStart || !trip.startDate) return null;
  return daysBetween(trip.startDate, item.dateStart);
}
function makeDayPinEl(glyph, color){
  const el = document.createElement('div');
  el.className = 'map-pin';
  el.style.background = color;
  el.innerHTML = `<span>${glyph||''}</span>`;
  return el;
}
function makeStarPinEl(glyph){
  const el = document.createElement('div');
  el.className = 'map-star';
  el.innerHTML = glyph || '★';
  return el;
}
function makeMyLocationEl(){
  const el = document.createElement('div');
  el.className = 'map-mydot';
  return el;
}
// A Google Maps custom control — added to map.controls[] below so Maps positions it
// alongside its own zoom/street-view controls, instead of an absolutely-positioned
// element layered on top and fighting the map's internal DOM on re-render.
function makeLocateControlButton(map, googleMaps){
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'map-locate-btn';
  btn.title = 'Show my location on the map';
  btn.setAttribute('aria-label', 'Show my location on the map');
  btn.innerHTML = '🎯';
  btn.addEventListener('click', ()=> locateMeOnTripMap(map, googleMaps, btn));
  return btn;
}
// Drops/moves a single "you are here" dot at the current device location and centers the
// map there — reuses the same Geolocation flow as Nearby/Nearest Toilet (one permission
// prompt, no API key, no cost). Only one dot is ever shown at a time; pressing the button
// again just moves it to the freshly-read position.
async function locateMeOnTripMap(map, googleMaps, btnEl){
  if(btnEl){ btnEl.disabled = true; btnEl.innerHTML = '…'; }
  try{
    const pos = await getCurrentPosition();
    if(myLocationMarker) myLocationMarker.map = null;
    const el = makeMyLocationEl();
    myLocationMarker = new googleMaps.marker.AdvancedMarkerElement({
      map, position: pos, content: el, zIndex: 999, title: 'You are here',
    });
    map.panTo(pos);
    if(map.getZoom() < 14) map.setZoom(15);
  } catch(err){
    alert(err.message);
  } finally {
    if(btnEl){ btnEl.disabled = false; btnEl.innerHTML = '🎯'; }
  }
}
async function initTripMap(trip, dayItems, poiItems){
  poiItems = poiItems || [];
  const container = document.getElementById('trip-map');
  const statusEl = document.getElementById('trip-map-status');
  if(!container) return;
  const myToken = ++tripMapRenderToken;

  let googleMaps;
  try {
    googleMaps = await loadGoogleMaps();
  } catch(e){
    if(statusEl) statusEl.textContent = 'Could not load Google Maps.';
    return;
  }
  if(tripMapRenderToken !== myToken) return; // a newer render superseded this one — stop

  // gestureHandling:'cooperative' reproduces the old custom pinch-zoom behavior with no
  // extra code: a plain one-finger touch drag or mouse-wheel scroll moves the page (not
  // the map), while a two-finger touch drag or ctrl+scroll/trackpad pinch zooms the map.
  // mapId:'DEMO_MAP_ID' is Google's documented placeholder for using Advanced Markers
  // without needing a configured Map ID in the console.
  const map = new googleMaps.Map(container, {
    center:{ lat:20, lng:0 }, zoom:2,
    gestureHandling:'cooperative', zoomControl:false, streetViewControl:false,
    mapTypeControl:false, fullscreenControl:false, mapId:'DEMO_MAP_ID',
  });
  tripMapInstance = map;
  // This is a brand-new Map instance, so any marker from a previous render is already gone
  // along with it — drop the stale reference rather than trying to clear a dot bound to a
  // map that no longer exists.
  myLocationMarker = null;
  map.controls[googleMaps.ControlPosition.RIGHT_BOTTOM].push(makeLocateControlButton(map, googleMaps));

  const markers = [];
  // Places of Interest stars still get plotted on the map (visible if they happen to fall
  // within view), but they shouldn't be able to drag the zoom out to include a POI clear
  // across the country — the auto-zoom fits to the day's own pins only, falling back to
  // the star pins only when a day has no pins of its own to fit to (e.g. the POI page).
  const fitMarkers = [];
  function fitToMarkers(){
    const list = fitMarkers.length ? fitMarkers : markers;
    if(!list.length) return;
    if(list.length===1){ map.setCenter(list[0].position); map.setZoom(14); return; }
    const bounds = new googleMaps.LatLngBounds();
    list.forEach(m=>bounds.extend(m.position));
    map.fitBounds(bounds, 48);
  }
  function addPin(item, isStar){
    if(item.lat==null || item.lng==null) return;
    // Wrapped defensively: one bad pin (or a transient Maps API hiccup) shouldn't take
    // down every other pin on the map along with it.
    try {
    let el, extraText;
    if(isStar){
      el = makeStarPinEl(explicitIconGlyphHtml(item, 14));
      extraText = item.type ? ` · ${item.type}` : '';
    } else {
      const dayNum = dayNumberFor(trip, item);
      // A pin uses the same icon and color already set on the activity's card
      // (customizable there) — only falls back to an automatic color if none was chosen.
      // Day numbering is 0-indexed, so "Day 0" is a real, valid value here — checks below
      // use dayNum==null (not truthiness) so it isn't mistaken for "no day number".
      const color = item.cardColor || MAP_DAY_COLORS[(dayNum==null?0:dayNum) % MAP_DAY_COLORS.length];
      const glyph = iconGlyphHtml(item, 16);
      el = makeDayPinEl(glyph, color);
      extraText = dayNum!=null ? ` · Day ${dayNum}` : '';
    }
    // Plain native tooltip — no live open-now lookup here, so hovering pins never spends
    // any of the Places Details free-tier allowance (the card badges and detail popup
    // still resolve it, just not on every pin hover).
    el.title = `${item.name||'Untitled'}${(!isStar && item.timeStart)? ' · '+itemTimeLabel(item):''}${extraText}`;
    el.style.cursor = 'pointer';
    const marker = new googleMaps.marker.AdvancedMarkerElement({
      map, position:{ lat:item.lat, lng:item.lng }, content:el,
    });
    el.addEventListener('click', ()=> openItemDetailModal(trip.id, item.id));
    markers.push(marker);
    if(!isStar) fitMarkers.push(marker);
    } catch(e){ console.error('addPin failed for', item && item.id, e); }
  }

  const combined = [
    ...dayItems.map(item=>({ item, star:false })),
    ...poiItems.map(item=>({ item, star:true })),
  ];
  const cached = combined.filter(e=>e.item.lat!=null && e.item.lng!=null);
  const needsGeocode = combined.filter(e=>e.item.lat==null || e.item.lng==null);
  cached.forEach(e=>addPin(e.item, e.star));
  fitToMarkers();

  if(needsGeocode.length && statusEl) statusEl.textContent = `Placing ${needsGeocode.length} more pin${needsGeocode.length===1?'':'s'}…`;

  // Geocoding runs one request/second in the background (Nominatim's usage policy) and can
  // take 10-20+ seconds for a trip with many un-cached pins. Re-fitting the map bounds after
  // every single pin (each one an animated pan/zoom) kept the map — and the whole page, since
  // it sits right behind the Add/Edit Activity modal — visibly janky for that whole stretch.
  // Only re-fit once, after the batch finishes, so the map is otherwise idle while this runs.
  let foundAny = false;
  for(const entry of needsGeocode){
    const item = entry.item;
    let coords = extractLatLngFromMapsLink(item.mapsLink);
    let placeQuery = coords ? null : extractPlaceNameFromMapsLink(item.mapsLink);
    // A shortened Google Maps share link (maps.app.goo.gl/...) has nothing readable in
    // the URL itself — resolve it to its full URL first, so we geocode the actual pinned
    // place instead of falling back to the activity's name (which, for something like a
    // "Singapore to Amsterdam" flight, isn't a real place Nominatim can look up).
    if(!coords && !placeQuery && isShortMapsLink(item.mapsLink)){
      const resolved = await resolveMapsShortLink(item.mapsLink);
      if(resolved){
        coords = extractLatLngFromMapsLink(resolved);
        if(!coords) placeQuery = extractPlaceNameFromMapsLink(resolved);
      }
    }
    if(!coords){
      const q = placeQuery || item.name;
      if(q){
        coords = await geocodePlace(q);
        await new Promise(r=>setTimeout(r,1100)); // respect Nominatim's ~1 req/sec usage policy
      }
    }
    if(tripMapRenderToken !== myToken) return; // a newer render superseded this one — stop
    if(coords){
      item.lat = coords.lat; item.lng = coords.lng;
      sb.from('activities').update({ lat: coords.lat, lng: coords.lng }).eq('id', item.id).then(()=>{});
      addPin(item, entry.star);
      foundAny = true;
    }
  }
  if(foundAny) fitToMarkers();
  if(statusEl){
    statusEl.textContent = markers.length ? '' : 'No locations to show yet — add a Google Maps link or a clear place name to your activities.';
  }
}

/* ---- Live EUR ⇄ SGD converter (Home page) ----
   Uses open.er-api.com, a free, no-API-key exchange rate service — the same kind of
   real-world market rate Google's own currency conversion reflects (frankfurter.app,
   tried first, turned out to be unreachable from this environment — "Failed to fetch"
   with no useful error detail — so this is the source that actually works here).
   Fetched once and cached (in memory + localStorage as an offline fallback), not
   re-fetched on every render. */
const CURRENCY_RATE_CACHE_KEY = 'victravels_eur_sgd_rate';
let currencyRate = null; // 1 EUR = currencyRate SGD
let currencyRateDate = null;
let currencyRateLoading = false;
let currencyRateFailed = false;
async function ensureCurrencyRate(){
  if(currencyRate!=null || currencyRateLoading || currencyRateFailed) return;
  currencyRateLoading = true;
  currencyRateFailed = false;
  try{
    const res = await fetch('https://open.er-api.com/v6/latest/EUR');
    const json = await res.json();
    if(json && json.result==='success' && json.rates && json.rates.SGD){
      currencyRate = json.rates.SGD;
      currencyRateDate = json.time_last_update_utc || null;
      try{ localStorage.setItem(CURRENCY_RATE_CACHE_KEY, JSON.stringify({ rate: currencyRate, date: currencyRateDate })); }catch(e){}
    }
  }catch(e){}
  if(currencyRate==null){
    try{
      const cached = JSON.parse(localStorage.getItem(CURRENCY_RATE_CACHE_KEY)||'null');
      if(cached && cached.rate){ currencyRate = cached.rate; currencyRateDate = cached.date; }
    }catch(e){}
  }
  if(currencyRate==null) currencyRateFailed = true;
  currencyRateLoading = false;
  const card = document.getElementById('currency-converter-card');
  if(card) card.outerHTML = renderCurrencyConverterCard();
  // Any EUR-priced costs already on screen (on views other than Home, which patches
  // its own card above) were drawn using the raw fallback before the rate arrived —
  // re-render once now that it's loaded so they show the converted SGD figure.
  if(currencyRate!=null && ui.view!=='home') render();
}
function retryCurrencyRate(){
  currencyRateFailed = false;
  const card = document.getElementById('currency-converter-card');
  if(card) card.outerHTML = renderCurrencyConverterCard();
  ensureCurrencyRate();
}
function renderCurrencyConverterCard(){
  let rateLabel;
  if(currencyRate!=null){
    rateLabel = `Live rate: 1 EUR = ${currencyRate.toFixed(4)} SGD${currencyRateDate? ' (as of '+currencyRateDate+')' : ''}`;
  } else if(currencyRateFailed){
    rateLabel = `Couldn't reach the live rate service. <button type="button" class="link-btn" onclick="retryCurrencyRate()">Try again</button>`;
  } else {
    rateLabel = 'Fetching live rate…';
  }
  return `
    <div class="card" id="currency-converter-card" style="margin-bottom:16px;">
      <div class="section-title">EUR ⇄ SGD Converter</div>
      <div class="currency-row">
        <div class="currency-field">
          <label class="field-label">EUR</label>
          <input type="number" step="0.01" inputmode="decimal" id="currency-eur-input" placeholder="0.00" oninput="convertCurrency('eur')" ${currencyRate==null?'disabled':''}>
        </div>
        <span class="currency-swap">⇄</span>
        <div class="currency-field">
          <label class="field-label">SGD</label>
          <input type="number" step="0.01" inputmode="decimal" id="currency-sgd-input" placeholder="0.00" oninput="convertCurrency('sgd')" ${currencyRate==null?'disabled':''}>
        </div>
      </div>
      <p class="muted-note" style="margin-top:8px;margin-bottom:0;">${rateLabel}</p>
    </div>`;
}
function convertCurrency(from){
  if(currencyRate==null) return;
  const eurInput = document.getElementById('currency-eur-input');
  const sgdInput = document.getElementById('currency-sgd-input');
  if(!eurInput || !sgdInput) return;
  if(from==='eur'){
    const v = parseFloat(eurInput.value);
    sgdInput.value = isNaN(v) ? '' : (v*currencyRate).toFixed(2);
  } else {
    const v = parseFloat(sgdInput.value);
    eurInput.value = isNaN(v) ? '' : (v/currencyRate).toFixed(2);
  }
}

// Spans ALL trips (unlike every other Home card, which is scoped to the trip picked in the
// dropdown) — a booking window opening for a different trip shouldn't get missed just because
// that trip isn't the one currently selected. Renders nothing at all when there's nothing to
// show, so it never sits on Home as an empty/useless card.
function renderBookingWindowsCard(){
  const t = todayStr();
  const rows = [];
  data.trips.forEach(trip=>{
    (trip.items||[]).forEach(item=>{
      if(item.isDuplicate || item.isPoi) return;
      if(item.status !== 'To Book') return;
      if(!item.bookingOpensDate) return;
      rows.push({ trip, item, isOpen: item.bookingOpensDate <= t });
    });
  });
  if(!rows.length) return '';
  rows.sort((a,b)=>{
    if(a.isOpen !== b.isOpen) return a.isOpen ? -1 : 1;
    return a.item.bookingOpensDate.localeCompare(b.item.bookingOpensDate);
  });
  return `
    <div class="card booking-windows-card">
      <div class="section-title">🔔 Booking Windows</div>
      ${rows.map(({trip,item,isOpen})=>{
        const metaText = isOpen
          ? 'Booking is open — go book it!'
          : `Opens ${fmtDateShort(item.bookingOpensDate)} · in ${daysBetween(t,item.bookingOpensDate)} day${daysBetween(t,item.bookingOpensDate)===1?'':'s'}`;
        return `
        <div class="flight-row" onclick="ui.homeTripId='${trip.id}';ui.detailTripId='${trip.id}';ui.view='tripDetail';render();openItemDetailModal('${trip.id}','${item.id}')">
          <span class="flight-icon ${isOpen?'icon-alert':''}">${isOpen?'🔓':'🔔'}</span>
          <div style="flex:1;min-width:0;">
            <div class="flight-name">${escapeHtml(item.name||'Untitled')}</div>
            <div class="flight-meta">${escapeHtml(trip.name)} · ${metaText}</div>
          </div>
          ${isOpen? '<span class="status-badge status-ToBook">Book now</span>' : ''}
        </div>`;
      }).join('')}
    </div>`;
}
function renderCountdownCard(trip){
  const t = todayStr();
  let num='', sub='';
  if(!trip.startDate || !trip.endDate){
    num='—'; sub='No dates set for this trip yet';
  } else if(t < trip.startDate){
    const d = daysBetween(t, trip.startDate);
    num = d; sub = d===1 ? 'day to go' : 'days to go';
  } else if(t <= trip.endDate){
    const dayNum = daysBetween(trip.startDate, t);
    num = 'Day '+dayNum; sub = 'of '+tripDays(trip)+' — trip in progress';
  } else {
    const d = daysBetween(trip.endDate, t);
    num = '✓'; sub = 'Trip ended '+d+' day'+(d===1?'':'s')+' ago';
  }
  return `
    <div class="card">
      <div class="section-title">Countdown</div>
      <div class="countdown-num">${num}</div>
      <div class="countdown-sub">${sub}</div>
    </div>`;
}

function renderOverviewCard(trip){
  const countries = trip.countries||[];
  // Every listing's cost is normalized to SGD before summing — a mix of EUR- and
  // SGD-entered activities still adds up to one meaningful total.
  const totalSgd = (trip.items||[]).reduce((s,i)=>(i.isDuplicate||i.isPoi)?s:s+toSgd(i.costTotal,i.currency),0);
  return `
    <div class="card">
      <div class="section-title">Trip Overview</div>
      <div>${countries.length? countries.map(c=>`<span class="overview-chip">${escapeHtml(c)}</span>`).join('') : '<span class="muted-note">No countries added</span>'}</div>
      <div class="overview-stats">
        <div><div class="stat-num">${tripDays(trip)}</div><div class="stat-label">DAYS</div></div>
        <div><div class="stat-num">${countries.length}</div><div class="stat-label">COUNTRIES</div></div>
        <div><div class="stat-num">${(trip.items||[]).filter(i=>!i.isPoi).length}</div><div class="stat-label">ACTIVITIES</div></div>
      </div>
      ${totalSgd>0? `<div class="countdown-sub" style="margin-top:12px;">Total cost so far: <strong style="color:var(--text);">${fmtCost(totalSgd)}</strong></div>` : ''}
    </div>`;
}

function renderExpensesCard(trip){
  const filter = ui.homeExpensesFilter;
  const items = (trip.items||[]).filter(i=>!i.isDuplicate && !i.isPoi && Number(i.costTotal)>0 && (filter==='all' || i.status===filter));

    <div class="card">
      <div class="section-title">Expenses</div>
      <div class="filter-bar" style="margin-bottom:10px;">
        <button class="day-btn ${filter==='all'?'active':''}" onclick="ui.homeExpensesFilter='all';render();">All</button>
        <button class="day-btn ${filter==='Booked'?'active':''}" onclick="ui.homeExpensesFilter='Booked';render();">Booked</button>
        <button class="day-btn ${filter==='To Book'?'active':''}" onclick="ui.homeExpensesFilter='To Book';render();">To Book</button>

      </div>
      ${items.length===0 ? '<p class="muted-note">No costs logged yet.</p>' : `
        <div style="height:150px;position:relative;"><canvas id="expenses-chart"></canvas></div>
        <div class="expenses-total">${fmtCost(total)}</div>
        <div class="countdown-sub">total across ${items.length} item${items.length===1?'':'s'}</div>
      `}

}

function renderExpensesChart(){
  const canvas = document.getElementById('expenses-chart');
  if(!canvas || typeof Chart==='undefined') return;
  const trip = getTrip(ui.homeTripId);
  if(!trip) return;
  const filter = ui.homeExpensesFilter;
  const byType = {};
  (trip.items||[]).forEach(i=>{
    if(!i.isDuplicate && !i.isPoi && Number(i.costTotal)>0 && (filter==='all' || i.status===filter)) byType[i.type] = (byType[i.type]||0) + toSgd(i.costTotal,i.currency);
  });
  const labels = Object.keys(byType);
  if(expensesChart) expensesChart.destroy();
  expensesChart = new Chart(canvas, {
    type:'doughnut',
    data:{ labels, datasets:[{ data: labels.map(l=>byType[l]), backgroundColor: labels.map(l=>TYPE_COLORS[l]||'#999'), borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:11} } } }, cutout:'65%' }
  });
}

function renderTasksCard(trip){
  const manualTasks = trip.tasks||[];
  const autoTasks = (trip.items||[])
    .filter(i=>i.status==='To Book' && !i.isDuplicate && !i.isPoi)
    .sort(compareItems);
  const empty = manualTasks.length===0 && autoTasks.length===0;
  return `
    <div class="card">
      <div class="section-title">Pending Tasks</div>
      ${empty ? '<p class="muted-note">No tasks yet.</p>' : ''}
      ${autoTasks.map(item=>`
        <div class="task-row">
          <input type="checkbox" onchange="toggleAutoTask('${trip.id}','${item.id}')">
          <span class="task-text">Book: ${escapeHtml(item.name||'Untitled')}</span>
          <span class="overview-chip" style="margin:0;">auto</span>
          <button class="btn btn-ghost btn-sm" onclick="openAddItemModal('${trip.id}','${item.id}')">✏️</button>
        </div>`).join('')}
      ${manualTasks.map(task=>`
        <div class="task-row">
          <input type="checkbox" ${task.done?'checked':''} onchange="toggleTask('${trip.id}','${task.id}')">
          <span class="task-text ${task.done?'done':''}" ondblclick="editTaskPrompt('${trip.id}','${task.id}')">${escapeHtml(task.text)}</span>
          <button class="btn btn-ghost btn-sm" onclick="editTaskPrompt('${trip.id}','${task.id}')">✏️</button>
          <button class="btn btn-ghost btn-sm" onclick="deleteTask('${trip.id}','${task.id}')">🗑️</button>
        </div>`).join('')}
      <div class="task-add-row">
        <input type="text" id="new-task-input" placeholder="Add a task…" onkeydown="if(event.key==='Enter')addTask('${trip.id}')">
        <button class="btn btn-primary btn-sm" onclick="addTask('${trip.id}')">Add</button>
      </div>
    </div>`;
}
async function toggleAutoTask(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip.items.find(i=>i.id===itemId);
  const newStatus = item.status==='To Book' ? 'Booked' : 'To Book';
  const { error } = await sb.from('activities').update({ status: newStatus }).eq('id', itemId);
  if(error){ alert('Could not update status: '+error.message); return; }
  item.status = newStatus;
  render();
}

async function addTask(tripId){
  const input = document.getElementById('new-task-input');
  const text = input.value.trim();
  if(!text) return;
  const { data: row, error } = await sb.from('tasks').insert({ trip_id: tripId, text }).select().single();
  if(error){ alert('Could not add task: '+error.message); return; }
  const trip = getTrip(tripId);
  trip.tasks = trip.tasks||[];
  trip.tasks.push({ id: row.id, text: row.text, done: row.done });
  render();
}
async function toggleTask(tripId, taskId){
  const trip = getTrip(tripId);
  const task = trip.tasks.find(t=>t.id===taskId);
  const newDone = !task.done;
  const { error } = await sb.from('tasks').update({ done: newDone }).eq('id', taskId);
  if(error){ alert('Could not update task: '+error.message); return; }
  task.done = newDone;
  render();
}
async function editTaskPrompt(tripId, taskId){
  const trip = getTrip(tripId);
  const task = trip.tasks.find(t=>t.id===taskId);
  const val = prompt('Edit task', task.text);
  if(val===null || !val.trim()) return;
  const { error } = await sb.from('tasks').update({ text: val.trim() }).eq('id', taskId);
  if(error){ alert('Could not update task: '+error.message); return; }
  task.text = val.trim();
  render();
}
async function deleteTask(tripId, taskId){
  const { error } = await sb.from('tasks').delete().eq('id', taskId);
  if(error){ alert('Could not delete task: '+error.message); return; }
  const trip = getTrip(tripId);
  trip.tasks = trip.tasks.filter(t=>t.id!==taskId);
  render();
}

function renderTripCard(trip){

  return `
    <div class="card trip-card" onclick="openTripDetail('${trip.id}')">

      <div>${(trip.countries||[]).slice(0,4).map(c=>`<span class="overview-chip">${escapeHtml(c)}</span>`).join('')}</div>
      <div class="trip-card-footer">
        <span>${(trip.items||[]).filter(i=>!i.isPoi).length} activities</span>
        <span>${fmtCost(total)}</span>

    </div>`;
}

function openTripDetail(tripId){

let tempCountries = [];
function openAddTripModal(editId){

  const html = `
    <div class="modal-header">
      <h3>${trip? 'Edit Trip' : 'Add Trip'}</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="field">
      <label class="field-label">Trip Name</label>
      <input type="text" id="trip-name-input" value="${trip?escapeHtml(trip.name):''}" placeholder="e.g. Japan Spring Trip">
    </div>
    <div class="field">
      <label class="field-label">Countries</label>
      <div class="chip-input-row">
        <input type="text" id="country-input" placeholder="Type a country, then Add" onkeydown="if(event.key==='Enter'){event.preventDefault();addCountryChip();}">
        <button type="button" class="btn btn-sm" onclick="addCountryChip()">Add</button>
      </div>
      <div class="chip-list" id="country-chip-list"></div>
    </div>
    <div class="field-row">
      <div class="field">
        <label class="field-label">Start Date</label>
        <input type="date" id="trip-start-input" value="${trip?trip.startDate||'':''}">
      </div>
      <div class="field">
        <label class="field-label">End Date</label>
        <input type="date" id="trip-end-input" value="${trip?trip.endDate||'':''}">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label class="field-label">Number of Pax</label>
        <input type="number" min="1" step="1" id="trip-pax-input" value="${trip&&trip.pax?trip.pax:1}">
      </div>
      <div class="field">
        <label class="field-label">Budget (optional)</label>
        <input type="number" min="0" step="0.01" id="trip-budget-input" value="${trip&&trip.budget?trip.budget:''}" placeholder="e.g. 3000">
