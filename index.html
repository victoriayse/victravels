function hexToRgba(hex, alpha){
  if(!hex) return null;
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g=parseInt(h.substring(2,4),16), b=parseInt(h.substring(4,6),16);
  if([r,g,b].some(isNaN)) return null;
  return `rgba(${r},${g},${b},${alpha})`;
}
// The notes editor only ever writes plain text plus <b>/<i>/<u> markup (no links, since
// there's no link button in its toolbar), so a plain regex swap for bare URLs is safe —
// there's nothing already anchor-tagged to accidentally double-wrap.
function linkifyNotes(html){
  if(!html) return html;
  return html.replace(/(https?:\/\/[^\s<]+)/g, url=>{
    const trailingMatch = url.match(/[.,;:!?)\]]+$/);
    const trailing = trailingMatch ? trailingMatch[0] : '';
    const clean = trailing ? url.slice(0, -trailing.length) : url;
    if(!clean) return url;
    return `<a href="${clean}" target="_blank" rel="noopener">${clean}</a>${trailing}`;
  });
}
/* ---- Map pin geocoding ---- */
function extractLatLngFromMapsLink(url){
  if(!url) return null;
  let m = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  m = url.match(/[?&](?:q|query)=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m) return { lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  return null;
}
function extractPlaceNameFromMapsLink(url){
  if(!url) return null;
  let m = url.match(/\/maps\/place\/([^\/@]+)/);
  if(m) return decodeURIComponent(m[1].replace(/\+/g,' '));
  m = url.match(/[?&](?:q|query)=([^&]+)/);
  if(m && !/^-?\d+\.\d+,-?\d+\.\d+$/.test(m[1])) return decodeURIComponent(m[1].replace(/\+/g,' '));
  return null;
}
// Google Maps "share" links (from the Share button on the app) come back shortened,
// e.g. https://maps.app.goo.gl/xxxx — these carry no lat/lng or place name in the URL
// itself, so extractLatLngFromMapsLink/extractPlaceNameFromMapsLink can't read anything
// from them until they're followed to their real, expanded maps.google.com URL.
function isShortMapsLink(url){
  if(!url) return false;
  return /^https?:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps)\//i.test(url.trim());
}
// A browser can't follow this redirect itself — a cross-origin fetch() to goo.gl is
// blocked by CORS (Google doesn't send Access-Control-Allow-Origin on the redirect
// chain) — so this asks a small Supabase Edge Function to follow it server-side instead.
async function resolveMapsShortLink(url){
  try{
    const { data, error } = await sb.functions.invoke('resolve-maps-link', { body: { url } });
    if(error || !data || !data.finalUrl) return null;
    return data.finalUrl;
  }catch(e){ return null; }
}
// Convenience for the Add/Edit Activity form: pasting a Maps link fills in the Name (and a
// best-guess Type) so a place doesn't need to be typed out by hand while standing in front
// of it. Only ever fills fields the user hasn't already touched — never overwrites.
async function autofillFromMapsLink(url){
  url = (url||'').trim();
  if(!url) return;
  const nameInput = document.getElementById('item-name-input');
  if(!nameInput || nameInput.value.trim()) return;
  let placeName = extractPlaceNameFromMapsLink(url);
  if(!placeName && isShortMapsLink(url)){
    const resolved = await resolveMapsShortLink(url);
    if(resolved) placeName = extractPlaceNameFromMapsLink(resolved);
  }
  if(!placeName) return;
  // The maps link field may have changed (or the modal closed) while the short-link
  // resolve above was in flight — re-check right before writing.
  const nameInputNow = document.getElementById('item-name-input');
  if(!nameInputNow || nameInputNow.value.trim()) return;
  nameInputNow.value = placeName;
  const typeInput = document.getElementById('item-type-input');
  if(typeInput && !typeInput.dataset.userChanged){
    const guessed = guessTypeFromPlaceName(placeName);
    if(guessed){ typeInput.value = guessed; syncChipActive('item-type-input','item-type-chips'); }
  }
}
// Add/Edit Activity form: typing a lead time (days before the visit) computes and fills in
// the Booking Opens date from the activity's own Date field, so a reservation that's known to
// open "3 weeks before" doesn't need the exact date worked out by hand. The field stays a
// normal, directly-editable date input either way — this is just a convenience calculator.
function autofillBookingOpensFromLead(){
  const leadEl = document.getElementById('item-bookinglead-input');
  const opensEl = document.getElementById('item-bookingopens-input');
  const dateStartEl = document.getElementById('item-date-start-input');
  if(!leadEl || !opensEl || !dateStartEl) return;
  const lead = parseInt(leadEl.value, 10);
  const dateStart = dateStartEl.value;
  if(!lead || lead<=0 || !dateStart) return;
  opensEl.value = addDays(dateStart, -lead);
}
function guessTypeFromPlaceName(name){
  const s = name.toLowerCase();
  if(/hotel|hostel|airbnb|\binn\b|resort|apartment|guesthouse|stay/.test(s)) return 'Stays';
  if(/restaurant|caf[eé]|bistro|\bbar\b|noodle|kitchen|eatery|diner/.test(s)) return 'Food';
  if(/airport|station|railway|\btrain\b/.test(s)) return 'Transport';
  if(/supermarket|grocery|groceries|\balbert heijn\b|\bjumbo\b|\blidl\b|\baldi\b/.test(s)) return 'Supermarket';
  if(/mall|market|shop|store|boutique/.test(s)) return 'Shopping';
  return null;
}
async function geocodePlace(query){
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
    const arr = await res.json();
    if(arr && arr[0]) return { lat: parseFloat(arr[0].lat), lng: parseFloat(arr[0].lon) };
  }catch(e){}
  return null;
}

/* ============ LOCATION: "Nearby" + "Nearest Toilet" ============
   Both features are free — no API key, no billing. "Nearby" reuses lat/lng the app has
   already geocoded for each activity; "Nearest Toilet" queries OpenStreetMap's free,
   crowdsourced amenity=toilets tag via the public Overpass API. Both use the browser's
   built-in Geolocation API for "where am I", which also costs nothing and needs no key —
   just a one-time permission prompt (requires HTTPS, which GitHub Pages already is). */
function getCurrentPosition(){
  if(testMode && testMode.loc) return Promise.resolve({ lat: testMode.loc.lat, lng: testMode.loc.lng });
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation){ reject(new Error('Geolocation is not supported on this device/browser.')); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      err => {
        let msg = 'Could not get your location.';
        if(err.code===1) msg = 'Location permission was denied. Allow location access in your browser settings to use this.';
        else if(err.code===2) msg = 'Your location is currently unavailable.';
        else if(err.code===3) msg = 'Getting your location took too long. Please try again.';
        reject(new Error(msg));
      },
      { enableHighAccuracy:true, timeout:12000, maximumAge:60000 }
    );
  });
}
// Great-circle distance between two lat/lng points, in meters (haversine formula).
function haversineMeters(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const toRad = d => d * Math.PI/180;
  const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function formatDistance(meters){
  if(meters < 1000) return Math.round(meters) + ' m';
  return (meters/1000).toFixed(1) + ' km';
}
function formatRouteDuration(seconds){
  const mins = Math.round(seconds/60);
  if(mins < 1) return '<1 min';
  if(mins < 60) return mins + ' min';
  const h = Math.floor(mins/60), m = mins % 60;
  return h + 'h' + (m ? ' '+m+'m' : '');
}
// Google's Routes API — used only for the two allowed modes (walking, public transit; no
// driving). Costs nothing at this app's scale: Routes: Compute Routes Essentials gives
// 10,000 free calls/month, and a couple of people's daily itinerary has nowhere near that.
async function computeRouteLeg(originLat, originLng, destLat, destLng, mode){
  try {
    const res = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
        'X-Goog-FieldMask': 'routes.duration,routes.distanceMeters',
      },
      body: JSON.stringify({
        origin: { location: { latLng: { latitude: originLat, longitude: originLng } } },
        destination: { location: { latLng: { latitude: destLat, longitude: destLng } } },
        travelMode: mode, // 'WALK' or 'TRANSIT'
      }),
    });
    if(!res.ok) return null;
    const data = await res.json();
    const route = data.routes && data.routes[0];
    if(!route) return null;
    return { seconds: parseInt(route.duration, 10) || 0, meters: route.distanceMeters || 0 };
  } catch(e){
    return null;
  }
}
// A plain Google Maps URL (no API key required — this is just a link, not an API call) that
// opens turn-by-turn directions in the Google Maps app on mobile, or maps.google.com on
// desktop, from wherever the user currently is to the given point.
function googleMapsDirectionsUrl(lat, lng){
  return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`;
}
// Same free Google Maps link scheme, but between two known points (an activity-to-activity
// hop) rather than from the user's current GPS position — no API key needed, just a link.
function googleMapsDirectionsUrlBetween(fromLat, fromLng, toLat, toLng, mode){
  return `https://www.google.com/maps/dir/?api=1&origin=${fromLat},${fromLng}&destination=${toLat},${toLng}&travelmode=${mode}`;
}
// Tapping a distance badge between two cards offers both allowed navigation methods —
// walking or public transit — each opening real turn-by-turn directions in Google Maps.
function showNavMethodsPopover(e, fromLat, fromLng, toLat, toLng){
  e.stopPropagation();
  const badge = e.currentTarget;
  const existing = badge.querySelector('.popover');
  closePopovers();
  if(existing) return;
  const pop = document.createElement('div');
  pop.className = 'popover';
  pop.innerHTML = `
    <button onclick="event.stopPropagation();showNavRoute(${fromLat},${fromLng},${toLat},${toLng},'walking');">🚶 Walking directions</button>
    <button onclick="event.stopPropagation();showNavRoute(${fromLat},${fromLng},${toLat},${toLng},'transit');">🚆 Transit directions</button>
  `;
  pop.addEventListener('click', e2=>e2.stopPropagation());
  badge.appendChild(pop);
}
function isMobileDevice(){
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}
// Same Routes API call the badges use, but also requesting the route's encoded polyline
// so it can actually be drawn on the overlay map (the badge-only version skips this field
// to keep those calls a little lighter).
async function computeRouteWithPolyline(originLat, originLng, destLat, destLng, mode){
  try {
    const res = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
        'X-Goog-FieldMask': 'routes.duration,routes.distanceMeters,routes.polyline.encodedPolyline',
      },
      body: JSON.stringify({
        origin: { location: { latLng: { latitude: originLat, longitude: originLng } } },
        destination: { location: { latLng: { latitude: destLat, longitude: destLng } } },
        travelMode: mode,
      }),
    });
    if(!res.ok) return null;
    const data = await res.json();
    const route = data.routes && data.routes[0];
    if(!route) return null;
    return {
      seconds: parseInt(route.duration, 10) || 0,
      meters: route.distanceMeters || 0,
      encodedPolyline: route.polyline && route.polyline.encodedPolyline,
    };
  } catch(e){
    return null;
  }
}
// On a phone/tablet, jump straight into the native Google Maps app (location.href on the
// same universal link Google Maps already understands is what reliably triggers the app,
// where window.open tends to just open a browser tab instead). On desktop, where there's
// no Maps app to hand off to, show the route as an on-screen overlay instead of leaving
// the page.
async function showNavRoute(fromLat, fromLng, toLat, toLng, mode){
  closePopovers();
  const gmapsUrl = googleMapsDirectionsUrlBetween(fromLat, fromLng, toLat, toLng, mode);
  if(isMobileDevice()){
    window.location.href = gmapsUrl;
    return;
  }
  const modeLabel = mode==='transit' ? '🚆 Transit' : '🚶 Walking';
  openModal(`
    <div class="modal-header"><h3>${modeLabel} directions</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div id="route-overlay-map" style="height:340px;border-radius:12px;overflow:hidden;background:var(--bg-soft);"></div>
    <div class="muted-note" id="route-overlay-status" style="margin-top:10px;">Loading route…</div>
    <div class="modal-footer">
      <a class="btn" href="${gmapsUrl}" target="_blank" rel="noopener">Open in Google Maps ↗</a>
      <button class="btn btn-primary" onclick="closeModal()">Close</button>
    </div>
  `, true);

  const leg = await computeRouteWithPolyline(fromLat, fromLng, toLat, toLng, mode==='transit' ? 'TRANSIT' : 'WALK');
  const mapEl = document.getElementById('route-overlay-map');
  if(!mapEl) return; // modal was closed before this resolved
  const statusEl = document.getElementById('route-overlay-status');
  if(!leg){
    if(statusEl) statusEl.textContent = 'Could not load this route — try "Open in Google Maps" instead.';
    return;
  }
  if(statusEl) statusEl.textContent = `${formatRouteDuration(leg.seconds)} · ${formatDistance(leg.meters)}`;

  let googleMaps;
  try { googleMaps = await loadGoogleMaps(); } catch(e){ return; }
  if(document.getElementById('route-overlay-map') !== mapEl) return; // modal changed underneath us

  const map = new googleMaps.Map(mapEl, {
    gestureHandling:'greedy', zoomControl:true, streetViewControl:false,
    mapTypeControl:false, fullscreenControl:false, mapId:'DEMO_MAP_ID',
  });
  const bounds = new googleMaps.LatLngBounds();
  new googleMaps.marker.AdvancedMarkerElement({ map, position:{ lat:fromLat, lng:fromLng } });
  new googleMaps.marker.AdvancedMarkerElement({ map, position:{ lat:toLat, lng:toLng } });
  bounds.extend({ lat:fromLat, lng:fromLng });
  bounds.extend({ lat:toLat, lng:toLng });
  if(leg.encodedPolyline && googleMaps.geometry){
    const path = googleMaps.geometry.encoding.decodePath(leg.encodedPolyline);
    new googleMaps.Polyline({ path, map, strokeColor:'#2f6f5e', strokeWeight:4, strokeOpacity:0.9 });
    path.forEach(p=>bounds.extend(p));
  }
  map.fitBounds(bounds, 40);
}

/* ---- Places API (New): autocomplete, "open now" badge, auto-pulled photo ----
   Text Search "IDs only" (field mask: places.id) is unlimited/free, so it's safe to call
   speculatively for any legacy activity missing a cached place_id. Place Details is on the
   Enterprise tier (1,000 free calls/month) — kept to the item detail modal only (not every
   compact list card) to stay comfortably within that smaller cap, and combined into one call
   covering both the open-now badge and the photo to minimize usage further. */
function streetViewUrl(lat, lng, w, h){
  return `https://maps.googleapis.com/maps/api/streetview?size=${w||640}x${h||300}&location=${lat},${lng}&key=${GOOGLE_MAPS_API_KEY}`;
}
function placesPhotoUrl(photoName, maxWidthPx){
  return `https://places.googleapis.com/v1/${photoName}/media?maxWidthPx=${maxWidthPx||480}&key=${GOOGLE_MAPS_API_KEY}`;
}
async function resolvePlaceId(item){
  if(item.placeId) return item.placeId;
  if(item.lat==null || item.lng==null || !item.name) return null;
  try{
    const res = await fetch('https://places.googleapis.com/v1/places:searchText', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
        'X-Goog-FieldMask': 'places.id',
      },
      body: JSON.stringify({
        textQuery: item.name,
        locationBias: { circle: { center: { latitude: item.lat, longitude: item.lng }, radius: 200 } },
      }),
    });
    if(!res.ok) return null;
    const data = await res.json();
    return (data.places && data.places[0] && data.places[0].id) || null;
  } catch(e){ return null; }
}
const placeDetailsCache = {}; // placeId -> {openNow, businessStatus, photoName} | null, per page session
async function fetchPlaceDetails(placeId){
  if(Object.prototype.hasOwnProperty.call(placeDetailsCache, placeId)) return placeDetailsCache[placeId];
  try{
    const res = await fetch(`https://places.googleapis.com/v1/places/${placeId}`, {
      headers: {
        'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
        'X-Goog-FieldMask': 'currentOpeningHours.openNow,currentOpeningHours.weekdayDescriptions,businessStatus,photos',
      },
    });
    if(!res.ok){ placeDetailsCache[placeId] = null; return null; }
    const data = await res.json();
    const result = {
      openNow: data.currentOpeningHours && typeof data.currentOpeningHours.openNow === 'boolean' ? data.currentOpeningHours.openNow : null,
      businessStatus: data.businessStatus || null,
      photoName: (data.photos && data.photos[0] && data.photos[0].name) || null,
      hours: (data.currentOpeningHours && data.currentOpeningHours.weekdayDescriptions) || null,
      placeId: placeId,
    };
    placeDetailsCache[placeId] = result;
    return result;
  } catch(e){ placeDetailsCache[placeId] = null; return null; }
}
// Fills in the "open now" badge and, if the activity has no manually-uploaded photo of its
// own, an auto-pulled Places photo as a fallback gallery image — both async, after the detail
// modal is already open. myToken guards against a stale fetch landing after the modal moved on.
async function loadDetailPlaceExtras(tripId, item, myToken){
  let placeId = item.placeId;
  if(!placeId){
    placeId = await resolvePlaceId(item);
    if(detailModalRenderToken !== myToken) return;
    if(placeId){
      item.placeId = placeId;
      sb.from('activities').update({ place_id: placeId }).eq('id', item.id).then(()=>{});
    }
  }
  if(!placeId) return;
  const details = await fetchPlaceDetails(placeId);
  if(detailModalRenderToken !== myToken || !details) return;
  const badgeEl = document.getElementById('detail-openbadge');
  if(badgeEl){
    if(details.businessStatus === 'CLOSED_PERMANENTLY'){
      badgeEl.innerHTML = `<span data-place="${placeId}" class="open-now-badge closed">Permanently closed</span>`;
    } else if(details.businessStatus === 'CLOSED_TEMPORARILY'){
      badgeEl.innerHTML = `<span data-place="${placeId}" class="open-now-badge closed">Temporarily closed</span>`;
    } else if(details.openNow === true){
      badgeEl.innerHTML = `<span data-place="${placeId}" class="open-now-badge open">🟢 Open now</span>`;
    } else if(details.openNow === false){
      badgeEl.innerHTML = `<span data-place="${placeId}" class="open-now-badge closed">🔴 Closed now</span>`;
    }
  }
  // Overwrites whatever's currently in the gallery slot — including a Street View placeholder
  // shown while this was loading — with the real place photo, as long as there's no manually
  // uploaded photo of the user's own to protect.
  if(details.photoName && !(item.imagePaths && item.imagePaths.length)){
    const galleryEl = document.getElementById('detail-gallery');
    if(galleryEl){
      galleryEl.innerHTML = `<div class="detail-gallery-frame"><img src="${placesPhotoUrl(details.photoName, 640)}" class="detail-gallery-img" alt=""></div>`;
    }
  }
}
// Builds the small "open now"/"closed" markup shared by the item detail modal, the compact
// card badge, and the map pin hover tooltip, so all three stay visually and logically in sync.
function openBadgeHtml(details){
  if(!details) return '';
  if(details.businessStatus === 'CLOSED_PERMANENTLY') return `<span data-place="${details.placeId}" class="open-now-badge closed">Permanently closed</span>`;
  if(details.businessStatus === 'CLOSED_TEMPORARILY') return `<span data-place="${details.placeId}" class="open-now-badge closed">Temporarily closed</span>`;
  if(details.openNow === true) return `<span data-place="${details.placeId}" class="open-now-badge open">🟢 Open</span>`;
  if(details.openNow === false) return `<span data-place="${details.placeId}" class="open-now-badge closed">🔴 Closed</span>`;
  return '';
}
// Fills in each card's small open-now badge (day view, POI view) — same lazy resolve+cache
// path as the detail modal, so repeat visits/hovers of an already-resolved place cost nothing
// extra. Runs after the card list is in the DOM, one item at a time, same pattern as
// loadDistanceBadges.
let cardOpenBadgeRenderToken = 0;
async function loadCardOpenBadges(trip, items){
  if(!trip || !items || !items.length) return;
  const myToken = ++cardOpenBadgeRenderToken;
  for(const item of items){
    if(item.lat==null || item.lng==null) continue;
    if(!document.getElementById(`cardopenbadge-${item.id}`)) continue;
    let placeId = item.placeId;
    if(!placeId){
      placeId = await resolvePlaceId(item);
      if(cardOpenBadgeRenderToken !== myToken) return;
      if(placeId){
        item.placeId = placeId;
        sb.from('activities').update({ place_id: placeId }).eq('id', item.id).then(()=>{});
      }
    }
    if(!placeId) continue;
    const details = await fetchPlaceDetails(placeId);
    if(cardOpenBadgeRenderToken !== myToken) return;
    const el = document.getElementById(`cardopenbadge-${item.id}`);
    if(el) el.innerHTML = openBadgeHtml(details);
    // No uploaded photo on this card → swap the placeholder tile for the Google Maps photo.
    const coverEl = document.getElementById(`cardcover-${item.id}`);
    if(coverEl && details && details.photoName && !(item.imagePaths && item.imagePaths.length)){
      const img = new Image();
      img.className = 'item-cover-img';
      img.alt = '';
      // Re-resolve the tile by id on load: the card list may have re-rendered meanwhile.
      const cid = `cardcover-${item.id}`;
      img.onload = ()=>{ const c = document.getElementById(cid); if(!c) return; c.innerHTML = ''; c.style.background = 'none'; c.appendChild(img); };
      img.src = placesPhotoUrl(details.photoName, 240);
    }
  }
}

/* ---- Nearby activities ---- */
function openNearbyModal(tripId){
  openModal(`
    <div class="modal-header"><h3>📍 Nearby</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <p class="muted-note" style="margin-top:0;">Finding your location…</p>

      <p class="muted-note" style="margin-top:0;">${escapeHtml(err.message)}</p>

function renderNearbyModal(tripId, pos){
  const trip = getTrip(tripId);
  if(!trip){ closeModal(); return; }
  // Both booked itinerary items and unscheduled Places of Interest are worth surfacing here —
  // anything with a real pin, minus the auto-generated multi-day continuation duplicates
  // (which would otherwise show the same place several times).
  const candidates = (trip.items||[]).filter(i=>!i.isDuplicate && i.lat!=null && i.lng!=null);
  const withDist = candidates.map(item=>({ item, dist: haversineMeters(pos.lat, pos.lng, item.lat, item.lng) }));
  withDist.sort((a,b)=>a.dist-b.dist);
  const html = `
    <div class="modal-header"><h3>📍 Nearby</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    ${withDist.length===0 ? `<p class="muted-note" style="margin-top:0;">No pinned activities or places of interest yet — add a Google Maps link to an activity so it can be geocoded.</p>` : `
    <div class="nearby-list">
      ${withDist.map(({item,dist})=>`
        <div class="nearby-row" onclick="closeModal();openItemDetailModal('${trip.id}','${item.id}')">

async function queryNearbyToilets(pos, radiusMeters){
  const query = `[out:json][timeout:15];node["amenity"="toilets"](around:${radiusMeters},${pos.lat},${pos.lng});out body;`;
  const res = await fetch('https://overpass-api.de/api/interpreter', {
    method: 'POST',
    body: 'data=' + encodeURIComponent(query),
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
  });
  if(!res.ok) throw new Error('Overpass API returned an error');
  const json = await res.json();
  return (json.elements||[]).map(el=>({
    lat: el.lat, lng: el.lon,
    name: (el.tags && el.tags.name) || 'Public Toilet',
    fee: el.tags && el.tags.fee==='yes',
    wheelchair: el.tags && el.tags.wheelchair==='yes',
    dist: haversineMeters(pos.lat, pos.lng, el.lat, el.lon),
  })).sort((a,b)=>a.dist-b.dist).slice(0,20);
}

/* ---- "What's next" countdown strip (lives in the header, outside #app, so it's visible
   on every page without needing to open anything) ---- */
function computeCountdownInfo(){
  const now = appNow();
  const t = todayStr();
  const n = nowTime();
  // On a train/flight right now? Then show "Arriving <destination> in Xm" until it ends.
  let arriving = null;
  const yday = addDays(t, -1);
  data.trips.forEach(trip=>{
    (trip.items||[]).forEach(item=>{
      if(item.isPoi || item.status!=='Booked' || !item.timeStart || !item.timeEnd) return;
      if(item.type!=='Transport' && item.type!=='Flight') return;
      if(item.dateStart!==t && item.dateStart!==yday) return;
      const s = new Date(item.dateStart+'T'+item.timeStart+':00');
      let e = new Date(item.dateStart+'T'+item.timeEnd+':00');
      if(isNaN(s)||isNaN(e)) return;
      if(e <= s) e = new Date(e.getTime()+86400000); // arrives after midnight
      if(s <= now && now < e){
        const diffMs = e.getTime() - now.getTime();
        if(!arriving || diffMs < arriving.diffMs) arriving = { item, trip, diffMs, mode:'arriving' };
      }
    });
  });
  if(arriving) return arriving;
  let candidates = [];
  data.trips.forEach(trip=>{
    (trip.items||[]).forEach(item=>{
      // Only confirmed plans are worth an "at a glance" countdown — a "To Book" or "Nil"
      // item isn't a real commitment yet, so surfacing it here would be misleading.
      // Only things happening today — nothing on later days.
      if(item.isPoi || !item.dateStart || item.status!=='Booked' || item.dateStart!==t) return;
      candidates.push({ item, trip });
    });
  });
  // The soonest timed item today that hasn't started yet.
  let upcoming = null;
  candidates.forEach(c=>{
    if(!c.item.timeStart) return;
    const dt = new Date(c.item.dateStart+'T'+c.item.timeStart+':00');
    if(isNaN(dt.getTime())) return;
    const diffMs = dt.getTime() - now.getTime();
    if(diffMs > 0 && (!upcoming || diffMs < upcoming.diffMs)){
      upcoming = { ...c, diffMs, mode:'upcoming' };
    }
  });
  return upcoming;
}
function countdownWhenLabel(diffMs){
  const mins = Math.max(1, Math.round(diffMs/60000));
  if(mins < 60) return `in ${mins}m`;
  if(mins < 60*24) return `in ${Math.floor(mins/60)}h ${mins%60}m`;
  return `in ${Math.floor(mins/(60*24))}d`;
}
function renderCountdownStrip(){
  const el = document.getElementById('countdown-strip');
  if(!el) return;
  const info = computeCountdownInfo();
  if(!info){ el.classList.add('hidden'); el.innerHTML=''; el.onclick=null; return; }
  const { item, trip, mode, diffMs } = info;
  const whenHtml = mode==='ongoing'
    ? `<span class="countdown-strip-when">Now</span>`
    : `<span class="countdown-strip-when">${countdownWhenLabel(diffMs)}</span>`;
  let label = item.name||'Untitled';
  if(mode==='arriving'){
    // "Train from Strasbourg to Paris" -> destination "Paris"
    const m = (item.name||'').match(/(?:\bto\b|→|->)\s*([^()]+?)\s*(?:\(.*\))?$/i);
    label = m && m[1] ? `Arriving ${m[1].trim()}` : `Arriving · ${item.name||''}`;
  }
  el.classList.remove('hidden');
  el.innerHTML = `<span class="countdown-strip-pill"><span class="countdown-strip-icon">${iconGlyphHtml(item,14)}</span><span class="countdown-strip-text">${escapeHtml(label)}</span> ${whenHtml}</span>`;

}

function icsEscape(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }

function exportBookedReminders(tripId){
  const trip = getTrip(tripId);
  if(!trip) return;
  const items = (trip.items||[]).filter(i=>i.status==='Booked' && !i.isPoi && !i.isDuplicate && i.dateStart && i.timeStart);
  const skipped = (trip.items||[]).filter(i=>i.status==='Booked' && !i.isPoi && !i.isDuplicate && (!i.dateStart || !i.timeStart)).length;
  if(!items.length){ alert('No Booked items with a start time yet. Add a time to your booked items and try again.'); return; }
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//VicTravels//Reminders//EN','CALSCALE:GREGORIAN'];
  items.forEach(i=>{
    const endDate = (i.timeEnd && (!i.dateEnd || i.dateEnd===i.dateStart)) ? i.dateStart : null;
    const dtEnd = endDate && i.timeEnd > i.timeStart ? icsStamp(i.dateStart, i.timeEnd) : icsStamp(i.dateStart, i.timeStart);
    lines.push('BEGIN:VEVENT',
      `UID:${i.id}@victravels`,
      'DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),
      `DTSTART:${icsStamp(i.dateStart, i.timeStart)}`,
      `DTEND:${dtEnd}`,
      `SUMMARY:${icsEscape(i.name||'Booked')}`,
      i.mapsLink ? `URL:${i.mapsLink}` : '',
      `DESCRIPTION:${icsEscape(trip.name+' · '+i.type)}`);
    [30,15,5].forEach(m=>lines.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEscape((i.name||'Booking')+' in '+m+' min')}`,`TRIGGER:-PT${m}M`,'END:VALARM'));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.filter(Boolean).join('\r\n')], { type:'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (trip.name||'trip').replace(/[^a-z0-9]+/gi,'_') + '_reminders.ics';
  document.body.appendChild(a); a.click(); a.remove();

}

async function initTripMap(trip, dayItems, poiItems){
  poiItems = poiItems || [];
  const container = document.getElementById('trip-map');
  const statusEl = document.getElementById('trip-map-status');
  if(!container) return;
  const myToken = ++tripMapRenderToken;

  let googleMaps;
  try {
    googleMaps = await loadGoogleMaps();
  } catch(e){
    if(statusEl) statusEl.textContent = 'Could not load Google Maps.';
    return;
  }
  if(tripMapRenderToken !== myToken) return; // a newer render superseded this one — stop

  // gestureHandling:'cooperative' reproduces the old custom pinch-zoom behavior with no
  // extra code: a plain one-finger touch drag or mouse-wheel scroll moves the page (not
  // the map), while a two-finger touch drag or ctrl+scroll/trackpad pinch zooms the map.
  // mapId:'DEMO_MAP_ID' is Google's documented placeholder for using Advanced Markers
  // without needing a configured Map ID in the console.
  const map = new googleMaps.Map(container, {
    center:{ lat:20, lng:0 }, zoom:2,
    gestureHandling:'cooperative', zoomControl:false, streetViewControl:false,
    mapTypeControl:false, fullscreenControl:false, mapId:'DEMO_MAP_ID',
  });
  tripMapInstance = map;
  tripMapPins = {};
  // This is a brand-new Map instance, so any marker from a previous render is already gone
  // along with it — drop the stale reference rather than trying to clear a dot bound to a
  // map that no longer exists.
  myLocationMarker = null;
  map.controls[googleMaps.ControlPosition.RIGHT_BOTTOM].push(makeLocateControlButton(map, googleMaps));

  const markers = [];
  // Places of Interest stars still get plotted on the map (visible if they happen to fall
  // within view), but they shouldn't be able to drag the zoom out to include a POI clear
  // across the country — the auto-zoom fits to the day's own pins only, falling back to
  // the star pins only when a day has no pins of its own to fit to (e.g. the POI page).
  const fitMarkers = [];
  function fitToMarkers(){
    const list = fitMarkers.length ? fitMarkers : markers;
    if(!list.length) return;
    if(list.length===1){ map.setCenter(list[0].position); map.setZoom(14); return; }
    const bounds = new googleMaps.LatLngBounds();
    list.forEach(m=>bounds.extend(m.position));
    map.fitBounds(bounds, 48);
  }
  function addPin(item, isStar){
    if(item.lat==null || item.lng==null) return;
    // Wrapped defensively: one bad pin (or a transient Maps API hiccup) shouldn't take
    // down every other pin on the map along with it.
    try {
    let el, extraText;
    const ex = getItemExtras(trip, item);
    if(isStar){
      el = makeStarPinEl(ex.done ? '✓' : explicitIconGlyphHtml(item, 14));
      const sc = ex.done ? PIN_DONE_COLOR : ex.pin;
      if(sc){ el.style.background = sc; el.style.borderColor = sc; el.style.color = isLightColor(sc) ? '#333' : '#fff'; }
      extraText = item.type ? ` · ${item.type}` : '';
    } else {
      const dayNum = dayNumberFor(trip, item);
      // A pin uses the same icon and color already set on the activity's card
      // (customizable there) — only falls back to an automatic color if none was chosen.
      // Day numbering is 0-indexed, so "Day 0" is a real, valid value here — checks below
      // use dayNum==null (not truthiness) so it isn't mistaken for "no day number".
      // Pins are white by default; a completed place turns green with a check, and a color
      // picked in the place's details window overrides the default.
      const color = ex.done ? PIN_DONE_COLOR : (ex.pin || '#ffffff');
      const glyph = ex.done ? '✓' : iconGlyphHtml(item, 16);
      el = makeDayPinEl(glyph, color);
      extraText = dayNum!=null ? ` · Day ${dayNum}` : '';
    }
    // Plain native tooltip — no live open-now lookup here, so hovering pins never spends
    // any of the Places Details free-tier allowance (the card badges and detail popup
    // still resolve it, just not on every pin hover).
    el.title = `${item.name||'Untitled'}${(!isStar && item.timeStart)? ' · '+itemTimeLabel(item):''}${extraText}`;
    el.style.cursor = 'pointer';

      map, position:{ lat:item.lat, lng:item.lng }, content:el,
    });
    el.addEventListener('click', ()=> openItemDetailModal(trip.id, item.id));
    tripMapPins[item.id] = { el, marker };
    markers.push(marker);
    if(!isStar) fitMarkers.push(marker);
    } catch(e){ console.error('addPin failed for', item && item.id, e); }
  }

  const combined = [
    ...dayItems.map(item=>({ item, star:false })),
    ...poiItems.map(item=>({ item, star:true })),
  ];
  const cached = combined.filter(e=>e.item.lat!=null && e.item.lng!=null);
  const needsGeocode = combined.filter(e=>e.item.lat==null || e.item.lng==null);
  cached.forEach(e=>addPin(e.item, e.star));
  fitToMarkers();

  if(needsGeocode.length && statusEl) statusEl.textContent = `Placing ${needsGeocode.length} more pin${needsGeocode.length===1?'':'s'}…`;

  // Geocoding runs one request/second in the background (Nominatim's usage policy) and can
  // take 10-20+ seconds for a trip with many un-cached pins. Re-fitting the map bounds after
  // every single pin (each one an animated pan/zoom) kept the map — and the whole page, since
  // it sits right behind the Add/Edit Activity modal — visibly janky for that whole stretch.
  // Only re-fit once, after the batch finishes, so the map is otherwise idle while this runs.
  let foundAny = false;

    const item = entry.item;

    let placeQuery = coords ? null : extractPlaceNameFromMapsLink(item.mapsLink);
    // A shortened Google Maps share link (maps.app.goo.gl/...) has nothing readable in
    // the URL itself — resolve it to its full URL first, so we geocode the actual pinned

    // "Singapore to Amsterdam" flight, isn't a real place Nominatim can look up).
    if(!coords && !placeQuery && isShortMapsLink(item.mapsLink)){

    // are two separate fields now, and a lot of activity names ("Taxi to Airport", "Checkout",
    // "Buy souvenirs") aren't real places at all — geocoding them against Nominatim can match
    // some unrelated business anywhere in the world and silently pin a wrong, far-away location.
    // Only geocode from something that actually came from a maps link/place search.
    if(!coords && placeQuery){
      coords = await geocodePlace(placeQuery);
      await new Promise(r=>setTimeout(r,1100)); // respect Nominatim's ~1 req/sec usage policy
    }

      sb.from('activities').update({ lat: coords.lat, lng: coords.lng }).eq('id', item.id).then(()=>{});
      addPin(item, entry.star);
      foundAny = true;
    }
  }
  if(foundAny) fitToMarkers();
  if(statusEl){
    statusEl.textContent = markers.length ? '' : 'No locations to show yet — add a Google Maps link or search the Location field on your activities.';
  }
}

          <label class="field-label">SGD</label>
          <input type="number" step="0.01" inputmode="decimal" id="currency-sgd-input" placeholder="0.00" oninput="convertCurrency('sgd')" ${currencyRate==null?'disabled':''}>
        </div>
      </div>
      <p class="muted-note" style="margin-top:8px;margin-bottom:0;">${rateLabel}</p>
    </div>`;
}
function convertCurrency(from){
  if(currencyRate==null) return;
  const eurInput = document.getElementById('currency-eur-input');
  const sgdInput = document.getElementById('currency-sgd-input');
  if(!eurInput || !sgdInput) return;
  if(from==='eur'){
    const v = parseFloat(eurInput.value);
    sgdInput.value = isNaN(v) ? '' : (v*currencyRate).toFixed(2);
  } else {
    const v = parseFloat(sgdInput.value);
    eurInput.value = isNaN(v) ? '' : (v/currencyRate).toFixed(2);
  }
}

// Spans ALL trips (unlike every other Home card, which is scoped to the trip picked in the
// dropdown) — a booking window opening for a different trip shouldn't get missed just because
// that trip isn't the one currently selected. Renders nothing at all when there's nothing to
// show, so it never sits on Home as an empty/useless card.
function renderBookingWindowsCard(){
  const t = todayStr();
  const rows = [];
  data.trips.forEach(trip=>{
    (trip.items||[]).forEach(item=>{
      if(item.isDuplicate || item.isPoi) return;
      if(item.status !== 'To Book') return;
      if(!item.bookingOpensDate) return;
      rows.push({ trip, item, isOpen: item.bookingOpensDate <= t });
    });
  });
  if(!rows.length) return '';
  rows.sort((a,b)=>{
    if(a.isOpen !== b.isOpen) return a.isOpen ? -1 : 1;
    return a.item.bookingOpensDate.localeCompare(b.item.bookingOpensDate);
  });
  return `
    <div class="card booking-windows-card">
      <div class="section-title">🔔 Booking Windows</div>
      ${rows.map(({trip,item,isOpen})=>{
        const metaText = isOpen
          ? 'Booking is open — go book it!'
          : `Opens ${fmtDateShort(item.bookingOpensDate)} · in ${daysBetween(t,item.bookingOpensDate)} day${daysBetween(t,item.bookingOpensDate)===1?'':'s'}`;
        return `
        <div class="flight-row" onclick="ui.homeTripId='${trip.id}';ui.detailTripId='${trip.id}';ui.view='tripDetail';render();openItemDetailModal('${trip.id}','${item.id}')">
          <span class="flight-icon ${isOpen?'icon-alert':''}">${isOpen?'🔓':'🔔'}</span>
          <div style="flex:1;min-width:0;">
            <div class="flight-name">${escapeHtml(item.name||'Untitled')}</div>
            <div class="flight-meta">${escapeHtml(trip.name)} · ${metaText}</div>
          </div>
          ${isOpen? '<span class="status-badge status-ToBook">Book now</span>' : ''}
        </div>`;
      }).join('')}
    </div>`;
}
function renderCountdownCard(trip){
  const t = todayStr();
  let num='', sub='';
  if(!trip.startDate || !trip.endDate){
    num='—'; sub='No dates set for this trip yet';
  } else if(t < trip.startDate){
    const d = daysBetween(t, trip.startDate);
    num = d; sub = d===1 ? 'day to go' : 'days to go';
  } else if(t <= trip.endDate){
    const dayNum = daysBetween(trip.startDate, t);
    num = 'Day '+dayNum; sub = 'of '+tripDays(trip)+' — trip in progress';
  } else {
    const d = daysBetween(trip.endDate, t);
    num = '✓'; sub = 'Trip ended '+d+' day'+(d===1?'':'s')+' ago';
  }
  return `
    <div class="card">
      <div class="section-title">Countdown</div>
      <div class="countdown-num">${num}</div>
      <div class="countdown-sub">${sub}</div>
    </div>`;
}

function renderOverviewCard(trip){
  const countries = trip.countries||[];
  // Every listing's cost is normalized to SGD before summing — a mix of EUR- and
  // SGD-entered activities still adds up to one meaningful total.
  const totalSgd = (trip.items||[]).reduce((s,i)=>(i.isDuplicate||i.isPoi)?s:s+toSgd(i.costTotal,i.currency),0);
  return `
    <div class="card">
      <div class="section-title">Trip Overview</div>
      <div>${countries.length? countries.map(c=>`<span class="overview-chip">${escapeHtml(c)}</span>`).join('') : '<span class="muted-note">No countries added</span>'}</div>
      <div class="overview-stats">
        <div><div class="stat-num">${tripDays(trip)}</div><div class="stat-label">DAYS</div></div>
        <div><div class="stat-num">${countries.length}</div><div class="stat-label">COUNTRIES</div></div>
        <div><div class="stat-num">${(trip.items||[]).filter(i=>!i.isPoi).length}</div><div class="stat-label">ACTIVITIES</div></div>
      </div>
      ${totalSgd>0? `<div class="countdown-sub" style="margin-top:12px;">Total cost so far: <strong style="color:var(--text);">${fmtCost(totalSgd)}</strong></div>` : ''}
    </div>`;
}

function renderExpensesChart(){
  const canvas = document.getElementById('expenses-chart');
  if(!canvas || typeof Chart==='undefined') return;
  const trip = getTrip(ui.homeTripId);

  const filter = ui.homeExpensesFilter;
  const byType = {};
  (trip.items||[]).forEach(i=>{
    if(!i.isDuplicate && !i.isPoi && Number(i.costTotal)>0 && (filter==='all' || i.status===filter)) byType[i.type] = (byType[i.type]||0) + toSgd(i.costTotal,i.currency);
  });
  const labels = Object.keys(byType);
  if(expensesChart) expensesChart.destroy();
  expensesChart = new Chart(canvas, {
    type:'doughnut',
    data:{ labels, datasets:[{ data: labels.map(l=>byType[l]), backgroundColor: labels.map(l=>TYPE_COLORS[l]||'#999'), borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:11} } } }, cutout:'65%' }
  });
}

function renderTasksCard(trip){
  const manualTasks = trip.tasks||[];
  const autoTasks = (trip.items||[])
    .filter(i=>i.status==='To Book' && !i.isDuplicate && !i.isPoi)
    .sort(compareItems);
  const empty = manualTasks.length===0 && autoTasks.length===0;
  // Per-pax total across the still-to-book items — each converted to SGD first, so a mix of
  // EUR- and SGD-priced bookings still adds up to one figure. Uses each item's own per-pax
  // cost when set, falling back to its total split across the trip's pax count otherwise.
  const autoTasksTotalPerPax = autoTasks.reduce((s,item)=>{
    const perPax = Number(item.costPerPax)>0
      ? toSgd(item.costPerPax, item.currency)
      : toSgd(item.costTotal, item.currency) / (trip.pax||1);
    return s + perPax;
  }, 0);
  return `
    <div class="card">
      <div class="section-title">Pending Tasks</div>
      ${autoTasksTotalPerPax>0 ? `<div class="countdown-sub" style="margin-bottom:10px;">To book total: <strong style="color:var(--text);">${fmtCost(autoTasksTotalPerPax)}</strong> / pax</div>` : ''}
      ${empty ? '<p class="muted-note">No tasks yet.</p>' : ''}
      ${autoTasks.map(item=>`
        <div class="task-row">
          <input type="checkbox" onchange="toggleAutoTask('${trip.id}','${item.id}')">
          <span class="task-text">Book: ${escapeHtml(item.name||'Untitled')}</span>
          <span class="overview-chip" style="margin:0;">auto</span>
          <button class="btn btn-ghost btn-sm" onclick="openAddItemModal('${trip.id}','${item.id}')">✏️</button>
        </div>`).join('')}
      ${manualTasks.map(task=>`
        <div class="task-row">
          <input type="checkbox" ${task.done?'checked':''} onchange="toggleTask('${trip.id}','${task.id}')">
          <span class="task-text ${task.done?'done':''}" ondblclick="editTaskPrompt('${trip.id}','${task.id}')">${escapeHtml(task.text)}</span>
          <button class="btn btn-ghost btn-sm" onclick="editTaskPrompt('${trip.id}','${task.id}')">✏️</button>
          <button class="btn btn-ghost btn-sm" onclick="deleteTask('${trip.id}','${task.id}')">🗑️</button>
        </div>`).join('')}
      <div class="task-add-row">
        <input type="text" id="new-task-input" placeholder="Add a task…" onkeydown="if(event.key==='Enter')addTask('${trip.id}')">
        <button class="btn btn-primary btn-sm" onclick="addTask('${trip.id}')">Add</button>
      </div>
    </div>`;
}
async function toggleAutoTask(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip.items.find(i=>i.id===itemId);
  const newStatus = item.status==='To Book' ? 'Booked' : 'To Book';
  const { error } = await sb.from('activities').update({ status: newStatus }).eq('id', itemId);
  if(error){ alert('Could not update status: '+error.message); return; }
  item.status = newStatus;
  render();
}

async function addTask(tripId){
  const input = document.getElementById('new-task-input');
  const text = input.value.trim();
  if(!text) return;
  const { data: row, error } = await sb.from('tasks').insert({ trip_id: tripId, text }).select().single();
  if(error){ alert('Could not add task: '+error.message); return; }
  const trip = getTrip(tripId);
  trip.tasks = trip.tasks||[];
  trip.tasks.push({ id: row.id, text: row.text, done: row.done });
  render();
}
async function toggleTask(tripId, taskId){
  const trip = getTrip(tripId);
  const task = trip.tasks.find(t=>t.id===taskId);
  const newDone = !task.done;
  const { error } = await sb.from('tasks').update({ done: newDone }).eq('id', taskId);
  if(error){ alert('Could not update task: '+error.message); return; }
  task.done = newDone;
  render();
}
async function editTaskPrompt(tripId, taskId){
  const trip = getTrip(tripId);
  const task = trip.tasks.find(t=>t.id===taskId);
  const val = prompt('Edit task', task.text);
  if(val===null || !val.trim()) return;
  const { error } = await sb.from('tasks').update({ text: val.trim() }).eq('id', taskId);
  if(error){ alert('Could not update task: '+error.message); return; }
  task.text = val.trim();
  render();
}
async function deleteTask(tripId, taskId){
  const { error } = await sb.from('tasks').delete().eq('id', taskId);
  if(error){ alert('Could not delete task: '+error.message); return; }
  const trip = getTrip(tripId);
  trip.tasks = trip.tasks.filter(t=>t.id!==taskId);
  render();
}

/* ---- Add / Edit Trip Modal ---- */
let tempCountries = [];
function openAddTripModal(editId){
  const trip = editId ? getTrip(editId) : null;
  tempCountries = trip ? [...(trip.countries||[])] : [];
  const html = `
    <div class="modal-header">
      <h3>${trip? 'Edit Trip' : 'Add Trip'}</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="field">
      <label class="field-label">Trip Name</label>

    </div>
    <div class="field">
      <label class="field-label">Countries</label>
      <div class="chip-input-row">
        <input type="text" id="country-input" placeholder="Type a country, then Add" onkeydown="if(event.key==='Enter'){event.preventDefault();addCountryChip();}">
        <button type="button" class="btn btn-sm" onclick="addCountryChip()">Add</button>
      </div>
      <div class="chip-list" id="country-chip-list"></div>
    </div>
    <div class="field-row">
      <div class="field">
        <label class="field-label">Start Date</label>
        <input type="date" id="trip-start-input" value="${trip?trip.startDate||'':''}">
      </div>
      <div class="field">
        <label class="field-label">End Date</label>
        <input type="date" id="trip-end-input" value="${trip?trip.endDate||'':''}">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label class="field-label">Number of Pax</label>
        <input type="number" min="1" step="1" id="trip-pax-input" value="${trip&&trip.pax?trip.pax:1}">
      </div>
      <div class="field">
        <label class="field-label">Budget (optional)</label>
        <input type="number" min="0" step="0.01" id="trip-budget-input" value="${trip&&trip.budget?trip.budget:''}" placeholder="e.g. 3000">
      </div>
    </div>
    <div class="modal-footer">
      ${trip? `<button class="btn" style="margin-right:auto;color:var(--danger);" onclick="deleteTripConfirm('${trip.id}')">Delete Trip</button>` : ''}
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTrip('${trip?trip.id:''}')">Save</button>
    </div>
  `;
  openModal(html);
  renderCountryChips();
}
function addCountryChip(){
  const input = document.getElementById('country-input');
  const val = input.value.trim();
  if(!val) return;
  tempCountries.push(val);
  input.value='';
  renderCountryChips();
}
function removeCountryChip(idx){
  tempCountries.splice(idx,1);
  renderCountryChips();
}
function renderCountryChips(){
  const el = document.getElementById('country-chip-list');
  if(!el) return;
  el.innerHTML = tempCountries.map((c,idx)=>`<span class="chip">${escapeHtml(c)}<button onclick="removeCountryChip(${idx})">&times;</button></span>`).join('');
}
async function saveTrip(editId){
  const name = document.getElementById('trip-name-input').value.trim();
  const startDate = document.getElementById('trip-start-input').value;
  const endDate = document.getElementById('trip-end-input').value;
  const pax = Math.max(1, parseInt(document.getElementById('trip-pax-input').value) || 1);
  const budgetRaw = document.getElementById('trip-budget-input').value;
  const budget = budgetRaw!=='' ? Math.max(0, parseFloat(budgetRaw)||0) : null;
  if(!name){ alert('Please enter a trip name.'); return; }
  if(startDate && endDate && endDate < startDate){ alert('End date must be after start date.'); return; }
  const payload = { name, countries: [...tempCountries], start_date: startDate || null, end_date: endDate || null, pax, budget };
  beginLoading();
  try{
    if(editId){
      const { data: row, error } = await sb.from('trips').update(payload).eq('id', editId).select().single();
      if(error){ alert('Could not save trip: '+error.message); return; }
      const trip = getTrip(editId);
      Object.assign(trip, { name: row.name, countries: row.countries||[], startDate: row.start_date||'', endDate: row.end_date||'', pax: row.pax, budget: row.budget });
    } else {
      const { data: row, error } = await sb.from('trips').insert(payload).select().single();
      if(error){ alert('Could not create trip: '+error.message); return; }
      data.trips.push({ id: row.id, name: row.name, countries: row.countries||[], startDate: row.start_date||'', endDate: row.end_date||'', pax: row.pax, budget: row.budget, items:[], tasks:[], expenses:[] });
    }
    closeModal(); render();
    showToast('Trip saved');
  } finally {
    endLoading();
  }
}
function deleteTripConfirm(tripId){
  const trip = getTrip(tripId);
  const modal = document.getElementById('modal-content');
  modal.innerHTML = `
    <div class="modal-header"><h3>Delete Trip</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <p>Are you sure you want to delete <strong>${escapeHtml(trip.name)}</strong>? This will remove all its itinerary items and tasks. This can't be undone.</p>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="deleteTrip('${tripId}')">Yes, delete trip</button>
    </div>`;
}
async function deleteTrip(tripId){
  const trip = getTrip(tripId);
  const storagePaths = (trip.items||[]).flatMap(i=>(i.files||[]).map(f=>f.storagePath));
  beginLoading();
  try{
    const { error } = await sb.from('trips').delete().eq('id', tripId);
    if(error){ alert('Could not delete trip: '+error.message); return; }
    if(storagePaths.length) await sb.storage.from('attachments').remove(storagePaths).catch(()=>{});
    data.trips = data.trips.filter(t=>t.id!==tripId);
    closeModal();
    ui.view='trips';
    render();
    showToast('Trip deleted');
  } finally {
    endLoading();
  }
}

function itemSearchText(item){

function getFilteredTripItems(trip){
  let items = (trip.items||[]).filter(i=>!i.isPoi);

// Whether a card represents an actual place at all, as opposed to a plain reminder/note
// ("Book taxi to airport", "Buy souvenirs") that was never given a Google Maps link or a
// Location field selection. Those note cards have nothing to put on the map or measure a
// walking distance to/from, so they're treated as transparent — skipped over — everywhere
// the app chains cards together by location, rather than breaking that chain in two.
function cardHasLocation(item){
  return !item.isPoi && (!!(item.mapsLink && item.mapsLink.trim()) || (item.lat!=null && item.lng!=null));
}
// Interleaves a distance-badge placeholder between each pair of consecutive LOCATION cards
// (skipping over both a Place of Interest, which isn't part of the day's walking sequence,
// and any plain note card with no location of its own — the badge instead spans straight
// from the last real place to the next one). The badges start empty and are filled in
// afterwards by loadDistanceBadges() once coordinates for both ends are known — keeps the
// initial render instant, no request-per-render-call.
function renderItemsWithDistanceBadges(items, trip){
  let html = '';
  items.forEach((item, idx)=>{
    html += renderItemCard(item, trip);
    if(!cardHasLocation(item)) return;
    let nextIdx = idx+1;
    while(nextIdx < items.length && !cardHasLocation(items[nextIdx])) nextIdx++;
    if(nextIdx < items.length){
      const next = items[nextIdx];
      // Keyed by the card ABOVE the gap, so the note follows that card when cards are dragged around.
      const legKey = `leg_${item.id}`;
      const hasNote = !!legNoteGet(trip, legKey);
      html += `<div class="leg-row"><div class="card-distance-badge" id="distbadge-${item.id}-${next.id}" data-from="${item.id}" data-to="${next.id}"></div>
        <button type="button" class="leg-notes-btn${hasNote?' has-note':''}" onclick="openLegNotes('${trip.id}','${legKey}')">📝 Notes${hasNote?' ·':''}</button></div>`;
    }
  });
  return html;
}
function renderItemList(items, trip){
  if(ui.dayFilter!=='all'){
    return `<div class="drag-group" data-group="single">${renderItemsWithDistanceBadges(items, trip)}</div>`;
  }
  // group by day when showing all (items already sorted earliest-to-latest).
  // Multi-day continuation duplicates are real rows with their own single-day date, so
  // grouping purely by each item's own dateStart naturally places everything correctly.
  const groups = {};
  const noDate = [];
  items.forEach(i=>{
    if(!i.dateStart || !trip.startDate){ noDate.push(i); return; }
    const d = daysBetween(trip.startDate, i.dateStart);
    groups[d] = groups[d]||[];
    groups[d].push(i);
  });
  let html = '';
  Object.keys(groups).sort((a,b)=>a-b).forEach(day=>{
    const title = trip.dayTitles && trip.dayTitles[day] ? ` · ${escapeHtml(trip.dayTitles[day])}` : '';
    html += `<div class="day-group-label">Day ${day} · ${fmtDateShort(groups[day][0].dateStart)}${title}</div>`;
    html += `<div class="drag-group" data-group="day-${day}">${renderItemsWithDistanceBadges(groups[day], trip)}</div>`;
  });
  if(noDate.length){
    html += `<div class="day-group-label">No date set</div>`;
    html += `<div class="drag-group" data-group="nodate">${noDate.map(i=>renderItemCard(i, trip)).join('')}</div>`;
  }
  return html;
}
// Fills in each distance-badge placeholder left by renderItemsWithDistanceBadges(), one
// consecutive pair at a time. Walking is tried first; if it's a long-looking hop (>20 min
// on foot) transit is tried too and shown instead when it's actually available for that
// leg. A pair with no coordinates yet (still geocoding) or a failed lookup is left blank —
// the placeholder's CSS collapses to nothing rather than showing a wrong or stuck number.
let distanceBadgeRenderToken = 0;
async function loadDistanceBadges(trip, items){
  if(!trip || !items || !items.length) return;
  const myToken = ++distanceBadgeRenderToken;
  const dayGroups = {};
  items.forEach(i=>{
    if(i.isPoi || !i.dateStart || !trip.startDate) return;
    const d = daysBetween(trip.startDate, i.dateStart);
    dayGroups[d] = dayGroups[d]||[];
    dayGroups[d].push(i);
  });
  for(const day of Object.keys(dayGroups)){
    const dayItems = dayGroups[day];
    for(let idx=0; idx<dayItems.length; idx++){
      const a = dayItems[idx];
      if(!cardHasLocation(a)) continue;
      // Mirrors renderItemsWithDistanceBadges' pairing above: skip past any plain note
      // card (no maps link/location at all) to find the next real place's badge.
      let nextIdx = idx+1;
      while(nextIdx<dayItems.length && !cardHasLocation(dayItems[nextIdx])) nextIdx++;
      if(nextIdx>=dayItems.length) continue;
      const b = dayItems[nextIdx];
      const el = document.getElementById(`distbadge-${a.id}-${b.id}`);
      if(!el || a.lat==null || a.lng==null || b.lat==null || b.lng==null) continue;
      // Always show BOTH walking and public transport (never driving).
      const walkLeg = await computeRouteLeg(a.lat, a.lng, b.lat, b.lng, 'WALK');
      const transitLeg = await computeRouteLeg(a.lat, a.lng, b.lat, b.lng, 'TRANSIT');
      if(distanceBadgeRenderToken !== myToken) return; // a newer render superseded this one
      if(!walkLeg && !transitLeg) continue;
      const parts = [];
      if(walkLeg) parts.push(`🚶 ${formatRouteDuration(walkLeg.seconds)} · ${formatDistance(walkLeg.meters)}`);
      if(transitLeg) parts.push(`🚆 ${formatRouteDuration(transitLeg.seconds)} · ${formatDistance(transitLeg.meters)}`);
      el.innerHTML = parts.join('<span class="dist-sep"> &nbsp;|&nbsp; </span>');
      el.classList.add('ready');
      el.onclick = (ev)=> showNavMethodsPopover(ev, a.lat, a.lng, b.lat, b.lng);
    }
  }
}

/* ---- Notes between two cards (stored in the trip's day_titles JSON under "leg_<from>_<to>") ---- */
function sanitizeNoteHtml(html){
  const tpl = document.createElement('template');
  tpl.innerHTML = html || '';
  const ok = new Set(['B','I','U','STRONG','EM','BR','DIV','P','SPAN','A','IMG','UL','OL','LI']);
  (function walk(node){
    Array.from(node.childNodes).forEach(ch=>{
      if(ch.nodeType===1){
        if(!ok.has(ch.tagName)){ ch.remove(); return; }
        Array.from(ch.attributes).forEach(a=>{
          const n=a.name.toLowerCase(), v=a.value.trim();
          if(ch.tagName==='A' && n==='href' && /^https?:/i.test(v)) return;
          if(ch.tagName==='IMG' && n==='src' && /^https:/i.test(v)) return;
          ch.removeAttribute(a.name);
        });
        if(ch.tagName==='A'){ ch.setAttribute('target','_blank'); ch.setAttribute('rel','noopener'); }
        walk(ch);
      }
    });
  })(tpl.content);
  return tpl.innerHTML;
}
function autoLinkNode(root){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; let n;
  while((n = walker.nextNode())) if(!n.parentElement.closest('a') && /https?:\/\/\S/.test(n.nodeValue)) nodes.push(n);
  nodes.forEach(t=>{
    const frag = document.createDocumentFragment();
    let last = 0;
    t.nodeValue.replace(/https?:\/\/[^\s<]+/g, (m, off)=>{
      const trail = (m.match(/[.,;:!?)\]]+$/)||[''])[0];
      const clean = trail ? m.slice(0, -trail.length) : m;
      frag.appendChild(document.createTextNode(t.nodeValue.slice(last, off)));
      const a = document.createElement('a'); a.href = clean; a.textContent = clean; frag.appendChild(a);
      last = off + clean.length;
      return m;
    });
    frag.appendChild(document.createTextNode(t.nodeValue.slice(last)));
    t.parentNode.replaceChild(frag, t);
  });
}
// Reads a note by "leg_<fromId>", falling back to older "leg_<fromId>_<toId>" keys.
function legNoteGet(trip, legKey){
  const t = (trip && trip.dayTitles) || {};
  if(t[legKey]) return t[legKey];
  const k = Object.keys(t).find(x=>x.startsWith(legKey+'_'));
  return k ? t[k] : '';
}

async function insertLegNoteImage(e){
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  const ed = document.getElementById('leg-note-editor');
  beginLoading();
  try{
    let blob = file, name = sanitizeFileName(file.name);
    try{ blob = await compressImageFile(file); name = withJpgExt(file.name); }catch(_){}
    const path = `shared/legnotes/${Date.now()}_${name}`;
    const { error } = await sb.storage.from('attachments').upload(path, blob);
    if(error){ alert('Image upload failed: '+error.message); return; }
    ed.focus();
    document.execCommand('insertImage', false, coverPublicUrl(path));
  } finally { endLoading(); }
}
async function saveLegNote(){
  const ed = document.getElementById('leg-note-editor');
  if(!ed) return;
  autoLinkNode(ed);
  let html = sanitizeNoteHtml(ed.innerHTML).trim();
  if(!ed.textContent.trim() && !ed.querySelector('img')) html = '';
  const trip = getTrip(legNoteCtx.tripId);
  const titles = { ...(trip.dayTitles||{}) };
  Object.keys(titles).forEach(k=>{ if(k===legNoteCtx.legKey || k.startsWith(legNoteCtx.legKey+'_')) delete titles[k]; });
  if(html) titles[legNoteCtx.legKey] = html;
  const { error } = await sb.from('trips').update({ day_titles: titles }).eq('id', legNoteCtx.tripId);
  if(error){ alert('Could not save notes: '+error.message); return; }
  trip.dayTitles = titles;
  render();
  renderLegNoteView();
}

function selectCardPin(itemId){
  selectedCardItemId = itemId;
  Object.keys(tripMapPins).forEach(id=>{
    const p = tripMapPins[id];
    p.el.classList.toggle('pin-active', id === itemId);
    try{ p.marker.zIndex = (id === itemId) ? 1000 : null; }catch(e){}
  });
  document.querySelectorAll('.item-card.item-selected').forEach(c=>c.classList.remove('item-selected'));

  const pin = tripMapPins[itemId];
  if(pin && tripMapInstance && pin.marker && pin.marker.position){

let dragSrcId = null;
document.addEventListener('dragstart', e=>{
  const card = e.target.closest('.item-card');
  if(!card) return;
  dragSrcId = card.id.replace('item-','');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', dragSrcId); }catch(err){}
  card.classList.add('dragging');
});
document.addEventListener('dragend', e=>{
  const card = e.target.closest('.item-card');
  if(card) card.classList.remove('dragging');
  document.querySelectorAll('.item-card.drag-over').forEach(c=>c.classList.remove('drag-over'));
  dragSrcId = null;
});
document.addEventListener('dragover', e=>{
  const card = e.target.closest('.item-card');
  if(!card || !dragSrcId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.item-card.drag-over').forEach(c=>{ if(c!==card) c.classList.remove('drag-over'); });
  card.classList.add('drag-over');
});
document.addEventListener('drop', async e=>{
  const targetCard = e.target.closest('.item-card');
  if(!targetCard || !dragSrcId) return;
  e.preventDefault();
  const targetId = targetCard.id.replace('item-','');
  targetCard.classList.remove('drag-over');
  if(targetId===dragSrcId) return;
  const group = targetCard.closest('.drag-group');
  const srcCard = document.getElementById('item-'+dragSrcId);
  if(!group || !srcCard || !group.contains(srcCard)) return;
  const ids = [...group.querySelectorAll('.item-card')].map(c=>c.id.replace('item-',''));
  const fromIdx = ids.indexOf(dragSrcId);
  const toIdx = ids.indexOf(targetId);
  if(fromIdx===-1 || toIdx===-1) return;
  ids.splice(fromIdx,1);
  ids.splice(toIdx,0,dragSrcId);
  const trip = getTrip(ui.detailTripId);
  const updates = [];
  ids.forEach((id, idx)=>{
    const it = trip.items.find(i=>i.id===id);
    if(it && it.order!==idx){
      it.order = idx;
      updates.push(sb.from('activities').update({ sort_order: idx }).eq('id', id));
    }
  });
  render(); // optimistic — reflect the new order immediately
  if(updates.length) await Promise.all(updates);
});

  e.stopPropagation();

  const existing = card.querySelector('.popover');

  if(existing) return;
  // The drag-handle (⠿) only reorders via HTML5 drag-and-drop, which mouse-only — there's
  // no touch equivalent, so it silently doesn't work on a phone. These "Reorder" buttons
  // give touch users the same reordering ability via a tap instead of a drag gesture.
  const group = card.closest('.drag-group');
  const siblingIds = group ? [...group.querySelectorAll('.item-card')].map(c=>c.id.replace('item-','')) : [];
  const idx = siblingIds.indexOf(itemId);

  const canDown = idx !== -1 && idx < siblingIds.length-1;

async function deleteItem(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip.items.find(i=>i.id===itemId);
  const children = trip.items.filter(i=>i.parentActivityId===itemId);
  const storagePaths = [item, ...children].flatMap(it=>{
    if(!it) return [];
    const paths = (it.files||[]).map(f=>f.storagePath);
    if(it.imagePaths && it.imagePaths.length) paths.push(...it.imagePaths);
    if(it.iconImagePath) paths.push(it.iconImagePath);
    return paths;
  });
  beginLoading();
  try{
  // Explicitly remove continuation duplicates too (belt-and-braces alongside the DB's own cascade).
  if(children.length){
    await sb.from('activities').delete().in('id', children.map(c=>c.id));
  }
  const { error } = await sb.from('activities').delete().eq('id', itemId);
  if(error){ alert('Could not delete activity: '+error.message); return; }
  if(storagePaths.length) await sb.storage.from('attachments').remove(storagePaths).catch(()=>{});
  trip.items = trip.items.filter(i=>i.id!==itemId && i.parentActivityId!==itemId);
  render();
  showToast('Activity deleted');
  } finally {
    endLoading();
  }
}
async function duplicateItem(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip.items.find(i=>i.id===itemId);
  if(!item) return;
  const newOrder = trip.items.reduce((m,i)=>Math.max(m,i.order||0),-1)+1;
  const payload = {
    trip_id: tripId, type: item.type, icon: item.icon || null, icon_image_path: item.iconImagePath || null, status: item.status,
    booked_by: item.bookedBy || null, name: item.name,
    cost_total: item.costTotal || 0, cost_per_pax: item.costPerPax || 0, currency: item.currency || 'SGD',
    date_start: item.dateStart || null, date_end: item.dateEnd || null,
    time_start: item.timeStart || null, time_end: item.timeEnd || null,
    link: item.link || null, maps_link: item.mapsLink || null,
    card_color: item.cardColor || null, notes: item.notes || '', sort_order: newOrder,
    is_duplicate: false, parent_activity_id: null, is_poi: item.isPoi || false,
    // Carrying these over is what makes the new card's map pin (and Open Now/photo lookups)
    // point at the exact same place instead of falling back to a fresh, name-based geocode —
    // which for a chain store like "Lidl" can land on the wrong branch entirely.
    place_id: item.placeId || null, lat: item.lat ?? null, lng: item.lng ?? null,
  };
  beginLoading();
  try{
    const { data: row, error } = await sb.from('activities').insert(payload).select().single();
    if(error){ alert('Could not duplicate activity: '+error.message); return; }
    trip.items.push(dbActivityToItem(row, []));
    await reconcileDuplicates(tripId, row.id, payload, newOrder);
    render();
    showToast('Activity duplicated');
  } finally {
    endLoading();
  }
}
/* Keeps auto-generated multi-day "continuation" rows in sync with a parent activity's
   date range, without touching any continuation rows the user has independently edited. */
async function reconcileDuplicates(tripId, parentId, basePayload, order){
  const trip = getTrip(tripId);
  if(!trip) return;
  const dateStart = basePayload.date_start, dateEnd = basePayload.date_end;
  const desiredDates = [];
  if(dateStart && dateEnd && dateEnd > dateStart){
    let d = addDays(dateStart, 1);
    while(d <= dateEnd){ desiredDates.push(d); d = addDays(d, 1); }
  }
  const existingDups = trip.items.filter(i=>i.parentActivityId===parentId);
  for(const dup of existingDups){
    if(!desiredDates.includes(dup.dateStart)){
      const storagePaths = (dup.files||[]).map(f=>f.storagePath);
      if(dup.imagePaths && dup.imagePaths.length) storagePaths.push(...dup.imagePaths);
      await sb.from('activities').delete().eq('id', dup.id);
      if(storagePaths.length) await sb.storage.from('attachments').remove(storagePaths).catch(()=>{});
      trip.items = trip.items.filter(i=>i.id!==dup.id);
    }
  }
  const stillExistingDates = trip.items.filter(i=>i.parentActivityId===parentId).map(i=>i.dateStart);
  for(const d of desiredDates){
    if(stillExistingDates.includes(d)) continue;
    const { data: row, error } = await sb.from('activities').insert({
      trip_id: tripId, type: basePayload.type, icon: basePayload.icon, icon_image_path: basePayload.icon_image_path || null, status: basePayload.status,
      booked_by: basePayload.booked_by, name: basePayload.name,
      cost_total: basePayload.cost_total, cost_per_pax: basePayload.cost_per_pax, currency: basePayload.currency || 'SGD',
      date_start: d, date_end: d, time_start: null, time_end: null,
      link: basePayload.link, maps_link: basePayload.maps_link, card_color: basePayload.card_color,
      notes: basePayload.notes, sort_order: order, is_duplicate: true, parent_activity_id: parentId,
      is_poi: basePayload.is_poi || false, place_id: basePayload.place_id || null,
      // Same reasoning as duplicateItem above — without these, a continuation row for e.g. a
      // multi-night stay has to be re-geocoded from scratch and can drift to a different
      // branch/address than the parent activity it's supposed to mirror.
      lat: basePayload.lat ?? null, lng: basePayload.lng ?? null,
    }).select().single();
    if(!error) trip.items.push(dbActivityToItem(row, []));
  }
}

async function moveItemToDate(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip && trip.items.find(i=>i.id===itemId);
  const newStart = document.getElementById('move-item-date-input').value;
  if(!trip || !item || !newStart) return;
  // Preserve the activity's span (e.g. a 2-night stay stays a 2-night stay) by shifting
  // date_end by the same number of days the start moved.
  let newEnd = newStart;
  if(item.dateStart && item.dateEnd && item.dateEnd > item.dateStart){
    const span = daysBetween(item.dateStart, item.dateEnd);
    newEnd = addDays(newStart, span);
  }
  beginLoading();
  try{
    const { error } = await sb.from('activities').update({ date_start: newStart, date_end: newEnd }).eq('id', itemId);
    if(error){ alert('Could not move activity: '+error.message); return; }
    item.dateStart = newStart;
    item.dateEnd = newEnd;
    await reconcileDuplicates(tripId, itemId, {
      type: item.type, icon: item.icon||null, icon_image_path: item.iconImagePath||null, status: item.status, booked_by: item.bookedBy||null,
      name: item.name, cost_total: item.costTotal||0, cost_per_pax: item.costPerPax||0, currency: item.currency||'SGD',
      date_start: newStart, date_end: newEnd, link: item.link||null, maps_link: item.mapsLink||null,
      card_color: item.cardColor||null, notes: item.notes||'', is_poi: item.isPoi||false,
      // Same fix as duplicateItem/reconcileDuplicates — moving an activity to a new day still
      // reconciles its continuation rows, which need the parent's exact location carried over.
      place_id: item.placeId||null, lat: item.lat ?? null, lng: item.lng ?? null,
    }, item.order||0);
    closeModal();
    render();
    showToast('Activity moved');
  } finally {
    endLoading();
  }
}

// Supabase Storage rejects object keys with spaces or other non-URL-safe characters
// (common in default screenshot/download filenames like "Screenshot 2026-09-01 at
// 5.06.33 PM.png") with an "Invalid key" error — sanitize before using in a path.
// The original, human-readable name is kept separately wherever it's displayed.
function sanitizeFileName(name){
  const lastDot = name.lastIndexOf('.');
  const base = lastDot > 0 ? name.slice(0, lastDot) : name;
  const ext = lastDot > 0 ? name.slice(lastDot) : '';
  const safeBase = base.replace(/[^a-zA-Z0-9_-]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '') || 'file';
  const safeExt = ext.replace(/[^a-zA-Z0-9.]+/g, '');
  return safeBase + safeExt;
}
/* ---- Photo compression (cover images, receipts, shopping item photos) ----
   Custom icons (handleIconUpload above) are exempt — those are small glyphs sized for
   200×200 display and kept as PNG for transparency, not photos re-encoded for byte size. */
function loadImageEl(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read the image file.')); };
    img.src = url;
  });
}
function encodeJpeg(img, width, height, quality){
  return new Promise(resolve=>{
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext('2d');
    // JPEG has no alpha channel — flatten onto white first so a transparent source (e.g. a
    // screenshot) doesn't turn solid black once re-encoded.
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, width, height);
    ctx.drawImage(img, 0, 0, width, height);
    canvas.toBlob(blob=>resolve(blob), 'image/jpeg', quality);
  });
}
// Re-encodes a photo as JPEG, stepping quality down and — once quality bottoms out —
// dimensions down, until it fits under maxBytes (default 60KB) or hits a sensible floor
// (35% quality, 480px on the long side). A phone photo can be 5-10MB straight out of the
// camera; this keeps Storage usage and page load small without a visible quality cliff for
// the vast majority of photos, which converge in 1-3 passes.
async function compressImageFile(file, maxBytes){
  maxBytes = maxBytes || 60*1024;
  const img = await loadImageEl(file);
  let width = img.width, height = img.height;
  const MAX_DIM = 1600;
  if(Math.max(width, height) > MAX_DIM){
    const scale = MAX_DIM / Math.max(width, height);
    width = Math.round(width*scale); height = Math.round(height*scale);
  }
  let quality = 0.85;
  let blob = await encodeJpeg(img, width, height, quality);
  let guard = 0;
  while(blob.size > maxBytes && guard < 10){
    guard++;
    if(quality > 0.35){
      quality = Math.max(0.35, quality - 0.1);
    } else if(Math.max(width, height) > 480){
      width = Math.round(width*0.85); height = Math.round(height*0.85);
    } else {
      break; // hit both floors — accept the smallest size we could reach
    }
    blob = await encodeJpeg(img, width, height, quality);
  }
  return blob;
}
// Swaps whatever extension the original file had for .jpg, since a compressed upload is
// always re-encoded as JPEG regardless of what it started as (PNG, HEIC, etc.) — keeps the
// stored file's extension honest about its actual content.
function withJpgExt(name){
  const base = sanitizeFileName(name).replace(/\.[a-zA-Z0-9]+$/, '') || 'photo';
  return base + '.jpg';
}

}

// Resizes/compresses an image file client-side (no server round trip needed) to fit within
// maxDim×maxDim, preserving aspect ratio (never stretched/cropped to a square) and
// transparency. Draws through a canvas and re-exports as PNG — this is what actually shrinks
// the file, not just how it's displayed, so custom icons don't quietly bloat Storage with
// full-resolution photos uploaded from a phone.
function resizeImageFileToPng(file, maxDim){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        const scale = Math.min(maxDim/width, maxDim/height);
        width = Math.max(1, Math.round(width*scale));
        height = Math.max(1, Math.round(height*scale));
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob=>{
        if(!blob){ reject(new Error('Could not process the image.')); return; }
        resolve(blob);
      }, 'image/png');
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read the image file.')); };
    img.src = url;
  });
}
async function handleIconUpload(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  beginLoading();
  try{
    // Icons are shown small everywhere (14-20px on cards/pins, 40px in this form), so every
    // upload is compressed down to fit within 200×200 — falls back to the original file only
    // if the resize itself fails, rather than blocking the upload entirely.
    let uploadBlob = file;
    try{ uploadBlob = await resizeImageFileToPng(file, 200); }catch(resizeErr){}
    const path = `shared/${currentDraftId}/icon_${Date.now()}_${sanitizeFileName(file.name)}`;
    const { error } = await sb.storage.from('attachments').upload(path, uploadBlob);
    if(error){ alert('Icon upload failed: '+error.message); return; }
    tempIconImagePath = path;
    refreshIconField();
  } finally {
    endLoading();
  }
}

async function handleFileSelect(e){
  const files = Array.from(e.target.files);
  e.target.value = '';
  if(!files.length) return;
  for(const f of files){
    const uploadingEntry = { name: f.name, storagePath: null, uploading: true };
    tempFiles.push(uploadingEntry);
    renderFileChips();
    // This picker accepts any file type (PDFs, docs, etc. alongside images), so only run
    // photos through compression — a non-image file is uploaded untouched.
    let uploadBlob = f, uploadName = sanitizeFileName(f.name);
    if(f.type && f.type.startsWith('image/')){
      try{ uploadBlob = await compressImageFile(f); uploadName = withJpgExt(f.name); }catch(compressErr){}
    }
    const path = `shared/${currentDraftId}/${Date.now()}_${uploadName}`;
    const { error } = await sb.storage.from('attachments').upload(path, uploadBlob);
    if(error){
      alert('Upload failed for '+f.name+': '+error.message);
      tempFiles.splice(tempFiles.indexOf(uploadingEntry), 1);
      renderFileChips();
      continue;
    }
    uploadingEntry.storagePath = path;
    uploadingEntry.uploading = false;
    uploadingEntry.pending = true; // not yet linked to an activity row
    if(currentEditingItemId){
      // parent activity already exists in the DB — link the file right away
      const { data: row, error: linkErr } = await sb.from('activity_files')
        .insert({ activity_id: currentEditingItemId, file_name: f.name, storage_path: path }).select().single();
      if(!linkErr){ uploadingEntry.id = row.id; uploadingEntry.pending = false; }
    }
    renderFileChips();
  }
}
function renderFileChips(){
