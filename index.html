async function removeTempFile(idx){
  const f = tempFiles[idx];
  if(f && f.storagePath){
    try{ await sb.storage.from('attachments').remove([f.storagePath]); }catch(e){}
    // Note: Supabase's Postgrest query builder only implements .then(), not .catch(),
    // so chaining .catch() directly on it throws a TypeError — must use try/catch instead.
    // Prefer deleting by id, but fall back to matching on storage_path when it's missing —
    // without this fallback, a file removed here would delete the storage object but leave
    // its activity_files row behind, orphaned and permanently un-openable from then on
    // (this is how a past bug left a few "Could not open file" attachments on some cards).
    try{
      if(f.id) await sb.from('activity_files').delete().eq('id', f.id);
      else if(currentEditingItemId) await sb.from('activity_files').delete().eq('activity_id', currentEditingItemId).eq('storage_path', f.storagePath);
    }catch(e){ console.error('Could not remove file record for', f.storagePath, e); }
  }
  tempFiles.splice(idx,1);
  renderFileChips();
}
function recalcPerPax(pax){

  const p = Number(pax) || 1;
  perPaxEl.value = total ? (total/p).toFixed(2) : '';
}

  beginLoading();
  try{
    if(itemId){
      const { error } = await sb.from('activities').update(payload).eq('id', itemId);
      if(error){ alert('Could not save activity: '+error.message); return; }
      savedOrder = trip.items.find(i=>i.id===itemId).order;
    } else {
      savedOrder = trip.items.reduce((m,i)=>Math.max(m,i.order||0),-1)+1;
      const { data: row, error } = await sb.from('activities').insert({ ...payload, trip_id: tripId, sort_order: savedOrder }).select().single();
      if(error){ alert('Could not create activity: '+error.message); return; }
      savedId = row.id;
      // link any files that were uploaded before this activity row existed
      for(const f of tempFiles.filter(f=>f.pending)){
        const { data: fr, error: fe } = await sb.from('activity_files')
          .insert({ activity_id: savedId, file_name: f.name, storage_path: f.storagePath }).select().single();
        if(!fe){ f.id = fr.id; f.pending = false; }
      }
    }

    const localItem = {
      id: savedId,
      type: payload.type, icon: payload.icon || '', status: payload.status, bookingOpensDate: payload.booking_opens_date || '', bookedBy: payload.booked_by || '',
      name: payload.name, costTotal: payload.cost_total, costPerPax: payload.cost_per_pax, currency: payload.currency,
      dateStart: payload.date_start || '', dateEnd: payload.date_end || '',
      timeStart: payload.time_start || '', timeEnd: payload.time_end || '',
      link: payload.link || '', mapsLink: payload.maps_link || '', cardColor: payload.card_color || '',
      imagePaths: payload.image_paths || [],
      iconImagePath: payload.icon_image_path || null,
      lat: tempPlaceLatLng ? tempPlaceLatLng.lat : (coordsCleared ? null : (existingItem ? existingItem.lat : null)),
      lng: tempPlaceLatLng ? tempPlaceLatLng.lng : (coordsCleared ? null : (existingItem ? existingItem.lng : null)),
      placeId: payload.place_id || null,
      isDuplicate: existingItem ? existingItem.isDuplicate : false,
      isPoi: payload.is_poi,
      parentActivityId: existingItem ? existingItem.parentActivityId : null,
      notes: payload.notes, order: savedOrder,
      files: tempFiles.map(f=>({ id: f.id, name: f.name, storagePath: f.storagePath })),
    };
    if(removedCoverPaths.length){
      sb.storage.from('attachments').remove(removedCoverPaths).catch(()=>{});
    }
    if(itemId){
      Object.assign(trip.items.find(i=>i.id===itemId), localItem);
    } else {
      trip.items = trip.items||[];
      trip.items.push(localItem);
    }
    if(!isEditingDuplicate){
      // payload.lat/lng are only set above when this save actually touched the location
      // (a fresh Autocomplete pick, or a cleared/changed maps link) — localItem.lat/lng is
      // always the authoritative current value, so continuation rows reconcile against that
      // rather than possibly-undefined fields and drifting to a re-geocoded, wrong location.
      payload.lat = localItem.lat; payload.lng = localItem.lng;
      await reconcileDuplicates(tripId, savedId, payload, savedOrder);
    }
    closeModal(); render();
    showToast('Activity saved');
  } finally {
    endLoading();
  }
}

   Separate from the booked-activity cost breakdown below (Expenses modal) — this is for

   folded into the itinerary's own cost totals. Opens as a modal over whatever page you're
   already on (trip detail), rather than navigating away to its own page. */

// Entry point for both "💰 Trip Expenses" buttons — resets any in-progress edit so
// re-opening the modal never carries over stale form state from a previous visit.
/* ---------- Smart receipt scanner (OpenRouter) ----------
   Pure parsing/validation helpers first (unit-tested in node), then UI + network glue.
   The API key lives only in this browser's localStorage; nothing is ever auto-saved. */
const OPENROUTER_KEY_LS = 'victravels_openrouter_key';
const OPENROUTER_MODEL_LS = 'victravels_openrouter_model';
const OPENROUTER_DEFAULT_MODEL = 'thinkingmachines/inkling-small:free';
// The OpenRouter key lives only on the server (Supabase Edge Function secret) — never in this page.
function aiProxyUrl(){ return SUPABASE_URL + '/functions/v1/ai-proxy'; }

function parseAmountLoose(v){
  if(typeof v === 'number') return (isFinite(v) && v > 0) ? Math.round(v*100)/100 : null;
  if(typeof v !== 'string') return null;
  let t = v.replace(/[^\d.,]/g,'');
  if(!/\d/.test(t)) return null;
  const lastDot = t.lastIndexOf('.'), lastComma = t.lastIndexOf(',');
  if(lastDot>-1 && lastComma>-1){
    const dec = lastDot > lastComma ? '.' : ',';
    const thou = dec === '.' ? ',' : '.';
    t = t.split(thou).join('').replace(dec,'.');
  } else if(lastComma>-1){
    t = (/,\d{1,2}$/.test(t) && t.indexOf(',')===lastComma) ? t.replace(',','.') : t.split(',').join('');
  } else if(lastDot>-1 && t.indexOf('.')!==lastDot){
    t = t.split('.').join('');
  }
  const n = parseFloat(t);
  return (isFinite(n) && n > 0) ? Math.round(n*100)/100 : null;
}
function extractJsonObject(text){
  if(typeof text !== 'string') return null;
  let t = text.replace(/```(?:json)?/gi,'');
  const start = t.indexOf('{');
  if(start < 0) return null;
  for(let end = t.lastIndexOf('}'); end > start; end = t.lastIndexOf('}', end-1)){
    try{
      const o = JSON.parse(t.slice(start, end+1));
      if(o && typeof o === 'object' && !Array.isArray(o)) return o;
    }catch(e){}
  }
  return null;
}
function normalizeCurrencyCode(c){
  if(typeof c !== 'string') return null;
  const t = c.trim();
  const sym = { '€':'EUR', 'S$':'SGD', '£':'GBP', '¥':'JPY' };
  if(sym[t]) return sym[t];
  const u = t.toUpperCase();
  return /^[A-Z]{3}$/.test(u) ? u : null;
}
function validDateStr(d){
  if(typeof d !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(d.trim())) return null;
  const s = d.trim(), dt = new Date(s+'T00:00:00Z');
  return (!isNaN(dt) && dt.toISOString().slice(0,10) === s) ? s : null;
}
// Returns { amount, currency, category, merchant, date, notes } (bad fields -> null) or null if
// no usable JSON object / no valid total was found.
function parseReceiptResponse(text, categories){
  const o = extractJsonObject(text);
  if(!o) return null;
  const amount = parseAmountLoose(o.total != null ? o.total : o.amount);
  if(amount == null) return null;
  const cats = categories || [];
  const catRaw = typeof o.category === 'string' ? o.category.trim().toLowerCase() : '';
  const category = cats.find(c=>c.toLowerCase() === catRaw) || (cats.includes('Other') ? 'Other' : null);
  const str = v => (typeof v === 'string' && v.trim()) ? v.trim().slice(0,200) : null;
  const items = [];
  if(Array.isArray(o.items)){
    o.items.slice(0,40).forEach(it=>{
      if(!it || typeof it !== 'object') return;
      const nm = str(it.name), am = parseAmountLoose(it.amount);
      if(nm && am != null) items.push({ name: nm.slice(0,60).toUpperCase(), amount: am });
    });
  }
  return { amount, currency: normalizeCurrencyCode(o.currency), category,
    merchant: str(o.merchant), date: validDateStr(o.date), notes: str(o.notes), items };
}
function buildReceiptPrompt(categories, opts){
  opts = opts || {};
  const schema = '{"total":number,"currency":"ISO 4217 code","category":"one of: '+categories.join(', ')+'","merchant":string,"date":"YYYY-MM-DD or null","notes":string,"items":[{"name":string,"amount":number}]}';
  if(opts.userText){
    return 'Extract one expense from the user\'s message below. Reply with a single JSON object and nothing else, in exactly this shape: '+schema+'.\n'
      +'Today is '+opts.today+'. If no currency is stated, use '+opts.defaultCurrency+'. Resolve relative dates like "yesterday" to YYYY-MM-DD; use null if no date is given.\n'
      +'Message: '+opts.userText;
  }
  return 'Read this receipt photo. Reply with a single JSON object and nothing else (no markdown, no commentary), in exactly this shape: '+schema+'. '
    +'"total" is the final amount paid as a plain number. "date" is the receipt date or null if not visible. "notes" is a short description of what was bought. "items" lists EVERY line on the receipt in order, each with its printed name (uppercase) and amount as a plain number: food/drink items, and also charges such as cover charge, GST/tax, service charge, and discounts as separate lines (omit the grand total from items).';
}
// Fold a validated extraction into the form-draft shape. The app stores every expense in SGD,
// so EUR is converted with the live rate when available; other currencies are kept as-is and
// flagged in the note so the user can fix the amount.
function receiptCurrencySymbol(c){
  const m = { SGD:'$', USD:'$', AUD:'$', CAD:'$', NZD:'$', HKD:'$', EUR:'€', GBP:'£', JPY:'¥', CNY:'¥', KRW:'₩', THB:'฿', CHF:'CHF ' };
  return c ? (m[c] || (c + ' ')) : '$';
}
function fmtReceiptAmt(n){ return Number.isInteger(n) ? String(n) : n.toFixed(2); }
// Itemised note exactly as printed on the receipt, e.g.
//   CARBONARA $10 / PASTA $10 / COVER CHARGE $2 / GST $1 / (blank) / TOTAL: $39
function receiptToDraft(r, rate){
  let amount = r.amount, hint = 'Read by AI — please check everything, then save.';
  const sym = receiptCurrencySymbol(r.currency);
  const lines = [];
  if(r.merchant) lines.push(r.merchant);
  if(r.items && r.items.length){
    r.items.forEach(it=>lines.push(it.name + ' ' + sym + fmtReceiptAmt(it.amount)));
    lines.push('');
    lines.push('TOTAL: ' + sym + fmtReceiptAmt(r.amount));
  } else if(r.notes){
    lines.push(r.notes);
  }
  if(r.currency === 'EUR' && rate){
    amount = Math.round(r.amount*rate*100)/100;
    lines.push('(Receipt in EUR; logged in SGD at the live rate)');
  } else if(r.currency && r.currency !== 'SGD'){
    lines.push('['+r.currency+' '+r.amount.toFixed(2)+' on receipt — amount may need converting]');
    hint = 'The receipt is in '+r.currency+' but expenses are logged in SGD — please convert the amount, then save.';
  }
  return { amount, category: r.category, date: r.date, note: lines.join('\n').trim() || null, hint };
}
function receiptErrorMessage(status){
  if(status === 401 || status === 403) return 'The AI service rejected the request (passcode or key problem on the server).';
  if(status === 404) return 'The AI service is not set up yet on the server.';
  if(status === 402) return 'The AI service is out of credit.';
  if(status === 429) return 'Rate limit reached (free models have daily limits). Try again later.';
  if(status >= 500) return 'The AI service is having trouble right now.';
  return 'The AI request failed (HTTP '+status+').';
}

function downscaleImageToDataUrl(file, maxSide, quality){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      try{
        const sc = Math.min(1, maxSide / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width*sc)), h = Math.max(1, Math.round(img.height*sc));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', quality));
      }catch(e){ reject(e); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('Could not read that image')); };
    img.src = url;
  });
}
// Free models are often busy or rate-limited, so try several in turn until one answers.
// dots-3 is a reasoning model: it spends tokens thinking first, so it needs a generous max_tokens.
const AI_MODEL_CHAIN = [
  'dots-studio/dots-3-note-preview:free',
  'google/gemma-4-31b-it:free',
  'google/gemma-4-26b-a4b-it:free',
  'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free'
];
async function callOpenRouter(content){
  let lastStatus = 0, lastNetwork = false, lastTimeout = false;
  for(const model of AI_MODEL_CHAIN){
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 60000);
    try{
      const res = await fetch(aiProxyUrl(), {
        method:'POST',
        headers:{ 'Authorization':'Bearer '+SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY, 'Content-Type':'application/json', 'x-vt-pass': PASS_HASH },
        body: JSON.stringify({ model, messages:[{ role:'user', content }], temperature:0, max_tokens:1400 }),
        signal: ctrl.signal
      });
      lastStatus = res.status; lastNetwork = false; lastTimeout = false;
      if(res.status === 401) return { error: receiptErrorMessage(401) };   // passcode/server problem: other models won't help
      if(res.status === 404) return { error: receiptErrorMessage(404) };
      if(!res.ok) continue;                                                // busy / gated model: try the next one
      let data = null;
      try{ data = JSON.parse((await res.text()).trim()); }catch(e){ continue; }
      if(!data || data.error) { lastStatus = (data && data.error && data.error.code) || 502; continue; }
      const msg = data.choices && data.choices[0] && data.choices[0].message;
      let text = msg && msg.content;
      if(Array.isArray(text)) text = text.map(p=>p && p.text || '').join('');
      if(typeof text === 'string' && text.trim()) return { text };
    }catch(e){
      if(e && e.name === 'AbortError') lastTimeout = true; else lastNetwork = true;
    }finally{ clearTimeout(timer); }
  }
  if(lastNetwork) return { error: 'Network problem reaching the AI service. Check your connection.' };
  if(lastTimeout) return { error: 'The free AI models are slow right now. Try again in a minute, or enter it manually.' };
  return { error: 'The free AI models are busy right now' + (lastStatus ? ' (HTTP '+lastStatus+')' : '') + '. Try again in a minute.' };
}

}

function finishScan(tripId, result){
  if(result.error){ scanStatus(result.error + ' You can enter it manually below.', true); return; }

  if(!parsed){ scanStatus('Could not understand the AI reply. You can enter it manually below.', true); return; }

async function handleScanFile(e, tripId){

function startSpeechInput(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  try{
    const r = new SR();
    r.lang = navigator.language || 'en-US';
    r.interimResults = false;
    r.onresult = ev=>{
      const t = ev.results && ev.results[0] && ev.results[0][0] && ev.results[0][0].transcript;
      const inp = document.getElementById('smart-text-input');
      if(t && inp) inp.value = t;
    };
    r.onerror = ()=>scanStatus('Could not hear that — try typing instead.', true);
    r.start();

function renderExpenseReceiptUploadHtml(){
  if(tempReceiptPath){
    return `<div style="display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap;">
      <img src="${coverPublicUrl(tempReceiptPath)}" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--border-strong);">
      <span class="muted-note" style="flex:1;min-width:120px;">Receipt attached.</span>

    </div>`;
  }
  // No "capture" attribute here on purpose — it forces mobile browsers straight into the
  // camera app, skipping the normal picker that also offers the photo gallery/files. Leaving
  // it off lets the OS show its usual chooser (camera, gallery, or files) instead.
  return `<input type="file" accept="image/*" id="expense-receipt-input" onchange="handleReceiptUpload(event)">
    <span class="muted-note">Snap a photo of the receipt, or pick one from your gallery.</span>`;

// Sends the just-uploaded receipt photo to the scan-receipt Edge Function, which calls
// Claude's vision model server-side (so the Anthropic API key never touches the browser) to
// read the line items and translate them to English. Pre-fills the form for review rather
// than saving straight to the database, since OCR/AI reads can occasionally mis-read a
// number — a human glance before hitting Save is cheap insurance on a financial record.
async function scanReceiptWithAI(){
  if(!tempReceiptPath){ alert('Attach a receipt photo first.'); return; }
  const imageUrl = coverPublicUrl(tempReceiptPath);
  beginLoading();
  try{
    const { data, error } = await sb.functions.invoke('scan-receipt', { body: { imageUrl } });
    if(error || (data && data.error)){
      const msg = (data && data.message) || (error && error.message) || 'Unknown error';
      alert('Could not scan the receipt: '+msg);
      return;
    }
    const amountEl = document.getElementById('expense-amount-input');
    const categoryEl = document.getElementById('expense-category-input');
    const noteEl = document.getElementById('expense-note-input');
    if(data.total!=null && amountEl) amountEl.value = Number(data.total).toFixed(2);
    if(data.category_guess && EXPENSE_CATEGORIES.includes(data.category_guess) && categoryEl) categoryEl.value = data.category_guess;
    if(noteEl){
      const parts = [];
      if(data.merchant) parts.push(data.merchant);
      if(data.items && data.items.length) parts.push(data.items.map(i=>`${i.name} (${i.price!=null?i.price:'?'})`).join(', '));
      if(data.currency) parts.push(`[${data.currency} on receipt — amount above may need converting]`);
      if(parts.length) noteEl.value = parts.join(' — ');
    }
    showToast((data.items&&data.items.length) ? 'Receipt scanned — review and save' : 'Scanned, but could not read line items — please check');
  }catch(e){
    alert('Could not scan the receipt: '+(e.message||e));
  } finally {
    endLoading();
  }
}
function refreshExpenseReceiptField(){
  const row = document.getElementById('expense-receipt-row');
  if(row) row.innerHTML = renderExpenseReceiptUploadHtml();
}
async function handleReceiptUpload(e){
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  beginLoading();
  try{
  let uploadBlob = file, uploadName = sanitizeFileName(file.name);
  try{ uploadBlob = await compressImageFile(file); uploadName = withJpgExt(file.name); }catch(compressErr){}
  const path = `shared/expenses/receipt_${Date.now()}_${uploadName}`;
  const { error } = await sb.storage.from('attachments').upload(path, uploadBlob);
  if(error){ alert('Receipt upload failed: '+error.message); return; }
  tempReceiptPath = path;
  refreshExpenseReceiptField();
  } finally {
    endLoading();
  }
}
function removeExpenseReceipt(){

  refreshExpenseReceiptField();
}
function startEditExpense(tripId, expenseId){
  const trip = getTrip(tripId);
  const exp = trip && (trip.expenses||[]).find(e=>e.id===expenseId);
  if(!exp) return;
  editingExpenseId = expenseId;
  tempReceiptPath = exp.receiptPath || null;
  renderTripExpensesModal(tripId);

  if(formEl && formEl.scrollIntoView) formEl.scrollIntoView({ behavior:'smooth', block:'start' });

function cancelEditExpense(){
  editingExpenseId = null;
  expenseDraft = null;
  tempReceiptPath = null;
  renderTripExpensesModal(ui.detailTripId);
}
async function saveExpense(tripId){
  const trip = getTrip(tripId);
  if(!trip) return;
  const amount = Number(document.getElementById('expense-amount-input').value);
  if(!amount || amount<=0){ alert('Enter an amount greater than 0.'); return; }
  const category = document.getElementById('expense-category-input').value;
  const dateInput = document.getElementById('expense-date-input');
  const date = (dateInput && dateInput.value) ? dateInput.value : (todayWithinTrip(trip) || null);
  const paidBy = document.getElementById('expense-paidby-input').value || null;
  const note = document.getElementById('expense-note-input').value.trim() || null;
  const payload = { trip_id: tripId, amount, category, date, paid_by: paidBy, note, receipt_path: tempReceiptPath || null };
  beginLoading();
  try{
    if(editingExpenseId){
      const { data: row, error } = await sb.from('expenses').update(payload).eq('id', editingExpenseId).select().single();
      if(error){ alert('Could not update expense: '+error.message); return; }
      const idx = (trip.expenses||[]).findIndex(e=>e.id===editingExpenseId);
      if(idx>-1) trip.expenses[idx] = dbExpenseToItem(row);
      editingExpenseId = null;
      tempReceiptPath = null;
      renderTripExpensesModal(tripId);
      showToast('Expense updated');
    } else {
      const { data: row, error } = await sb.from('expenses').insert(payload).select().single();
      if(error){ alert('Could not log expense: '+error.message); return; }
      trip.expenses = trip.expenses || [];
      trip.expenses.push(dbExpenseToItem(row));
      tempReceiptPath = null;
      expenseDraft = null;
      renderTripExpensesModal(tripId);
      showToast('Expense logged');
    }
  } finally {
    endLoading();
  }
}
async function deleteExpense(tripId, expenseId){
  const trip = getTrip(tripId);
  if(!trip) return;
  const exp = (trip.expenses||[]).find(e=>e.id===expenseId);
  beginLoading();
  try{
    try{ await sb.from('expenses').delete().eq('id', expenseId); }catch(e){}
    if(exp && exp.receiptPath){ try{ await sb.storage.from('attachments').remove([exp.receiptPath]); }catch(e){} }
    trip.expenses = (trip.expenses||[]).filter(e=>e.id!==expenseId);
    if(editingExpenseId===expenseId){ editingExpenseId=null; tempReceiptPath=null; }
    showToast('Expense deleted');
  } finally {
    endLoading();
  }
  renderTripExpensesModal(tripId);
}

/* ============ FINANCE DASHBOARD ============
   Full-page view (not a modal — the itemized table with filters/sort/search needs real
   room) covering booked-activity costs only, deliberately separate from the ad-hoc Trip
   Expenses cash log above. Two parts: a Victoria-vs-Weng-Seng balance built from each
   item's "Booked by" field (assumes an even 50/50 split of everything booked), and a
   logged settlement history ("Weng Seng Paid Victoria" or the reverse) that nets against
   that balance — covers the real scenario of a partial reimbursement transfer after the
   trip, not just a single lump-sum settle-up. */
let financeChart = null;
// Items with a cost but no "Booked by" set can't be attributed to either person, so they're
// deliberately excluded from the balance (rather than guessed at) and called out separately
// so Victoria knows which ones to go fill in for an accurate number.
function computeFinanceBalance(trip){
  const items = (trip.items||[]).filter(i=>!i.isDuplicate && !i.isPoi && Number(i.costTotal)>0);
  let totalVictoria = 0, totalWengSeng = 0, unassignedTotal = 0, unassignedCount = 0;
  items.forEach(i=>{
    const sgd = toSgd(i.costTotal, i.currency);
    if(i.bookedBy==='Victoria') totalVictoria += sgd;
    else if(i.bookedBy==='Weng Seng') totalWengSeng += sgd;
    // A "Both" item is credited half its cost to each person — adding the same amount to
    // both sides leaves the imbalance between them unchanged, which is exactly right: if you
    // each already paid your own half directly, that item owes nothing either way.
    else if(i.bookedBy==='Both'){ totalVictoria += sgd/2; totalWengSeng += sgd/2; }
    else { unassignedTotal += sgd; unassignedCount++; }
  });
  // Manual adjustments — an extra amount one person paid/is owed outside of any booked
  // activity (e.g. cash spent off-app). Unlike a settlement, this changes the underlying
  // imbalance itself, exactly as if it were another activity cost attributed to that person.
  let adjustmentsVictoria = 0, adjustmentsWengSeng = 0;
  (trip.adjustments || []).forEach(a=>{
    const sgd = toSgd(a.amount, a.currency);
    if(a.person==='Victoria') adjustmentsVictoria += sgd;
    else if(a.person==='Weng Seng') adjustmentsWengSeng += sgd;
  });
  totalVictoria += adjustmentsVictoria;
  totalWengSeng += adjustmentsWengSeng;
  const combined = totalVictoria + totalWengSeng;
  const fairShare = combined / 2;
  const rawBalance = totalVictoria - fairShare; // positive: Victoria fronted more than her fair share
  const settlements = trip.settlements || [];
  let settledToVictoria = 0, settledFromVictoria = 0;
  settlements.forEach(s=>{
    const sgd = toSgd(s.amount, s.currency);
    if(s.toPerson==='Victoria') settledToVictoria += sgd;
    if(s.fromPerson==='Victoria') settledFromVictoria += sgd;
  });
  const netSettlement = settledToVictoria - settledFromVictoria; // net money Victoria has actually received back
  const finalBalance = rawBalance - netSettlement; // positive: Weng Seng still owes Victoria this much
  return { totalVictoria, totalWengSeng, unassignedTotal, unassignedCount, fairShare, finalBalance };
}
function getFilteredFinanceItems(trip){
  let items = (trip.items||[]).filter(i=>!i.isDuplicate && !i.isPoi && Number(i.costTotal)>0);
  if(ui.financeTypeFilter!=='all') items = items.filter(i=>i.type===ui.financeTypeFilter);
  if(ui.financeStatusFilter!=='all') items = items.filter(i=>i.status===ui.financeStatusFilter);
  if(ui.financeBookedByFilter!=='all'){
    items = ui.financeBookedByFilter==='__unassigned__'
      ? items.filter(i=>!i.bookedBy)
      : items.filter(i=>i.bookedBy===ui.financeBookedByFilter);
  }
  const q = (ui.financeSearchQuery||'').trim().toLowerCase();
  if(q) items = items.filter(i=>itemSearchText(i).includes(q));
  const key = ui.financeSortKey || 'date';
  const dir = ui.financeSortDir==='desc' ? -1 : 1;
  items = items.slice().sort((a,b)=>{
    let av, bv;
    if(key==='cost'){ av = toSgd(a.costTotal,a.currency); bv = toSgd(b.costTotal,b.currency); }
    else if(key==='name'){ av = (a.name||'').toLowerCase(); bv = (b.name||'').toLowerCase(); }
    else if(key==='type'){ av = a.type||''; bv = b.type||''; }
    else if(key==='bookedBy'){ av = a.bookedBy||''; bv = b.bookedBy||''; }
    else if(key==='status'){ av = a.status||''; bv = b.status||''; }
    else { av = a.dateStart||''; bv = b.dateStart||''; }
    if(av<bv) return -1*dir;
    if(av>bv) return 1*dir;
    return 0;
  });
  return items;
}
// Normalizes booked-activity cost items AND manual adjustments (from "Add Expenses") into one
// shape so they can share the same itemized table below the balance/adjustment cards, rather
// than adjustments only living in their own little list — that's the one place to see and
// sort everything that feeds into the balance.
function getFinanceTableRows(trip){
  const itemRows = getFilteredFinanceItems(trip).map(i=>({
    kind:'item', id:i.id, name:i.name||'Untitled', type:i.type, date:i.dateStart||'',
    bookedBy:i.bookedBy||'', status:i.status, costSgd: toSgd(i.costTotal,i.currency),
  }));
  // Adjustments have no Type/Status of their own, so they only show up when those filters
  // are at "All" — narrowing to a specific type or status is asking for booked-activity rows.
  let adjRows = [];
  if(ui.financeTypeFilter==='all' && ui.financeStatusFilter==='all'){
    adjRows = (trip.adjustments||[]).filter(a=>{
      if(ui.financeBookedByFilter!=='all'){
        if(ui.financeBookedByFilter==='__unassigned__' || ui.financeBookedByFilter==='Both') return false;
        if(a.person!==ui.financeBookedByFilter) return false;
      }
      const q = (ui.financeSearchQuery||'').trim().toLowerCase();
      if(q){
        const text = ((a.note||'')+' '+a.person+' manual adjustment expense').toLowerCase();
        if(!text.includes(q)) return false;
      }
      return true;
    }).map(a=>({
      kind:'adjustment', id:a.id, name: a.note ? a.note : 'Manual Adjustment', type:'Adjustment',
      date:a.date||'', bookedBy:a.person, status:'', costSgd: toSgd(a.amount,a.currency),
    }));
  }
  const combined = itemRows.concat(adjRows);
  const key = ui.financeSortKey || 'date';
  const dir = ui.financeSortDir==='desc' ? -1 : 1;
  combined.sort((a,b)=>{
    let av, bv;
    if(key==='cost'){ av=a.costSgd; bv=b.costSgd; }
    else if(key==='name'){ av=a.name.toLowerCase(); bv=b.name.toLowerCase(); }
    else if(key==='type'){ av=a.type||''; bv=b.type||''; }
    else if(key==='bookedBy'){ av=a.bookedBy||''; bv=b.bookedBy||''; }
    else if(key==='status'){ av=a.status||''; bv=b.status||''; }
    else { av=a.date||''; bv=b.date||''; }
    if(av<bv) return -1*dir;
    if(av>bv) return 1*dir;
    return 0;
  });
  return combined;
}
function financeSortToggle(key){
  if(ui.financeSortKey===key){
    ui.financeSortDir = ui.financeSortDir==='asc' ? 'desc' : 'asc';
  } else {
    ui.financeSortKey = key;
    ui.financeSortDir = key==='cost' ? 'desc' : 'asc'; // biggest cost first is usually what you want
  }
  render();
}
function financeSortArrow(key){

}

function renderFinanceChart(){
  const canvas = document.getElementById('finance-chart');
  if(!canvas || typeof Chart==='undefined') return;
  const trip = getTrip(ui.detailTripId);
  if(!trip) return;
  const items = getFilteredFinanceItems(trip);
  const byType = {};
  items.forEach(i=>{ byType[i.type] = (byType[i.type]||0) + toSgd(i.costTotal,i.currency); });
  const labels = Object.keys(byType);
  if(financeChart) financeChart.destroy();
  if(!labels.length) return;
  financeChart = new Chart(canvas, {
    type:'doughnut',
    data:{ labels, datasets:[{ data: labels.map(l=>byType[l]), backgroundColor: labels.map(l=>TYPE_COLORS[l]||'#999'), borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:11} } } }, cutout:'65%' }
  });
}
function renderSettlementRow(s, trip){
  const metaBits = [s.date? fmtDateShort(s.date):'', s.note? escapeHtml(s.note):''].filter(Boolean).join(' · ');
  return `<div class="card expense-row" id="settlement-row-${s.id}" style="position:relative;margin-bottom:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;">
    <div style="font-size:20px;flex-shrink:0;">💸</div>
    <div style="flex:1;min-width:0;">
      <div style="font-weight:600;">${escapeHtml(s.fromPerson)} → ${escapeHtml(s.toPerson)}: ${costHtml(s.amount, s.currency)}</div>
      ${metaBits? `<div class="countdown-sub">${metaBits}</div>`:''}
    </div>
    <button class="btn btn-sm" onclick="showDeleteSettlementConfirm(event,'${trip.id}','${s.id}')" title="Delete">✕</button>
  </div>`;

async function saveSettlement(tripId){
  const trip = getTrip(tripId);
  if(!trip) return;
  const fromPerson = document.getElementById('settlement-from-input').value;
  const toPerson = document.getElementById('settlement-to-input').value;
  if(fromPerson===toPerson){ alert('From and To must be different people.'); return; }
  const amount = parseFloat(document.getElementById('settlement-amount-input').value);
  if(!amount || amount<=0){ alert('Enter an amount greater than 0.'); return; }
  const currency = document.getElementById('settlement-currency-input').value==='EUR' ? 'EUR' : 'SGD';
  const date = document.getElementById('settlement-date-input').value || null;
  const note = document.getElementById('settlement-note-input').value.trim() || null;
  const payload = { trip_id: tripId, from_person: fromPerson, to_person: toPerson, amount, currency, date, note };
  beginLoading();
  try{
    const { data: row, error } = await sb.from('settlements').insert(payload).select().single();
    if(error){ alert('Could not log payment: '+error.message); return; }
    trip.settlements = trip.settlements || [];
    trip.settlements.push(dbSettlementToItem(row));
    showToast('Payment logged');
    render();
  } finally {
    endLoading();
  }
}
function showDeleteSettlementConfirm(e, tripId, settlementId){
  e.stopPropagation();
  const row = document.getElementById('settlement-row-'+settlementId);
  if(!row) return;
  const existing = row.querySelector('.confirm-box');
  if(existing){ existing.remove(); return; }
  const box = document.createElement('div');
  box.className = 'popover confirm-box';
  box.innerHTML = `
    <p>Delete this payment record? This can't be undone.</p>
    <div class="confirm-actions">
      <button class="btn btn-sm" style="flex:1;" onclick="event.stopPropagation();this.closest('.confirm-box').remove()">Cancel</button>
      <button class="btn btn-danger btn-sm" style="flex:1;" onclick="event.stopPropagation();deleteSettlement('${tripId}','${settlementId}')">Delete</button>
    </div>`;
  box.addEventListener('click', e2=>e2.stopPropagation());
  row.appendChild(box);
}
async function deleteSettlement(tripId, settlementId){
  beginLoading();
  try{
    try{ await sb.from('settlements').delete().eq('id', settlementId); }catch(e){}
    const trip = getTrip(tripId);
    if(trip) trip.settlements = (trip.settlements||[]).filter(s=>s.id!==settlementId);
    showToast('Payment record deleted');
  } finally {
    endLoading();
  }
  render();
}

/* ============ SHOPPING LIST (per country, per trip) ============
   For things worth buying in a specific place — "get this in Venice", "look out for that in
   Paris" — tracked separately from booked-activity costs and the ad-hoc Trip Expenses log.
   Prices follow the same EUR/SGD pattern as activity costs (see toSgd/costHtml). */
let editingShoppingItemId = null;
let tempShoppingImagePath = null;
function openShoppingList(tripId){
  ui.detailTripId = tripId;
  editingShoppingItemId = null;
  tempShoppingImagePath = null;
  modalPreventOutsideClose = true;
  renderShoppingListModal(tripId);
}
function renderShoppingListModal(tripId){
  const trip = getTrip(tripId);
  if(!trip) return;
  const countries = trip.countries || [];
  const filterCountry = ui.shoppingCountryFilter || 'all';
  const all = (trip.shoppingItems||[]).slice().sort((a,b)=>
    (a.isBought===b.isBought ? 0 : (a.isBought ? 1 : -1)) || (b.createdAt||'').localeCompare(a.createdAt||''));
  const filtered = filterCountry==='all' ? all : all.filter(i=>i.country===filterCountry);
  const editing = editingShoppingItemId ? (trip.shoppingItems||[]).find(i=>i.id===editingShoppingItemId) : null;
  const groups = groupShoppingByCountry(filtered);

  const html = `
    <div class="modal-header">
      <h3>Shopping List — ${escapeHtml(trip.name)}</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>

    <div class="card" id="shopping-form-card" style="margin-bottom:22px;padding:18px;">
      <div class="section-title">${editing? 'Edit Item' : 'Add Item'}</div>
      <div class="field">
        <label class="field-label">Item</label>
        <input type="text" id="shopping-name-input" placeholder="e.g. Murano glass necklace" value="${editing?escapeHtml(editing.itemName):''}">
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">Country</label>
          <select id="shopping-country-input">
            ${countries.length
              ? countries.map(c=>`<option value="${escapeHtml(c)}" ${(editing? editing.country===c : (filterCountry!=='all' && filterCountry===c))?'selected':''}>${escapeHtml(c)}</option>`).join('')
              : `<option value="">—</option>`}
          </select>
        </div>
        <div class="field">
          <label class="field-label">Price</label>
          <input type="number" min="0" step="0.01" id="shopping-price-input" placeholder="0.00" value="${editing&&editing.price?editing.price:''}">
        </div>
        <div class="field" style="flex:0.6;">
          <label class="field-label">Currency</label>
          <select id="shopping-currency-input">
            <option value="SGD" ${(!editing||editing.currency!=='EUR')?'selected':''}>SGD</option>
            <option value="EUR" ${editing&&editing.currency==='EUR'?'selected':''}>EUR</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Where to find it <span style="font-weight:400;">(optional)</span></label>
        <input type="text" id="shopping-foundat-input" placeholder="e.g. Rialto Market, Murano island" value="${editing&&editing.foundAt?escapeHtml(editing.foundAt):''}">
      </div>
      <div class="field">
        <label class="field-label">Notes <span style="font-weight:400;">(optional)</span></label>
        <input type="text" id="shopping-notes-input" placeholder="e.g. Get the blue one, compare prices first" value="${editing&&editing.notes?escapeHtml(editing.notes):''}">
      </div>
      <div class="field">
        <label class="field-label">Photo <span style="font-weight:400;">(optional)</span></label>
        <div id="shopping-image-row">${renderShoppingImageUploadHtml()}</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary" onclick="saveShoppingItem('${trip.id}')">${editing? 'Save Changes' : '+ Add Item'}</button>
        ${editing? `<button class="btn" onclick="cancelEditShoppingItem('${trip.id}')">Cancel</button>` : ''}
      </div>
    </div>

    ${countries.length>1 ? `
    <div class="filter-bar">
      <select class="filter-select" onchange="ui.shoppingCountryFilter=this.value;renderShoppingListModal('${trip.id}');">
        <option value="all" ${filterCountry==='all'?'selected':''}>All Countries</option>
        ${countries.map(c=>`<option value="${escapeHtml(c)}" ${filterCountry===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
      </select>
    </div>` : ''}

    <div id="shopping-list">
      ${groups.length===0 ? '<div class="empty-state"><span class="emoji">🛍️</span><p>No shopping list items yet.</p></div>' : groups.map(g=>renderShoppingGroupHtml(g, trip)).join('')}
    </div>

    <div class="modal-footer">
      <button class="btn btn-primary" onclick="closeModal()">Close</button>
    </div>
  `;
  openModal(html, true);

function groupShoppingByCountry(list){
  const byCountry = {};
  const order = [];
  list.forEach(i=>{
    const key = i.country || 'No country set';
    if(!byCountry[key]){ byCountry[key]=[]; order.push(key); }
    byCountry[key].push(i);
  });
  return order.map(key=>({ country:key, items:byCountry[key], total: byCountry[key].reduce((s,i)=>s+toSgd(i.price,i.currency),0) }));
}
function renderShoppingGroupHtml(group, trip){
  return `
    <div style="margin-bottom:18px;">
      <div class="expense-day-header">
        <span>${escapeHtml(group.country)}</span>
        <span>${fmtCost(group.total)}</span>
      </div>
      ${group.items.map(i=>renderShoppingRow(i, trip)).join('')}
    </div>`;
}
// Tapping anywhere on the row (including its thumbnail) opens the read-only detail popup —

function startEditShoppingItem(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip && (trip.shoppingItems||[]).find(i=>i.id===itemId);
  if(!item) return;
  editingShoppingItemId = itemId;
  tempShoppingImagePath = item.imagePath || null;
  renderShoppingListModal(tripId);
  const formEl = document.getElementById('shopping-form-card');
  if(formEl && formEl.scrollIntoView) formEl.scrollIntoView({ behavior:'smooth', block:'start' });
}
function cancelEditShoppingItem(tripId){
  editingShoppingItemId = null;
  tempShoppingImagePath = null;
  renderShoppingListModal(tripId);
}
// Mirrors the Trip Expenses receipt-photo upload pattern (see renderExpenseReceiptUploadHtml/
// handleReceiptUpload) — same "attachments" bucket, same no-capture-attribute choice so mobile
// browsers show their normal camera-or-gallery picker instead of forcing the camera straight open.
function renderShoppingImageUploadHtml(){
  if(tempShoppingImagePath){
    return `<div style="display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap;">
      <img src="${coverPublicUrl(tempShoppingImagePath)}" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--border-strong);">
      <span class="muted-note" style="flex:1;min-width:120px;">Photo attached.</span>
      <button type="button" class="btn btn-sm" onclick="removeShoppingImage()">Remove</button>
    </div>`;
  }
  return `<input type="file" accept="image/*" id="shopping-image-input" onchange="handleShoppingImageUpload(event)">
    <span class="muted-note">Snap a photo of the item, or pick one from your gallery.</span>`;
}
function refreshShoppingImageField(){
  const row = document.getElementById('shopping-image-row');
  if(row) row.innerHTML = renderShoppingImageUploadHtml();
}
async function handleShoppingImageUpload(e){
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  beginLoading();
  try{
    let uploadBlob = file, uploadName = sanitizeFileName(file.name);
    try{ uploadBlob = await compressImageFile(file); uploadName = withJpgExt(file.name); }catch(compressErr){}
    const path = `shared/shopping/item_${Date.now()}_${uploadName}`;
    const { error } = await sb.storage.from('attachments').upload(path, uploadBlob);
    if(error){ alert('Photo upload failed: '+error.message); return; }
    tempShoppingImagePath = path;
    refreshShoppingImageField();
  } finally {
    endLoading();
  }
}
function removeShoppingImage(){
  tempShoppingImagePath = null;
  refreshShoppingImageField();
}
async function saveShoppingItem(tripId){
  const trip = getTrip(tripId);
  if(!trip) return;
  const itemName = document.getElementById('shopping-name-input').value.trim();
  if(!itemName){ alert('Please enter an item name.'); return; }
  const country = document.getElementById('shopping-country-input').value || null;
  const price = parseFloat(document.getElementById('shopping-price-input').value) || 0;
  const currency = document.getElementById('shopping-currency-input').value === 'EUR' ? 'EUR' : 'SGD';
  const foundAt = document.getElementById('shopping-foundat-input').value.trim() || null;
  const notes = document.getElementById('shopping-notes-input').value.trim() || null;
  const payload = { trip_id: tripId, country, item_name: itemName, price, currency, found_at: foundAt, notes, image_path: tempShoppingImagePath || null };
  beginLoading();
  try{
    if(editingShoppingItemId){
      const { data: row, error } = await sb.from('shopping_items').update(payload).eq('id', editingShoppingItemId).select().single();
      if(error){ alert('Could not update item: '+error.message); return; }
      const idx = (trip.shoppingItems||[]).findIndex(i=>i.id===editingShoppingItemId);
      if(idx>-1) trip.shoppingItems[idx] = dbShoppingItemToItem(row);
      editingShoppingItemId = null;
      tempShoppingImagePath = null;
      renderShoppingListModal(tripId);
      showToast('Item updated');
    } else {
      const { data: row, error } = await sb.from('shopping_items').insert(payload).select().single();
      if(error){ alert('Could not add item: '+error.message); return; }
      trip.shoppingItems = trip.shoppingItems || [];
      trip.shoppingItems.push(dbShoppingItemToItem(row));
      tempShoppingImagePath = null;
      renderShoppingListModal(tripId);
      showToast('Item added');
    }
  } finally {
    endLoading();
  }
}

/* ============ TODAY ============ */
function renderToday(){
  const t = todayStr();
  const n = nowTime();
  let allToday = [];
  data.trips.forEach(trip=>{
    (trip.items||[]).forEach(item=>{
      // Exactly what the trip's day view shows for today: items dated today (a multi-night stay
      // has its own "Continued" row per day), no Places of Interest.
      if(item.isPoi) return;
      if(item.dateStart === t) allToday.push({...item, tripName: trip.name, tripId: trip.id});
    });
  });
  // Same order as the itinerary list for that day.
  allToday.sort(compareItems);
  // "upcoming" = ongoing multi-day items already in progress, or items starting today that haven't started yet
  const upcoming = allToday.filter(i => i.dateStart < t || !i.timeStart || i.timeStart >= n);

  const list = ui.todayShowAll ? allToday : upcoming;

  return `
    <div class="toolbar-row" style="margin-top:28px;">
      <div>
        <h1 class="page-title" style="margin:0;">Today</h1>
        <div class="countdown-sub">${fmtDateLong(t)}</div>
      </div>
    </div>
    ${allToday.length===0 ? `
      <div class="empty-state"><span class="emoji">☀️</span><p>Nothing on the itinerary for today.</p></div>
    ` : `
      <div class="today-scroll">
        ${renderTodayList(allToday)}
      </div>
    `}
  `;
}
// The item happening right now: the latest timed item that has started and hasn't ended yet.
function todayCurrentId(items){
  const n = nowTime();
  const started = items.filter(i=>i.timeStart && i.timeStart<=n).sort((a,b)=>a.timeStart.localeCompare(b.timeStart));
  if(!started.length) return null;
  const cur = started[started.length-1];
  if(cur.timeEnd && cur.timeEnd > cur.timeStart && n >= cur.timeEnd) return null;
  return cur.id;
}
setInterval(()=>{ if(ui.view==='today') markTodayCurrent(); }, 60000); // keeps the highlight in step with the clock
function markTodayCurrent(){
  document.querySelectorAll('.item-card.item-current').forEach(c=>c.classList.remove('item-current'));
  document.querySelectorAll('.now-pill').forEach(p=>p.remove());

let modalPreventOutsideClose = false;
// Backs a row of .chip-opt pill buttons standing in for a <select> — the hidden input still
// holds the actual value, so every existing reader (saveItem(), autofillFromMapsLink(), etc.)
// keeps working against document.getElementById(id).value exactly as it did with a <select>.
// toggleable lets a required field (Type, Status) only ever select — clicking the active chip
// again is a no-op — while an optional field (Booked By) can clear back to "nobody chosen".
function selectChip(hiddenInputId, groupId, btn, toggleable){
  const hidden = document.getElementById(hiddenInputId);
  const group = document.getElementById(groupId);
  if(!hidden || !group) return;
  const value = btn.dataset.value;
  const isActive = btn.classList.contains('on');
  const newValue = (toggleable && isActive) ? '' : value;
  hidden.value = newValue;
  hidden.dataset.userChanged = '1';
  syncChipActive(hiddenInputId, groupId);
  if(hiddenInputId==='item-bookedby-input'){
    const hint = document.getElementById('item-bookedby-hint');
    if(hint) hint.style.display = newValue==='Both' ? '' : 'none';
  }
}
// Re-reads the hidden input's current value and highlights the matching chip — needed
// whenever something other than a chip click sets the value in code (e.g. autofillFromMapsLink
// guessing a Type from the pasted place name).
function syncChipActive(hiddenInputId, groupId){
  const hidden = document.getElementById(hiddenInputId);
  const group = document.getElementById(groupId);
  if(!hidden || !group) return;
  group.querySelectorAll('.chip-opt').forEach(b=>{
    b.classList.toggle('on', hidden.value!=='' && b.dataset.value===hidden.value);
  });
}

/* ---- File attachment preview (opens as an in-app pop-out instead of a new browser tab) ---- */
function openFilePreview(url, name){
  const ext = (name.split('.').pop()||'').toLowerCase();
  const isImage = ['png','jpg','jpeg','gif','webp','svg'].includes(ext);
  const isPdf = ext==='pdf';
  let body;
  if(isImage) body = `<img src="${url}" style="max-width:100%;border-radius:10px;display:block;margin:0 auto;">`;
  // A raw <iframe src="pdf-url"> hands off to the browser's own native PDF plugin, which on
  // mobile Safari/Chrome often locks to page 1 with no way to scroll further inside a modal
  // (the touch-scroll gesture gets captured by the page behind it instead). Routing through
  // Mozilla's PDF.js web viewer instead renders the PDF as a normal scrollable web page, so
  // swiping down moves through every page reliably on both mobile and desktop.
  else if(isPdf) body = `<iframe src="https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(url)}" style="width:100%;height:75vh;border:1px solid var(--border);border-radius:10px;" allowfullscreen></iframe>`;
  else body = `<p class="muted-note">Preview isn't available for this file type, but you can open it below.</p>`;
  document.getElementById('preview-content').innerHTML = `
    <div class="modal-header"><h3 style="font-size:14px;word-break:break-all;padding-right:10px;">${escapeHtml(name)}</h3><button class="modal-close" onclick="closeFilePreview()">&times;</button></div>
    ${body}
    <div class="modal-footer">
      <a class="btn" href="${url}" target="_blank" rel="noopener">Open / Download</a>
      <button class="btn btn-primary" onclick="closeFilePreview()">Close</button>
    </div>`;
  document.getElementById('preview-overlay').classList.remove('hidden');
}
function closeFilePreview(){
  document.getElementById('preview-overlay').classList.add('hidden');
  document.getElementById('preview-content').innerHTML = '';
}
document.getElementById('preview-overlay').addEventListener('click', e=>{

async function openFilePreviewFor(tripId, itemId, idx){
  const trip = getTrip(tripId);
  const item = trip && trip.items.find(i=>i.id===itemId);

  if(!f) return;
  const { data, error } = await sb.storage.from('attachments').createSignedUrl(f.storagePath, 3600);
  if(error){

    // storage (e.g. left behind by a past removal that deleted the object but not this
    // reference). Rather than a dead-end error every time, offer to clear the broken link.
    const shouldRemove = confirm(`Could not open "${f.name}" — the file seems to be missing.\n\nRemove this broken attachment from the activity?`);
    if(shouldRemove){
      beginLoading();

        render();
        showToast('Removed broken attachment');
      }catch(e){
        alert('Could not remove the broken attachment: '+(e.message||e));

      }
    }
    return;
  }
  openFilePreview(data.signedUrl, f.name);
}

// One-tap way to hand a location to a taxi driver or send it to a travel companion —
// uses the native share sheet on mobile (where it's most useful), falling back to a
// clipboard copy (with a plain "copy the link" nudge if even that fails, e.g. no
// clipboard permission).
async function shareLocation(tripId, itemId){
  const trip = getTrip(tripId);
  const item = trip && trip.items.find(i=>i.id===itemId);
  if(!item || !item.mapsLink) return;
  const title = item.name || 'Location';
  if(navigator.share){
    try{ await navigator.share({ title, text: title, url: item.mapsLink }); return; }
    catch(e){ if(e && e.name==='AbortError') return; /* user cancelled the share sheet */ }
  }
  try{
    await navigator.clipboard.writeText(`${title}\n${item.mapsLink}`);
    alert('Location copied — paste it into Maps, a message, or share with your companion.');
  }catch(e){
    alert('Could not copy automatically — long-press the Navigation link above to copy it.');
  }
}

// Converts a rich-text notes field to clean plain-text lines. Turning <br>/<p>/<div> line
// breaks into real newlines BEFORE reading textContent matters — otherwise two separate
// lines in the notes editor (e.g. "Reservation: …" and "Opening hours: …") collapse into one
// run-on line with no space between them. Also decodes entities (&amp; etc.) for free, since
// it goes through a real element rather than a regex strip.
function htmlNotesToLines(html){
  if(!html) return [];
  const withBreaks = html.replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li)>/gi, '\n');
  const el = document.createElement('div');
  el.innerHTML = withBreaks;
  return (el.textContent || '').split('\n').map(l=>l.trim()).filter(Boolean);
}
// Plain-text summary of a single day's plan, formatted to be readable pasted straight into
// WhatsApp/Messages — for the times you or Weng Seng are separated, someone's phone dies, or
// it's just easier to glance at a text than open the app. Deliberately built from every
// activity on that day (not whatever Type/Status/Booked-by filter happens to be active on
// screen), since "share today's plan" should mean the whole day.
function buildDayShareText(trip, dayNum){
  const dayDate = trip.startDate ? addDays(trip.startDate, dayNum) : '';
  const dayTitle = trip.dayTitles && trip.dayTitles[dayNum] ? trip.dayTitles[dayNum] : '';
  const items = (trip.items||[])
    .filter(i=>!i.isPoi && itemMatchesDay(i, trip, dayNum))
    .slice()
    .sort(compareItems);

  const headerLines = [`📅 ${trip.name} — Day ${dayNum}${dayDate?` (${fmtDateShort(dayDate)})`:''}`];
  if(dayTitle) headerLines.push(dayTitle);

  const blocks = items.map((item, idx)=>{
    const emoji = (item.icon || TYPE_ICONS[item.type] || '📌');
    const time = itemTimeLabel(item);
    // "Nil" just means "doesn't need booking" — worth knowing in the app, but stamping
    // every single card with it here just repeats itself down the whole message. Only the
    // statuses that actually need action (Booked/To Book) earn a tag.
    const statusTag = item.status && item.status!=='Nil' ? ` [${item.status.toUpperCase()}]` : '';
    const lines = [`${idx+1}. ${emoji} ${time? time+' ' : ''}${item.name||'Untitled'}${statusTag}`];
    htmlNotesToLines(item.notes).forEach(line=> lines.push(`   ${line}`));
    if(Number(item.costTotal) > 0){
      lines.push(`   ${fmtCost(toSgd(item.costTotal, item.currency))}/pax${item.bookedBy? ' · '+item.bookedBy : ''}`);
    }
    if(item.mapsLink) lines.push(`   📍 ${item.mapsLink}`);
    return lines.join('\n');
  });

  return [...headerLines, '', ...blocks.length? [blocks.join('\n\n')] : ['No activities planned for this day yet.'], '', '—', 'Sent from VicTravels'].join('\n');
}
async function shareDayPlan(tripId){
  const trip = getTrip(tripId);
  if(!trip || ui.dayFilter==='all') return;
  const dayNum = Number(ui.dayFilter);
  const text = buildDayShareText(trip, dayNum);
  // Deliberately NOT passing a separate `title` here — the text above already opens with its
  // own header line, and several share targets (WhatsApp included) render title AND text as
  // two separate blocks, which just duplicated the same line twice in the shared message.
  if(navigator.share){
    try{ await navigator.share({ text }); return; }
    catch(e){ if(e && e.name==='AbortError') return; /* user cancelled the share sheet */ }
  }
  try{
    await navigator.clipboard.writeText(text);
    showToast('Day’s plan copied — paste it into WhatsApp or a message.');
  }catch(e){
    alert('Could not copy automatically. Here is the plan to copy by hand:\n\n'+text);
  }
}

function showPoiDayPicker(tripId, itemId){
  const trip = getTrip(tripId);
  const wrap = document.getElementById('poi-add-wrap');
  if(!trip || !wrap) return;
  let n = 1;
  if(trip.endDate) n = Math.max(1, daysBetween(trip.startDate, trip.endDate) + 1);
  const opts = [];
  for(let d=0; d<n; d++){
    const dt = addDays(trip.startDate, d);

// IATA airline code -> ICAO callsign prefix (OpenSky reports ICAO-style callsigns, e.g. SIA324).
const FL_AIRLINES = {
  SQ:'SIA', TR:'TGW', MI:'SLK', '3K':'JSA', KL:'KLM', AF:'AFR', EK:'UAE', QR:'QTR', BA:'BAW', LH:'DLH',
  SU:'AFL', EY:'ETD', TK:'THY', AY:'FIN', SK:'SAS', LX:'SWR', OS:'AUA', IB:'IBE', VY:'VLG', TP:'TAP',
  AZ:'ITY', LO:'LOT', OK:'CSA', SN:'BEL', EI:'EIN', FR:'RYR', U2:'EZY', W6:'WZZ', DY:'NAX', D8:'IBK',
  HV:'TRA', TO:'TVF', UX:'AEA', KE:'KAL', OZ:'AAR', JL:'JAL', NH:'ANA', CX:'CPA', KA:'HDA', CI:'CAL',
  BR:'EVA', MU:'CES', CA:'CCA', CZ:'CSN', MF:'CXA', HU:'CHH', TG:'THA', FD:'AIQ', AK:'AXM', D7:'XAX',
  QZ:'AWQ', GA:'GIA', MH:'MAS', VN:'HVN', VJ:'VJC', PR:'PAL', '5J':'CEB', QF:'QFA', JQ:'JST', VA:'VOZ',
  NZ:'ANZ', AI:'AIC', '6E':'IGO', UL:'ALK', AA:'AAL', DL:'DAL', UA:'UAL', AC:'ACA', WN:'SWA', B6:'JBU',
  AS:'ASA', LA:'LAN', SV:'SVA', MS:'MSR', ET:'ETH', SA:'SAA', KQ:'KQA', WY:'OMA', GF:'GFA', RJ:'RJA',
  FZ:'FDB', G9:'ABY', PC:'PGT', '8M':'MMA', OD:'MXD', BI:'RBA', JT:'LNI', ID:'BTK', QG:'CTV', IT:'TTW'
};
const FL_LS_NUM = 'victravels_fl_num';        // { activityId: 'SQ324' }
const FL_LS_GATE = 'victravels_fl_gate';      // { activityId: { gate, terminal } }
const FL_LS_ALERTS = 'victravels_fl_alerts';  // { activityId: { tripId, startedAt } }
function flLoad(key){ try{ return JSON.parse(localStorage.getItem(key)||'{}') || {}; }catch(e){ return {}; } }
function flSave(key, obj){ try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){} }

// Pure: pull a flight number out of free text (name + notes). Prefers a code we know.
function flParseFlightNumber(text){
  const t = String(text||'').replace(/<[^>]*>/g,' ');
  const re = /\b([A-Z]{2}|[A-Z]\d|\d[A-Z])\s?(\d{1,4})\b/g;
  let m, first = null;
  while((m = re.exec(t))){
    const rec = flMakeFlight(m[1], m[2]);
    if(rec.icao) return rec;
    if(!first) first = rec;
  }
  return first;
}
function flMakeFlight(code, num){
  const n = String(parseInt(num,10));
  const icao = FL_AIRLINES[code] || null;
  return { code, num: n, iata: code+n, icao, callsign: icao ? icao+n : null };
}
// Pure: does an OpenSky callsign (padded, maybe zero-padded or with a letter suffix) match?
function flMatchCallsign(raw, flight){
  if(!raw || !flight) return false;
  const cs = String(raw).trim().toUpperCase();
  const prefixes = [flight.icao, flight.code].filter(Boolean);
  return prefixes.some(p=>{
    if(!cs.startsWith(p)) return false;
    const m = cs.slice(p.length).match(/^0*(\d{1,4})[A-Z]?$/);
    return !!m && m[1] === flight.num;
  });
}
// Pure: OpenSky state vector -> readable summary.
function flSummarize(s, nowSec){
  if(!s) return null;
  const alt = s[7]!=null ? s[7] : s[13];
  return {
    callsign: (s[1]||'').trim(), country: s[2]||'', lastContact: s[4]||null,
    lon: s[5], lat: s[6], altM: alt!=null ? alt : null,
    onGround: !!s[8], speedMs: s[9], heading: s[10], vrate: s[11],
    ageSec: s[4] ? Math.max(0, Math.round((nowSec||Date.now()/1000) - s[4])) : null
  };
}
// Pure: compare two summaries and return human-readable change messages.
function flDiffStatus(prev, cur){
  const out = [];
  if(!prev) return out;
  if(prev.found === false && cur && cur.found !== false) { out.push('Flight is now visible on the live feed'); return out; }
  if(prev.found !== false && (!cur || cur.found === false)) { out.push('Flight left the live feed (landed, or out of receiver coverage)'); return out; }
  if(!cur) return out;
  if(prev.onGround && !cur.onGround) out.push('Took off');
  else if(!prev.onGround && cur.onGround) out.push('Landed');
  else if(!cur.onGround){
    if(prev.altM!=null && cur.altM!=null && prev.altM - cur.altM >= 1500) out.push('Altitude dropping: '+Math.round(prev.altM*3.281)+' ft to '+Math.round(cur.altM*3.281)+' ft');
    if(prev.speedMs && cur.speedMs!=null){
      const d = Math.abs(cur.speedMs - prev.speedMs) * 3.6;
      if(d >= 50 && d/(prev.speedMs*3.6) >= 0.15) out.push('Ground speed changed: '+Math.round(prev.speedMs*3.6)+' to '+Math.round(cur.speedMs*3.6)+' km/h');
    }
  }
  return out;
}
function flAgeText(sec){
  if(sec==null) return 'unknown';
  if(sec < 90) return sec+'s ago';
  if(sec < 5400) return Math.round(sec/60)+' min ago';
  return Math.round(sec/3600)+' h ago';
}
const FL_CACHE = { at:0, states:null };
let flCooldownUntil = 0;
async function flFetchStates(){
  const now = Date.now();
  if(FL_CACHE.states && now - FL_CACHE.at < 30000) return { ok:true, states:FL_CACHE.states };
  if(now < flCooldownUntil) return { ok:false, error:'rate' };
  try{
    const res = await fetch('https://opensky-network.org/api/states/all');
    if(res.status === 429){ flCooldownUntil = Date.now() + 60000; return { ok:false, error:'rate' }; }
    if(!res.ok) return { ok:false, error:'http' };
    const j = await res.json();
    FL_CACHE.at = Date.now(); FL_CACHE.states = (j && j.states) || [];
    return { ok:true, states:FL_CACHE.states };
  }catch(e){ return { ok:false, error:'network' }; }
}
function flErrText(code){
  if(code==='rate') return 'OpenSky is rate-limiting anonymous requests right now. Please wait a minute and try again.';
  if(code==='http') return 'OpenSky did not respond properly. Please try again shortly.';
  return 'Could not reach OpenSky (network or browser restriction). Use the FlightAware / Flightradar24 links instead.';
}
async function flLookup(flight){
  const r = await flFetchStates();
  if(!r.ok) return { ok:false, error:r.error };
  const nowSec = Date.now()/1000;
  const hit = r.states.find(s => flMatchCallsign(s[1], flight));
  if(!hit) return { ok:true, found:false };
  const sum = flSummarize(hit, nowSec); sum.found = true;
  return { ok:true, found:true, sum };
}
// Flight number for an activity: manual override first, otherwise parsed from name + notes.
function flGetFlight(item){
  const manual = flLoad(FL_LS_NUM)[item.id];
  if(manual){ const p = flParseFlightNumber(manual); if(p) return p; }
  return flParseFlightNumber((item.name||'')+' '+(item.notes||''));
}
const FL_UI = {}; // activityId -> { open, loading, res, err }
function flState(id){ return FL_UI[id] || (FL_UI[id] = { open:false, loading:false, res:null, err:null }); }

function flResultHtml(res){
  if(!res.found) return `<p class="muted-note">Not visible on the live feed right now. It may not have departed yet, may have landed, or may be outside receiver coverage.</p>`;
  const s = res.sum;
  const ft = s.altM!=null ? Math.round(s.altM*3.281).toLocaleString()+' ft' : 'n/a';
  const kmh = s.speedMs!=null ? Math.round(s.speedMs*3.6)+' km/h' : 'n/a';
  return `<div class="fl-line"><span class="fl-badge ${s.onGround?'gnd':'air'}">${s.onGround?'On the ground':'Airborne'}</span></div>

    </div>`;
}
function flSaveNumber(tripId, id){

  if(!p){ showToast('Enter a flight number like SQ324', true); return; }
  const m = flLoad(FL_LS_NUM); m[id] = p.iata; flSave(FL_LS_NUM, m);
  flState(id).res = null; flState(id).err = null;
  render(); flState(id).open = true; const pan = document.getElementById('fl-panel-'+id); if(pan){ pan.classList.remove('hidden'); flRefreshPanel(tripId, id); }
}
function flClearNumber(tripId, id){

      <button type="button" class="btn btn-sm btn-primary" onclick="flSaveNumber('${tripId}','${id}')">Save</button></div>`;
  }
}
async function flCheck(tripId, id){
  const item = flFindItem(tripId, id);
  if(!item) return;
  const fl = flGetFlight(item);
  const st = flState(id);
  if(!fl || !fl.callsign){ st.err = 'This airline is not in the built-in callsign list, so live lookup is unavailable. Use the FlightAware / Flightradar24 links.'; flRefreshPanel(tripId, id); return; }
  st.loading = true; st.err = null; flRefreshPanel(tripId, id);
  const r = await flLookup(fl);
  st.loading = false;
  if(!r.ok) st.err = flErrText(r.error); else st.res = r;
  flRefreshPanel(tripId, id);
}
function flSaveGate(tripId, id){
  const g = (document.getElementById('fl-gate-'+id)||{}).value || '';
  const t = (document.getElementById('fl-term-'+id)||{}).value || '';
  const all = flLoad(FL_LS_GATE);
  const old = all[id] || {};
  const nu = { gate: g.trim().toUpperCase(), terminal: t.trim().toUpperCase() };
  if(nu.gate || nu.terminal) all[id] = nu; else delete all[id];
  flSave(FL_LS_GATE, all);
  const changed = (old.gate||old.terminal) && (old.gate !== nu.gate || old.terminal !== nu.terminal);
  if(changed){
    showToast('Gate changed: '+(old.gate||'-')+(old.terminal? ' (T'+old.terminal+')':'')+' to '+(nu.gate||'-')+(nu.terminal? ' (T'+nu.terminal+')':''));
  } else showToast('Gate / terminal saved');
  const open = flState(id).open;
  render();
  if(open){ flState(id).open = true; const pan = document.getElementById('fl-panel-'+id); if(pan){ pan.classList.remove('hidden'); flRefreshPanel(tripId, id); } }
}

// ---- Gate alerts: poll every 60 s while the page is open, stop after 12 h ----
const FL_ALERT_TIMERS = {};
const FL_ALERT_PREV = {};
const FL_ALERT_MAX_MS = 12*3600*1000;
function flNotify(title, body){
  showToast(title+': '+body);
  try{ if(typeof Notification!=='undefined' && Notification.permission==='granted') new Notification(title, { body }); }catch(e){}
}
async function flToggleAlerts(tripId, id, on){
  const all = flLoad(FL_LS_ALERTS);
  if(!on){
    delete all[id]; flSave(FL_LS_ALERTS, all); flStopAlert(id);
    showToast('Flight alerts off'); return;
  }
  try{
    if(typeof Notification!=='undefined' && Notification.permission==='default') await Notification.requestPermission();
  }catch(e){}
  if(typeof Notification==='undefined' || Notification.permission!=='granted') showToast('Browser notifications are off, so you will only get in-app alerts while this page is open.');
  all[id] = { tripId, startedAt: Date.now() }; flSave(FL_LS_ALERTS, all);
  flStartAlert(tripId, id, Date.now());
  showToast('Flight alerts on');
}
function flStopAlert(id){
  if(FL_ALERT_TIMERS[id]){ clearInterval(FL_ALERT_TIMERS[id]); delete FL_ALERT_TIMERS[id]; }
  delete FL_ALERT_PREV[id];
}
function flStartAlert(tripId, id, startedAt){
  flStopAlert(id);
  const tick = async ()=>{
    if(Date.now() - startedAt > FL_ALERT_MAX_MS){
      const all = flLoad(FL_LS_ALERTS); delete all[id]; flSave(FL_LS_ALERTS, all); flStopAlert(id);
      showToast('Flight alerts stopped after 12 hours'); return;
    }
    const item = flFindItem(tripId, id);
    const fl = item && flGetFlight(item);
    if(!fl || !fl.callsign) return;
    const r = await flLookup(fl);
    if(!r.ok) return; // stay quiet on transient failures
    const cur = r.found ? r.sum : { found:false };
    const prev = FL_ALERT_PREV[id];
    FL_ALERT_PREV[id] = cur;
    flDiffStatus(prev, cur).forEach(msg => flNotify(fl.iata, msg));
  };
  tick();
  FL_ALERT_TIMERS[id] = setInterval(tick, 60000);
}
function flResumeAlerts(){
  const all = flLoad(FL_LS_ALERTS);
  Object.keys(all).forEach(id=>{
    const a = all[id];
    if(!a || Date.now() - a.startedAt > FL_ALERT_MAX_MS){ delete all[id]; return; }
    if(flFindItem(a.tripId, id)) flStartAlert(a.tripId, id, a.startedAt); else delete all[id];
  });
  flSave(FL_LS_ALERTS, all);
}

/* ============ FEATURE 2: BEST TIME TO VISIT (BestTime.app) ============ */
const BT_LS_KEY = 'victravels_besttime_key';
const BT_LS_CACHE = 'victravels_besttime_cache';
const BT_TTL = 7*24*3600*1000;
const BT_DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const BT_UI = {}; // itemId -> { day, loading, data, err, live, needAddr }
function btGetKey(){ try{ return localStorage.getItem(BT_LS_KEY)||''; }catch(e){ return ''; } }
function btCacheKey(item){ return (item.name||'')+'|'+(item.lat!=null? Number(item.lat).toFixed(4):'')+'|'+(item.lng!=null? Number(item.lng).toFixed(4):'')+'|'+(item.mapsLink||''); }
function btCacheGet(item){
  try{
    const all = JSON.parse(localStorage.getItem(BT_LS_CACHE)||'{}');
    const e = all[btCacheKey(item)];
    if(e && Date.now() - e.t < BT_TTL) return e.data;
  }catch(e){}
  return null;
}
function btCacheSet(item, data){
  try{
    const all = JSON.parse(localStorage.getItem(BT_LS_CACHE)||'{}');
    Object.keys(all).forEach(k=>{ if(Date.now() - all[k].t >= BT_TTL) delete all[k]; });
    all[btCacheKey(item)] = { t: Date.now(), data };
    localStorage.setItem(BT_LS_CACHE, JSON.stringify(all));
  }catch(e){}
}
// Pure: BestTime /forecasts response -> compact structure. day_raw has 24 values starting at 06:00.
function btNormalize(resp){
  if(!resp || !Array.isArray(resp.analysis)) return null;
  const vi = resp.venue_info || {};
  const days = [];
  for(let d=0; d<7; d++){
    const a = resp.analysis.find(x => x && x.day_info && x.day_info.day_int === d);
    const hours = new Array(24).fill(null);
    if(a && Array.isArray(a.day_raw)){
      a.day_raw.forEach((v,i)=>{ hours[(6+i)%24] = v; });
      (a.hour_analysis||[]).forEach(h=>{ if(h && h.intensity_nr === 999) hours[h.hour] = null; });
    }
    const oc = a && a.day_info && a.day_info.venue_open_close_v2;
    days.push({ hours, open: oc && oc.open_24h ? 'Open 24 hours' : (oc && oc['12h'] && oc['12h'].length ? oc['12h'].join(', ') : ''), closedAllDay: !!(a && a.day_info && a.day_info.venue_open === 'closed') });
  }
  return { venueId: vi.venue_id||'', name: vi.venue_name||'', address: vi.venue_address||'', rating: vi.rating||null, days };
}
// Pure: best (lowest) and worst (highest) 2-hour windows among hours with data.
function btWindows(hours, span){
  span = span||2;
  let best = null, worst = null;
  for(let h=0; h<24; h++){
    let sum = 0, ok = true;
    for(let k=0; k<span; k++){ const v = hours[(h+k)%24]; if(h+k>23 || v==null){ ok=false; break; } sum += v; }
    if(!ok) continue;
    const avg = sum/span;
    if(!best || avg < best.avg) best = { start:h, end:h+span, avg };
    if(!worst || avg > worst.avg) worst = { start:h, end:h+span, avg };
  }
  return { quiet: best, peak: worst };
}
function btHourLabel(h){ h = ((h%24)+24)%24; const ap = h>=12 ? 'PM' : 'AM'; const x = h%12===0 ? 12 : h%12; return x+' '+ap; }
function btRangeLabel(w){
  if(!w) return '';
  const a = btHourLabel(w.start), b = btHourLabel(w.end);
  const apA = a.split(' ')[1], apB = b.split(' ')[1];
  return apA===apB ? a.split(' ')[0]+'–'+b : a+' – '+b;
}
function btEligible(item){
  return item && item.name && !item.isPoi && item.type!=='Flight' && item.type!=='Stays' && ((item.lat!=null && item.lng!=null) || item.mapsLink);
}
function btSectionHtml(trip, item){
  if(!btEligible(item)) return '';
  const st = BT_UI[item.id] || (BT_UI[item.id] = { day: (new Date().getDay()+6)%7, loading:false, data:null, err:null, live:null, needAddr:false });
  if(!st.data){ const c = btCacheGet(item); if(c) st.data = c; }
  return `<div class="bt-section" id="bt-section">${btInner(trip.id, item)}</div>`;
}
function btInner(tripId, item){
  const st = BT_UI[item.id];
  const key = btGetKey();
  let h = `<div class="bt-title">⏱ Best time to visit</div>`;
  if(st.data) h += btChartHtml(tripId, item, st);
  else {
    h += `<p class="muted-note" style="margin:0 0 8px;">Crowd data from BestTime.app. Nothing is requested until you tap the button, and results are saved for 7 days.</p>`;
    h += `<button type="button" class="btn btn-sm btn-primary" ${st.loading?'disabled':''} onclick="btCheck('${tripId}','${item.id}')">${st.loading?'Checking...':'Check busy times'}</button>`;
  }
  if(st.err) h += `<p class="muted-note" style="margin-top:8px;color:var(--danger);">${escapeHtml(st.err)}</p>`;
  if(st.needAddr || !st.data){
    h += `<div class="bt-key" style="${st.needAddr?'':'display:none;'}" id="bt-addr-row"><input type="text" id="bt-addr" placeholder="Venue address (street, city)" value="${escapeHtml(st.addr||'')}"><button type="button" class="btn btn-sm" onclick="btCheck('${tripId}','${item.id}')">Retry</button></div>`;
  }
  h += `<div class="bt-key"><input type="password" id="bt-key" autocomplete="off" placeholder="BestTime API key (private)" value="${escapeHtml(key)}"><button type="button" class="btn btn-sm" onclick="btSaveKey()">Save key</button></div>`;
  if(!key) h += `<p class="muted-note" style="font-size:11.5px;margin:6px 0 0;">Free key: besttime.app, sign up, API keys (private key). It is only stored in this browser.</p>`;
  return h;
}
function btSaveKey(){
  const el = document.getElementById('bt-key');
  if(!el) return;
  try{ localStorage.setItem(BT_LS_KEY, el.value.trim()); }catch(e){}
  showToast(el.value.trim()? 'BestTime key saved' : 'BestTime key cleared');
}
function btChartHtml(tripId, item, st){
  const d = st.data.days[st.day] || st.data.days[0];
  const hours = d.hours;
  const idx = hours.map((v,i)=>v==null?-1:i).filter(i=>i>=0);
  const w = btWindows(hours, 2);
  const todayIdx = (new Date().getDay()+6)%7;
  const nowH = new Date().getHours();
  let h = `<div class="bt-days">${BT_DAYS.map((n,i)=>`<button type="button" class="chip-opt ${i===st.day?'on':''}" onclick="btSetDay('${tripId}','${item.id}',${i})">${n}</button>`).join('')}</div>`;
  if(!idx.length){
    h += `<p class="muted-note">No busyness data for this day (the place may be closed).</p>`;
  } else {
    // Show the span of hours with data, plus one hour of padding each side so bars aren't clipped.
    const lo = Math.min(...idx), hi = Math.max(...idx);
    const shown = []; for(let i=lo;i<=hi;i++) shown.push(i);
    h += `<div class="bt-chart" role="img" aria-label="Busyness by hour">${shown.map(i=>{
      const v = hours[i]; const hh = v==null?2:Math.max(3,v);
      const inQ = w.quiet && i>=w.quiet.start && i<w.quiet.end, inP = w.peak && i>=w.peak.start && i<w.peak.end;
      return `<div class="bt-bar ${inQ?'quiet':''} ${inP?'peak':''} ${(st.day===todayIdx && i===nowH)?'now':''}" style="height:${hh}%;" title="${btHourLabel(i)}: ${v==null?'closed':v+'%'}"></div>`;
    }).join('')}</div>
    <div class="bt-axis">${shown.map(i=>`<span>${(i-lo)%3===0 ? (i%12===0?12:i%12) : ''}</span>`).join('')}</div>`;
    h += `<div class="bt-sum">
      ${w.quiet? `<span class="bt-pill q">Quietest: ${btRangeLabel(w.quiet)}</span>`:''}
      ${w.peak? `<span class="bt-pill p">Peak: ${btRangeLabel(w.peak)}</span>`:''}
      ${d.open? `<span class="bt-pill n">Open ${escapeHtml(d.open)}</span>`:''}
    </div>`;
  }
  if(st.live){
    const L = st.live;
    h += `<p class="muted-note" style="margin:6px 0;">${L.available? `Right now: <b>${L.live}% busy</b>${L.fc!=null? ` (usual for this hour: ${L.fc}%)`:''}` : 'Live busyness is not available for this venue right now.'}</p>`;
  } else {
    h += `<button type="button" class="btn btn-sm" ${st.loadingLive?'disabled':''} onclick="btLive('${tripId}','${item.id}')">${st.loadingLive?'Checking...':'Check live busyness now'}</button>`;
  }
  h += `<p class="muted-note" style="font-size:11.5px;margin:8px 0 0;">Relative scale: 100% is this venue's busiest hour of the week. Forecast from BestTime.app${st.data.name? ' for '+escapeHtml(st.data.name):''}.</p>`;
  return h;
}
function btRefresh(tripId, itemId){
  const el = document.getElementById('bt-section');
  const item = flFindItem(tripId, itemId);
  if(el && item) el.innerHTML = btInner(tripId, item);
}
function btSetDay(tripId, itemId, d){ BT_UI[itemId].day = d; btRefresh(tripId, itemId); }
function btErrText(status, msg){
  const m = String(msg||'').toLowerCase();
  if(status===401 || /api key|unauthor|invalid key/.test(m)) return 'BestTime rejected the API key. Check that you pasted the private key.';
  if(status===429) return 'BestTime is rate-limiting requests. Please wait a minute and try again.';
  if(status===402 || /credit|quota|limit|payment|subscription/.test(m)) return 'Your BestTime credits look used up for now. Check your BestTime account.';
  if(/not found|no venue|no result|could not find|not enough|no data|foot ?traffic/.test(m)) return 'BestTime has no busy-times data for this venue. Try adding the full street address below.';
  return msg ? 'BestTime says: '+msg : 'BestTime could not return data for this venue.';
}
async function btResolveAddress(item, trip){
  try{
    let pid = item.placeId || await resolvePlaceId(item);
    if(!pid) return '';
    const res = await fetch('https://places.googleapis.com/v1/places/'+pid, { headers: { 'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY, 'X-Goog-FieldMask': 'formattedAddress' } });
    if(!res.ok) return '';
    const j = await res.json();
    return j.formattedAddress || '';
  }catch(e){ return ''; }
}
async function btCheck(tripId, itemId){
  const trip = getTrip(tripId);
  const item = flFindItem(tripId, itemId);
  const st = BT_UI[itemId];
  if(!item || !st || st.loading) return;
  const keyEl = document.getElementById('bt-key');
  if(keyEl && keyEl.value.trim() && keyEl.value.trim() !== btGetKey()) btSaveKey();
  const key = btGetKey();
  if(!key){ st.err = 'Add your BestTime API key below first.'; btRefresh(tripId, itemId); return; }
  const addrEl = document.getElementById('bt-addr');
  st.addr = addrEl ? addrEl.value.trim() : (st.addr||'');
  st.loading = true; st.err = null; btRefresh(tripId, itemId);
  let address = st.addr || await btResolveAddress(item, trip);
  if(!address) address = ((trip && trip.countries)||[]).join(', ');
  try{
    const params = new URLSearchParams({ api_key_private: key, venue_name: item.name, venue_address: address });
    const res = await fetch('https://besttime.app/api/v1/forecasts?'+params.toString(), { method:'POST' });
    let j = null; try{ j = await res.json(); }catch(e){}
    if(!res.ok || !j || j.status !== 'OK'){
      st.err = btErrText(res.status, j && (j.message || j.error));
      st.needAddr = true;
    } else {
      const norm = btNormalize(j);
      if(!norm){ st.err = 'BestTime returned data in an unexpected format.'; }
      else { st.data = norm; st.needAddr = false; btCacheSet(item, norm); }
    }
  }catch(e){
    st.err = 'Could not reach BestTime (network or browser restriction). Please try again later.';
  }
  st.loading = false;
  btRefresh(tripId, itemId);
}
async function btLive(tripId, itemId){
  const st = BT_UI[itemId];
  const key = btGetKey();
  if(!st || !st.data || !key || !st.data.venueId) return;
  st.loadingLive = true; btRefresh(tripId, itemId);
  try{
    const params = new URLSearchParams({ api_key_private: key, venue_id: st.data.venueId });
    const res = await fetch('https://besttime.app/api/v1/forecasts/live?'+params.toString(), { method:'POST' });
    const j = await res.json().catch(()=>null);
    if(res.ok && j && j.status==='OK' && j.analysis){
      st.live = { available: !!j.analysis.venue_live_busyness_available, live: j.analysis.venue_live_busyness, fc: j.analysis.venue_forecasted_busyness };
    } else {
      st.err = btErrText(res.status, j && (j.message || j.error));
    }
  }catch(e){ st.err = 'Could not reach BestTime for live data.'; }
  st.loadingLive = false;
  btRefresh(tripId, itemId);
}
