const TX_NO_DECIMAL = ['JPY','KRW','HUF'];
const TX_METHOD_LABEL = { card:'Card / bank refund', cash:'Cash refund' };
function txFmt(amount, cur){
  const dp = TX_NO_DECIMAL.indexOf(cur) >= 0 ? 0 : 2;
  try{ return new Intl.NumberFormat('en', { style:'currency', currency:cur, minimumFractionDigits:dp, maximumFractionDigits:dp }).format(amount); }
  catch(e){ return cur+' '+Number(amount).toFixed(dp); }
}
function txRound(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
// Pure: refund maths for one tax-inclusive receipt.
//   VAT contained = price * rate / (1 + rate); fee = max(feeMin, VAT * fee%) (cash adds a few points), capped at VAT;
//   net refund = VAT - fee; price after refund = price - net refund.
function taxCompute(country, price, opts){
  opts = opts || {};
  const c = typeof country === 'string' ? TAX_REFUND_DATA.countries[country] : country;
  price = Number(price) || 0;
  const base = { price, rate:0, vat:0, fee:0, net:0, after:price, savedPct:0, eligible:false, reason:'', minSpend:0, cur: c ? c.cur : '' };
  if(!c) { base.reason = 'unknown'; return base; }
  if(c.kind === 'none'){ base.reason = 'none'; return base; }
  const rate = (opts.reduced && c.red != null) ? c.red : c.std;
  const vatRaw = price * (rate/100) / (1 + rate/100);
  base.rate = rate; base.vat = txRound(vatRaw); base.minSpend = c.min || 0;
  if(price <= 0){ base.reason = 'empty'; return base; }
  if(c.min && price < c.min){ base.reason = 'min'; return base; }
  const pct = (c.fee||0) + (opts.method === 'cash' ? (c.cash||0) : 0);
  const feeRaw = Math.min(vatRaw, Math.max(c.feeMin||0, vatRaw * pct/100));
  const netRaw = vatRaw - feeRaw;
  base.fee = txRound(feeRaw); base.net = txRound(netRaw);
  base.after = txRound(price - netRaw);
  base.savedPct = price ? txRound(netRaw / price * 100) : 0;
  base.eligible = true;
  return base;
}
function taxTripCountryCodes(){
  const found = [];
  const cs = TAX_REFUND_DATA.countries;
  (data.trips||[]).forEach(t=>{
    const hay = ((t.countries||[]).join(' | ') + ' | ' + (t.name||'')).toLowerCase();
    Object.keys(cs).forEach(code=>{
      const names = [cs[code].n.toLowerCase()].concat((cs[code].al||[]).map(a=>a.toLowerCase()));
      if(names.some(n=> new RegExp('(^|[^a-z])'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z]|$)').test(hay)) && found.indexOf(code)<0) found.push(code);
    });
  });
  return found;
}
const TX = { scope:'all', method:'card', rows:[] };
function txCodesForScope(){
  const all = Object.keys(TAX_REFUND_DATA.countries).sort((a,b)=>TAX_REFUND_DATA.countries[a].n.localeCompare(TAX_REFUND_DATA.countries[b].n));
  if(TX.scope !== 'trip') return all;
  const mine = taxTripCountryCodes();
  return mine.length ? mine : all;
}

function txRerender(){

function txSetScope(s){ TX.scope = s; txRerender(); }

function txSetRow(i, key, val){
  if(!TX.rows[i]) return;
  TX.rows[i][key] = val;
  if(key === 'code') txRerender(); else txRenderResults();
}

    const res = taxCompute(c, r.price, { reduced:r.reduced, method:TX.method });

      html += `<div class="tx-res bad"><b>${escapeHtml(c.n)}</b><div class="muted-note" style="margin-top:4px;">${escapeHtml(c.noneMsg||'No tourist refund available.')}</div></div>`;

      return;
    }
    const t = totals[r.code] || (totals[r.code] = { price:0, net:0, after:0, vat:0, fee:0 });
    t.price += res.price; t.net += res.net; t.after += res.after; t.vat += res.vat; t.fee += res.fee;

  // Where & how to claim, once per distinct country
  const seen = [];
  TX.rows.forEach(r=>{ if(seen.indexOf(r.code)<0) seen.push(r.code); });
  html += `<div class="section-title" style="margin-top:16px;">Where &amp; how to claim</div>`;

function jlHm(t){ const m = String(t||'').match(/^(\d{1,2}):(\d{2})/); return m ? (+m[1])*60 + (+m[2]) : null; }

// Pure: offset of an IANA zone from UTC in minutes at an instant (handles DST).
function jlOffsetMin(tz, ms){
  const dtf = new Intl.DateTimeFormat('en-US', { timeZone:tz, hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });

  const asUtc = Date.UTC(+p.year, +p.month-1, +p.day, (+p.hour)%24, +p.minute, +p.second);
  return Math.round((asUtc - Math.floor(ms/1000)*1000)/60000);

// Pure: UTC ms for a wall-clock date+time in a zone.
function jlLocalToUtc(dateStr, timeStr, tz){
  const [y,m,d] = dateStr.split('-').map(Number); const hm = jlHm(timeStr)||0;
  const guess = Date.UTC(y, m-1, d, Math.floor(hm/60), hm%60);

  const off2 = jlOffsetMin(tz, utc); utc = guess - off2*60000;

}
function jlClock(utc, tz){ return Math.floor(utc/60000) + jlOffsetMin(tz, utc); }

// Pure: build the whole schedule. Returns tz difference, direction ('east'|'west'|'none') and day rows.
function jlPlan(p){
  const date = p.date;
  const depTime = p.depTime || '09:00', arrTime = p.arrTime || '16:00';
  const depUtc = jlLocalToUtc(date, depTime, p.fromTz);
  let arrUtc = null, arrDate = date;
  for(let dd=-1; dd<=3 && arrUtc===null; dd++){
    const ds = jlAddDays(date, dd);
    const u = jlLocalToUtc(ds, arrTime, p.toTz);
    if(u > depUtc + 30*60000){ arrUtc = u; arrDate = ds; }
  }
  const rawDiff = (jlOffsetMin(p.toTz, arrUtc) - jlOffsetMin(p.fromTz, depUtc)) / 60;
  let nd = rawDiff; while(nd > 12) nd -= 24; while(nd <= -12) nd += 24;
  const abs = Math.abs(nd);
  const direction = abs < 1 ? 'none' : (nd > 0 ? 'east' : 'west');
  const east = direction === 'east';
  const B = jlHm(p.bed||'23:00'), W = jlHm(p.wake||'07:00');
  const dur = ((W - B + 1440) % 1440) || 480;
  const m = east ? -1 : 1;                 // pre-trip bedtime shift: east = earlier, west = later
  const sgn = east ? 1 : -1;               // post-arrival: body-clock offset relative to local target
  const rate = east ? 1 : 1.5;             // hours of adaptation per day at the destination
  const preTotal = direction === 'none' ? 0 : Math.min(3, abs);
  const R = abs - preTotal;
  const estDays = direction === 'none' ? 0 : Math.ceil(abs / rate);
  const days = [];
  const mk = (o)=>{
    const bed = o.bed, wake = o.wake, leftStart = Math.max(0, o.prevBed - 1440);
    const w = {};
    w.sleep = jlSegs(leftStart, wake).concat(bed < 1440 ? jlSegs(bed, 1440) : []);
    const caffFrom = bed - 540;
    w.caff = jlSegs(leftStart, wake).concat(jlSegs(caffFrom, 1440));
    let seek, avoid;
    if(direction === 'west'){ seek = [bed - 240, bed - 60]; avoid = [wake, wake + 120]; }
    else { seek = [wake, wake + 180]; avoid = o.adapted ? null : [bed - 180, bed]; }
    w.seek = jlSegs(seek[0], seek[1]); w.avoid = avoid ? jlSegs(avoid[0], avoid[1]) : [];
    const napFrom = Math.max(wake + 360, 780), napTo = Math.min(900, bed - 480);
    w.nap = napTo - napFrom >= 30 ? jlSegs(napFrom, napTo) : [];
    w.mel = (east && !o.adapted && o.kind === 'post' && bed - 60 < 1440) ? (bed - 60)/14.4 : null;
    const tips = [];
    tips.push('Sleep ' + jlFmt(bed) + ' to ' + jlFmt(bed + dur));
    tips.push('Seek bright light ' + jlFmt(seek[0]) + ' to ' + jlFmt(seek[1]));
    if(avoid) tips.push('Dim lights / sunglasses ' + jlFmt(avoid[0]) + ' to ' + jlFmt(avoid[1]));
    tips.push('No caffeine after ' + jlFmt(caffFrom) + ' (about 9 h before bed)');
    if(w.mel !== null) tips.push('Some people use low-dose melatonin around ' + jlFmt(bed - 60) + ' after eastward travel. Ask a doctor before using it.');
    if(w.nap.length) tips.push('If needed, nap 20-30 min between ' + jlFmt(napFrom) + ' and ' + jlFmt(napTo) + ', not later');
    return Object.assign({}, o, { windows:w, tips, dur });
  };
  for(let j=1; j<=3; j++){
    const s = Math.min(j, preTotal), ps = Math.min(j-1, preTotal);
    const left = 4 - j;
    days.push(mk({ kind:'pre', clock:'origin', date:jlAddDays(date, -left), label: left + (left===1 ? ' day' : ' days') + ' before departure',
      bed: B + m*s*60, wake: W + m*ps*60, prevBed: B + m*ps*60, shift: m*s, adapted:false }));
  }
  days.push({ kind:'travel', clock:'origin', date, label:'Travel day',
    tips:[
      direction === 'none' ? 'Little time-zone change: keep your normal routine.' : 'Keep to your adjusted sleep schedule until boarding, then set your watch to destination time.',
      east ? 'On the plane, try to sleep when it is night at the destination; eye mask and earplugs help.' : (direction==='west' ? 'On the plane, stay awake until it is evening at the destination if you can.' : ''),
      'Drink water; limit alcohol; avoid caffeine in the hours before the destination night.'
    ].filter(Boolean) });
  for(let k=1; k<=5; k++){
    const gapK = Math.max(0, R - rate*k), gapPrev = Math.max(0, R - rate*(k-1));
    days.push(mk({ kind:'post', clock:'dest', date:jlAddDays(arrDate, k-1), label: k===1 ? 'Arrival day' : 'Day ' + k + ' at destination',
      bed: B + sgn*gapK*60, wake: W + sgn*gapPrev*60, prevBed: B + sgn*gapPrev*60, shift: sgn*gapK, adapted: gapK === 0, gap: gapK }));
  }
  return { rawDiff, nd, direction, estDays, abs, rate, durationH: (arrUtc - depUtc)/3600000, arrDate, days, preTotal, big: east && abs >= 9, depUtc, arrUtc };
}

  el.style.cssText = 'position:fixed;inset:0;z-index:99999;background:var(--bg,#f5f3ed);display:flex;align-items:center;justify-content:center;padding:24px;';
  el.innerHTML = `<form id="pass-form" autocomplete="off" style="width:100%;max-width:340px;background:#fff;border:1px solid var(--border,#e4e1d8);border-radius:22px;padding:28px 24px;text-align:center;">
    <div style="font-size:34px;margin-bottom:6px;">✈️</div>
    <h2 style="margin:0 0 4px;font-size:20px;">VicTravels</h2>
    <p style="margin:0 0 18px;font-size:13px;color:var(--text-muted,#777);">Enter the passcode to continue</p>
    <input id="pass-input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Passcode" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid var(--border-strong,#d8d4c8);border-radius:14px;font-size:16px;text-align:center;">
    <div id="pass-err" style="min-height:18px;margin:8px 0 4px;font-size:12.5px;color:#c0392b;"></div>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Unlock</button>
    <p style="margin:12px 0 0;font-size:11.5px;color:var(--text-muted,#777);">This device will be remembered.</p>
  </form>`;
  document.body.appendChild(el);
  const input = el.querySelector('#pass-input'), err = el.querySelector('#pass-err');
  setTimeout(()=>input.focus(), 50);
  el.querySelector('#pass-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    err.textContent = '';
    try{
      const h = await passHash(input.value.trim());
      if(h === PASS_HASH){
        try{ localStorage.setItem(PASS_KEY, PASS_HASH); }catch(_){}
        el.remove();
        startApp();
      } else {
        err.textContent = 'Incorrect passcode';
        input.value = ''; input.focus();
      }
    }catch(_){ err.textContent = 'Could not check the passcode in this browser.'; }
  });
}
if(isUnlocked()) startApp(); else showPassGate();
</script>
</body>
</html>
